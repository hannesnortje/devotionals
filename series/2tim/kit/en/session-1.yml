session: 1
lang: en
title: "Not Ashamed"
ref: "1:1-1:18"
days: [1, 2]
big_idea: "God did not give us a spirit of cowardice: because Christ has broken the power of death and God guards what is entrusted, we can rekindle his gift and stand unashamed with the gospel and with his suffering people."
opening: "Think of a campfire or a fireplace that had almost gone out. What did it take to get it burning again?"
context: >-
  Paul is in chains in Rome, around AD 66–67, under the emperor Nero, and he is expecting his execution.
  This is his last letter – written to his “beloved child” Timothy in Ephesus, who is under heavy pressure and tempted to shrink back.
  Tonight we read chapter 1: a gift that needs to be rekindled, a gospel we need not be ashamed of, and two very different ways of responding to an apostle in chains.
read_aloud_tip: "Read in three parts with three readers: verses 1–7 (Paul's greeting and the gift of God), verses 8–14 (not ashamed of the gospel – read verse 12 slowly), verses 15–18 (those who turned away, and Onesiphorus)."
hebrew:
  - word: "anazōpyreō"
    hebrew: "ἀναζωπυρέω"
    gloss: "rekindle"
    point: "A verb found only here in the New Testament: ana (again), zōos (alive), pyr (fire) – bellows worked over smouldering coals until the ash blows away. Timothy's gift is not dead, but fear and tears have let a layer of ash settle over it (1:6)."
  - word: "epaischynomai"
    hebrew: "ἐπαισχύνομαι"
    gloss: "be ashamed"
    point: "The key word of 1:8–18 occurs three times: as a call to Timothy (v. 8), as Paul's own testimony (v. 12), and as the badge of honour of Onesiphorus, who “was not ashamed of my chain” (v. 16)."
  - word: "parathēkē"
    hebrew: "παραθήκη"
    gloss: "my entrusted deposit"
    point: "A banking and legal term for something handed over for safekeeping. In 1:12 the Greek leaves open whether it is what Paul has entrusted to God or what God has entrusted to Paul; in 1:14 it is clearly the sound teaching entrusted to Timothy."
discussion:
  - q: "Paul is in chains and expecting death, yet he opens with “the promise of the life that is in Christ Jesus” and with gratitude. What does that tell you about where his hope is anchored?"
    ref: "1:1-1:5"
  - q: "Timothy's faith “lived first in your grandmother Lois and in your mother Eunice”. Who passed the faith on to you – and why does Paul add “it lives in you as well”?"
    ref: "1:5"
  - q: "“Rekindle the gift of God” – the gift is under ash, not dead. What kinds of “ash” settle on our faith and our gifts today?"
    ref: "1:6"
  - q: "Verse 7 names a “spirit of cowardice” – not natural caution, but shrinking back from what God calls us to. Where do we hide fear behind good excuses? What would power, love and self-control look like instead?"
    ref: "1:7"
  - q: "Read verses 9–10 again. How does knowing that grace was given to us “before eternal ages” and that Christ “broke the power of death” give us courage to stand up for the gospel?"
    ref: "1:8-1:10"
  - q: "“I know whom I have believed.” Paul's confidence rests on a Person, not only on facts. What difference does that make when you are under pressure?"
    ref: "1:12"
  - q: "Phygelus and Hermogenes turned away; Onesiphorus “searched hard for me and found me”. Who in your world is “chained” by illness, loss or loneliness – and what would it take to be an Onesiphorus to them?"
    ref: "1:15-1:18"
application:
  - "Name one layer of “ash” on your faith or your gifts this week and take one practical step to fan the flame again – prayer, opening the Scriptures, or using a gift you have let lie."
  - "Be an Onesiphorus: seek out one person who is going through a hard season – visit, call or write – and refresh them."
prayer: "Begin by reading verse 7 aloud together. Then pray in pairs: thank God for the people who passed the faith on to you, name one place where fear holds you back, and ask for his power, love and self-control. Close by praying for people you know who are “chained” by hardship."
leader_notes:
  - "This session covers two devotionals (days 1–2). Chapter 1 is rich; choose four or five questions and leave time for the last one."
  - "1:12 “my entrusted deposit”: our translation deliberately leaves this open. It may mean what Paul has entrusted to God (his life, his ministry, his future) or what God has entrusted to Paul (the gospel, as in 1:14). Both readings bring comfort – don't let the question become the main topic of the evening."
  - "Some in the group had no Lois or Eunice, or grieve over children or grandchildren who have left the faith. Handle this gently: Paul's point is that faith must become personal – “it lives in you as well” – and God also uses spiritual parents and mentors."
  - "Verse 7 can sound like an accusation to people who struggle with anxiety. The day 1 devotional distinguishes deilia (cowardice: shrinking back from God's call) from natural caution, and says fear is overcome not by willpower alone but by the fullness of the Spirit. Don't let the verse become a verdict on anyone's struggles."
  - "Background: in Rome's honour-and-shame culture, standing with a condemned prisoner could cost your reputation, your property and even your freedom. Help the group find today's equivalents without letting the evening turn into complaints about the culture."
  - "Point ahead: next week chapter 2 – the soldier, the athlete and the farmer, and the sentence “But the word of God is not chained.”"
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
