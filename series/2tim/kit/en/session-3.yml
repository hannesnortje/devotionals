session: 3
lang: en
title: "Remain in the Word"
ref: "3:1-3:17"
days: [6, 7]
big_idea: "In difficult times an outward form of godliness is not enough; what keeps us standing is the God-breathed Scripture, learned from people whose lives we have seen up close."
opening: "Who taught you something important – not in a classroom, but by letting you watch how they lived? What did you pick up from them?"
context: >-
  At the end of chapter 2 Paul told Timothy to treat the misled with gentleness and patience.
  Now he warns him not to be naive: the “last days” – the whole period between Christ's first coming and his return – bring difficult times, even inside the church.
  Tonight we read chapter 3: a portrait of religion that is only an outer shell, and Paul's answer – a life lived in the open and the Scriptures breathed out by God.
read_aloud_tip: "Use two readers: verses 1–9 (the warning – read the list at a steady pace and pause after “Turn away from such people!”) and verses 10–17 (the answer); then read verses 16–17 aloud together."
hebrew:
  - word: "philautoi … philotheoi"
    hebrew: "φίλαυτοι … φιλόθεοι"
    gloss: "lovers of themselves … lovers of God"
    point: "Paul frames the list with words built on *philos* (love): it begins with “lovers of themselves” and ends with “lovers of pleasure rather than lovers of God” (3:2, 4). The root of the decay is disordered love – when love of self pushes out love of God, relationships fall apart."
  - word: "morphōsis eusebeias"
    hebrew: "μόρφωσις εὐσεβείας"
    gloss: "outward form of godliness"
    point: "A *morphōsis* is an outward form or shell. These people are “having an outward form of godliness but denying its power” (3:5): the right words and the right meetings, but no *dynamis* – no power of the Spirit that changes the heart."
  - word: "theopneustos"
    hebrew: "θεόπνευστος"
    gloss: "God-breathed"
    point: "The word occurs only here in the New Testament (3:16): Scripture is breathed out by God. When Scripture speaks, God speaks – and so it is useful “for teaching, for reproof, for correction, for training in righteousness”."
discussion:
  - q: "Read the list in verses 2–4 again. Which of these marks do you recognise most in our culture today? Why might the list begin with “lovers of themselves”?"
    ref: "3:1-3:4"
  - q: "Paul is describing people who are “having an outward form of godliness but denying its power”. What could that look like in a church – and, honestly, in my own life?"
    ref: "3:5"
  - q: "“always learning and never able to come to the knowledge of the truth” – how is it possible to take in many sermons, podcasts and books and still not change?"
    ref: "3:7"
  - q: "Jannes and Jambres opposed Moses by imitating his miracles. Where do we meet imitations of true faith today, and how can we tell the difference?"
    ref: "3:8-3:9"
  - q: "Timothy had closely followed Paul's life – including what happened in Lystra, probably his home town. Who has let you see their faith up close? And who is watching yours?"
    ref: "3:10-3:11"
  - q: "“all who want to live in godliness in Christ Jesus will be persecuted.” Do we expect the Christian life to be comfortable? What has following Christ cost you?"
    ref: "3:12"
  - q: "Scripture is useful “for teaching, for reproof, for correction, for training in righteousness”. Which of these four do you welcome easily – and which do you tend to avoid?"
    ref: "3:16-3:17"
application:
  - "Take one Bible passage each day this week and ask four questions: What does it teach me? Where does it reprove me? What does it want to set straight? How does it train me in righteousness?"
  - "Spend time this week with someone younger in faith – a child, a grandchild or a new believer – and tell them about one time when God carried you through something hard."
prayer: "Begin with a minute of silence, asking God to show you any area where you are content with an outward form. Then pray together: thank God for his God-breathed Word, for the parents, grandparents and mentors who passed it on to you, and pray for the children and young people in your lives."
leader_notes:
  - "This session covers two devotionals (days 6 and 7). The list in verses 2–4 easily turns into complaining about “the world out there”; day 6 aims the sharpest question at “us who sit in the pews” – steer the group there."
  - "Handle 3:6 (“weak women”, *gynaikaria*) with care. Following day 6, it is a judgment on these particular people who let themselves be taken in, not on women in general. The ones under judgment are the false teachers; the people they prey on are “weighed down with sins and driven by all kinds of desires” – a weakness any of us can have."
  - "Our translation reads 3:16 predicatively: “All Scripture is God-breathed and useful”. Day 7 notes that the reading every God-breathed Scripture is also useful is grammatically possible; our translation follows the more common reading. Mention it if asked, but don't let it take over."
  - "Verse 15 (“from childhood”) may be painful for those without a Christian upbringing, or for parents whose children have turned away. It is never too late to sow the Word – say so gently."
  - "If time is short, skip question 4. Point ahead: next week is the last session – chapter 4, Paul's final charge and his last words. Consider ending it with a meal or a longer time of prayer."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
