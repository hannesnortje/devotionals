session: 4
lang: en
title: "Finish the Race"
ref: "4:1-4:22"
days: [8, 9]
big_idea: "Because Scripture is God's voice and Christ is the coming Judge, we proclaim the word whether the time is right or not – and when everyone else leaves, the Lord stands by his servant and brings him safely home."
opening: "Think of a finish line you have crossed – a race, an exam, a big project, a long journey. What kept you going near the end?"
context: >-
  Paul is in chains in Rome, probably around AD 66 or 67; winter is coming and he knows his death is near.
  Chapter 4 holds the last words we have from his pen: a solemn charge to Timothy, a look back on his finished race, and very personal requests and greetings.
  Tonight we close the series with Paul's last words.
read_aloud_tip: "Use three readers: verses 1–5 (the charge – firmly, like a herald), verses 6–8 (Paul's testimony – slowly), verses 9–22 (requests and greetings – let the names stand). Close by reading verse 22 aloud together."
hebrew:
  - word: "kēryxon ton logon"
    hebrew: "κήρυξον τὸν λόγον"
    gloss: "proclaim the word"
    point: "A *kēryx* was a herald who announced the King's decree in the town square – not his own philosophy. His one duty was faithfulness to the message of the one who sent him, “whether the time is right or not” (4:2)."
  - word: "spendomai / analysis"
    hebrew: "σπένδομαι / ἀνάλυσις"
    gloss: "poured out as a drink offering … departure"
    point: "“For already I am being poured out as a drink offering” (4:6): Paul sees his execution not as a wasted life but as a last offering of worship. *Analysis* was used of loosing a ship's mooring ropes – death as setting sail for home."
  - word: "ho de kyrios moi parestē"
    hebrew: "ὁ δὲ κύριός μοι παρέστη"
    gloss: "the Lord stood by me"
    point: "*Paristēmi* means to come and stand right beside someone – in court, like an advocate beside the accused. When no one stood by Paul, “the Lord stood by me and gave me strength” (4:17)."
discussion:
  - q: "Paul gives his charge “before God and Christ Jesus, who is going to judge the living and the dead”. How does living before the coming King change the way we speak and serve?"
    ref: "4:1-4:2"
  - q: "People “will pile up teachers for themselves because their ears itch”. Where are we tempted to listen only to what we want to hear? How do you react when the Word reproves you?"
    ref: "4:3-4:4"
  - q: "“I have fought the good fight, I have run the race to the end, I have kept the faith.” The crown is for “all who have loved his appearing”. What does it look like to love Christ's appearing in everyday life?"
    ref: "4:7-4:8"
  - q: "Demas “loved this present age”; Mark, who once deserted Paul, is now “useful to me for service”. What do these two stories say to someone who started strong – and to someone who has failed?"
    ref: "4:10-4:11"
  - q: "About Alexander Paul says “the Lord will repay him according to his works”; about those who left him, “may it not be counted against them!” How does Paul handle people who hurt him? Is there someone you need to leave with God or forgive?"
    ref: "4:14-4:16"
  - q: "When have you known that the Lord stood by you when people could not or would not? Share only what you are comfortable sharing."
    ref: "4:17-4:18"
  - q: "As we finish 2 Timothy: which verse from these four chapters will you take with you, and why?"
application:
  - "Think of a “Mark” – someone who has failed or drifted and feels written off. Contact them this week with a word of encouragement."
  - "Choose one verse from 2 Timothy as your verse for the road, learn it by heart, and tell one person why you chose it."
prayer: "Thank God that the Lord stood by Paul and stands by us. Pray for people who stand alone right now – in a hospital room, a courtroom or at a grave. Then read 4:18 aloud together: “The Lord will rescue me from every evil deed and will save me for his heavenly kingdom. To him be the glory for ever and ever. Amen.” The leader closes with 4:22 as a blessing."
leader_notes:
  - "This is the last session of the series. Keep about ten minutes for the closing question (question 7) and the prayer; a shared meal afterwards suits the occasion."
  - "The chapter has two halves (days 8 and 9). Don't skip the personal requests and greetings in verses 9–22 – there the gospel becomes very personal: the cloak, the parchments, Trophimus left sick."
  - "4:14 is a statement, not a curse: “the Lord will repay him”. Following day 9, Paul does not take revenge but leaves the matter with God – and in verse 16 he prays for those who abandoned him."
  - "Talk of death (vv. 6–8) and of being abandoned (v. 16) may touch people who are grieving, lonely or have been let down. Allow silence with question 6 and don't press anyone to share."
  - "Avoid speculating about people from your church who have “left” when discussing Demas. End with Mark: past failure is never final with God."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
