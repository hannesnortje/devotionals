session: 2
lang: en
title: "Strengthened by Grace"
ref: "2:1-2:26"
days: [3, 4, 5]
big_idea: "Strengthened by grace and remembering the risen Christ, we pass the unchained word on to faithful people, handle it accurately and meet even our opponents with gentleness – because he remains faithful."
opening: "Who taught you a skill – cooking, a trade, a sport – that you have since passed on to someone else?"
context: >-
  Chapter 1 ended with people who turned away and one faithful friend; chapter 2 opens with “You then, my child” – Timothy must stand firm.
  Paul knows his life will soon end, and his question is how the gospel will go forward when he is no longer there.
  Tonight we read three pictures of endurance, the unchained word with a hymn of God's faithfulness, and instructions for dealing with false teaching in the church – Hymenaeus and Philetus were saying that the resurrection had already taken place.
read_aloud_tip: "Read in three parts with three readers: verses 1–7 (soldier, athlete, farmer), verses 8–13 (read the hymn in verses 11–13 together, line by line), verses 14–26 (the approved worker and the servant of the Lord)."
hebrew:
  - word: "endynamou"
    hebrew: "ἐνδυναμοῦ"
    gloss: "be strengthened"
    point: "Present tense and usually understood as passive (2:1): keep on letting yourself be made strong by the grace that is in Christ Jesus. Strength is not generated from within; it is received from Christ's grace."
  - word: "orthotomeō"
    hebrew: "ὀρθοτομέω"
    gloss: "handle accurately"
    point: "Found only here in the New Testament, literally “cutting straight” – a stonemason, a ploughman's furrow, a straight road, or Paul the tentmaker cutting along a pattern. False teachers cut Scripture crooked; the approved worker is one “who handles the word of truth accurately” (2:15)."
  - word: "skeuos eis timēn"
    hebrew: "σκεῦος εἰς τιμήν"
    gloss: "a vessel meant for honour"
    point: "In a large house some vessels serve at the table, others carry out the waste (2:20). But unlike a clay pot, anyone who purifies himself “will be a vessel meant for honour – consecrated, useful to the master” (2:21). Purity, not status, makes us useful."
discussion:
  - q: "Paul says “be strengthened by the grace”. What is the difference between trying to be strong for God in our own strength and letting his grace make us strong?"
    ref: "2:1"
  - q: "Verse 2 describes four generations: Paul, Timothy, “faithful people” and “others”. Why does Paul look first for faithful people rather than brilliant ones? Whose life are you investing in?"
    ref: "2:2"
  - q: "Soldier, athlete, farmer: undivided focus, no shortcuts, patient hard work. Which of the three pictures speaks to you most right now – and why?"
    ref: "2:3-2:7"
  - q: "“Remember Jesus Christ, raised from the dead.” When problems fill your whole field of vision, what helps you keep the risen Christ before your eyes?"
    ref: "2:8"
  - q: "Paul is chained “like a criminal”, “but the word of God is not chained”. Where do you feel limited or “chained” – and how might God's word still move through you?"
    ref: "2:9"
  - q: "Read the hymn in verses 11–13 again. Which line comforts you, and which line warns you? What does “he remains faithful” mean to you on a weak day?"
    ref: "2:11-2:13"
  - q: "Verses 24–26: a servant of the Lord must not quarrel, but be kind, patient when wronged, and correct with gentleness. Think of someone who opposes your faith. What would gentleness look like in your next conversation?"
    ref: "2:24-2:26"
application:
  - "Choose one of the “faithful people” around you – a younger colleague, a child or grandchild, someone new to faith – and arrange a coffee in the next two weeks to open the Scriptures and pray together."
  - "Each morning this week, before you look at your phone, read 2:8 and tell yourself: “Remember Jesus Christ.” Then name one situation in which you will trust his unchained word."
prayer: "Read the hymn of 2:11–13 aloud together. Then pray in threes: for strength from grace in a place where you feel exhausted, for the faithful people you want to invest in, and with gentleness for someone who opposes the faith – that God may grant them repentance that leads to the knowledge of the truth."
leader_notes:
  - "This session covers three devotionals (days 3–5) and the whole of chapter 2. Don't try to cover everything: choose one question from each section (vv. 1–7, 8–13, 14–26) and add others as time allows."
  - "Verses 11–13: our translation keeps the future tense in 12b (“if we will deny him”) and leaves open whether verse 13 is a warning or a comfort. The day 4 devotional mentions both and stresses the comfort for the weak; 12b means a final, persistent rejection of Christ, not a stumble like Peter's that ends in repentance. If someone fears they have “denied” Christ, point them to verse 13 and offer to talk afterwards."
  - "Verse 18: Hymenaeus and Philetus taught that the resurrection had already taken place – probably only as an inner, spiritual awakening, with no future bodily resurrection (day 5). Hymenaeus is very probably the man of 1 Timothy 1:20."
  - "Verse 22 “desires of youth”: the day 5 devotional includes sexual temptation but also the urges of an immature spirit – impatience, opinionatedness, the urge to win every argument, a quick temper, pride. Keep this in view so that the verse is not heard as being only about sex or only about the young."
  - "Verse 26 is open in the Greek: whose will is meant (“for his will”) – the devil's or God's? Our translation leaves it open; you don't need to decide."
  - "Point ahead: next week chapter 3 – difficult times in the last days, and the Scripture that is God-breathed."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
