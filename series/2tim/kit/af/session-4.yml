session: 4
lang: af
title: "Die Wedloop tot die Einde"
ref: "4:1-4:22"
days: [8, 9]
big_idea: "Omdat die Skrif God se stem is en Christus as Regter kom, verkondig ons die woord of die tyd geleë is of nie – en wanneer almal anders weggaan, staan die Here aan die kant van sy dienaar en bring hom veilig huis toe."
opening: "Dink aan 'n eindstreep wat jy al oorgesteek het – 'n wedloop, 'n eksamen, 'n groot projek, 'n lang reis. Wat het jou naby die einde laat aanhou?"
context: >-
  Paulus sit in boeie in Rome, waarskynlik omstreeks 66 of 67 n.C.; die winter kom nader en hy weet sy dood is naby.
  Hoofstuk 4 bevat die laaste woorde wat ons uit sy pen het: 'n plegtige opdrag aan Timoteus, 'n terugblik op sy voltooide wedloop, en baie persoonlike versoeke en groete.
  Vanaand sluit ons die reeks af met Paulus se laaste woorde.
read_aloud_tip: "Gebruik drie lesers: verse 1–5 (die opdrag – beslis, soos 'n herout), verse 6–8 (Paulus se getuienis – stadig), verse 9–22 (versoeke en groete – laat die name inwerk). Lees aan die einde vers 22 saam hardop."
hebrew:
  - word: "kēryxon ton logon"
    hebrew: "κήρυξον τὸν λόγον"
    gloss: "verkondig die woord"
    point: "'n *Kēryx* was 'n herout wat die koning se dekreet op die stadsplein uitgeroep het – nie sy eie filosofie nie. Sy enigste plig was getrouheid aan die boodskap van die een wat hom gestuur het, “of die tyd geleë is of nie” (4:2)."
  - word: "spendomai / analysis"
    hebrew: "σπένδομαι / ἀνάλυσις"
    gloss: "as 'n drankoffer uitgegiet … vertrek"
    point: "“Want ek word reeds as 'n drankoffer uitgegiet” (4:6): Paulus sien sy teregstelling nie as 'n vermorste lewe nie, maar as 'n laaste offer van aanbidding. *Analysis* is gebruik vir die losmaak van 'n skip se ankertoue – die dood as vertrek huis toe."
  - word: "ho kyrios moi parestē"
    hebrew: "ὁ δὲ κύριός μοι παρέστη"
    gloss: "die Here het aan my kant gestaan"
    point: "*Paristēmi* beteken om na iemand toe te kom en reg langs hom te gaan staan – in die hof soos 'n advokaat langs die beskuldigde. Toe niemand aan Paulus se kant was nie: “Maar die Here het aan my kant gestaan en my krag gegee” (4:17)."
discussion:
  - q: "Paulus gee sy opdrag “voor God en Christus Jesus, wat die lewendes en die dooies gaan oordeel”. Hoe verander dit ons praat en ons dien dat ons leef voor die Koning wat kom?"
    ref: "4:1-4:2"
  - q: "Paulus waarsku dat hulle “volgens hulle eie begeertes vir hulleself 'n klomp leraars bymekaar sal maak, omdat hulle ore jeuk”. Waar is ons in die versoeking om net te luister na wat ons wil hoor? Hoe reageer jy wanneer die Woord jou weerlê?"
    ref: "4:3-4:4"
  - q: "“Ek het die goeie stryd gestry, ek het die wedloop tot die einde toe gehardloop, ek het die geloof bewaar.” Die krans is vir “almal wat sy verskyning liefgekry het”. Hoe lyk dit in die alledaagse lewe om Christus se verskyning lief te hê?"
    ref: "4:7-4:8"
  - q: "Demas het Paulus in die steek gelaat “omdat hy die huidige wêreld liefgekry het”; oor Markus, wat eens van Paulus weggeloop het, sê hy nou: “want hy is vir my bruikbaar vir die diens”. Wat sê hierdie twee verhale vir iemand wat sterk begin het – en vir iemand wat misluk het?"
    ref: "4:10-4:11"
  - q: "Oor Aleksander sê Paulus “die Here sal hom vergeld volgens sy werke”; oor dié wat hom verlaat het: “mag dit nie teen hulle gereken word nie!” Hoe hanteer Paulus mense wat hom seergemaak het? Is daar iemand wat jy aan God moet oorlaat of moet vergewe?"
    ref: "4:14-4:16"
  - q: "Wanneer het jy beleef dat die Here aan jou kant gestaan het toe mense dit nie kon of wou doen nie? Deel net wat jy gemaklik voel om te deel."
    ref: "4:17-4:18"
  - q: "Noudat ons 2 Timoteus klaar gelees het: watter vers uit hierdie vier hoofstukke neem jy saam, en hoekom?"
application:
  - "Dink aan 'n “Markus” – iemand wat misluk het of weggedryf het en voel hy is afgeskryf. Kontak hom of haar hierdie week met 'n woord van bemoediging."
  - "Kies een vers uit 2 Timoteus as jou vers vir die pad, leer dit uit jou kop en vertel vir een persoon waarom jy dit gekies het."
prayer: "Dank God dat die Here aan Paulus se kant gestaan het en ook aan ons kant staan. Bid vir mense wat nou alleen staan – in 'n hospitaalkamer, in 'n hofsaal of by 'n graf. Lees dan 4:18 saam hardop: “Die Here sal my verlos van elke bose daad en my red vir sy hemelse koninkryk. Aan Hom kom die heerlikheid toe tot in alle ewigheid. Amen.” Die leier sluit af met 4:22 as seën."
leader_notes:
  - "Dit is die laaste byeenkoms van die reeks. Beplan sowat tien minute vir die slotvraag (vraag 7) en die gebed; 'n gesamentlike ete daarna pas goed by die aand."
  - "Die hoofstuk het twee helftes (dag 8 en 9). Moenie die persoonlike versoeke en groete in verse 9–22 oorslaan nie – daar word die evangelie baie persoonlik: die mantel, die perkamente, Trofimus wat siek agtergebly het."
  - "4:14 is 'n stelling, nie 'n vloek nie: “die Here sal hom vergeld”. Soos in die oordenking van dag 9: Paulus neem nie self wraak nie, maar laat die saak by God – en in vers 16 bid hy vir dié wat hom in die steek gelaat het."
  - "Die praat oor sterwe (verse 6–8) en oor in die steek gelaat word (vers 16) kan mense raak wat rou, eensaam is of teleurgestel is. Laat stilte toe by vraag 6 en moenie iemand druk om te deel nie."
  - "Vermy bespiegeling oor mense uit julle gemeente wat “weggegaan” het wanneer julle oor Demas praat. Sluit af met Markus: mislukking in die verlede is nooit finaal by God nie."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
