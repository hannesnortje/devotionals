session: 2
lang: af
title: "Sterk in die genade"
ref: "2:1-2:26"
days: [3, 4, 5]
big_idea: "Sterk gemaak deur die genade en met die opgewekte Christus voor oë gee ons die ongeboeide woord aan getroue mense oor, werk reguit daarmee en behandel selfs ons teenstanders met sagmoedigheid – want Hy bly getrou."
opening: "Wie het jou 'n vaardigheid geleer – kook, 'n ambag, 'n sport – wat jy intussen self aan iemand anders oorgedra het?"
context: >-
  Hoofstuk 1 het geëindig met mense wat hulle rug gedraai het en een getroue vriend; hoofstuk 2 begin met “Jy dan, my kind” – Timoteus moet standhou.
  Paulus weet sy lewe kom binnekort tot 'n einde, en sy vraag is hoe die evangelie vorentoe sal gaan wanneer hy nie meer daar is nie.
  Vanaand lees ons drie beelde van volharding, die ongeboeide woord saam met 'n lied oor God se trou, en opdragte oor hoe om dwaalleer in die gemeente te hanteer – Himeneus en Filetus het gesê dat die opstanding reeds plaasgevind het.
read_aloud_tip: "Lees in drie dele met drie lesers: verse 1–7 (soldaat, atleet, boer), verse 8–13 (lees die lied in verse 11–13 saam, reël vir reël), verse 14–26 (die goedgekeurde arbeider en die kneg van die Here)."
hebrew:
  - word: "endynamou"
    hebrew: "ἐνδυναμοῦ"
    gloss: "word sterk"
    point: "Teenwoordige tyd en gewoonlik passief verstaan (2:1): laat jou voortdurend sterk maak deur die genade wat in Christus Jesus is. Krag word nie van binne opgewek nie; dit word uit Christus se genade ontvang."
  - word: "orthotomeō"
    hebrew: "ὀρθοτομέω"
    gloss: "reguit werk met"
    point: "Kom net hier in die Nuwe Testament voor en beteken letterlik “reguit sny” – 'n klipkapper, 'n ploeër se voor, 'n reguit pad, of Paulus die tentmaker wat volgens 'n patroon sny. Dwaalleraars sny die Skrif skeef; die goedgekeurde arbeider is een “wat met die woord van die waarheid reguit werk” (2:15)."
  - word: "skeuos eis timēn"
    hebrew: "σκεῦος εἰς τιμήν"
    gloss: "voorwerp tot eer"
    point: "In 'n groot huis word sommige voorwerpe by die tafel gebruik, terwyl ander die afval uitdra (2:20). Maar anders as 'n kleipot kan elkeen wat homself reinig, “'n voorwerp tot eer wees: geheilig, bruikbaar vir die eienaar” (2:21). Reinheid, nie status nie, maak ons bruikbaar."
discussion:
  - q: "Paulus sê: “word sterk in die genade”. Wat is die verskil tussen om uit eie krag sterk te probeer wees vir God en om deur sy genade sterk gemaak te word?"
    ref: "2:1"
  - q: "Vers 2 beskryf vier geslagte: Paulus, Timoteus, “getroue mense” en “ander”. Waarom soek Paulus eerste getroue mense en nie briljantes nie? In wie se lewe belê jy?"
    ref: "2:2"
  - q: "Soldaat, atleet, boer: onverdeelde fokus, geen kortpaaie nie, geduldige harde werk. Watter een van die drie beelde spreek jou nou die meeste aan – en waarom?"
    ref: "2:3-2:7"
  - q: "“Dink aan Jesus Christus, opgewek uit die dood.” Wanneer probleme jou hele blikveld vul – wat help jou om die opgewekte Christus voor oë te hou?"
    ref: "2:8"
  - q: "Paulus dra boeie “soos 'n misdadiger” – “maar die woord van God is nie geboei nie”. Waar voel jy beperk of “geboei” – en hoe kan God se woord steeds deur jou werk?"
    ref: "2:9"
  - q: "Lees die lied in verse 11–13 weer. Watter reël troos jou, en watter een waarsku jou? Wat beteken “bly Hy getrou” vir jou op 'n swak dag?"
    ref: "2:11-2:13"
  - q: "Verse 24–26: 'n kneg van die Here moet nie rusie maak nie, maar vriendelik wees, geduldig wanneer hom onreg aangedoen word, en met sagmoedigheid teregwys. Dink aan iemand wat jou geloof teëstaan. Hoe sou sagmoedigheid in julle volgende gesprek lyk?"
    ref: "2:24-2:26"
application:
  - "Kies een van die “getroue mense” in jou lewenswêreld – 'n jonger kollega, 'n kind of kleinkind, iemand wat nuut in die geloof is – en reël binne die volgende twee weke 'n koppie koffie om saam die Skrif oop te maak en te bid."
  - "Lees elke oggend hierdie week, voordat jy na jou foon kyk, 2:8 en sê vir jouself: “Dink aan Jesus Christus.” Noem dan een situasie waarin jy sy ongeboeide woord gaan vertrou."
prayer: "Lees saam die lied uit 2:11–13 hardop. Bid dan drie-drie: vir krag uit die genade op 'n plek waar julle uitgeput is, vir die getroue mense in wie julle wil belê, en met sagmoedigheid vir iemand wat die geloof teëstaan – dat God aan hom of haar bekering sal gee wat tot kennis van die waarheid lei."
leader_notes:
  - "Hierdie byeenkoms dek drie oordenkings (dag 3–5) en die hele hoofstuk 2. Moenie probeer om alles te behandel nie: kies een vraag uit elke gedeelte (verse 1–7, 8–13, 14–26) en voeg ander by as daar tyd is."
  - "Verse 11–13: ons vertaling behou in 12b die toekomende tyd (“as ons Hom sal verloën”) en laat oop of vers 13 'n waarskuwing of 'n troos is. Die oordenking van dag 4 noem albei en beklemtoon die troos vir die swakkes; 12b gaan oor 'n finale, volgehoue verwerping van Christus, nie oor 'n struikeling soos Petrus s'n wat in bekering eindig nie. As iemand bang is dat hy of sy Christus “verloën” het, wys na vers 13 en bied ná die tyd 'n gesprek aan."
  - "Vers 18: Himeneus en Filetus het geleer dat die opstanding reeds plaasgevind het – waarskynlik net as 'n innerlike, geestelike ontwaking, sonder 'n toekomstige liggaamlike opstanding (dag 5). Himeneus is heel waarskynlik dieselfde man as in 1 Timoteus 1:20."
  - "Vers 22 “begeertes van die jeug”: die oordenking van dag 5 sluit seksuele versoekings in, maar bedoel ook die drange van 'n onvolwasse gees – ongeduld, eiewysheid, die drang om elke argument te wen, opvlieëndheid en hoogmoed. Hou dit in gedagte, sodat die vers nie net op seks of net op jong mense betrek word nie."
  - "Vers 26 is oop in die Grieks: wie se wil word bedoel (“vir sy wil”) – die duiwel s'n of God s'n? Ons vertaling laat dit oop; julle hoef dit nie te besluit nie."
  - "Vooruitskouing: volgende week gaan hoofstuk 3 oor swaar tye in die laaste dae en oor die Skrif wat deur God ingegee is."
