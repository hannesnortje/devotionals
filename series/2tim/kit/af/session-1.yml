session: 1
lang: af
title: "Moenie jou skaam nie"
ref: "1:1-1:18"
days: [1, 2]
big_idea: "God het ons nie 'n gees van bangheid gegee nie: omdat Christus die mag van die dood gebreek het en God die toevertroude goed bewaak, kan ons sy gawe weer aan die brand blaas en ons nie skaam vir die evangelie of vir sy lydende mense nie."
opening: "Dink aan 'n kampvuur of 'n kaggel wat amper doodgegaan het. Wat het dit gekos om dit weer aan die brand te kry?"
context: >-
  Paulus is omstreeks 66–67 n.C. onder keiser Nero in Rome in boeie, en hy verwag sy teregstelling.
  Dit is sy laaste brief – aan sy “geliefde kind” Timoteus in Efese, wat onder groot druk is en in die versoeking is om terug te deins.
  Vanaand lees ons hoofstuk 1: 'n gawe wat weer aan die brand geblaas moet word, 'n evangelie waarvoor ons ons nie hoef te skaam nie, en twee heel verskillende maniere om op 'n apostel in boeie te reageer.
read_aloud_tip: "Lees in drie dele met drie lesers: verse 1–7 (die groet en God se gawe), verse 8–14 (nie skaam vir die evangelie nie – lees vers 12 stadig), verse 15–18 (dié wat hulle rug gedraai het, en Onesiforus)."
hebrew:
  - word: "anazōpyreō"
    hebrew: "ἀναζωπυρέω"
    gloss: "blaas … weer aan die brand"
    point: "'n Werkwoord wat net hier in die Nuwe Testament voorkom: ana (weer), zōos (lewend), pyr (vuur) – 'n blaasbalk oor smeulende kole totdat die as wegwaai. Timoteus se gawe is nie dood nie, maar vrees en trane het 'n laag as daaroor laat gaan lê (1:6)."
  - word: "epaischynomai"
    hebrew: "ἐπαισχύνομαι"
    gloss: "jou skaam"
    point: "Die sleutelwoord van 1:8–18 kom drie keer voor: as 'n oproep aan Timoteus (vers 8), as Paulus se eie getuienis (vers 12) en as die ereteken van Onesiforus, wat hom “nie vir my ketting geskaam nie” (vers 16)."
  - word: "parathēkē"
    hebrew: "παραθήκη"
    gloss: "my toevertroude goed"
    point: "'n Bank- en regsterm vir iets wat aan iemand oorhandig word om te bewaar. In 1:12 laat die Grieks oop of dit gaan oor wat Paulus aan God toevertrou het, of oor wat God aan Paulus toevertrou het; in 1:14 is dit duidelik die gesonde leer wat aan Timoteus toevertrou is."
discussion:
  - q: "Paulus is in boeie en verwag die dood, en tog begin hy met “die belofte van die lewe wat in Christus Jesus is” en met dankbaarheid. Wat sê dit oor waar sy hoop geanker is?"
    ref: "1:1-1:5"
  - q: "Timoteus se geloof het “eers in jou ouma Loïs en in jou ma Eunike gewoon”. Wie het die geloof aan jou oorgedra – en waarom voeg Paulus by: “ook in jou”?"
    ref: "1:5"
  - q: "“Blaas die genadegawe van God weer aan die brand” – die gawe lê onder die as, dit is nie dood nie. Watter soort “as” gaan lê vandag op ons geloof en ons gawes?"
    ref: "1:6"
  - q: "Vers 7 praat van “'n gees van bangheid” – nie natuurlike versigtigheid nie, maar terugdeins voor dit waartoe God ons roep. Waar steek ons vrees agter goeie verskonings weg? Hoe sou krag, liefde en selfbeheersing eerder lyk?"
    ref: "1:7"
  - q: "Lees verse 9–10 weer. Hoe gee dit ons moed om vir die evangelie op te staan as ons weet dat die genade ons “voor die ewige tye” gegee is en dat Christus “die mag van die dood gebreek” het?"
    ref: "1:8-1:10"
  - q: "“Ek weet in wie ek geglo het.” Paulus se sekerheid rus op 'n Persoon, nie net op feite nie. Watter verskil maak dit wanneer jy onder druk is?"
    ref: "1:12"
  - q: "Figelus en Hermogenes het hulle rug gedraai; Onesiforus het “onvermoeid na my gesoek en my gevind”. Wie in jou lewenswêreld is deur siekte, verlies of eensaamheid “geboei” – en wat sal dit kos om vir so iemand 'n Onesiforus te wees?"
    ref: "1:15-1:18"
application:
  - "Noem hierdie week een laag “as” op jou geloof of jou gawes en neem een praktiese stap om die vlam weer aan te blaas – gebed, die Skrif oopmaak, of 'n gawe gebruik wat jy laat lê het."
  - "Wees 'n Onesiforus: gaan soek een persoon op wat deur 'n moeilike tyd gaan – besoek, bel of skryf – en gee vir hom of haar nuwe krag."
prayer: "Lees eers saam vers 7 hardop. Bid dan twee-twee: dank God vir die mense wat die geloof aan julle oorgedra het, noem een plek waar vrees julle terughou, en vra vir sy krag, liefde en selfbeheersing. Bid laastens vir mense wat julle ken wat deur swaarkry “geboei” is."
leader_notes:
  - "Hierdie byeenkoms dek twee oordenkings (dag 1–2). Hoofstuk 1 is ryk; kies vier of vyf vrae en gee die laaste een genoeg tyd."
  - "1:12 “my toevertroude goed”: ons vertaling laat dit doelbewus oop. Dit kan wees wat Paulus aan God toevertrou het (sy lewe, sy bediening, sy toekoms) of wat God aan Paulus toevertrou het (die evangelie, soos in 1:14). Albei lesings bring troos – moenie dat die vraag die hooftema van die aand word nie."
  - "Sommige in die groep het nie 'n Loïs of Eunike gehad nie, of treur oor kinders of kleinkinders wat die geloof verlaat het. Hanteer dit sensitief: Paulus wys daarop dat die geloof persoonlik moet word – “ook in jou” – en God gebruik ook geestelike ouers en mentors."
  - "Vers 7 kan vir mense wat met angs worstel, soos 'n verwyt klink. Die oordenking van dag 1 onderskei deilia (bangheid: terugdeins voor God se roeping) van natuurlike versigtigheid, en sê dat vrees nie deur wilskrag alleen oorwin word nie, maar deur die volheid van die Gees. Moenie dat die vers 'n oordeel oor iemand se stryd word nie."
  - "Agtergrond: in Rome se kultuur van eer en skande kon dit jou aansien, jou besittings en selfs jou vryheid kos om by 'n veroordeelde gevangene te staan. Help die groep om vandag se eweknieë te vind sonder dat die aand 'n klaagsessie oor die kultuur word."
  - "Vooruitskouing: volgende week gaan hoofstuk 2 oor die soldaat, die atleet en die boer – en oor die sin: “Maar die woord van God is nie geboei nie.”"
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
