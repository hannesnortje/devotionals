session: 3
lang: af
title: "Bly by die Woord"
ref: "3:1-3:17"
days: [6, 7]
big_idea: "In moeilike tye is 'n uiterlike vorm van godsvrug nie genoeg nie; wat ons staande hou, is die Skrif wat deur God ingegee is, geleer by mense wie se lewe ons van naby gesien het."
opening: "Wie het jou iets belangriks geleer – nie in 'n klaskamer nie, maar deur jou te laat sien hoe hulle leef? Wat het jy by hulle opgetel?"
context: >-
  Aan die einde van hoofstuk 2 het Paulus vir Timoteus gesê om die misleides met sagmoedigheid en geduld te behandel.
  Nou waarsku hy hom om nie naïef te wees nie: die “laaste dae” – die hele tydperk tussen Christus se eerste koms en sy wederkoms – bring moeilike tye, selfs binne die kerk.
  Vanaand lees ons hoofstuk 3: 'n beeld van godsdiens wat net 'n buitedop is, en Paulus se antwoord – 'n lewe wat in die oopte geleef word, en die Skrif wat God self uitgeadem het.
read_aloud_tip: "Gebruik twee lesers: verse 1–9 (die waarskuwing – lees die lys in 'n bestendige tempo en wag 'n oomblik ná “Draai weg van sulke mense!”) en verse 10–17 (die antwoord); lees daarna verse 16–17 saam hardop."
hebrew:
  - word: "philautoi … philotheoi"
    hebrew: "φίλαυτοι … φιλόθεοι"
    gloss: "liefhebbers van hulleself … meer liefhet as God"
    point: "Paulus raam die lys met woorde wat op *philos* (liefde) gebou is: dit begin met “liefhebbers van hulleself” en eindig met “mense wat plesier meer liefhet as God” (3:2, 4). Die wortel van die verval is liefde wat skeefgetrek is – wanneer liefde vir die self die liefde vir God verdring, val verhoudings uitmekaar."
  - word: "morphōsis eusebeias"
    hebrew: "μόρφωσις εὐσεβείας"
    gloss: "uiterlike vorm van godsvrug"
    point: "'n *Morphōsis* is 'n uiterlike vorm of dop. Van hierdie mense staan daar: “Hulle het die uiterlike vorm van godsvrug, maar die krag daarvan verloën hulle” (3:5) – die regte woorde en die regte byeenkomste, maar geen *dynamis* nie, geen krag van die Gees wat die hart verander nie."
  - word: "theopneustos"
    hebrew: "θεόπνευστος"
    gloss: "deur God ingegee"
    point: "Die woord kom net hier in die Nuwe Testament voor (3:16): die Skrif is deur God uitgeadem. Wanneer die Skrif praat, praat God – en daarom is dit nuttig “om te leer, om te weerlê, om reg te stel, om op te lei in geregtigheid”."
discussion:
  - q: "Lees die lys in verse 2–4 weer. Watter van hierdie kenmerke herken jy die duidelikste in ons kultuur vandag? Waarom sou die lys met “liefhebbers van hulleself” begin?"
    ref: "3:1-3:4"
  - q: "Paulus beskryf mense van wie dit geld: “Hulle het die uiterlike vorm van godsvrug, maar die krag daarvan verloën hulle”. Hoe kan dit in 'n gemeente lyk – en, eerlik gesê, in my eie lewe?"
    ref: "3:5"
  - q: "Mense “wat altyd leer en tog nooit tot kennis van die waarheid kan kom nie” – hoe is dit moontlik om baie preke, podcasts en boeke in te neem en tog nie te verander nie?"
    ref: "3:7"
  - q: "Jannes en Jambres het Moses teëgestaan deur sy wonders na te boots. Waar ontmoet ons vandag namaaksels van ware geloof, en hoe ken ons die verskil?"
    ref: "3:8-3:9"
  - q: "Timoteus het Paulus se lewe noukeurig gevolg – ook wat in Listra gebeur het, waarskynlik sy tuisdorp. Wie het jou hulle geloof van naby laat sien? En wie kyk na joune?"
    ref: "3:10-3:11"
  - q: "“almal wat in Christus Jesus in godsvrug wil lewe, sal vervolg word.” Verwag ons dat die Christelike lewe gemaklik sal wees? Wat het die navolging van Christus jou al gekos?"
    ref: "3:12"
  - q: "Die Skrif is nuttig “om te leer, om te weerlê, om reg te stel, om op te lei in geregtigheid”. Watter van hierdie vier verwelkom jy maklik – en watter probeer jy eerder ontwyk?"
    ref: "3:16-3:17"
application:
  - "Neem hierdie week elke dag een Skrifgedeelte en vra vier vrae: Wat leer dit my? Waar weerlê dit my? Wat wil dit by my regstel? Hoe lei dit my op in geregtigheid?"
  - "Bestee hierdie week tyd saam met iemand wat jonger in die geloof is – 'n kind, 'n kleinkind of 'n nuwe gelowige – en vertel hulle van 'n keer toe God jou deur iets swaars gedra het."
prayer: "Begin met 'n minuut van stilte en vra God om julle te wys waar julle tevrede is met 'n uiterlike vorm. Bid dan saam: dank God vir sy Woord wat deur Hom ingegee is, vir die ouers, grootouers en mentors wat dit aan julle oorgedra het, en bid vir die kinders en jongmense in julle lewe."
leader_notes:
  - "Hierdie byeenkoms dek twee oordenkings (dag 6 en 7). Die lys in verse 2–4 lei maklik daartoe dat die groep oor “die wêreld daar buite” kla; dag 6 rig die skerpste vraag op “ons wat in die kerkbanke sit” – stuur die gesprek soontoe."
  - "Hanteer 3:6 (“swak vroue”, *gynaikaria*) versigtig. Soos in die oordenking van dag 6: dit is 'n oordeel oor hierdie spesifieke mense wat hulle laat inpalm het, nie oor vroue in die algemeen nie. Die oordeel val op die valse leraars; die mense wat hulle in hulle mag kry, is “vroue wat met sondes belaai is en deur allerlei begeertes gedryf word” – 'n swakheid wat enigeen van ons kan hê."
  - "Ons vertaling lees 3:16 predikatief: “Die hele Skrif is deur God ingegee en nuttig”. Dag 7 noem dat die lesing elke Skrif wat deur God ingegee is, is ook nuttig grammatikaal ook moontlik is; ons vertaling volg die meer algemene lesing. Noem dit as iemand vra, maar moenie dat dit die aand oorneem nie."
  - "Vers 15 (“van kleins af”) kan seer wees vir mense sonder 'n Christelike opvoeding, of vir ouers wie se kinders weggedraai het. Dit is nooit te laat om die Woord te saai nie – sê dit sag."
  - "As die tyd min is, laat vraag 4 weg. Vooruitskouing: volgende week is die laaste byeenkoms – hoofstuk 4, Paulus se laaste opdrag en sy laaste woorde. Oorweeg dit om dit met 'n ete of 'n langer gebedstyd af te sluit."
