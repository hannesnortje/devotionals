session: 4
lang: de
title: "Bis ans Ziel"
ref: "4:1-4:22"
days: [8, 9]
big_idea: "Weil die Schrift Gottes Stimme ist und Christus als Richter kommt, verkündigen wir das Wort, ob es gelegen kommt oder ungelegen – und wenn alle anderen gehen, tritt der Herr an die Seite seines Dieners und bringt ihn sicher nach Hause."
opening: "Denk an eine Ziellinie, die du überquert hast – ein Rennen, eine Prüfung, ein großes Projekt, eine lange Reise. Was hat dich kurz vor dem Ziel durchhalten lassen?"
context: >-
  Paulus liegt in Rom in Ketten, wahrscheinlich um 66 oder 67 n. Chr.; der Winter naht, und er weiß, dass sein Tod nahe ist.
  Kapitel 4 enthält die letzten Worte, die wir aus seiner Feder haben: einen feierlichen Auftrag an Timotheus, einen Rückblick auf sein vollendetes Rennen und sehr persönliche Bitten und Grüße.
  Heute schließen wir die Reihe mit Paulus' letzten Worten ab.
read_aloud_tip: "Lest mit drei Lesern: Verse 1–5 (der Auftrag – bestimmt, wie ein Herold), Verse 6–8 (Paulus' Zeugnis – langsam), Verse 9–22 (Bitten und Grüße – lasst die Namen wirken). Zum Schluss lest ihr Vers 22 gemeinsam laut."
hebrew:
  - word: "kēryxon ton logon"
    hebrew: "κήρυξον τὸν λόγον"
    gloss: "verkündige das Wort"
    point: "Ein *kēryx* war ein Herold, der auf dem Marktplatz den Erlass des Königs ausrief – nicht seine eigene Philosophie. Seine einzige Pflicht war die Treue zur Botschaft dessen, der ihn gesandt hatte, „ob es gelegen kommt oder ungelegen“ (4,2)."
  - word: "spendomai / analysis"
    hebrew: "σπένδομαι / ἀνάλυσις"
    gloss: "als Trankopfer ausgegossen … Aufbruch"
    point: "„Denn ich werde schon als Trankopfer ausgegossen“ (4,6): Paulus sieht seine Hinrichtung nicht als vergeudetes Leben, sondern als letzte Opfergabe der Anbetung. *Analysis* wurde für das Lösen der Ankertaue eines Schiffes gebraucht – der Tod als Aufbruch nach Hause."
  - word: "ho kyrios moi parestē"
    hebrew: "ὁ δὲ κύριός μοι παρέστη"
    gloss: "der Herr aber trat an meine Seite"
    point: "*Paristēmi* heißt, zu jemandem kommen und sich direkt neben ihn stellen – vor Gericht wie ein Anwalt neben den Angeklagten. Als niemand an Paulus' Seite war, gilt: „Der Herr aber trat an meine Seite und gab mir Kraft“ (4,17)."
discussion:
  - q: "Paulus gibt seinen Auftrag „vor Gott und Christus Jesus, der Lebende und Tote richten wird“. Wie verändert es unser Reden und Dienen, dass wir vor dem kommenden König leben?"
    ref: "4:1-4:2"
  - q: "Paulus warnt: „nach ihren eigenen Begierden werden sie sich eine Menge Lehrer zusammensuchen, weil ihnen die Ohren jucken“. Wo sind wir versucht, nur zu hören, was wir hören wollen? Wie reagierst du, wenn das Wort dich überführt?"
    ref: "4:3-4:4"
  - q: "„Ich habe den guten Kampf gekämpft, ich habe das Rennen zu Ende gebracht, ich habe den Glauben bewahrt.“ Den Siegeskranz gibt der Herr „allen, die sein Erscheinen lieb gewonnen haben“. Wie sieht es im Alltag aus, Christi Erscheinen lieb zu haben?"
    ref: "4:7-4:8"
  - q: "Demas hat Paulus verlassen, „weil er die jetzige Welt lieb gewonnen hat“; über Markus, der Paulus einst im Stich ließ, heißt es nun: „denn er ist mir brauchbar für den Dienst“. Was sagen diese beiden Geschichten jemandem, der stark angefangen hat – und jemandem, der versagt hat?"
    ref: "4:10-4:11"
  - q: "Über Alexander sagt Paulus: „der Herr wird ihm vergelten nach seinen Werken“; über die, die ihn verlassen haben: „möge es ihnen nicht angerechnet werden!“ Wie geht Paulus mit Menschen um, die ihn verletzt haben? Gibt es jemanden, den du Gott überlassen oder dem du vergeben musst?"
    ref: "4:14-4:16"
  - q: "Wann hast du erlebt, dass der Herr an deine Seite trat, als Menschen es nicht konnten oder nicht wollten? Teile nur, was du teilen möchtest."
    ref: "4:17-4:18"
  - q: "Zum Abschluss des zweiten Timotheusbriefes: Welchen Vers aus diesen vier Kapiteln nimmst du mit, und warum?"
application:
  - "Denk an einen „Markus“ – jemanden, der versagt hat oder abgedriftet ist und sich abgeschrieben fühlt. Melde dich diese Woche bei ihm mit einem ermutigenden Wort."
  - "Wähl dir einen Vers aus dem zweiten Timotheusbrief als Vers für den Weg, lern ihn auswendig und erzähl einem Menschen, warum du ihn gewählt hast."
prayer: "Dankt Gott, dass der Herr an Paulus' Seite trat und auch an unserer Seite steht. Betet für Menschen, die gerade allein dastehen – in einem Krankenzimmer, vor Gericht oder an einem Grab. Lest dann 4,18 gemeinsam laut: „Der Herr wird mich erretten vor jedem bösen Werk und mich retten für sein himmlisches Reich. Ihm sei die Herrlichkeit von Ewigkeit zu Ewigkeit. Amen.“ Der Leiter schließt mit 4,22 als Segen."
leader_notes:
  - "Dies ist das letzte Treffen der Reihe. Plane etwa zehn Minuten für die Abschlussfrage (Frage 7) und das Gebet ein; ein gemeinsames Essen danach passt gut zu diesem Abend."
  - "Das Kapitel hat zwei Hälften (Tag 8 und 9). Überspring die persönlichen Bitten und Grüße in den Versen 9–22 nicht – dort wird das Evangelium ganz persönlich: der Mantel, die Pergamente, der kranke Trophimus."
  - "4,14 ist eine Aussage, kein Fluch: „der Herr wird ihm vergelten“. Wie in der Andacht zu Tag 9: Paulus rächt sich nicht selbst, sondern überlässt die Sache Gott – und in Vers 16 betet er für die, die ihn verlassen haben."
  - "Das Reden vom Sterben (V. 6–8) und vom Verlassenwerden (V. 16) kann Menschen berühren, die trauern, einsam sind oder enttäuscht wurden. Lass bei Frage 6 Stille zu und dräng niemanden zum Erzählen."
  - "Vermeide bei Demas Spekulationen über Menschen aus eurer Gemeinde, die „gegangen“ sind. Schließ mit Markus: Versagen in der Vergangenheit ist bei Gott nie endgültig."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
