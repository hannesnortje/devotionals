session: 3
lang: de
title: "Bleib beim Wort"
ref: "3:1-3:17"
days: [6, 7]
big_idea: "In schweren Zeiten genügt eine äußere Form der Gottesfurcht nicht; was uns hält, ist die von Gott eingegebene Schrift, gelernt von Menschen, deren Leben wir aus der Nähe gesehen haben."
opening: "Wer hat dir etwas Wichtiges beigebracht – nicht im Unterricht, sondern indem du zusehen durftest, wie er oder sie lebt? Was hast du davon mitgenommen?"
context: >-
  Am Ende von Kapitel 2 hat Paulus Timotheus gesagt, er soll den Verführten mit Sanftmut und Geduld begegnen.
  Jetzt warnt er ihn, nicht naiv zu sein: In den „letzten Tagen“ – der ganzen Zeit zwischen dem ersten Kommen Christi und seiner Wiederkunft – werden schwere Zeiten anbrechen, auch mitten in der Gemeinde.
  Heute lesen wir Kapitel 3: das Bild einer Religion, die nur noch Hülle ist, und Paulus' Antwort – ein offen gelebtes Leben und die Schrift, die Gott selbst ausgehaucht hat.
read_aloud_tip: "Lest mit zwei Lesern: Verse 1–9 (die Warnung – die Liste in ruhigem Tempo lesen und nach „Von solchen wende dich ab!“ kurz innehalten) und Verse 10–17 (die Antwort); danach lest ihr die Verse 16–17 gemeinsam laut."
hebrew:
  - word: "philautoi … philotheoi"
    hebrew: "φίλαυτοι … φιλόθεοι"
    gloss: "selbstverliebt … mehr als Gott (lieben)"
    point: "Paulus rahmt die Liste mit Wörtern vom Stamm *philos* (Liebe) ein: Sie beginnt mit „selbstverliebt“ und endet mit „sie lieben das Vergnügen mehr als Gott“ (3,2.4). Die Wurzel des Verfalls ist eine Unordnung der Liebe – wenn die Liebe zum eigenen Ich die Liebe zu Gott verdrängt, zerbrechen die Beziehungen."
  - word: "morphōsis eusebeias"
    hebrew: "μόρφωσις εὐσεβείας"
    gloss: "äußere Form der Gottesfurcht"
    point: "Eine *morphōsis* ist eine äußere Form, eine Hülle. Von diesen Menschen heißt es: „Sie haben die äußere Form der Gottesfurcht, deren Kraft aber verleugnen sie“ (3,5) – die richtigen Worte und Versammlungen, aber keine *dynamis*, keine Kraft des Geistes, die das Herz verändert."
  - word: "theopneustos"
    hebrew: "θεόπνευστος"
    gloss: "von Gott eingegeben"
    point: "Das Wort kommt im Neuen Testament nur hier vor (3,16): Die Schrift ist von Gott ausgehaucht. Wenn die Schrift spricht, spricht Gott – darum ist sie nützlich „zur Lehre, zur Überführung, zur Zurechtbringung, zur Schulung in der Gerechtigkeit“."
discussion:
  - q: "Lest die Liste in den Versen 2–4 noch einmal. Welche dieser Merkmale erkennst du in unserer Kultur heute am deutlichsten? Warum beginnt die Liste wohl mit „selbstverliebt“?"
    ref: "3:1-3:4"
  - q: "Paulus beschreibt Menschen, von denen es heißt: „Sie haben die äußere Form der Gottesfurcht, deren Kraft aber verleugnen sie“. Wie könnte das in einer Gemeinde aussehen – und, ehrlich gesagt, in meinem eigenen Leben?"
    ref: "3:5"
  - q: "„die immer lernen und doch nie zur Erkenntnis der Wahrheit kommen können“ – wie ist es möglich, viele Predigten, Podcasts und Bücher aufzunehmen und sich doch nicht zu verändern?"
    ref: "3:7"
  - q: "Jannes und Jambres widersetzten sich Mose, indem sie seine Wunder nachahmten. Wo begegnen uns heute Nachahmungen echten Glaubens, und wie erkennen wir den Unterschied?"
    ref: "3:8-3:9"
  - q: "Timotheus ist Paulus' Leben genau gefolgt – auch dem, was in Lystra geschah, wahrscheinlich seiner Heimatstadt. Wer hat dich seinen Glauben aus der Nähe sehen lassen? Und wer schaut auf deinen?"
    ref: "3:10-3:11"
  - q: "„alle, die in Christus Jesus in Gottesfurcht leben wollen, werden verfolgt werden.“ Erwarten wir, dass das Leben als Christ bequem ist? Was hat dich die Nachfolge schon gekostet?"
    ref: "3:12"
  - q: "Die Schrift ist nützlich „zur Lehre, zur Überführung, zur Zurechtbringung, zur Schulung in der Gerechtigkeit“. Welches dieser vier lässt du gern zu – und welchem weichst du eher aus?"
    ref: "3:16-3:17"
application:
  - "Nimm dir diese Woche jeden Tag einen Bibelabschnitt und stell vier Fragen: Was lehrt er mich? Wo überführt er mich? Was will er bei mir zurechtbringen? Wie schult er mich in der Gerechtigkeit?"
  - "Verbring diese Woche Zeit mit jemandem, der jünger im Glauben ist – einem Kind, einem Enkelkind oder einem neuen Christen – und erzähl ihm von einer Zeit, in der Gott dich durch etwas Schweres getragen hat."
prayer: "Beginnt mit einer Minute Stille und bittet Gott, euch zu zeigen, wo ihr euch mit einer äußeren Form zufriedengebt. Dann betet gemeinsam: Dankt Gott für sein von ihm eingegebenes Wort, für die Eltern, Großeltern und Mentoren, die es euch weitergegeben haben, und betet für die Kinder und jungen Menschen in eurem Leben."
leader_notes:
  - "Dieses Treffen umfasst zwei Andachten (Tag 6 und 7). Die Liste in den Versen 2–4 lädt leicht dazu ein, über „die Welt da draußen“ zu klagen; Tag 6 richtet die schärfste Frage an „uns, die wir in den Kirchenbänken sitzen“ – lenke das Gespräch dorthin."
  - "Geh mit 3,6 („schwache Frauen“, *gynaikaria*) behutsam um. Wie in der Andacht zu Tag 6: Es ist ein Urteil über diese bestimmten Menschen, die sich haben einfangen lassen, nicht über Frauen im Allgemeinen. Unter dem Urteil stehen die falschen Lehrer; die Menschen, die sie einfangen, sind solche, „die mit Sünden beladen sind und von vielerlei Begierden getrieben werden“ – eine Schwäche, die jeder von uns haben kann."
  - "Unsere Übersetzung liest 3,16 prädikativ: „Alle Schrift ist von Gott eingegeben und nützlich“. Tag 7 erwähnt, dass grammatisch auch die Lesart jede von Gott eingegebene Schrift ist auch nützlich möglich ist; unsere Übersetzung folgt der verbreiteteren Lesart. Erwähne das, wenn jemand fragt, aber lass es nicht das Treffen bestimmen."
  - "Vers 15 („von klein auf“) kann für Menschen ohne christliche Erziehung schmerzlich sein – oder für Eltern, deren Kinder sich abgewandt haben. Es ist nie zu spät, das Wort zu säen – sag das behutsam."
  - "Wenn die Zeit knapp ist, lass Frage 4 weg. Ausblick: Nächste Woche ist das letzte Treffen – Kapitel 4, Paulus' letzter Auftrag und seine letzten Worte. Überlegt, es mit einem Essen oder einer längeren Gebetszeit abzuschließen."
