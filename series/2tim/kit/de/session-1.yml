session: 1
lang: de
title: "Schäme dich nicht"
ref: "1:1-1:18"
days: [1, 2]
big_idea: "Gott hat uns keinen Geist der Feigheit gegeben: Weil Christus den Tod entmachtet hat und Gott das anvertraute Gut bewahrt, können wir seine Gabe neu entfachen und uns weder des Evangeliums noch seiner leidenden Leute schämen."
opening: "Denk an ein Lagerfeuer oder einen Kamin, der fast ausgegangen war. Was hat es gebraucht, damit es wieder brennt?"
context: >-
  Paulus liegt um 66–67 n. Chr. unter Kaiser Nero in Rom in Ketten und rechnet mit seiner Hinrichtung.
  Dies ist sein letzter Brief – an sein „geliebtes Kind“ Timotheus in Ephesus, der unter großem Druck steht und versucht ist zurückzuweichen.
  Heute lesen wir Kapitel 1: eine Gabe, die neu entfacht werden soll, ein Evangelium, dessen wir uns nicht schämen müssen, und zwei ganz verschiedene Arten, auf einen gefangenen Apostel zu reagieren.
read_aloud_tip: "Lest in drei Teilen mit drei Lesern: Verse 1–7 (Gruß und die Gabe Gottes), Verse 8–14 (sich des Evangeliums nicht schämen – Vers 12 langsam lesen), Verse 15–18 (die sich abgewandt haben, und Onesiphorus)."
hebrew:
  - word: "anazōpyreō"
    hebrew: "ἀναζωπυρέω"
    gloss: "neu entfachen"
    point: "Ein Verb, das im Neuen Testament nur hier vorkommt: ana (wieder), zōos (lebendig), pyr (Feuer) – ein Blasebalg über glimmender Glut, bis die Asche wegfliegt. Die Gabe des Timotheus ist nicht tot, aber Angst und Tränen haben eine Schicht Asche darauf gelegt (1,6)."
  - word: "epaischynomai"
    hebrew: "ἐπαισχύνομαι"
    gloss: "sich schämen"
    point: "Das Schlüsselwort von 1,8–18 kommt dreimal vor: als Aufruf an Timotheus (V. 8), als Zeugnis des Paulus (V. 12) und als Ehrenzeichen des Onesiphorus, der „sich meiner Kette nicht geschämt“ hat (V. 16)."
  - word: "parathēkē"
    hebrew: "παραθήκη"
    gloss: "mein anvertrautes Gut"
    point: "Ein Begriff aus Bank- und Rechtswesen für etwas, das man jemandem zur Aufbewahrung übergibt. In 1,12 lässt der griechische Text offen, ob es um das geht, was Paulus Gott anvertraut hat, oder um das, was Gott Paulus anvertraut hat; in 1,14 ist es eindeutig die gesunde Lehre, die Timotheus anvertraut ist."
discussion:
  - q: "Paulus liegt in Ketten und rechnet mit dem Tod, und doch beginnt er mit der „Verheißung des Lebens, das in Christus Jesus ist“ und mit Dank. Was sagt das darüber, wo seine Hoffnung verankert ist?"
    ref: "1:1-1:5"
  - q: "Der Glaube des Timotheus hat „zuerst in deiner Großmutter Lois und in deiner Mutter Eunike“ gewohnt. Wer hat dir den Glauben weitergegeben – und warum fügt Paulus hinzu: „auch in dir“?"
    ref: "1:5"
  - q: "„Entfache die Gnadengabe Gottes neu“ – die Gabe liegt unter Asche, sie ist nicht tot. Welche Art von „Asche“ legt sich heute auf unseren Glauben und unsere Gaben?"
    ref: "1:6"
  - q: "Vers 7 spricht von einem „Geist der Feigheit“ – nicht natürliche Vorsicht, sondern ein Zurückweichen vor dem, wozu Gott uns ruft. Wo verstecken wir Angst hinter guten Ausreden? Wie sähen stattdessen Kraft, Liebe und Besonnenheit aus?"
    ref: "1:7"
  - q: "Lest die Verse 9–10 noch einmal. Wie macht es uns Mut, für das Evangelium einzustehen, wenn wir wissen, dass die Gnade uns „vor ewigen Zeiten“ gegeben wurde und Christus „den Tod entmachtet“ hat?"
    ref: "1:8-1:10"
  - q: "„Denn ich weiß, wem ich geglaubt habe.“ Die Zuversicht des Paulus ruht auf einer Person, nicht nur auf Fakten. Was ändert das, wenn du unter Druck stehst?"
    ref: "1:12"
  - q: "Phygelus und Hermogenes haben sich abgewandt; Onesiphorus hat „unermüdlich nach mir gesucht und mich gefunden“. Wer in deinem Umfeld ist durch Krankheit, Verlust oder Einsamkeit „gefesselt“ – und was würde es brauchen, für diesen Menschen ein Onesiphorus zu sein?"
    ref: "1:15-1:18"
application:
  - "Benenne diese Woche eine Schicht „Asche“ auf deinem Glauben oder deinen Gaben und tu einen praktischen Schritt, um die Flamme neu anzufachen – Gebet, die Schrift aufschlagen oder eine Gabe einsetzen, die du hast liegen lassen."
  - "Sei ein Onesiphorus: Such einen Menschen auf, der gerade eine schwere Zeit durchmacht – besuch ihn, ruf an oder schreib – und gib ihm neue Kraft."
prayer: "Lest zu Beginn gemeinsam Vers 7. Betet dann zu zweit: Dankt Gott für die Menschen, die euch den Glauben weitergegeben haben, nennt eine Stelle, an der euch die Angst zurückhält, und bittet um seine Kraft, Liebe und Besonnenheit. Betet zum Schluss für Menschen, die ihr kennt und die durch Not „gefesselt“ sind."
leader_notes:
  - "Dieses Treffen umfasst zwei Andachten (Tag 1–2). Kapitel 1 ist reich; wählt vier oder fünf Fragen aus und lasst der letzten genug Zeit."
  - "1,12 „mein anvertrautes Gut“: Unsere Übersetzung lässt das bewusst offen. Gemeint sein kann, was Paulus Gott anvertraut hat (sein Leben, seinen Dienst, seine Zukunft), oder was Gott Paulus anvertraut hat (das Evangelium, wie in 1,14). Beide Lesarten trösten – lasst die Frage nicht zum Hauptthema des Abends werden."
  - "Manche in der Gruppe hatten keine Lois oder Eunike oder trauern um Kinder oder Enkel, die den Glauben verlassen haben. Nimm das behutsam auf: Paulus geht es darum, dass der Glaube persönlich wird – „auch in dir“ –, und Gott gebraucht auch geistliche Eltern und Mentoren."
  - "Vers 7 kann für Menschen, die mit Ängsten kämpfen, wie ein Vorwurf klingen. Die Andacht von Tag 1 unterscheidet deilia (Feigheit: Zurückweichen vor Gottes Ruf) von natürlicher Vorsicht und sagt, dass Angst nicht allein durch Willenskraft überwunden wird, sondern durch die Fülle des Geistes. Lass den Vers kein Urteil über die Nöte Einzelner werden."
  - "Hintergrund: In der Ehre-und-Schande-Kultur Roms konnte es Ansehen, Besitz und sogar die Freiheit kosten, sich zu einem verurteilten Gefangenen zu stellen. Helft der Gruppe, heutige Entsprechungen zu finden, ohne dass der Abend zur Klage über die Kultur wird."
  - "Ausblick: Nächste Woche geht es in Kapitel 2 um den Soldaten, den Athleten und den Bauern – und um den Satz: „Aber das Wort Gottes ist nicht gefesselt.“"
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
