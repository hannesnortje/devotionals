session: 2
lang: de
title: "Stark in der Gnade"
ref: "2:1-2:26"
days: [3, 4, 5]
big_idea: "Durch die Gnade stark gemacht und im Blick auf den auferstandenen Christus geben wir das ungefesselte Wort an treue Menschen weiter, gehen geradlinig damit um und begegnen selbst unseren Gegnern mit Sanftmut – denn er bleibt treu."
opening: "Wer hat dir etwas beigebracht – Kochen, ein Handwerk, einen Sport –, das du inzwischen selbst an jemanden weitergegeben hast?"
context: >-
  Kapitel 1 endete mit Menschen, die sich abgewandt haben, und einem treuen Freund; Kapitel 2 beginnt mit „Du nun, mein Kind“ – Timotheus soll standhalten.
  Paulus weiß, dass sein Leben bald endet, und fragt, wie das Evangelium weitergehen wird, wenn er nicht mehr da ist.
  Heute lesen wir drei Bilder der Ausdauer, das ungefesselte Wort mit einem Lied von Gottes Treue und Anweisungen für den Umgang mit Irrlehre in der Gemeinde – Hymenäus und Philetus sagten, die Auferstehung sei schon geschehen.
read_aloud_tip: "Lest in drei Teilen mit drei Lesern: Verse 1–7 (Soldat, Athlet, Bauer), Verse 8–13 (das Lied in den Versen 11–13 lest ihr gemeinsam, Zeile für Zeile), Verse 14–26 (der bewährte Arbeiter und der Knecht des Herrn)."
hebrew:
  - word: "endynamou"
    hebrew: "ἐνδυναμοῦ"
    gloss: "werde stark"
    point: "Präsens und meist passivisch verstanden (2,1): Lass dich immer wieder stark machen durch die Gnade, die in Christus Jesus ist. Kraft wird nicht von innen erzeugt; sie wird aus der Gnade Christi empfangen."
  - word: "orthotomeō"
    hebrew: "ὀρθοτομέω"
    gloss: "geradlinig umgehen mit"
    point: "Kommt im Neuen Testament nur hier vor und heißt wörtlich „gerade schneiden“ – ein Steinmetz, die Furche eines Pflügers, ein gerader Weg oder Paulus als Zeltmacher, der nach einem Muster zuschneidet. Irrlehrer schneiden die Schrift krumm zu; der bewährte Arbeiter ist einer, „der mit dem Wort der Wahrheit geradlinig umgeht“ (2,15)."
  - word: "skeuos eis timēn"
    hebrew: "σκεῦος εἰς τιμήν"
    gloss: "Gefäß für Ehrenvolles"
    point: "In einem großen Haus dienen manche Gefäße bei Tisch, andere tragen den Abfall hinaus (2,20). Aber anders als ein Tontopf kann jeder, der sich reinigt, „ein Gefäß für Ehrenvolles sein: geheiligt, brauchbar für seinen Besitzer“ (2,21). Reinheit, nicht Rang, macht brauchbar."
discussion:
  - q: "Paulus sagt: „werde stark in der Gnade“. Was ist der Unterschied, ob wir aus eigener Kraft für Gott stark sein wollen oder uns von seiner Gnade stark machen lassen?"
    ref: "2:1"
  - q: "Vers 2 beschreibt vier Generationen: Paulus, Timotheus, treue Menschen und andere. Warum sucht Paulus zuerst treue Menschen und nicht brillante? In wessen Leben investierst du?"
    ref: "2:2"
  - q: "Soldat, Athlet, Bauer: ungeteilte Ausrichtung, keine Abkürzungen, geduldige harte Arbeit. Welches der drei Bilder spricht dich gerade am meisten an – und warum?"
    ref: "2:3-2:7"
  - q: "„Denk an Jesus Christus, von den Toten auferweckt.“ Wenn Probleme dein ganzes Blickfeld füllen – was hilft dir, den auferstandenen Christus vor Augen zu behalten?"
    ref: "2:8"
  - q: "Paulus trägt Fesseln „wie ein Verbrecher“ – „aber das Wort Gottes ist nicht gefesselt“. Wo fühlst du dich eingeschränkt oder „gefesselt“ – und wie kann Gottes Wort trotzdem durch dich wirken?"
    ref: "2:9"
  - q: "Lest das Lied in den Versen 11–13 noch einmal. Welche Zeile tröstet dich, welche warnt dich? Was bedeutet dir „bleibt er treu“ an einem schwachen Tag?"
    ref: "2:11-2:13"
  - q: "Verse 24–26: Ein Knecht des Herrn soll nicht streiten, sondern gütig sein, geduldig, wenn ihm Unrecht geschieht, und mit Sanftmut zurechtweisen. Denk an jemanden, der sich deinem Glauben widersetzt. Wie sähe Sanftmut in eurem nächsten Gespräch aus?"
    ref: "2:24-2:26"
application:
  - "Such dir einen der „treuen Menschen“ in deinem Umfeld aus – eine jüngere Kollegin, ein Kind oder Enkelkind, jemanden, der neu im Glauben ist – und verabrede dich in den nächsten zwei Wochen zu einem Kaffee, um gemeinsam die Schrift aufzuschlagen und zu beten."
  - "Lies diese Woche jeden Morgen, bevor du aufs Handy schaust, 2,8 und sag dir: „Denk an Jesus Christus.“ Nenne dann eine Situation, in der du seinem ungefesselten Wort vertrauen willst."
prayer: "Lest gemeinsam das Lied aus 2,11–13. Betet dann zu dritt: um Kraft aus der Gnade an einer Stelle, an der ihr erschöpft seid, für die treuen Menschen, in die ihr investieren wollt, und mit Sanftmut für jemanden, der sich dem Glauben widersetzt – dass Gott ihm Umkehr zur Erkenntnis der Wahrheit schenkt."
leader_notes:
  - "Dieses Treffen umfasst drei Andachten (Tag 3–5) und das ganze Kapitel 2. Versucht nicht, alles zu besprechen: Wählt je eine Frage zu jedem Abschnitt (V. 1–7, 8–13, 14–26) und nehmt weitere dazu, wenn Zeit bleibt."
  - "Verse 11–13: Unsere Übersetzung behält in 12b die Zukunft („wenn wir ihn verleugnen werden“) und lässt offen, ob Vers 13 Warnung oder Trost ist. Die Andacht von Tag 4 nennt beides und betont den Trost für die Schwachen; 12b meint ein endgültiges, beharrliches Verwerfen Christi, nicht ein Straucheln wie bei Petrus, das in Umkehr endet. Wenn jemand fürchtet, Christus „verleugnet“ zu haben, weise auf Vers 13 hin und biete ein Gespräch danach an."
  - "Vers 18: Hymenäus und Philetus lehrten, die Auferstehung sei schon geschehen – wahrscheinlich nur als innere, geistliche Erweckung, ohne künftige leibliche Auferstehung (Tag 5). Hymenäus ist sehr wahrscheinlich derselbe Mann wie in 1. Timotheus 1,20."
  - "Vers 22 „Begierden der Jugend“: Die Andacht von Tag 5 schließt sexuelle Versuchungen ein, meint aber auch die Triebe eines unreifen Geistes – Ungeduld, Rechthaberei, den Drang, jede Diskussion zu gewinnen, Jähzorn und Stolz. Behaltet das im Blick, damit der Vers nicht nur auf Sexualität oder nur auf junge Menschen bezogen wird."
  - "Vers 26 ist im Griechischen offen: Wessen Wille ist gemeint („für seinen Willen“) – der des Teufels oder der Gottes? Unsere Übersetzung lässt das offen; ihr müsst es nicht entscheiden."
  - "Ausblick: Nächste Woche geht es in Kapitel 3 um schwere Zeiten in den letzten Tagen und um die Schrift, die von Gott eingegeben ist."
