session: 4
lang: en
title: "Training for Godliness"
ref: "4:1-4:16"
days: [9, 10, 11]
big_idea: "False piety says “Don't touch” and makes people anxious; true godliness receives God's good gifts with thanksgiving and is trained day by day – in the leader's own life first."
opening: "What is something you have trained for – a sport, an instrument, a language? What did it take to keep going when it got boring?"
context: >-
  Chapter 3 ended with the hymn to Christ, “the mystery of godliness”. Chapter 4 now shows its counterfeit:
  teachers in Ephesus who forbid marriage and certain foods and call that holiness.
  Against them Paul sets two things – thankful enjoyment of God's good creation, and a young leader who trains himself for godliness and keeps watch over his own life.
read_aloud_tip: "Read in three parts with three readers: verses 1–5 (the warning), verses 6–10 (the training), verses 11–16 (the young leader). Pause briefly between the parts."
hebrew:
  - word: "gymnazō"
    hebrew: "γύμναζε σεαυτὸν πρὸς εὐσέβειαν"
    gloss: "train yourself for godliness"
    point: "The word that gives us “gymnasium”. Godliness is not a feeling that falls on us but something trained with regular, sometimes sweaty effort (4:7) – and unlike bodily training, it pays off in both this life and the next (4:8)."
  - word: "kekaustēriasmenōn"
    hebrew: "κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν"
    gloss: "whose own consciences have been branded"
    point: "A conscience seared as with a branding iron no longer feels anything (4:2). The false teachers could sound very strict and still be dead inside."
  - word: "typos"
    hebrew: "τύπος"
    gloss: "example"
    point: "Timothy's answer to people who look down on his youth is not a title but a life that others can copy: “in speech, in conduct, in love, in faith, in purity” (4:12)."
discussion:
  - q: "What exactly did the false teachers forbid, and what is Paul's answer? Look closely at verses 3 to 5."
    ref: "4:3-4:5"
  - q: "“For everything created by God is good, and nothing is to be rejected if it is received with thanksgiving.” Where do Christians today still make holiness a matter of avoiding things rather than receiving them gratefully?"
    ref: "4:4"
  - q: "Paul says, “Rather, train yourself for godliness.” What would a realistic “training plan” for godliness look like in your week?"
    ref: "4:7"
  - q: "Bodily training is of “little value”, godliness of value “in every way”. Where do our time and money show what we really value more?"
    ref: "4:8"
  - q: "“Let no one look down on you because of your youth.” What does Paul tell Timothy to do instead of demanding respect? What could that mean for younger people in our church – and for how older people treat them?"
    ref: "4:12"
  - q: "Paul names reading Scripture aloud, exhortation and teaching (4:13). Which of these is strongest in our group, and which do we neglect?"
    ref: "4:13"
  - q: "“Keep a close watch on yourself and on your teaching.” Why do both belong together? Where is it easier for you to watch one and neglect the other?"
    ref: "4:16"
application:
  - "Choose one small, daily “exercise” of godliness for this week (for example, ten minutes of Scripture before your phone, or thanksgiving before every meal) and tell one person in the group which one."
  - "Pay attention to one good gift of God you usually take for granted – food, rest, a relationship – and receive it this week consciously “with thanksgiving”."
prayer: "Thank God together for his good gifts, naming specific ones. Then pray in pairs for each other's “training” in godliness, and for younger people in the church who serve or are just starting to serve."
leader_notes:
  - "This session covers three devotionals (Days 9–11). Choose four or five questions; question 3 and question 7 are the heart of the chapter."
  - "The “later times” in 4:1 can lead to speculation about the end times. Keep the focus on what the text applies it to: teaching that makes people anxious instead of grateful."
  - "Verse 4:8 can make sporty people feel judged. Point out, as Day 10 does, that Paul calls bodily training of limited value, not worthless."
  - "If there are younger members in the group, let them answer question 5 first; older members often have the most to learn from listening."
  - "Verse 4:10 (“the Saviour of all people, especially of those who believe”) may raise questions. Note it, but don't let it take over the evening; it can be discussed separately."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
