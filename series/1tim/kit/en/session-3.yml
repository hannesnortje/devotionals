session: 3
lang: en
title: "Leaders for God's Household"
ref: "3:1-3:16"
days: [6, 7, 8]
big_idea: "The church is God's household and “a pillar and foundation of the truth”, so its leaders are chosen for tested character more than talent – and all godliness flows from the mystery of Christ."
opening: "If you had to hire someone to look after your house and family while you were away for a year, what would matter most to you?"
context: >-
  The crisis in Ephesus was at heart a leadership crisis.
  In chapter 3 Paul sets out what overseers and deacons must be like – almost all of it about character, very little about skills.
  Then he explains why: the church is the household of the living God, and he ends with an early Christian hymn about Christ.
read_aloud_tip: "One reader for verses 1–7 (overseers), another for verses 8–13 (deacons), a third for verses 14–15; then the whole group reads the hymn in verse 16 together, line by line."
hebrew:
  - word: "anepilēmptos"
    hebrew: "ἀνεπίλημπτος"
    gloss: "above reproach"
    point: "The heading over the whole list (3:2): a picture from wrestling – someone with nothing an opponent can grab hold of. Not sinless, but without obvious footholds for accusation."
  - word: "dokimazō"
    hebrew: "δοκιμάζω"
    gloss: "be tested"
    point: "Of deacons Paul says: “let them also be tested first” (3:10) – the word for testing precious metals in fire. Character is proved over time, before a public task is given."
  - word: "eusebeia"
    hebrew: "εὐσέβεια"
    gloss: "godliness"
    point: "The letter's key word. “great is the mystery of godliness” (3:16): true godliness is not produced by willpower, it flows from wonder at who Christ is and what he has done."
discussion:
  - q: "Read through the qualities in verses 2–7. How many are about skills, and how many about character? What does that tell us?"
    ref: "3:2-3:7"
  - q: "Why is the way someone manages his own household a test for leading “God's church”?"
    ref: "3:4-3:5"
  - q: "Why should a leader “have a good reputation with outsiders”? How do colleagues and neighbours see our church – and us?"
    ref: "3:7"
  - q: "Deacons are to be “not double-tongued”. Why is consistency in our words so important in a church family?"
    ref: "3:8"
  - q: "The church is “the household of God … a pillar and foundation of the truth”. Do we treat our local church more like a household or like a service provider?"
    ref: "3:15"
  - q: "Read the hymn in verse 16 slowly. Which line speaks to you most today, and why?"
    ref: "3:16"
  - q: "These qualities are for leaders, but they describe every mature Christian. Which one would you like God to grow in you?"
application:
  - "Pray this week for the leaders of your church by name, using one quality from verses 2–13 for each of them."
  - "Take on one quiet, unseen task of service in your church or home this week, without telling anyone."
prayer: "Pray for the overseers, elders and deacons of your church. Then read the hymn of verse 16 aloud once more and turn each line into a short sentence of praise."
leader_notes:
  - "This session covers three devotionals (days 6–8). Choose four or five questions; question 6 on the hymn makes a good ending."
  - "Be careful that the evening doesn't become a critique of current church leaders. Keep the focus on what God values and on our own character."
  - "Phrases like “husband of one wife” (3:2, 12) and “women” (3:11 – deacons' wives or women deacons; the day 7 devotional leaves both options open) can lead to long debates. Acknowledge the questions and return to the main point: tested character."
  - "Some in the group may feel disqualified because of divorce, family struggles or past failures. Remind them of last week's theme: grace for the worst of sinners."
  - "Verse 16 reads “He was revealed in the flesh”; older Bibles read “God”. Our translation follows the Greek text used for it (SBLGNT); the day 8 devotional explains the difference. Either way, the hymn is clearly about Christ."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
