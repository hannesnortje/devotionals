session: 6
lang: en
title: "Real Wealth, Real Life"
ref: "6:1-6:21"
days: [15, 16]
big_idea: "True gain is godliness with contentment; so flee the love of money, pursue Christlike character, fight the good fight of the faith – and guard the gospel entrusted to you."
opening: "If your house were on fire and everyone were safe, what one thing would you go back for – and why?"
context: >-
  In the last chapter Paul gathers up the letter. He contrasts teachers who see godliness as “a means of gain” with the real gain of contentment,
  calls Timothy a “man of God” with four commands – flee, pursue, fight, take hold – breaks out into praise of the King of kings,
  and ends with one urgent plea: guard what has been entrusted to you.
read_aloud_tip: "Let one reader take verses 1–10, a second verses 11–16, and a third verses 17–21. Read verses 15–16 together as a group, like a confession of faith."
hebrew:
  - word: "autarkeia"
    hebrew: "αὐτάρκεια"
    gloss: "contentment"
    point: "In Stoic philosophy, the pride of needing nothing. Paul fills it with new content: being satisfied with what God gives, because he is enough (6:6–8)."
  - word: "philargyria"
    hebrew: "φιλαργυρία"
    gloss: "love of money"
    point: "Not money itself, but the love of it is “a root of all kinds of evil” (6:10). It quietly draws people away from the faith and leaves them “pierced … with many pains”."
  - word: "parathēkē"
    hebrew: "τὴν παραθήκην φύλαξον"
    gloss: "guard what has been entrusted to you"
    point: "A deposit handed over for safekeeping: the keeper may not change it or keep it for himself, but must protect it and pass it on intact (6:20). That is how Paul sees the gospel."
discussion:
  - q: "Verses 1 and 2 speak to slaves in the Roman world. We live in a different world, but most of us work under someone's authority. What does it look like to work in a way that brings honour, not shame, to “the name of God”?"
    ref: "6:1-6:2"
  - q: "Some people think “that godliness is a means of gain”. Where do we see this today – and where in ourselves?"
    ref: "6:5"
  - q: "“But godliness with contentment is great gain.” What makes contentment so hard in our culture? What helps you practise it?"
    ref: "6:6-6:8"
  - q: "“For the love of money is a root of all kinds of evil.” How can you recognise when love of money is growing in your own heart?"
    ref: "6:10"
  - q: "Flee, pursue, fight, take hold (6:11–12). Which of the four commands is most urgent for you at the moment?"
    ref: "6:11-6:12"
  - q: "Paul tells the rich not to set their hope on “the uncertainty of riches, but on God, who richly provides us with everything to enjoy”. Compared with most of the world, many of us are rich. What would “rich in good works” look like for us?"
    ref: "6:17-6:19"
  - q: "Looking back over the six sessions: what has God shown you through 1 Timothy, and what will you take with you?"
application:
  - "Do a simple “contentment check” this week: each evening, write down three things God has given you that day, and one thing you can give away."
  - "Choose one concrete act of generosity – time, money or hospitality – and do it before the week is over, quietly."
prayer: "Begin by reading 6:15–16 aloud together as praise. Then pray for each other to “take hold of the life that is truly life”, and thank God for what the group has received through this study of 1 Timothy."
leader_notes:
  - "This is the last session. Leave enough time for question 7 and for prayer; you may drop one of the earlier questions to make room."
  - "Verses 1–2 on slavery need care. Explain briefly, as Day 15 does, the Roman context and Paul's concern for the gospel's reputation, and don't suggest that the Bible endorses slavery; then move to today's workplaces."
  - "Money is a personal topic. Avoid comparing incomes, and don't put anyone on the spot; let people share what they are comfortable with."
  - "Point out the contrast between the false teachers' “gain” (6:5) and true “gain” (6:6) – the group often discovers it themselves if you ask what word appears twice."
  - "Consider ending with a short celebration or meal together. If your group wants to continue, the letter of 2 Timothy is a natural next step."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
