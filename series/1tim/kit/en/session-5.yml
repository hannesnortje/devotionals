session: 5
lang: en
title: "The Church as a Family"
ref: "5:1-5:25"
days: [12, 13, 14]
big_idea: "God's household is a family: we treat each other as fathers, mothers, brothers and sisters, care concretely for those who are truly alone, and honour and correct leaders fairly and without favouritism."
opening: "Who was a “spiritual father” or “spiritual mother” to you – someone outside your own family who shaped your faith? What did they do?"
context: >-
  Paul has called the church “the household of God” (3:15). In chapter 5 he shows what that means in everyday life:
  how to speak to older and younger people, how to look after widows who have no one, and how to treat elders – with honour, but also with fair correction.
  It is the most practical chapter of the letter, and some of it is far from our world; the principles behind it are not.
read_aloud_tip: "The chapter is long. Read it in three sections with different readers: verses 1–8, verses 9–16, verses 17–25."
hebrew:
  - word: "ontōs chēra"
    hebrew: "τὰς ὄντως χήρας"
    gloss: "truly widows"
    point: "Paul uses this phrase three times (5:3, 5, 16). The church's help is meant first for those who really have no one else – families are to take responsibility for their own first (5:4, 8)."
  - word: "parakalei"
    hebrew: "μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει"
    gloss: "do not rebuke … harshly, but encourage"
    point: "Even necessary correction is to happen in a family tone: an older man as a father, younger men as brothers (5:1). The word for “encourage” comes from the same root as the Holy Spirit's name, the Paraclete."
  - word: "diplē timē"
    hebrew: "διπλῆς τιμῆς"
    gloss: "double honour"
    point: "Elders who lead well and labour in preaching and teaching deserve respect and also practical support (5:17–18) – and when they sin, they are not exempt from correction (5:19–20)."
discussion:
  - q: "How should Timothy speak to older men, younger men, older women and younger women? What changes if we really treat the church as a family?"
    ref: "5:1-5:2"
  - q: "“Honour widows who are truly widows.” Who are the people in our church and town today who are “truly alone”? How would we know?"
    ref: "5:3"
  - q: "Paul is very sharp in verse 8: whoever does not provide for his own relatives “has denied the faith and is worse than an unbeliever”. Why does care for our own families weigh so heavily?"
    ref: "5:8"
  - q: "The widows on the list were known for hospitality, washing the feet of the saints and helping the afflicted (5:10). What does this list tell us about what God values in a life?"
    ref: "5:10"
  - q: "Elders are “worthy of double honour”, yet accusations need two or three witnesses, and sin is rebuked openly (5:17–20). How can a church honour its leaders and still hold them accountable?"
    ref: "5:17-5:20"
  - q: "“Do not be hasty in the laying on of hands.” Why is patience so important before trusting people with leadership? Have you seen what happens without it?"
    ref: "5:22"
  - q: "Paul tells Timothy to look after his health (5:23). What does it say about God that such a practical remark stands in the middle of instructions for church leaders?"
    ref: "5:23"
application:
  - "Think of one older person and one younger person in the church you could treat this week as a “father/mother” or “brother/sister” – with a call, a visit or a meal."
  - "Find out together whether there is someone in your church or neighbourhood who is “truly alone”, and agree on one concrete step of help."
prayer: "Pray for people in the church who are alone, ill or grieving, by name where appropriate. Then pray for the elders and leaders of your church: for wisdom, protection and faithfulness."
leader_notes:
  - "This session covers three devotionals (Days 12–14). The chapter is long; don't try to discuss every verse. Questions 1, 2 and 5 carry the main line."
  - "The rules about younger widows (5:11–15) can sound harsh or strange today. Explain briefly that the “list” was a church office with lifelong support and a vow of service (Day 13), and don't force the group into a single application."
  - "Group members may hold different convictions about church structures, elders and the roles of women and men. Let the text speak, follow the line of the devotionals, and keep the conversation respectful; don't settle every disagreement tonight."
  - "Verse 5:23 (wine) may provoke jokes or touch real struggles with alcohol. Keep the focus on Paul's care for Timothy's health, as Day 14 does, and be sensitive to anyone for whom alcohol is painful."
  - "Question 3 can touch painful family situations (neglect, broken relationships, caring for parents). Allow silence, and offer to talk afterwards."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
