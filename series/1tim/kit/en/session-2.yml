session: 2
lang: en
title: "Prayer for All, Worship in Order"
ref: "2:1-2:15"
days: [4, 5]
big_idea: "God “wants all people to be saved”, so the church's first task is prayer for all – and its worship should reflect reconciled hearts, holy lives and God's good order."
opening: "Who is a public figure – a politician, a celebrity, a CEO – you find hard to pray for? (No need to say why.)"
context: >-
  After warning against false teaching, Paul turns to the life of the church gathered for worship.
  First he urges prayer for all people, including rulers, because there is one God and one mediator.
  Then he speaks to men and women about how they pray, dress, learn and serve – some of the most discussed verses in the New Testament.
read_aloud_tip: "Read verses 1–7 with one reader and say the confession in verses 5–6 together as a group; then a second reader reads verses 8–15 slowly."
hebrew:
  - word: "mesitēs"
    hebrew: "μεσίτης"
    gloss: "mediator"
    point: "A mediator stands between two estranged parties to reconcile them. There is “one mediator between God and humankind, the man Christ Jesus” (2:5) – no other bridge is needed or possible."
  - word: "antilytron"
    hebrew: "ἀντίλυτρον"
    gloss: "ransom"
    point: "Christ “gave himself as a ransom for all” (2:6). The prefix anti- means “in the place of”: our freedom was bought at the cost of his own life."
  - word: "hēsychia"
    hebrew: "ἡσυχία"
    gloss: "quietness"
    point: "The same root as the “peaceful and quiet life” Paul wants for all believers (2:2). In 2:11–12 it describes a peaceful, teachable spirit – not a humiliating silence."
discussion:
  - q: "Paul lists “petitions, prayers, intercessions and thanksgivings”. Which of these is strongest in your prayer life, and which is weakest?"
    ref: "2:1"
  - q: "Why does Paul link praying for rulers with God, “who wants all people to be saved and to come to the knowledge of the truth”?"
    ref: "2:1-2:4"
  - q: "Read verses 5–6 again. What difference does it make in daily life that there is only one mediator?"
    ref: "2:5-2:6"
  - q: "Men are to pray “lifting up holy hands without anger or quarrelling”. How can unresolved anger block our prayers?"
    ref: "2:8"
  - q: "Paul contrasts outward adornment with “good works”. Where do we invest more – in our image or in our character?"
    ref: "2:9-2:10"
  - q: "Paul says “A woman should learn” – in its culture a remarkable command. What do verses 11–15 say, and what do they not say? Listen carefully to one another here."
    ref: "2:11-2:15"
  - q: "Whom do you find hardest to pray for – and what would change if you prayed for them regularly?"
application:
  - "Choose one political leader and one person you disagree with, and pray for each of them by name every day this week."
  - "If there is anger or a quarrel between you and someone else, take one step towards reconciliation before next week."
prayer: "Pray around the circle for leaders in your town, country and the world, using the four kinds of prayer from verse 1. Close by saying verses 5–6 together as a confession of faith."
leader_notes:
  - "Give verses 1–7 real time: they are the heart of the chapter and the most practical. Don't let verses 11–15 swallow the whole evening."
  - "Verses 11–15 are understood differently by sincere Christians. The day 5 devotional follows Hannes's position: God's complementary order for men and women in the church, grounded in creation (verse 13) and not in superiority or inferiority (Galatians 3:28). Present it as such, and let others in the group say where they see it differently."
  - "Set the tone early: we listen to understand, not to win. Keep to what the text says; the translation notes explain choices such as “exercise authority” (verse 12) and “quietness”."
  - "Verse 15 is difficult. The day 5 devotional says it cannot mean earning salvation by giving birth, and points to Genesis 3:15 (the promised offspring). It's fine to leave some questions open."
  - "Be sensitive to single, childless or widowed people and to anyone hurt by church experiences in this area. Offer to talk afterwards."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
