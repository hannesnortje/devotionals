session: 1
lang: en
title: "Guard the Gospel"
ref: "1:1-1:20"
days: [1, 2, 3]
big_idea: "Sound teaching is known by its fruit – love, a good conscience and sincere faith – and at its heart stands the gospel of grace for sinners like Paul and like us."
opening: "Think of something precious someone once entrusted to you – a key, a child, a secret. How did it change the way you behaved?"
context: >-
  Paul has left Timothy behind in Ephesus, a busy port city full of temples and ideas, to deal with people who were teaching “a different doctrine”.
  This letter is Paul's instruction for how the church should live as God's household.
  Tonight we read chapter 1: the danger of false teaching, Paul's own story of grace, and a charge to Timothy to stay in the fight.
read_aloud_tip: "Read in three parts with three readers: verses 1–11 (the problem in Ephesus), verses 12–17 (Paul's testimony – read slowly, ending with the doxology), verses 18–20 (the charge to Timothy)."
hebrew:
  - word: "telos tēs parangelias"
    hebrew: "τέλος τῆς παραγγελίας"
    gloss: "the goal of our instruction"
    point: "The goal of all teaching is not winning debates but “love from a pure heart, from a good conscience and from a sincere faith” (1:5). Teaching that breeds pride and quarrels has missed its goal."
  - word: "pistos ho logos"
    hebrew: "πιστὸς ὁ λόγος"
    gloss: "this is a trustworthy saying"
    point: "The first of five “trustworthy sayings” in the Pastoral Letters (1:15). It anchors the church in a simple confession: “Christ Jesus came into the world to save sinners.”"
  - word: "strateia"
    hebrew: "στρατεία"
    gloss: "warfare"
    point: "Timothy is to “wage the good warfare” (1:18) – a long military campaign, not a single battle. Faith and a good conscience are his equipment; without them faith suffers shipwreck."
discussion:
  - q: "What were the false teachers in Ephesus busy with, according to verses 3–7? What might “myths and endless genealogies” look like in church life today?"
    ref: "1:3-1:7"
  - q: "Paul says the goal of instruction is “love from a pure heart, from a good conscience and from a sincere faith”. How can we tell whether teaching we hear is “sound”?"
    ref: "1:5"
  - q: "Paul describes himself as “a blasphemer, a persecutor and a violent man”. Why do you think he tells his own story at this point in the letter?"
    ref: "1:13"
  - q: "Paul says “of them I am the first” – present tense, not past. What does this tell us about how a mature Christian sees himself or herself?"
    ref: "1:15"
  - q: "Paul's testimony ends in worship (v. 17). When did thinking about God's grace last lead you to praise?"
    ref: "1:17"
  - q: "“Some have pushed this conscience aside and have made shipwreck of their faith.” How can ignoring our conscience slowly wreck our faith?"
    ref: "1:19"
  - q: "Where is your conscience “flashing a warning light” at the moment? Share only what you are comfortable sharing."
application:
  - "Write down your own short “testimony of grace” (three or four sentences, as Paul does in verses 12–16) and share it with one person this week."
  - "Ask God each evening this week: “Is there anything I am pushing aside in my conscience?” – and act on one thing he shows you."
prayer: "Begin by reading 1:17 aloud together as praise. Then pray in pairs: thank God for his mercy to each of you, and pray for people you know who have “made shipwreck” of their faith, that they would be restored."
leader_notes:
  - "This session covers three devotionals (days 1–3). Choose four or five questions and leave time for the last one."
  - "The list in verses 9–10 (including “men who have sex with men”) can derail the evening. Acknowledge it, note that Paul's point is the right use of the law and the gospel of grace for all sinners – including himself in verse 13 – and keep the focus there."
  - "Verse 20 (“handed over to Satan”) raises questions. The day 3 devotional explains it as formal church discipline whose aim is restoration (“so that they may be taught not to blaspheme”); you don't need to resolve every detail."
  - "Some may carry deep shame about their past. Verses 12–16 are good news for them – let the group dwell on them rather than rushing on."
  - "Point ahead: next week chapter 2 turns to prayer “for all people” and to worship in the church."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
