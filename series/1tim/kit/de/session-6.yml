session: 6
lang: de
title: "Wahrer Reichtum, wirkliches Leben"
ref: "6:1-6:21"
days: [15, 16]
big_idea: "Der wahre Gewinn ist Gottesfurcht mit Genügsamkeit; darum flieh vor der Geldgier, jage nach einem Charakter wie Christus, kämpfe den guten Kampf des Glaubens – und bewahre das Evangelium, das dir anvertraut ist."
opening: "Wenn dein Haus brennen würde und alle in Sicherheit wären: Welchen einen Gegenstand würdest du noch holen – und warum?"
context: >-
  Im letzten Kapitel fasst Paulus den Brief zusammen. Er stellt Lehrer, die meinen, „die Gottesfurcht sei ein Mittel zum Gewinn“, dem wahren Gewinn der Genügsamkeit gegenüber,
  ruft Timotheus als „Mensch Gottes“ mit vier Aufforderungen – fliehen, nachjagen, kämpfen, ergreifen –, bricht in Lob für den König der Könige aus
  und schließt mit einer eindringlichen Bitte: Bewahre das anvertraute Gut!
read_aloud_tip: "Ein Leser übernimmt die Verse 1–10, ein zweiter die Verse 11–16 und ein dritter die Verse 17–21. Die Verse 15–16 lest ihr gemeinsam als Gruppe, wie ein Glaubensbekenntnis."
hebrew:
  - word: "autarkeia"
    hebrew: "αὐτάρκεια"
    gloss: "Genügsamkeit"
    point: "In der stoischen Philosophie der Stolz, nichts zu brauchen. Paulus füllt das Wort neu: zufrieden sein mit dem, was Gott gibt, weil er genügt (6,6–8)."
  - word: "philargyria"
    hebrew: "φιλαργυρία"
    gloss: "Geldgier"
    point: "Nicht das Geld selbst, sondern die Gier danach ist „eine Wurzel aller Übel“ (6,10). Sie zieht Menschen leise vom Glauben weg, und am Ende haben sie sich „selbst viele Schmerzen zugefügt“."
  - word: "parathēkē"
    hebrew: "τὴν παραθήκην φύλαξον"
    gloss: "bewahre das anvertraute Gut"
    point: "Ein Gut, das zur Aufbewahrung übergeben wurde: Wer es verwahrt, darf es weder verändern noch für sich behalten, sondern muss es schützen und unversehrt weitergeben (6,20). So sieht Paulus das Evangelium."
discussion:
  - q: "Die Verse 1 und 2 sprechen Sklaven in der römischen Welt an. Wir leben in einer anderen Welt, aber die meisten von uns arbeiten unter der Autorität anderer. Wie sieht Arbeit aus, die dem „Namen Gottes“ Ehre und nicht Schande macht?"
    ref: "6:1-6:2"
  - q: "Manche meinen, „die Gottesfurcht sei ein Mittel zum Gewinn“. Wo begegnet uns das heute – und wo in uns selbst?"
    ref: "6:5"
  - q: "„Ein großer Gewinn ist aber die Gottesfurcht mit Genügsamkeit.“ Was macht Genügsamkeit in unserer Kultur so schwer? Was hilft dir, sie einzuüben?"
    ref: "6:6-6:8"
  - q: "„Denn eine Wurzel aller Übel ist die Geldgier.“ Woran kannst du erkennen, dass die Liebe zum Geld in deinem eigenen Herzen wächst?"
    ref: "6:10"
  - q: "Fliehen, nachjagen, kämpfen, ergreifen (6,11–12). Welche der vier Aufforderungen ist für dich im Moment am dringendsten?"
    ref: "6:11-6:12"
  - q: "Paulus sagt den Reichen, sie sollen ihre Hoffnung nicht auf „die Unsicherheit des Reichtums“ setzen, „sondern auf Gott, der uns alles reichlich zum Genuss gibt“. Im Vergleich mit dem größten Teil der Welt sind viele von uns reich. Wie sähe es für uns aus, „reich zu werden an guten Werken“?"
    ref: "6:17-6:19"
  - q: "Rückblick auf die sechs Treffen: Was hat Gott dir durch den ersten Timotheusbrief gezeigt, und was nimmst du mit?"
application:
  - "Mach diese Woche einen einfachen „Genügsamkeits-Check“: Schreib jeden Abend drei Dinge auf, die Gott dir an diesem Tag gegeben hat, und eine Sache, die du weitergeben kannst."
  - "Wähle eine konkrete Tat der Großzügigkeit – Zeit, Geld oder Gastfreundschaft – und tu sie still, bevor die Woche zu Ende ist."
prayer: "Beginnt damit, die Verse 6,15–16 gemeinsam laut als Lobpreis zu lesen. Betet dann füreinander, dass ihr „das wirkliche Leben ergreifen“ könnt, und dankt Gott für das, was die Gruppe durch diese Reihe über den ersten Timotheusbrief empfangen hat."
leader_notes:
  - "Dies ist das letzte Treffen. Lass genug Zeit für Frage 7 und für das Gebet; du kannst dafür eine der früheren Fragen weglassen."
  - "Die Verse 1–2 über Sklaverei brauchen Sorgfalt. Erkläre wie Tag 15 kurz den römischen Zusammenhang und Paulus' Sorge um den Ruf des Evangeliums, ohne den Eindruck zu erwecken, die Bibel befürworte Sklaverei; geh dann zur heutigen Arbeitswelt über."
  - "Geld ist ein persönliches Thema. Vergleicht keine Einkommen und bring niemanden in Verlegenheit; jeder teilt, was er möchte."
  - "Weise auf den Gegensatz zwischen dem „Gewinn“ der Irrlehrer (6,5) und dem wahren „Gewinn“ (6,6) hin – oft entdeckt die Gruppe ihn selbst, wenn du fragst, welches Wort zweimal vorkommt."
  - "Überlegt, mit einer kleinen Feier oder einem gemeinsamen Essen abzuschließen. Wenn eure Gruppe weitermachen möchte, ist der zweite Timotheusbrief ein naheliegender nächster Schritt."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
