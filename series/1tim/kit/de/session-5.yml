session: 5
lang: de
title: "Die Gemeinde als Familie"
ref: "5:1-5:25"
days: [12, 13, 14]
big_idea: "Gottes Haus ist eine Familie: Wir begegnen einander als Vätern, Müttern, Brüdern und Schwestern, sorgen ganz praktisch für die, die wirklich allein sind, und ehren und korrigieren Leitende fair und ohne Parteilichkeit."
opening: "Wer war für dich ein „geistlicher Vater“ oder eine „geistliche Mutter“ – jemand außerhalb deiner Familie, der deinen Glauben geprägt hat? Was hat diese Person getan?"
context: >-
  Paulus hat die Gemeinde das „Haus Gottes“ genannt (3,15). In Kapitel 5 zeigt er, was das im Alltag bedeutet:
  wie man mit Älteren und Jüngeren spricht, wie man für Witwen sorgt, die niemanden haben, und wie man mit Ältesten umgeht – mit Ehre, aber auch mit fairer Zurechtweisung.
  Es ist das praktischste Kapitel des Briefes; manches ist weit weg von unserer Welt, die Grundsätze dahinter sind es nicht.
read_aloud_tip: "Das Kapitel ist lang. Lest es in drei Abschnitten mit verschiedenen Lesern: Verse 1–8, Verse 9–16, Verse 17–25."
hebrew:
  - word: "ontōs chēra"
    hebrew: "τὰς ὄντως χήρας"
    gloss: "die wirklich Witwen sind"
    point: "Paulus gebraucht diese Wendung dreimal (5,3.5.16). Die Hilfe der Gemeinde gilt zuerst denen, die wirklich niemanden sonst haben – Familien sollen zuerst für die Ihren Verantwortung übernehmen (5,4.8)."
  - word: "parakalei"
    hebrew: "μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει"
    gloss: "fahre nicht hart an, sondern ermahne"
    point: "Selbst nötige Korrektur soll im Familienton geschehen: einen älteren Mann wie einen Vater, jüngere Männer wie Brüder (5,1). Das Wort für „ermahnen“ hat dieselbe Wurzel wie der Name des Heiligen Geistes, des Parakleten."
  - word: "diplē timē"
    hebrew: "διπλῆς τιμῆς"
    gloss: "doppelte Ehre"
    point: "Älteste, die gut vorstehen und sich im Wort und in der Lehre abmühen, verdienen Achtung und auch praktische Unterstützung (5,17–18) – und wenn sie sündigen, sind sie von Zurechtweisung nicht ausgenommen (5,19–20)."
discussion:
  - q: "Wie soll Timotheus mit älteren Männern, jüngeren Männern, älteren und jüngeren Frauen sprechen? Was ändert sich, wenn wir die Gemeinde wirklich als Familie behandeln?"
    ref: "5:1-5:2"
  - q: "„Ehre die Witwen, die wirklich Witwen sind.“ Wer sind heute die Menschen in unserer Gemeinde und unserem Ort, die „wirklich allein“ sind? Woran würden wir es merken?"
    ref: "5:3"
  - q: "Paulus wird in Vers 8 sehr scharf: Wer nicht für die Seinen sorgt, „hat er den Glauben verleugnet und ist schlimmer als ein Ungläubiger“. Warum wiegt die Sorge für die eigene Familie so schwer?"
    ref: "5:8"
  - q: "Die Witwen auf der Liste waren bekannt für Gastfreundschaft, dafür, dass sie den Heiligen die Füße gewaschen und Bedrängten geholfen hatten (5,10). Was sagt diese Liste darüber, was Gott an einem Leben wertschätzt?"
    ref: "5:10"
  - q: "Älteste sollen „doppelter Ehre wert“ geachtet werden, und doch braucht eine Anklage zwei oder drei Zeugen, und Sünde wird vor allen zurechtgewiesen (5,17–20). Wie kann eine Gemeinde ihre Leitenden ehren und sie zugleich zur Verantwortung ziehen?"
    ref: "5:17-5:20"
  - q: "„Lege niemandem vorschnell die Hände auf.“ Warum ist Geduld so wichtig, bevor man Menschen Leitung anvertraut? Hast du erlebt, was ohne sie geschieht?"
    ref: "5:22"
  - q: "Paulus sagt Timotheus, er solle auf seine Gesundheit achten (5,23). Was sagt es über Gott, dass eine so praktische Bemerkung mitten in Anweisungen für Gemeindeleiter steht?"
    ref: "5:23"
application:
  - "Denk an einen älteren und einen jüngeren Menschen in der Gemeinde, denen du diese Woche wie einem Vater oder einer Mutter, einem Bruder oder einer Schwester begegnen kannst – mit einem Anruf, einem Besuch oder einer Mahlzeit."
  - "Findet gemeinsam heraus, ob es in eurer Gemeinde oder Nachbarschaft jemanden gibt, der „wirklich allein“ ist, und verabredet einen konkreten Schritt der Hilfe."
prayer: "Betet für Menschen in der Gemeinde, die allein, krank oder in Trauer sind – mit Namen, wo es passt. Betet dann für die Ältesten und Leitenden eurer Gemeinde: um Weisheit, Schutz und Treue."
leader_notes:
  - "Dieses Treffen umfasst drei Andachten (Tag 12–14). Das Kapitel ist lang; versucht nicht, jeden Vers zu besprechen. Die Fragen 1, 2 und 5 tragen die Hauptlinie."
  - "Die Regeln über jüngere Witwen (5,11–15) können heute hart oder fremd klingen. Erkläre kurz, dass die „Liste“ ein Gemeindeamt mit lebenslanger Versorgung und einem Dienstversprechen war (Tag 13), und drängt die Gruppe nicht in eine einzige Anwendung."
  - "In der Gruppe kann es unterschiedliche Überzeugungen über Gemeindestrukturen, Älteste und die Rollen von Frauen und Männern geben. Lass den Text sprechen, folge der Linie der Andachten und halte das Gespräch respektvoll; nicht jede Meinungsverschiedenheit muss heute gelöst werden."
  - "Vers 5,23 (Wein) kann Witze auslösen oder echte Probleme mit Alkohol berühren. Halte den Blick wie Tag 14 auf Paulus' Sorge um Timotheus' Gesundheit und sei sensibel für alle, für die Alkohol ein schmerzhaftes Thema ist."
  - "Frage 3 kann schmerzhafte Familiensituationen berühren (Vernachlässigung, zerbrochene Beziehungen, Pflege der Eltern). Lass Stille zu und biete an, danach noch zu reden."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
