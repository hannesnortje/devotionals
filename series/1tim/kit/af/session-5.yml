session: 5
lang: af
title: "Die gemeente as familie"
ref: "5:1-5:25"
days: [12, 13, 14]
big_idea: "God se huis is 'n familie: ons behandel mekaar as vaders, moeders, broers en susters, sorg prakties vir dié wat werklik alleen is, en eer en korrigeer leiers regverdig en sonder partydigheid."
opening: "Wie was vir jou 'n “geestelike vader” of “geestelike moeder” – iemand buite jou eie familie wat jou geloof gevorm het? Wat het daardie persoon gedoen?"
context: >-
  Paulus het die gemeente die “huis van God” genoem (3:15). In hoofstuk 5 wys hy wat dit in die alledaagse lewe beteken:
  hoe om met ouer en jonger mense te praat, hoe om na weduwees om te sien wat niemand het nie, en hoe om ouderlinge te behandel – met eer, maar ook met regverdige teregwysing.
  Dit is die mees praktiese hoofstuk van die brief; party dinge is ver van ons wêreld af, maar die beginsels daaragter is nie.
read_aloud_tip: "Die hoofstuk is lank. Lees dit in drie gedeeltes met verskillende lesers: verse 1–8, verse 9–16, verse 17–25."
hebrew:
  - word: "ontōs chēra"
    hebrew: "τὰς ὄντως χήρας"
    gloss: "werklik weduwees"
    point: "Paulus gebruik hierdie uitdrukking drie keer (5:3, 5, 16). Die gemeente se hulp is eerstens bedoel vir dié wat regtig niemand anders het nie – families moet eers vir hulle eie mense verantwoordelikheid neem (5:4, 8)."
  - word: "parakalei"
    hebrew: "μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει"
    gloss: "moenie skerp teregwys nie, maar vermaan"
    point: "Selfs nodige teregwysing moet in 'n familietoon gebeur: 'n ouer man soos 'n vader, jonger mans soos broers (5:1). Die woord vir “vermaan” het dieselfde wortel as die naam van die Heilige Gees, die Parakleet."
  - word: "diplē timē"
    hebrew: "διπλῆς τιμῆς"
    gloss: "dubbele eer"
    point: "Ouderlinge wat goed leiding gee en hulle in die verkondiging en die onderrig inspan, verdien respek en ook praktiese ondersteuning (5:17–18) – en as hulle sondig, is hulle nie vrygestel van teregwysing nie (5:19–20)."
discussion:
  - q: "Hoe moet Timoteus met ouer mans, jonger mans, ouer vroue en jonger vroue praat? Wat verander as ons die gemeente regtig as 'n familie behandel?"
    ref: "5:1-5:2"
  - q: "“Eer die weduwees wat werklik weduwees is.” Wie is vandag die mense in ons gemeente en ons dorp wat “werklik alleen” is? Hoe sou ons dit agterkom?"
    ref: "5:3"
  - q: "Paulus is baie skerp in vers 8: wie nie vir sy eie mense sorg nie, “het hy die geloof verloën en is hy slegter as 'n ongelowige”. Waarom weeg sorg vir ons eie families so swaar?"
    ref: "5:8"
  - q: "Die weduwees op die lys was bekend vir gasvryheid, daarvoor dat hulle die voete van die heiliges gewas en mense in nood gehelp het (5:10). Wat sê hierdie lys oor wat God in 'n lewe waardeer?"
    ref: "5:10"
  - q: "Ouderlinge moet “dubbele eer waardig geag” word, en tog vra 'n aanklag twee of drie getuies, en sonde word voor almal teregwys (5:17–20). Hoe kan 'n gemeente sy leiers eer en hulle tog aanspreeklik hou?"
    ref: "5:17-5:20"
  - q: "“Moet niemand haastig die hande oplê nie.” Waarom is geduld so belangrik voordat mense leierskap toevertrou word? Het jy al gesien wat gebeur sonder dit?"
    ref: "5:22"
  - q: "Paulus sê vir Timoteus om na sy gesondheid te kyk (5:23). Wat sê dit oor God dat so 'n praktiese opmerking midde-in opdragte vir gemeenteleiers staan?"
    ref: "5:23"
application:
  - "Dink aan een ouer en een jonger persoon in die gemeente wat jy hierdie week as 'n vader of moeder, broer of suster kan behandel – met 'n oproep, 'n besoek of 'n ete."
  - "Vind saam uit of daar iemand in julle gemeente of buurt is wat “werklik alleen” is, en spreek een konkrete stap van hulp af."
prayer: "Bid vir mense in die gemeente wat alleen, siek of in rou is – op naam waar dit gepas is. Bid dan vir die ouderlinge en leiers van julle gemeente: om wysheid, beskerming en getrouheid."
leader_notes:
  - "Hierdie byeenkoms dek drie oordenkings (Dag 12–14). Die hoofstuk is lank; moenie probeer om elke vers te bespreek nie. Vrae 1, 2 en 5 dra die hooflyn."
  - "Die reëls oor jonger weduwees (5:11–15) kan vandag hard of vreemd klink. Verduidelik kortliks dat die “lys” 'n gemeentelike amp met lewenslange versorging en 'n diensbelofte was (Dag 13), en moenie die groep in 'n enkele toepassing dwing nie."
  - "Daar kan in die groep verskillende oortuigings wees oor kerkstrukture, ouderlinge en die rolle van vroue en mans. Laat die teks praat, volg die lyn van die oordenkings en hou die gesprek respekvol; nie elke meningsverskil hoef vanaand opgelos te word nie."
  - "Vers 5:23 (wyn) kan grappe uitlok of werklike stryd met alkohol raak. Hou die fokus, soos Dag 14, op Paulus se sorg vir Timoteus se gesondheid, en wees sensitief vir enigiemand vir wie alkohol 'n pynlike saak is."
  - "Vraag 3 kan pynlike familiesituasies raak (verwaarlosing, gebroke verhoudings, sorg vir ouers). Laat stilte toe en bied aan om ná die tyd te gesels."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
