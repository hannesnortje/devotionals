session: 6
lang: af
title: "Ware rykdom, werklike lewe"
ref: "6:1-6:21"
days: [15, 16]
big_idea: "Die ware wins is godsvrug saam met tevredenheid; vlug daarom van die liefde vir geld, jaag 'n karakter soos dié van Christus na, stry die goeie stryd van die geloof – en bewaak die evangelie wat aan jou toevertrou is."
opening: "As jou huis aan die brand was en almal veilig was, watter een ding sou jy nog gaan haal – en hoekom?"
context: >-
  In die laaste hoofstuk vat Paulus die brief saam. Hy stel leraars wat “dink dat godsvrug 'n manier is om wins te maak” teenoor die ware wins van tevredenheid,
  roep Timoteus as “mens van God” met vier opdragte – vlug, jaag na, stry, gryp vas –, bars uit in lof vir die Koning van die konings
  en sluit af met een dringende pleidooi: bewaak wat aan jou toevertrou is.
read_aloud_tip: "Laat een leser verse 1–10 neem, 'n tweede verse 11–16 en 'n derde verse 17–21. Lees verse 15–16 saam as groep, soos 'n geloofsbelydenis."
hebrew:
  - word: "autarkeia"
    hebrew: "αὐτάρκεια"
    gloss: "tevredenheid"
    point: "In die Stoïsynse filosofie die trots dat 'n mens niks nodig het nie. Paulus gee die woord nuwe inhoud: tevrede wees met wat God gee, omdat Hy genoeg is (6:6–8)."
  - word: "philargyria"
    hebrew: "φιλαργυρία"
    gloss: "liefde vir geld"
    point: "Nie geld self nie, maar die liefde daarvoor is “'n wortel van allerlei kwaad” (6:10). Dit trek mense stilletjies van die geloof weg, totdat hulle hulleself “met baie pyn deurboor” het."
  - word: "parathēkē"
    hebrew: "τὴν παραθήκην φύλαξον"
    gloss: "bewaak wat aan jou toevertrou is"
    point: "'n Pand wat vir bewaring oorhandig is: die bewaarder mag dit nie verander of vir homself hou nie, maar moet dit beskerm en ongeskonde oordra (6:20). So sien Paulus die evangelie."
discussion:
  - q: "Verse 1 en 2 praat met slawe in die Romeinse wêreld. Ons leef in 'n ander wêreld, maar die meeste van ons werk onder iemand se gesag. Hoe lyk werk wat eer, en nie skande nie, bring op “die Naam van God”?"
    ref: "6:1-6:2"
  - q: "Party mense “dink dat godsvrug 'n manier is om wins te maak”. Waar sien ons dit vandag – en waar in onsself?"
    ref: "6:5"
  - q: "“Godsvrug saam met tevredenheid is wel 'n groot wins.” Wat maak tevredenheid in ons kultuur so moeilik? Wat help jou om dit in te oefen?"
    ref: "6:6-6:8"
  - q: "“Want die liefde vir geld is 'n wortel van allerlei kwaad.” Hoe kan jy agterkom dat die liefde vir geld in jou eie hart groei?"
    ref: "6:10"
  - q: "Vlug, jaag na, stry, gryp vas (6:11–12). Watter een van die vier opdragte is op die oomblik vir jou die dringendste?"
    ref: "6:11-6:12"
  - q: "Paulus sê vir die ryk mense om hulle hoop nie te vestig op rykdom, “wat so onseker is nie, maar op God, wat ons alles ryklik gee om te geniet”. In vergelyking met die meeste van die wêreld is baie van ons ryk. Hoe sou dit vir ons lyk om “ryk te wees aan goeie werke”?"
    ref: "6:17-6:19"
  - q: "As jy terugkyk oor die ses byeenkomste: wat het God jou deur die eerste brief aan Timoteus gewys, en wat neem jy saam?"
application:
  - "Doen hierdie week 'n eenvoudige “tevredenheidstoets”: skryf elke aand drie dinge neer wat God jou daardie dag gegee het, en een ding wat jy kan weggee."
  - "Kies een konkrete daad van vrygewigheid – tyd, geld of gasvryheid – en doen dit stilletjies voor die week verby is."
prayer: "Begin deur verse 6:15–16 saam hardop as lofprysing te lees. Bid dan vir mekaar dat julle “die werklike lewe kan vasgryp”, en dank God vir wat die groep deur hierdie reeks oor die eerste brief aan Timoteus ontvang het."
leader_notes:
  - "Dit is die laaste byeenkoms. Maak genoeg tyd vir vraag 7 en vir gebed; jy kan een van die vroeëre vrae laat val om plek te maak."
  - "Verse 1–2 oor slawerny vra sorg. Verduidelik kortliks, soos Dag 15, die Romeinse konteks en Paulus se besorgdheid oor die evangelie se goeie naam, sonder om die indruk te skep dat die Bybel slawerny goedkeur; gaan dan oor na vandag se werkplek."
  - "Geld is 'n persoonlike onderwerp. Moenie inkomstes vergelyk nie en moenie iemand in die verleentheid stel nie; elkeen deel wat hy of sy wil."
  - "Wys op die kontras tussen die dwaalleraars se “wins” (6:5) en die ware “wins” (6:6) – die groep ontdek dit dikwels self as jy vra watter woord twee keer voorkom."
  - "Oorweeg om met 'n klein viering of 'n ete saam af te sluit. As julle groep wil voortgaan, is die tweede brief aan Timoteus 'n natuurlike volgende stap."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
