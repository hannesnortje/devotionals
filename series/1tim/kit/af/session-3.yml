session: 3
lang: af
title: "Leiers vir God se Huis"
ref: "3:1-3:16"
days: [6, 7, 8]
big_idea: "Die kerk is God se huis en “'n pilaar en fondament van die waarheid”; daarom word sy leiers meer op grond van beproefde karakter as van talent gekies – en alle godsvrug vloei uit die geheimenis van Christus."
opening: "As jy iemand moes aanstel om vir 'n jaar na jou huis en gesin om te sien terwyl jy weg is – wat sou vir jou die belangrikste wees?"
context: >-
  Die krisis in Efese was in sy kern 'n leierskapskrisis.
  In hoofstuk 3 beskryf Paulus hoe opsieners en diakens moet wees – byna alles gaan oor karakter, baie min oor vaardighede.
  Dan verduidelik hy waarom: die kerk is die huis van die lewende God. Hy sluit af met 'n vroeë Christelike lofsang oor Christus.
read_aloud_tip: "Een leser vir verse 1–7 (opsieners), 'n tweede vir verse 8–13 (diakens), 'n derde vir verse 14–15; lees dan die lofsang in vers 16 almal saam, reël vir reël."
hebrew:
  - word: "anepilēmptos"
    hebrew: "ἀνεπίλημπτος"
    gloss: "onberispelik"
    point: "Die opskrif oor die hele lys (3:2): 'n beeld uit die stoeigeveg – iemand aan wie die teenstander geen houvas kry nie. Nie sondeloos nie, maar sonder ooglopende vatplekke vir beskuldiging."
  - word: "dokimazō"
    hebrew: "δοκιμάζω"
    gloss: "getoets word"
    point: "Van die diakens sê Paulus: “Ook hulle moet eers getoets word” (3:10) – die woord vir die toets van edelmetaal in die vuur. Karakter word oor tyd bewys voordat 'n openbare taak gegee word."
  - word: "eusebeia"
    hebrew: "εὐσέβεια"
    gloss: "godsvrug"
    point: "Die sleutelwoord van die brief. “Die geheimenis van die godsvrug” is groot (3:16): ware godsvrug word nie deur wilskrag opgewek nie; dit vloei uit verwondering oor wie Christus is en wat Hy gedoen het."
discussion:
  - q: "Gaan deur die eienskappe in verse 2–7. Hoeveel gaan oor vaardighede, en hoeveel oor karakter? Wat sê dit vir ons?"
    ref: "3:2-3:7"
  - q: "Waarom is die manier waarop iemand sy eie huishouding bestuur 'n toets of hy “na die kerk van God” kan “omsien”?"
    ref: "3:4-3:5"
  - q: "Waarom moet 'n leier “'n goeie naam hê by buitestaanders”? Hoe sien kollegas en bure ons kerk – en ons?"
    ref: "3:7"
  - q: "Diakens moet “nie dubbeltongig nie” wees. Waarom is betroubaarheid in ons woorde so belangrik in 'n kerkfamilie?"
    ref: "3:8"
  - q: "Die kerk is “die huis van God … 'n pilaar en fondament van die waarheid”. Behandel ons ons gemeente meer soos 'n huisgesin of soos 'n diensverskaffer?"
    ref: "3:15"
  - q: "Lees die lofsang in vers 16 stadig. Watter reël praat vandag die meeste met jou, en waarom?"
    ref: "3:16"
  - q: "Hierdie eienskappe geld vir leiers, maar beskryf elke volwasse Christen. Watter een wil jy hê God moet in jou laat groei?"
application:
  - "Bid hierdie week by name vir die leiers van jou gemeente – vir elkeen met een eienskap uit verse 2–13."
  - "Neem hierdie week een stil, onsigbare diens in jou gemeente of by die huis op jou, sonder om vir iemand te vertel."
prayer: "Bid vir die opsieners, ouderlinge en diakens van julle gemeente. Lees dan die lofsang van vers 16 weer hardop en maak van elke reël 'n kort sin van lof."
leader_notes:
  - "Hierdie byeenkoms dek drie oordenkings (dag 6–8). Kies vier of vyf vrae; vraag 6 oor die lofsang is 'n goeie afsluiting."
  - "Pas op dat die aand nie 'n kritiek op die huidige leiers van die gemeente word nie. Bly by wat vir God belangrik is en by ons eie karakter."
  - "Uitdrukkings soos “die man van een vrou” (3:2, 12) en “die vroue” (3:11 – vroue van die diakens of vroulike diakens; die oordenking van dag 7 laat albei oop) kan tot lang debatte lei. Erken die vrae en keer terug na die hoofpunt: beproefde karakter."
  - "Sommige voel dalk uitgesluit weens egskeiding, gesinsprobleme of vroeëre mislukkings. Herinner hulle aan die tema van die vorige weke: genade vir die grootste sondaar."
  - "Vers 16 lees “Hy is geopenbaar in die vlees”; ouer Bybels lees “God”. Ons vertaling volg die Griekse teks waarop dit gebaseer is (SBLGNT); die oordenking van dag 8 verduidelik die verskil. Hoe ook al, die lofsang gaan duidelik oor Christus."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
