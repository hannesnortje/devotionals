session: 4
lang: af
title: "Oefen jou in godsvrug"
ref: "4:1-4:16"
days: [9, 10, 11]
big_idea: "Valse vroomheid sê “Moenie raak nie!” en maak mense angstig; ware godsvrug ontvang God se goeie gawes met danksegging en word dag vir dag ingeoefen – eerste in die lewe van die een wat lei."
opening: "Waarvoor het jy al ooit geoefen – 'n sport, 'n musiekinstrument, 'n taal? Wat het jou gehelp om aan te hou toe dit vervelig geword het?"
context: >-
  Hoofstuk 3 het geëindig met die loflied oor Christus, die “geheimenis van die godsvrug”. Hoofstuk 4 wys nou die namaaksel:
  leraars in Efese wat die huwelik en sekere voedsel verbied en dit as heiligheid beskou.
  Paulus stel twee dinge daarteenoor – dankbare genieting van God se goeie skepping, en 'n jong leier wat homself in die godsvrug oefen en oor sy eie lewe waak.
read_aloud_tip: "Lees die hoofstuk in drie dele met drie lesers: verse 1–5 (die waarskuwing), verse 6–10 (die oefening), verse 11–16 (die jong leier). Wag kort tussen die dele."
hebrew:
  - word: "gymnazō"
    hebrew: "γύμναζε σεαυτὸν πρὸς εὐσέβειαν"
    gloss: "oefen jou in die godsvrug"
    point: "Die woord waarvan “gimnasium” en “gimnastiek” kom. Godsvrug is nie 'n gevoel wat oor ons kom nie, maar iets wat met gereelde, soms sweterige inspanning ingeoefen word (4:7) – en anders as liggaamlike oefening is dit van waarde in hierdie lewe en die lewe wat kom (4:8)."
  - word: "kekaustēriasmenōn"
    hebrew: "κεκαυστηριασμένων τὴν ἰδίαν συνείδησιν"
    gloss: "wie se gewete gebrandmerk is"
    point: "'n Gewete wat soos met 'n brandyster toegeskroei is, voel niks meer nie (4:2). Die dwaalleraars kon baie streng klink en tog innerlik dood wees."
  - word: "typos"
    hebrew: "τύπος"
    gloss: "voorbeeld"
    point: "Timoteus se antwoord aan mense wat hom geringskat omdat hy jonk is, is nie 'n titel nie, maar 'n lewe wat ander kan navolg: “in woord, in lewenswyse, in liefde, in geloof, in reinheid” (4:12)."
discussion:
  - q: "Wat presies het die dwaalleraars verbied, en wat is Paulus se antwoord? Kyk mooi na verse 3 tot 5."
    ref: "4:3-4:5"
  - q: "“Want alles wat God geskep het, is goed, en niks is verwerplik as dit met danksegging ontvang word nie.” Waar maak Christene vandag nog heiligheid 'n saak van vermy eerder as van dankbaar ontvang?"
    ref: "4:4"
  - q: "Paulus sê: “Oefen jou eerder in die godsvrug.” Hoe sou 'n realistiese “oefenprogram” vir godsvrug in jou week lyk?"
    ref: "4:7"
  - q: "Liggaamlike oefening “is van min nut”, maar “godsvrug is in alle opsigte nuttig”. Waar wys ons tyd en ons geld wat ons werklik meer waardeer?"
    ref: "4:8"
  - q: "“Laat niemand jou geringskat omdat jy jonk is nie.” Wat moet Timoteus doen in plaas daarvan om respek te eis? Wat kan dit beteken vir jonger mense in ons gemeente – en vir hoe ouer mense hulle behandel?"
    ref: "4:12"
  - q: "Paulus noem die voorlesing, die vermaning en die onderrig (4:13). Watter een daarvan is sterk in ons groep, en watter een verwaarloos ons?"
    ref: "4:13"
  - q: "“Let op jouself en op die leer.” Waarom hoort die twee saam? Waar is dit vir jou makliker om op die een te let en die ander te verwaarloos?"
    ref: "4:16"
application:
  - "Kies vir hierdie week een klein, daaglikse “oefening” in godsvrug (byvoorbeeld tien minute Bybel voor jou foon, of 'n dankgebed voor elke ete) en vertel een persoon in die groep watter een."
  - "Let op een goeie gawe van God wat jy gewoonlik as vanselfsprekend aanvaar – kos, rus, 'n verhouding – en ontvang dit hierdie week doelbewus “met danksegging”."
prayer: "Dank God saam vir sy goeie gawes en noem spesifieke gawes. Bid dan in pare vir mekaar se “oefening” in godsvrug, en vir jonger mense in die gemeente wat dien of pas begin dien."
leader_notes:
  - "Hierdie byeenkoms dek drie oordenkings (Dag 9–11). Kies vier of vyf vrae; vraag 3 en vraag 7 is die hart van die hoofstuk."
  - "Die “latere tye” in 4:1 kan tot spekulasie oor die eindtyd lei. Hou die fokus op waarop die teks dit toepas: leer wat mense angstig in plaas van dankbaar maak."
  - "Vers 4:8 kan sportiewe mense laat voel dat hulle veroordeel word. Wys, soos Dag 10, daarop dat Paulus liggaamlike oefening van beperkte nut noem, nie waardeloos nie."
  - "As daar jonger mense in die groep is, laat hulle eerste op vraag 5 antwoord; ouer lede kan dikwels die meeste leer deur te luister."
  - "Vers 4:10 (“die Redder van alle mense is, veral van die gelowiges”) kan vrae laat ontstaan. Erken dit, maar moenie toelaat dat dit die aand oorneem nie; dit kan apart bespreek word."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
