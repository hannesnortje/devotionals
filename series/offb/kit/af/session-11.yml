session: 11
lang: af
title: "Kom, Here Jesus"
ref: "20:1-22:21"
days: [27, 28, 29, 30, 31]
big_idea: "Agter die skerms regeer Christus reeds nou, en die Satan is aan 'n ketting, sodat hy die evangelie nie kan keer nie; die verhaal wat in Eden begin het, eindig nie met 'n ontsnapping uit die wêreld nie, maar daarmee dat God alles nuut maak en van aangesig tot aangesig by sy volk woon – en daarom wag die kerk, wakker en getrou, en bid: “Amen, kom, Here Jesus!”"
opening: "Wat is die beste tuiskoms wat jy kan onthou – ná 'n reis, 'n hospitaalverblyf of 'n lang tyd weg? Wat het dit soos tuis laat voel?"
context: >-
  Hoofstuk 19 het Christus se wederkoms gewys. Hoofstuk 20 tree nog een keer terug en wys die tyd waarin ons leef uit 'n ander hoek: die draak is vir duisend jaar vasgebind terwyl Christus saam met sy volk regeer; dan kom die laaste kort opstand en die groot wit troon.
  Hoofstuk 21–22 wys wat oorbly wanneer alles wat sleg is, weg is: 'n nuwe hemel en 'n nuwe aarde, die bruid wat 'n stad is, die rivier en die boom van die lewe uit Eden, en die aangesig van God.
  En die boek eindig soos dit begin het – as 'n brief aan die sewe gemeentes, met die belofte “Ek kom gou” en met genade.
read_aloud_tip: "Vyf voorlesers: 20:1–10; 20:11–21:8; 21:9–27; 22:1–9; 22:10–21. Die lofsang van 21:3–4 lees die hele groep saam, en heel aan die einde sê almal 22:20–21 hardop."
hebrew:
  - word: "edēsen"
    hebrew: "ἔδησεν"
    gloss: "vasgebind"
    point: "Van deō, “bind” – dieselfde werkwoord wat Jesus gebruik vir die vasbind van die sterk man voordat sy huis geplunder word (Markus 3:27). Die binding van die Satan begin by die kruis (Johannes 12:31–32): hy kan nog skade doen, maar hy kan die evangelie onder die nasies nie meer keer nie (20:3)."
  - word: "Idou kaina poiō panta"
    hebrew: "Ἰδοὺ καινὰ ποιῶ πάντα"
    gloss: "Kyk, Ek maak alles nuut"
    point: "Een van die min plekke waar Hy wat op die troon sit, self praat (vgl. 1:8). Hy gooi sy skepping nie weg nie; Hy maak alles nuut. En die werkwoord staan in die teenwoordige tyd: wie in Christus is, is reeds 'n nuwe skepping (2 Korintiërs 5:17)."
  - word: "erchou, kyrie Iēsou"
    hebrew: "ἔρχου, κύριε Ἰησοῦ"
    gloss: "kom, Here Jesus"
    point: "Die vroeë kerk het waarskynlik dieselfde gebed in Aramees gebid, Marana tha – “Ons Here, kom!” (1 Korintiërs 16:22); volgens die Didache (10:6) het dit deel van die gebede by die nagmaal gevorm. Dit is die antwoord op sy belofte “Ek kom gou” (22:20)."
discussion:
  - q: "'n Engel bind die draak vas, “sodat hy die nasies nie meer sou mislei nie” (vgl. Markus 3:27). As die duisend jaar die tyd is waarin ons nou leef – tussen Christus se eerste en tweede koms – waar sien jy dat die ketting hou, dat die Satan die evangelie nie kan keer nie? En waar voel dit glad nie so nie?"
    ref: "20:1-20:3"
  - q: "Dié wat “onthoof is ter wille van die getuienis van Jesus”, het geleef en saam met Christus geregeer, duisend jaar lank. Vir die wêreld het hulle verloor; agter die skerms regeer hulle. Wat sou dit beteken het vir 'n gemeente wat Antipas onthou het (2:13)? Hoe troos dit jou oor geliefdes wat in die geloof gesterf het?"
    ref: "20:4-20:6"
  - q: "Voor die groot wit troon staan daar: “boeke is oopgemaak. En 'n ander boek is oopgemaak, dit is die boek van die lewe.” Ons word volgens ons werke geoordeel, maar die laaste woord kom uit die boek van die lewe van die Lam (21:27; Lukas 10:20). Hoe hou dit die erns van ons lewe en die sekerheid van genade bymekaar?"
    ref: "20:11-20:15"
  - q: "Lees Genesis 2:8–10 en 3:17–24, en dan Openbaring 22:1–5. Wat het in Eden verlore gegaan, en wat kom terug? Wat is groter as aan die begin – 'n tuin wat 'n stad geword het, die boom van die lewe in die middel van haar straat, geen vloek meer nie, en “hulle sal sy aangesig sien”? (As daar tyd is, vergelyk Esegiël 47:1–12.)"
    ref: "22:1-22:5"
  - q: "“Kyk, die tent van God is by die mense” – die taal van die tabernakel (Eksodus 25:8; Johannes 1:14). Ons ontsnap nie na 'n hemel ver weg nie; God kom woon by ons, en “Hy sal elke traan uit hulle oë afvee”. Watter traan dra jy nog? Watter verskil maak dit dat Hy “Kyk, Ek maak alles nuut” in die teenwoordige tyd sê?"
    ref: "21:1-21:7"
  - q: "Die engel wat vir Johannes die hoer gewys het (17:1), wys hom nou “die bruid, die vrou van die Lam”: 'n stad sonder 'n tempel, want God en die Lam is haar tempel. Wat beteken dit vir jou Maandag? En vir jou gemeente, met al sy eienaardighede, dat die bruid 'n volk is en nie 'n versameling enkelinge nie?"
    ref: "21:9-21:27"
  - q: "Drie keer hoor ons “Ek kom gou”, en tussen die waarskuwings staan die uitnodiging: “En die Gees en die bruid sê: ‘Kom!’” Hoe vorm Jesus se “gou” die manier waarop ons wag – nie met datums nie, maar met gereedheid? Wie kan jy hierdie week nooi om te kom en die water van die lewe verniet te drink?"
    ref: "22:6-22:21"
application:
  - "Bid hierdie week elke oggend die laaste gebed van die Bybel: “Amen, kom, Here Jesus!” Voeg die naam by van een persoon wat jy graag wil nooi om te kom en van die water van die lewe te drink (22:17)."
  - "Skryf een traan neer wat jy nog dra, en lees 21:3–5 hardop daarlangs. Sê dan vir God: Ook hierdie een sal U afvee. En bid een keer hierdie week vir 'n volk of land waar die evangelie nog min bekend is."
prayer: "Hierdie aand sluit die reeks af. Begin met 'n dankrondte: elkeen sê in een sin wat hy of sy in Openbaring agter die skerms gesien het en wil hou. Bid dan vir die vervolgde kerk, vir een volk waar die evangelie nog min bekend is, en vir mekaar. Staan aan die einde op en lees 22:20–21 saam hardop: “Amen, kom, Here Jesus! Mag die genade van die Here Jesus met almal wees.”"
leader_notes:
  - "Laaste byeenkoms: drie hoofstukke en vyf oordenkings (dag 27–31). Kies vyf van die sewe vrae en hou minstens 20 minute oor vir terugkyk en die slotgebed."
  - "Die duisend jaar (20:1–6): hierdie reeks volg die lesing wat sedert Augustinus in die kerk bekend is – die tyd tussen Christus se eerste en tweede koms, waarin Christus regeer en sy volk saam met Hom, en die Satan vasgebind is sodat hy die evangelie onder die nasies nie kan keer nie. Premillennialiste (reeds Justinus en Ireneus, later die dispensasionaliste) verwag ná Christus se wederkoms 'n letterlike duisendjarige ryk op aarde; postmillennialiste verwag vooraf 'n goue eeu van die evangelie. Noem hierdie sienings regverdig en moenie die aand 'n debat laat word nie: almal stem saam dat Christus terugkom, oordeel en alles nuut maak."
  - "Hoofstuk 20 volg nie noodwendig in tyd op hoofstuk 19 nie. Dieselfde laaste oorlog (in die Grieks elke keer “die oorlog”, 16:14; 19:19; 20:8) word uit verskillende hoeke gewys, en elke keer is daar geen werklike geveg nie: die einde kom van die troon af."
  - "Hanteer die groot wit troon en die vuurpoel (20:11–15; 21:8) versigtig: party mense sal vrees voel, ander droefheid oor geliefdes. Moenie bespiegel oor wie in die boek van die lewe staan nie; wys na die Lam aan wie die boek behoort. “Die lafaards” (21:8) is nie mense wat bang en swak is nie, maar dié wat uit vrees Christus prysgegee het – en die deur staan nog oop: wie dors het, mag kom (21:6; 22:17)."
  - "Die mates van die stad (twaalfduisend stadies, honderd vier-en-veertig el) is getalle om oor te verwonder, nie vir kaarte nie: twaalf is die volk van God, en die kubus herinner aan die Allerheiligste (1 Konings 6:20). Uitleggers verskil oor of die nuwe skepping heeltemal nuut is of die ou skepping vernuwe; die punt bly dieselfde – God gee sy skepping nie prys nie."
  - "“Gou” (22:7, 12, 20) is nie 'n datum nie, maar 'n belofte wat elke geslag wakker hou (2 Petrus 3:8–9; Habakuk 2:3). Vermy datumberekeninge en vrees. As julle gemeente se gebruik dit toelaat, kan die reeks met die nagmaal afsluit, as 'n voorsmaak van die bruilofsmaal van die Lam (19:9)."
