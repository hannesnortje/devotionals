session: 3
lang: af
title: "Word wakker, hou vas, maak die deur oop"
ref: "3:1-3:22"
days: [7, 8, 9]
big_idea: "Christus sien deur reputasie, grootte en rykdom heen: Hy maak 'n gemeente wakker wat net lewendig lyk, Hy maak 'n deur oop vir 'n gemeente met min krag, en Hy klop aan die deur van 'n gemeente wat dink hy kort niks nie – en aan al drie bied Hy 'n plek saam met Hom op sy troon aan."
opening: "Wat is die verskil tussen 'n huis wat op foto's goed lyk en 'n huis waarin dit goed is om te woon? Het daardie verskil jou al ooit verras?"
context: >-
  Die boodskapper se pad eindig met nog drie stede. Sardis was trots op sy verlede en op 'n vesting wat hy as onneembaar beskou het – en tog is dit twee keer ingeneem omdat niemand wag gehou het nie.
  Filadelfia was jonk en klein, op 'n vrugbare vlakte wat telkens deur aardbewings geskud is. Laodisea was ryk, met banke, 'n tekstielhandel en 'n mediese skool, maar sy water het lou aangekom.
  Drie gemeentes, drie gevare – reputasie, swakheid, gemak – en die sewe briewe eindig met 'n troon (3:21).
read_aloud_tip: "Laat die drie wat elkeen 'n gemeente geneem het, hul brief lees (vers 1–6, 7–13, 14–22); die hele groep lees die refrein saam. Laat aan die einde een persoon vers 20 weer stadig lees, en hou 'n oomblik stilte."
hebrew:
  - word: "onoma"
    hebrew: "ὄνομα"
    gloss: "naam"
    point: "Naam beteken hier reputasie: “jy het die naam dat jy lewe, maar jy is dood” (3:1). Sardis was bekend, aktief en gerespekteer – en voor Christus 'n mooi grafsteen met 'n indrukwekkende inskripsie. Tog ken dieselfde brief ook “'n paar name” wat hulle klere nie besoedel het nie (3:4)."
  - word: "mikran dynamin"
    hebrew: "μικρὰν δύναμιν"
    gloss: "min krag"
    point: "Nie 'n verwyt oor swak geloof nie, maar 'n beskrywing van 'n klein, arm gemeente sonder invloed (3:8). En tog het hy Christus se woord bewaar en sy naam nie verloën nie – en Hy wat die sleutel van Dawid het, het 'n oop deur voor hom gegee."
  - word: "chliaros"
    hebrew: "χλιαρός"
    gloss: "lou"
    point: "Die woord kom net hier in die Nuwe Testament voor (3:16). Baie uitleggers hoor die water van die Likus-vallei daaragter: warm, genesende bronne in Hiërapolis, koue drinkwater in Kolosse – en lou water in Laodisea wat niemand genees en niemand se dors geles het nie."
discussion:
  - q: "Aan elkeen wat verslag doen: waarop was jou stad trots (Sardis: sy onneembare vesting; Filadelfia: sy naam en sy nuwe keisername; Laodisea: sy banke, sy swart wol en sy oogsalf)? Waar raak Christus se brief presies daardie punt?"
    ref: "3:1-3:18"
  - q: "Sardis: “jy het die naam dat jy lewe, maar jy is dood.” Geen vervolging, geen dwaalleraars nie – kan vrede met die wêreld 'n teken van geestelike slaap wees? Hoe groot is die gaping tussen jou “naam” en jou lewe met God wanneer niemand kyk nie – en wat sou “Word wakker en versterk wat oorbly” vir jou beteken?"
    ref: "3:1-3:4"
  - q: "Filadelfia: Christus is Hy “wat die sleutel van Dawid het, wat oopmaak en niemand sal toesluit nie, en wat toesluit en niemand maak oop nie” (Jesaja 22:20–23). Wat het die sleutel vir Eljakim beteken, en wat beteken dit dat Jesus dit hou? Watter deur is voor jou neus toegeslaan – en watter een het Hy dalk oopgemaak?"
    ref: "3:7-3:8"
  - q: "Christus sê “dat jy min krag het, en tog het jy my woord bewaar en my naam nie verloën nie”. Wat sê dit vir klein gemeentes en vir mense wat voel hulle is te gewoon om 'n verskil te maak? Waarom sou 'n pilaar “in die tempel van my God” soveel beteken in 'n stad van aardbewings?"
    ref: "3:8-3:12"
  - q: "“sal Ek jou ook bewaar uit die uur van beproewing”. Die oordenking verwys na Johannes 17:15: nie uit die wêreld weggeneem nie, maar teen die Bose bewaar – deur dit bewaar en daaruit gebring. Watter verskil maak dit of ons verwag dat God ons moeilikheid sal spaar, of dat Hy ons daarin sal bewaar?"
    ref: "3:10-3:11"
  - q: "Laodisea: “Ek is ryk, ek het ryk geword en ek kort niks nie”. Christus bied aan om te verkoop wat net Hy het (vgl. Jesaja 55:1: koop sonder geld en sonder prys). Waar het gemak of sukses jou ongemerk laat voel dat jy niks kort nie? Wat sou goud wat deur vuur gesuiwer is, wit klere en oogsalf vir jou wees?"
    ref: "3:15-3:19"
  - q: "“Kyk, Ek staan by die deur en klop.” Die Here van die kerk staan buite sy eie gemeente – en breek nie die deur oop nie. Aan watter vertrek van jou lewe klop Hy nog? En wat beteken dit dat wie oopmaak, 'n plek saam met Hom op sy troon belowe word?"
    ref: "3:20-3:22"
application:
  - "Kies een geestelike gewoonte wat in jou lewe soos die oorblyfsel in Sardis “op die punt was om te sterf” – gebed, Bybellees, aanbidding, vrygewigheid – en versterk dit hierdie week doelbewus, elke dag op 'n vaste tyd."
  - "Maak 'n deur oop: noem die terrein van jou lewe waar Jesus nog buite staan, sê dit vir Hom in gebed en gee Hom daar die ereplek – miskien met een konkrete verandering in hoe jy jou tyd of jou geld gebruik."
prayer: "Bid vir die drie gemeentes en vir julleself: vir waaksaamheid (Sardis), vir getrouheid met min krag (Filadelfia), vir eerlike afhanklikheid (Laodisea). Hou dan 'n minuut stilte met vers 20, en laat elkeen in stilte 'n deur vir Christus oopmaak. Sluit af met dank dat Hy dié bestraf en tugtig wat Hy liefhet (3:19)."
leader_notes:
  - "Hierdie byeenkoms dek drie oordenkings (dag 7–9). Laat elkeen wat verslag doen, sy of haar stad in twee minute uit die oordenking voorstel (Sardis: die vesting wat deur Kores en Antiochus ingeneem is; Filadelfia: die aardbewing van 17 n.C.; Laodisea: die aardbewing van 60 n.C., banke, wol, oogsalf en lou water). As die tyd min is, kies vrae 2, 3, 6 en 7."
  - "3:10 en die “wegraping”: party (veral dispensasionalistiese lesings) verstaan 3:10 as 'n belofte dat die kerk voor 'n toekomstige tyd van verdrukking weggeneem sal word. Noem dit regverdig. Die oordenking lees “bewaar uit” as deur dit bewaar en daaruit gebring, soos in Johannes 17:15 – vir Filadelfia en vir elke gemeente. Moenie die aand 'n debat daaroor laat word nie."
  - "Warm en koud: die ouer lesing verstaan “warm” as ywerig en “koud” as vyandig. Die oordenking verkies die agtergrond van Hiërapolis en Kolosse, waarin warm en koud albei nuttig is – maar sê dat ons nie seker kan wees nie. Hoe ook al, die punt bly dieselfde: lou geloof is nutteloos."
  - "Met sorg: iemand is dalk bang oor sy of haar naam in die boek van die lewe. Vers 5 is 'n belofte, nie 'n dreigement nie: “Ek sal sy naam beslis nie uit die boek van die lewe uitwis nie”. Laat die angstiges die belofte hoor. Vir die “sinagoge van die Satan” (3:9) geld dieselfde sorg as verlede week."
  - "Vers 20 word dikwels in evangelisasie gebruik, en dit mag so gehoor word – maar in die konteks praat Christus met 'n gemeente wat Hom uitgesluit het. Laat die groep albei hoor."
  - "Vooruitskouing: die briewe eindig met 'n troon (3:21), en volgende week staan daar: “'n deur was oop in die hemel” (4:1) – ons sien wie op daardie troon sit, en wie in die middel daarvan staan."
