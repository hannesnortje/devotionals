session: 5
lang: af
title: "Wie kan staande bly?"
ref: "6:1-7:17"
days: [12, 13]
big_idea: "Die Lam wat geslag is, hou die seëls in sy hand: oorlog, honger en dood gaan net uit wanneer Hy dit oopmaak, en net so ver as wat God toelaat – en op die groot vraag “wie kan staande bly?” is die antwoord 'n menigte wat niemand kon tel nie, uit elke nasie, deur God verseël en gewas in die bloed van die Lam."
opening: "Wanneer jy slegte nuus oor die radio hoor of op jou foon lees, wat is jou eerste reaksie – afskakel, bekommerd raak, 'n verklaring soek, of bid? Waarom?"
context: >-
  In hoofstuk 4–5 het Johannes die troon in die hemel gesien, en die Lam wat alleen waardig is om die boekrol te neem. Nou maak die Lam die seëls een vir een oop:
  vier ruiters, die siele onder die altaar, en 'n hemel wat soos 'n boekrol opgerol word (hoofstuk 6). Vir die klein gemeentes in Asië, wat oorlog, hongersnood en die druk van Rome geken het,
  was dit geen fantasie nie. Voor die sewende seël hou die verhaal stil (hoofstuk 7): God verseël sy knegte, en Johannes sien die menigte wat niemand kon tel nie.
read_aloud_tip: "Een persoon lees die hoofstukke voor; by elke seël sê die hele groep saam “Kom!” (6:1, 3, 5, 7). 'n Tweede leser neem die uitroep van die siele (6:10) en die ouderling (7:13–17); almal lees die liedere van 7:10 en 7:12 saam."
hebrew:
  - word: "edothē"
    hebrew: "ἐδόθη"
    gloss: "is gegee"
    point: "Die kroon, die swaard en die gesag word aan die ruiters gegee (6:2, 4, 8). Die passiewe vorm wys na God as die Een wat toelaat – en begrens: die olie en die wyn word gespaar, die Dood kry 'n kwart van die aarde, nie die hele aarde nie. Soos in Job 1–2 kan die vernietiger net so ver gaan as wat God toelaat."
  - word: "stathēnai / hestōtes"
    hebrew: "σταθῆναι / ἑστῶτες"
    gloss: "staande bly / gestaan"
    point: "Hoofstuk 6 eindig met die vraag van Nahum 1:6: “wie kan staande bly?” (6:17). Hoofstuk 7 antwoord daarop: 'n menigte wat “voor die troon en voor die Lam” staan (7:9) – nie op eie krag nie, maar omdat die Lam self eerste gestaan het, “soos een wat geslag is” (5:6)."
  - word: "sphragida"
    hebrew: "σφραγῖδα"
    gloss: "seël"
    point: "'n Seël was die merk van eienaarskap en egtheid – 'n seëlring in die was van 'n brief, 'n stempel op 'n vrag. Wat verseël is, behoort aan iemand en word deur hom bewaak. God se knegte word op hulle voorkoppe verseël voordat die storm kom (7:3)."
discussion:
  - q: "Elke ruiter gaan eers uit wanneer die Lam 'n seël oopmaak, en elke keer word iets gegee: “'n kroon is aan hom gegee”, “'n groot swaard is aan hom gegee”. Watter een van die ruiters – oorlog, ekonomiese druk, siekte, dood – maak jou op die oomblik die bangste? Wat verander wanneer jy onthou wie die seëls oopmaak?"
    ref: "6:1-6:8"
  - q: "Vergelyk vers 8 met Sagaria 1:8–11 en Esegiël 14:21. Jesus het gesê dat oorloë en hongersnode die hele tyd tot sy wederkoms sal kenmerk, maar dat dit nog nie die einde is nie (Markus 13:7–8). Hoe moet ons dan die seëls lees – as 'n rooster, of as 'n prentjie van die wêreld tussen Christus se eerste en tweede koms?"
    ref: "6:8"
  - q: "Die siele onder die altaar roep uit: “Hoe lank, heilige en waaragtige Heerser, oordeel U nie en wreek U nie ons bloed op dié wat op die aarde woon nie?” God bestraf hulle nie, maar sê dat hulle “nog 'n kort tydjie moet rus”. Wat sê dit oor eerlike gebed? Waaroor roep jy al lank “Hoe lank?”"
    ref: "6:9-6:11"
  - q: "Konings, bevelvoerders en rykes steek hulle in die grotte weg – maar ook “elke slaaf en vry mens”. Hulle skuil “van die toorn van die Lam”. Hoe kan die toorn van Hom wat vir die wêreld geslag is, tegelyk die ernstigste en die hoopvolste woord in die hoofstuk wees? Op wie of wat vertrou jy om op daardie dag staande te bly?"
    ref: "6:15-6:17"
  - q: "Voor die storm word God se knegte op hulle voorkoppe verseël (vgl. Eksodus 12:13; Esegiël 9:4–6). In Asië het die keiserkultus en die gildes elke dag gevra aan wie die gelowiges behoort – watter troos het in hierdie seël gelê? Watter etikette wat ander op jou plak, glo jy meer as die seël van die lewende God?"
    ref: "7:1-7:3"
  - q: "Johannes hoor 'n getal – honderd vier-en-veertigduisend uit die stamme van Israel – en dan sien hy “'n groot menigte wat niemand kon tel nie, uit elke nasie en al die stamme en volke en tale”. Hoe word God se belofte aan Abraham hierin vervul (Genesis 15:5; 12:3)? Hoe groot is die kerk in jou verbeelding?"
    ref: "7:4-7:10"
  - q: "“Hulle het hulle klede gewas en dit wit gemaak in die bloed van die Lam.” Die menigte sing nie oor hulle volharding nie, maar: “Aan ons God wat op die troon sit, en aan die Lam behoort die redding!” Waar probeer jy nog self jou klere skoon hou? Watter belofte uit verse 15–17 het jy hierdie week die nodigste?"
    ref: "7:13-7:17"
application:
  - "Wanneer jy hierdie week die nuus lees of hoor, kies een plek waar oorlog of honger is en bid daarvoor – en sê dit hardop: Die Lam hou die seëls in sy hand."
  - "Elke oggend wanneer jy jou gesig in die spieël sien, sê vir jouself: Ek is verseël, en ek behoort aan die Lam. Bid een keer hierdie week vir gelowiges in 'n land en 'n taal wat nie joune is nie."
prayer: "Begin met die lied van die menigte, saam hardop gelees: “Aan ons God wat op die troon sit, en aan die Lam behoort die redding!” (7:10). Laat dan elkeen in een sin 'n “Hoe lank?” voor God bring – vir hulleself of vir lydende gelowiges elders. Sluit af met dank vir die belofte: “God sal elke traan uit hulle oë afvee.”"
leader_notes:
  - "Hierdie byeenkoms dek twee oordenkings (dag 12–13). Hoofstuk 6 maak bang, en hoofstuk 7 is die antwoord daarop – moenie dat die gesprek in hoofstuk 6 vassteek nie. Hou minstens vyftien minute vir hoofstuk 7."
  - "Ons benadering in hierdie reeks: die seëls wys die wêreld soos dit is tussen Christus se eerste en tweede koms, en wie dit in sy hand hou; eers die sesde seël bring ons tot by die groot dag self. Futuristiese uitleggers plaas die seëls in 'n toekomstige tydperk net voor Christus se wederkoms. As dit ter sprake kom, noem dit regverdig in een sin en keer terug na die pastorale punt: die Lam maak die seëls oop, en die geskiedenis is nie buite beheer nie."
  - "Die eerste ruiter (6:2): sommige sien Christus self in hom, omdat Hy in 19:11 op 'n wit perd ry; baie lees hom as verowering en oorlog, dalk selfs as 'n namaaksel van Christus, omdat hy saam met die ander drie uitry. Albei lesings kan genoem word; moenie lank daarby stilstaan nie."
  - "Die 144 000: dispensasionaliste lees hulle letterlik as Joodse gelowiges, apart van die menigte. Die patroon van hoor en sien (soos in 5:5–6) maak dit waarskynlik dat Johannes een volk van twee kante beskryf. Israel word nie uitgewis of vervang nie; die nasies word in Abraham se familie ingeënt (Romeine 11:17–18; Galasiërs 3:29). Hou die toon warm – geen polemiek nie."
  - "Hanteer versigtig: daar kan mense in die groep wees wat rou, of wat familie het in lande met oorlog of vervolging. Laat die uitroep “Hoe lank?” staan sonder om vinnig antwoorde te gee, en keer enige poging af om die ruiters aan vandag se opskrifte te koppel of datums uit te werk."
  - "Vooruitskouing: volgende week die sewende seël – stilte in die hemel, die gebede van die heiliges, en die trompette."
