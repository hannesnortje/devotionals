session: 10
lang: af
title: "Gaan uit haar uit"
ref: "17:1-19:21"
days: [23, 24, 25, 26]
big_idea: "Babilon – die verleidelike mag van elke tyd wat op die dier ry, in weelde leef, met liggame en siele handel dryf en dronk is van die bloed van die heiliges – lyk indrukwekkend, maar val in een enkele uur; God roep sy volk uit haar uit, nie uit die wêreld nie, en nooi hulle na die bruilof van die Lam, wie se Ruiter, Getrou en Waaragtig, deur die woord van sy mond oorwin."
opening: "Dink aan 'n advertensie, 'n produk of 'n leefstyl wat jou eens regtig beïndruk het. Wat het dit so aantreklik gemaak – en het dit sy belofte nagekom?"
context: >-
  By die laaste bak het die stem van die troon af uitgeroep: “Dit het gebeur!”, en God het “aan Babilon, die grote, gedink” (16:19). Hoofstuk 17–19 wys wie sy is.
  Vir die sewe gemeentes was sy Rome op sy sewe heuwels, ryk, glansryk en gewelddadig; in die groot verhaal van die Bybel is sy elke mag sedert Babel wat mense met weelde verlei en hulle laat vergeet aan wie hulle behoort.
  Hoofstuk 18 is die klaaglied oor haar val en die roep aan God se volk om uit haar uit te gaan; hoofstuk 19 antwoord met die hemel se Halleluja, die bruilof van die Lam en die Ruiter op die wit perd – Christus se wederkoms, wat nog voor ons lê.
read_aloud_tip: "Die hoofstukke is lank: lees 17:1–6 en 17:14–18, die hele hoofstuk 18 en die hele hoofstuk 19. In hoofstuk 18 neem drie voorlesers die klaagliedere van die konings (v. 9–10), die handelaars (v. 11–17a) en die seemanne (v. 17b–19); die Hallelujas van 19:1–8 lees die hele groep saam."
hebrew:
  - word: "Exelthate, ho laos mou, ex autēs"
    hebrew: "Ἐξέλθατε, ὁ λαός μου, ἐξ αὐτῆς"
    gloss: "Gaan uit haar uit, my volk"
    point: "Die roep van Jeremia aan die ballinge in die ou Babilon (Jeremia 51:6, 45). Die Griekse Ou Testament gebruik dieselfde werkwoord vir Israel se uittog uit Egipte (Eksodus 13:3). Dit is 'n nuwe uittog – uit Babilon uit, nie uit die skepping nie; die doel is die stad waar God by die mense woon (21:1–3)."
  - word: "sōmatōn, kai psychas anthrōpōn"
    hebrew: "σωμάτων, καὶ ψυχὰς ἀνθρώπων"
    gloss: "liggame – en mensesiele"
    point: "Die laaste items op Babilon se vraglys. “Liggame” was 'n handelswoord vir slawe; hier verander die Grieks skielik van konstruksie, asof Johannes die lys onderbreek om te sê wat die handelaars nie wou sien nie: dit is siele. Die Lam het mense vir God gekoop (5:9); Babilon koop en verkoop hulle."
  - word: "pistos … kai alēthinos"
    hebrew: "πιστὸς … καὶ ἀληθινός"
    gloss: "Getrou en Waaragtig"
    point: "Pistos is iemand wat sy woord hou; alēthinos is wat eg is, teenoor die namaaksel. In 'n boek vol namaaksels – 'n dier wat soos geslag lyk (13:3), 'n vals profeet met horings soos 'n lam (13:11) – is die Ruiter die Egte. So het Jesus Homself aan Laodisea voorgestel (3:14)."
discussion:
  - q: "Johannes hoor van “die groot hoer … wat by baie waters sit”, dan sien hy “'n vrou … wat op 'n skarlakenrooi dier sit”. Hoe verklaar die sien die hoor? Wat sou die gemeentes herken het toe die engel van sewe berge praat en van “die groot stad wat koningsheerskappy het oor die konings van die aarde”?"
    ref: "17:1-17:18"
  - q: "“En toe ek haar sien, het ek my baie verwonder.” Die engel vra: “Waarom verwonder jy jou?” Babilon verskyn nie as 'n monster nie, maar as 'n koningin in purper met 'n goue beker. Wat beïndruk jou op die oomblik so dat dit jou hart van die Lam begin wegtrek? Agter die glans: waarop ry dit – en wie betaal daarvoor?"
    ref: "17:3-17:7"
  - q: "Die Ou Testament in die Nuwe: lees Jeremia 51:6–8 en Jesaja 47:7–8 hardop en vergelyk dit met 18:2–8. Wat sê dit vir ons dat die stem uit die hemel Jeremia se woorde gebruik: “Gaan uit haar uit, my volk”? Watter soort uittog is dit – uit die wêreld uit, of uit iets anders? Wat sou dit vir jou werk en jou besteding beteken?"
    ref: "18:2-18:8"
  - q: "In haar hart sê Babilon: “Ek sit as koningin, en ek is geen weduwee nie, en droefheid sal ek nooit sien nie.” Laodisea het gesê: “Ek is ryk, ek het ryk geword en ek kort niks nie” (3:17). Waar hoor jy daardie stem in jou eie hart – “as ek genoeg het, kan niks my raak nie”?"
    ref: "18:7"
  - q: "Die handelaars huil nie oor die stad of oor die slawe nie, maar “omdat niemand meer hulle vrag koop nie” – en die lys eindig met “liggame – en mensesiele”. Wat wys ons droefheid oor waaraan ons hart gebind is? Wie is vir ons dalk net “vrag” – mense wie se werk ons gebruik sonder om hulle werklik raak te sien?"
    ref: "18:11-18:24"
  - q: "Halleluja, “want die bruilof van die Lam het gekom, en sy vrou het haar gereed gemaak.” Die hoer het haar purper en goud gekoop; aan die bruid word fyn linne gegee, blink en skoon. Sien jy die kerk eerder as 'n mislukking of as die bruid van die Lam? En probeer jy jou kleed verdien, of ontvang jy dit as 'n geskenk?"
    ref: "19:1-19:10"
  - q: "Die Ruiter “word Getrou en Waaragtig genoem”; sy kleed is al voor enige stryd in bloed gedoop, en geen veldslag word beskryf nie – net die swaard uit sy mond. Watter van God se beloftes vind jy nou moeilik om te glo? En wanneer het jy laas met die wapens van die dier geveg – woede, manipulasie, mag – in plaas van met die woord?"
    ref: "19:11-19:21"
application:
  - "Kies hierdie week een daad van “uitgaan”: gee iets weg wat jy graag sou wou hou, of vra by een aankoop wie die mense daaragter is en bid vir hulle – nie uit skuldgevoel nie, maar as iemand wat reeds aan die Lam behoort."
  - "Kies een gesprek waarin jy in die versoeking is om met harde woorde te wen. Bid vooraf Hebreërs 4:12, en sê dan een ware woord in liefde in plaas van die woord wat seermaak."
prayer: "Lees 19:6–8 saam hardop. Bid dan in pare: noem voor God een ding wat julle meer beïndruk as die Lam; bid vir mense wat soos vrag behandel word – uitgebuite werkers, slagoffers van mensehandel, almal wie se waarde gemeet word aan wat hulle produseer; en dank die Ruiter wat Getrou en Waaragtig genoem word vir een belofte wat Hy nagekom het. Sluit saam af: “Halleluja! Want die Here God, die Almagtige, het begin regeer.”"
leader_notes:
  - "Dit is die volste byeenkoms: drie lang hoofstukke en vier oordenkings (dag 23–26). Volg die leeswenk en kies vyf vrae; 2, 4 en 6 is die hart van die aand."
  - "Wie is Babilon? Vir die eerste lesers duidelik Rome (die sewe berge, 17:9; die groot stad, 17:18), maar in die verhaal van die Bybel is sy elke mag sedert Babel (Genesis 11:4) wat met weelde, geweld en afgodery verlei. Moenie die sewe konings (17:9–11) na 'n lys keisers vertaal nie, of die dier na 'n hedendaagse staat, instelling of kerk nie. Futuristiese uitleggers verwag 'n Babilon of wêreldstelsel aan die einde van die tyd, preteristiese sien net Rome; noem albei regverdig in een sin en keer terug na die boek se vraag: aan wie behoort ek?"
  - "Hanteer “binne of buite” versigtig. Twee vroue en twee stede is 'n roep tot getrouheid, nie 'n werktuig om ander mense as Babilon te etiketteer nie. Hoofstuk 18 is ook nie 'n preek teen geld of handel nie – koring, wyn en olyfolie is goeie gawes van God. Dit gaan oor die hart wat sê “droefheid sal ek nooit sien nie”, en oor die mense agter die goedere."
  - "Die teks noem Babilon 'n “hoer” en praat van “hoerery”. In die profete is dit die beeld van ontrouheid aan God – om jou liefde en vertroue aan ander magte te gee (Hosea 2; Esegiël 16; Nahum 3:4). As iemand ongemaklik is met die beeld, verduidelik dit kortliks: dit gaan daaroor aan wie ons ons hart gee."
  - "19:11–21 is Christus se wederkoms, wat nog voor ons lê. Die verskriklike maal van 19:17–18 neem Esegiël 39:17–20 op: die kwaad is volkome en finaal verslaan. Wys op die twee maaltye – almal word eers na die bruilofsmaal van die Lam genooi (19:9). En 19:10 is 'n goeie oomblik om te vra wat ons in die versoeking is om in God se plek te aanbid: “Aanbid God!”"
  - "Vooruitskouing: Volgende week is die laaste byeenkoms, hoofstuk 20–22 – die draak aan die ketting, alles word nuut, die bruid wat 'n stad is, die rivier en die boom van die lewe, en “Kom, Here Jesus”."
