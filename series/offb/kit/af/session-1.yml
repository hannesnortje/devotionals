session: 1
lang: af
title: "Die Koning tussen die lampstaanders"
ref: "1:1-1:20"
days: [1, 2]
big_idea: "Openbaring trek vir klein gemeentes onder druk die gordyn oop: Hy wat ons liefhet en ons deur sy bloed losgemaak het, is die heerser oor die konings van die aarde; Hy wandel tussen sy gemeentes, hou hulle in sy regterhand en sê vir hulle – en vir ons: “Moenie bang wees nie.”"
opening: "Was jy al ooit agter die skerms iewers – in 'n teater, 'n restaurantkombuis, 'n hospitaal, 'n stadion? Hoe het dit verander hoe jy daarna na die voorkant van die verhoog kyk?"
context: >-
  Openbaring is waarskynlik omstreeks 95 n.C. geskryf aan sewe werklike gemeentes in die Romeinse provinsie Asië (die weste van vandag se Turkye), waar die eer van die keiser as heer deel van die alledaagse lewe was
  en Christene wat geweier het, hul werk, hul vryheid of hul lewe kon verloor. Johannes skryf uit ballingskap op die eiland Patmos.
  Die boek se eerste woord, apokalypsis, beteken onthulling: God trek die gordyn oop sodat sy volk kan sien wie werklik regeer – en wat dit vir daardie sewe gemeentes beteken het, beteken dit vir die kerk in elke tyd.
  Vanaand lees ons hoofstuk 1: die groet en 'n lofsang (vers 1–8), en Johannes se visioen van die opgestane Christus tussen die lampstaanders (vers 9–20).
read_aloud_tip: "Lees met drie stemme: 'n verteller vir Johannes se woorde, 'n tweede leser vir die lofsang en vers 7 (vers 5b–7), en 'n derde leser vir die woorde van die Here (vers 8, 11 en 17b–20). Vers 3 noem hy wat voorlees geseënd – lees dus stadig, soos die eerste gemeentes dit gehoor het."
hebrew:
  - word: "apokalypsis"
    hebrew: "ἀποκάλυψις"
    gloss: "openbaring"
    point: "Nie chaos en wêreldvernietiging nie, maar die wegneem van 'n sluier – 'n onthulling. Die boek is nie geskryf om God se planne agter geheime kodes weg te steek nie, maar om gelowiges te wys wie werklik op die troon sit. En dit is die openbaring van Jesus Christus: Hy is die Gewer en die Inhoud daarvan (1:1)."
  - word: "synkoinōnos"
    hebrew: "συγκοινωνός"
    gloss: "wat saam met julle deel"
    point: "Johannes staan nie as 'n verhewe apostel bo die gemeentes nie; hy is hulle broer, 'n vennoot wat saam met hulle deel het. En wat hy met hulle deel, is drie dinge wat saamhoort: verdrukking, die koninkryk en volharding (1:9)."
  - word: "lychniai"
    hebrew: "λυχνίαι"
    gloss: "lampstaanders"
    point: "Nie die een sewe-armige lampstaander van die tabernakel nie (Eksodus 25:31–37; vgl. Sagaria 4:2), maar sewe afsonderlike goue lampstaanders – die sewe gemeentes (1:20). 'n Lampstaander het nie sy eie lig nie; dit hou die lig omhoog. En Christus staan tussen hulle (1:13)."
discussion:
  - q: "Vers 3 noem hy wat voorlees geseënd, en dié wat hoor en bewaar wat geskryf is. Openbaring was bedoel om in die gemeente voorgelees en uitgeleef te word – nie in die eerste plek om ontsyfer te word nie. Watter verskil maak dit as ons hierdie boek benader as 'n brief om te hoor en te bewaar eerder as 'n raaisel om op te los?"
    ref: "1:1-1:3"
  - q: "Voordat Johannes een woord oor verdrukking skryf, bars hy uit in lof: “Aan Hom wat ons liefhet en ons deur sy bloed van ons sondes losgemaak het”. “Liefhet” is teenwoordige tyd, “losgemaak het” verlede tyd. Waarom moes die gemeentes dit seker eerste hoor? En watter een van die twee vind jy moeiliker om oor jouself te glo?"
    ref: "1:4-1:6"
  - q: "Vers 7 vleg twee profesieë uit die Ou Testament saam: Daniël 7:13 (iemand soos 'n mensseun kom met die wolke van die hemel) en Sagaria 12:10 (hulle sal kyk na Hom wat hulle deurboor het, en rou). Slaan hulle na. Wat het hierdie beloftes in hul eie konteks beteken – en wat sien Johannes in Jesus waar word?"
    ref: "1:7"
  - q: "Keiser Domitianus wou graag “heer en god” genoem word. In vers 8 hoor die gemeentes: “die Here God, wat is en wat was en wat kom, die Almagtige”. Wat sou dit beteken het in 'n stad vol tempels vir die keiser? Watter “klein keisers” eis vandag daardie plek in ons lewe op?"
    ref: "1:8"
  - q: "Johannes noem homself “julle broer, wat saam met julle deel in die verdrukking en die koninkryk en die volharding in Jesus”. Waarom hoort hierdie drie bymekaar? Wat gebeur met ons geloof as ons die koninkryk wil hê sonder die verdrukking en die volharding?"
    ref: "1:9"
  - q: "Die portret in vers 13–16 is met Ou-Testamentiese kleure geverf (Daniël 7:9; 10:5–6). Wat beteken dit dat trekke van die Oue van dae – hare wit soos wol – gegee word aan iemand soos 'n mensseun? Watter besonderheid spreek jou die meeste aan: die oë soos 'n vuurvlam, die stem soos baie waters, die swaard uit sy mond?"
    ref: "1:12-1:16"
  - q: "Christus staan “tussen die lampstaanders”, en die hand wat die sterre vashou, rus op die bewende Johannes: “Moenie bang wees nie. Ek is die Eerste en die Laaste”. Watter vrees in jou lewe moet vandag hoor dat Hy “die sleutels van die dood en van die doderyk” het?"
    ref: "1:17-1:20"
application:
  - "Lees hierdie week elke oggend, voordat jy na die nuus of jou foon kyk, 1:5–6 hardop en sê dit in jou eie woorde: Hy het my lief – vandag; Hy het my losgemaak – dit is klaar."
  - "Loof God soos Johannes op Patmos te midde van iets moeiliks, nie eers wanneer dit verby is nie: noem hierdie week een moeilike situasie en dank Christus uitdruklik dat Hy die sleutels hou en tussen sy volk wandel."
prayer: "Lees vers 17–18 saam stadig hardop. Laat elkeen dan (hardop of stil) een vrees noem en dit oorgee aan Hom wat die sleutels van die dood en van die doderyk het. Sluit af deur die lofsang van vers 5–6 saam as julle eie lof te bid."
leader_notes:
  - "Hierdie byeenkoms dek twee oordenkings (dag 1–2) en open die reeks van elf byeenkomste. Stel die bril aan die begin: Openbaring is aan sewe gemeentes geskryf; wat dit vir hulle beteken het, beteken dit vir ons. Die vraag is nie “wanneer?” nie, maar “wie regeer werklik, en aan wie se kant staan ek?”."
  - "Sommige in die groep het dalk geleer om Openbaring hoofsaaklik as 'n tydtabel van toekomstige eindtydgebeure te lees (futuristiese en dispensasionalistiese lesings), ander as iets wat in die eerste eeu vervul is (preteristiese lesings). Noem dit regverdig en sonder polemiek, en sê dat hierdie reeks die boek lees as 'n boodskap vir die kerk in elke tyd; hou die fokus op die pastorale hart daarvan: God regeer, die Lam het oorwin, die kerk word geroep tot getroue getuienis en volharding."
  - "“Wat gou moet gebeur” en “die tyd is naby” (1:1, 3): die oordenking wys dat Johannes Daniël 2:28 opneem, maar “in die laaste dae” met “gou” vervang – wat vir Daniël ver was, het met Christus begin, en die hele tyd tussen sy eerste en tweede koms is die laaste dae. Moenie die groep datums laat uitwerk nie."
  - "Die “engele” van die sewe gemeentes (1:20) word verskillend verstaan – hemelse engele, of die leiers of boodskappers van die gemeentes. Noem dit kortliks en gaan aan. In 1:5 lees party ouer Bybels “gewas”; die oudste handskrifte lees “losgemaak”."
  - "Met sorg: party mense dra werklike vrees saam uit eindtydfilms, tabelle of preke. Die eerste woord van die opgestane Christus aan die bewende Johannes is “Moenie bang wees nie.” Laat dit die toon van die aand bepaal."
  - "Vooruitskouing: volgende week lees ons hoofstuk 2 – Efese, Smirna, Pergamum en Tiatira. Vra vier mense om elkeen een gemeente te neem, die brief tuis saam met die oordenking van daardie dag te lees en volgende keer kortliks verslag te doen."
