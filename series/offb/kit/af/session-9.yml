session: 9
lang: af
title: "Die lied op die oewer"
ref: "14:1-16:21"
days: [20, 21, 22]
big_idea: "Ná die draak en die diere gaan die gordyn oop: die Lam staan op Sion saam met sy volk, wat sy naam dra en die lied van Moses en van die Lam sing nog voordat 'n enkele bak uitgestort is – God se oordeel oor die kwaad is werklik en regverdig, maar dié wat aan die Lam behoort, word bewaar, en die einde van die kwaad is reeds beslis."
opening: "Is daar 'n lied wat jou deur moeilike tye dra – een wat jy sing of neurie wanneer dit swaar gaan? Wat doen dit vir jou?"
context: >-
  In hoofstuk 13 het dit gelyk asof die draak en sy twee diere die wêreld regeer, en niemand kon sonder die merk van die dier koop of verkoop nie.
  Hoofstuk 14–16 trek die gordyn weer oop: die Lam staan saam met die hele volk van God op die berg Sion, engele verkondig 'n ewige evangelie, en die oes van die aarde word ingesamel.
  Dan kom die sewe laaste plae: voordat 'n enkele bak uitgestort word, sing die oorwinnaars op die oewer van die see van glas; dan val die bakke soos die plae van Egipte op die koninkryk van die dier – totdat die stem van die troon af uitroep: “Dit het gebeur!”
read_aloud_tip: "Drie voorlesers, een per hoofstuk. In 14:6–11 neem drie stemme die drie engele; die lied van 15:3–4 lees die hele groep saam; in hoofstuk 16 wag die voorleser kort ná elke bak, en die groep lees die antwoord van die altaar (16:7) hardop saam."
hebrew:
  - word: "gegrammenon epi tōn metōpōn autōn"
    hebrew: "γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν"
    gloss: "op hulle voorkoppe geskryf"
    point: "Die werkwoordsvorm beskryf iets wat geskryf is en geskryf bly. Die merk van die dier moet afgedwing word (13:16); die naam van die Lam en van sy Vader is 'n blywende gawe (14:1; vgl. 7:3; 22:4). Niemand is ongemerk nie – elkeen behoort aan iemand."
  - word: "tēn ōdēn Mōyseōs … kai tēn ōdēn tou arniou"
    hebrew: "τὴν ᾠδὴν Μωϋσέως … καὶ τὴν ᾠδὴν τοῦ ἀρνίου"
    gloss: "die lied van Moses … en die lied van die Lam"
    point: "Waarskynlik nie twee liedere nie, maar een: die lied van die uittog (Eksodus 15), nou gesing oor 'n groter uittog. Die bloed van die paaslam het Israel uit Egipte gebring; die bloed van die Lam het mense uit al die nasies vir God gekoop (5:9)."
  - word: "Gegonen"
    hebrew: "Γέγονεν"
    gloss: "Dit het gebeur!"
    point: "Die voltooide tyd: iets het gebeur en bly so staan. Die konings versamel nog vir die oorlog, en tog is die uitslag reeds beslis. Dieselfde woord klink weer by die nuwe skepping (21:6)."
discussion:
  - q: "Ná die merk van die dier: “En ek het gekyk, en daar was die Lam, staande op die berg Sion”. Die draak het op die sand van die see gestaan (12:18); die Lam staan op die rots van Sion. Wat sou dit beteken het vir 'n gelowige in Pergamum wat amper alleen nie gebuig het nie? Waar het jy vandag hierdie blik agter die skerms nodig?"
    ref: "14:1"
  - q: "Die 144 000 het “sy naam en die naam van sy Vader op hulle voorkoppe geskryf” en volg die Lam waar Hy ook al gaan. Watter etiket (werk, inkomste, voorkoms, mislukkings) weeg die swaarste op jou, en wat verander as sy naam daaroor staan? Waarheen volg jy die Lam op die oomblik net teësinnig?"
    ref: "14:1-14:5"
  - q: "Nog voor die val van Babilon en die ernstige waarskuwing vlieg daar 'n engel met “'n ewige evangelie” vir elke nasie: “Vrees God en gee Hom eer”. Waarom dink julle kom die evangelie eerste? En wat sê vers 13 vir iemand wat 'n geliefde in die Here verloor het?"
    ref: "14:6-14:13"
  - q: "Die oorwinnaars staan langs die see van glas en sing “die lied van Moses, die kneg van God, en die lied van die Lam”. Lees Eksodus 15:1–2, 11 en Jeremia 10:6–7 hardop. Watter verbande sien julle tussen Israel op die oewer van die Rietsee en God se volk hier? Wat is die groter uittog wat die Lam bewerk het?"
    ref: "15:2-15:4"
  - q: "Die lied kom vóór die bakke, en daar is nie 'n woord daarin oor die sangers se eie lyding of moed nie – elke reël gaan oor God. Waar staan jy op die oomblik: nog in die see, of al op die oewer? Wat sou dit beteken om reeds daar te sing: “regverdig en waaragtig is u weë”?"
    ref: "15:3-15:4"
  - q: "Die bakke bring die plae van Egipte terug (Eksodus 7–10). Twee keer lees ons dat hulle hulle nie bekeer het nie, en drie keer dat hulle God gelaster het. Wat leer Farao se storie ons oor waarom oordeel alleen nie 'n hart verander nie? Wanneer iets seermaak, word jy sagter of harder teenoor God?"
    ref: "16:1-16:11"
  - q: "Die altaar sê: “Ja, Here God, die Almagtige, waaragtig en regverdig is u oordele.” En Christus: “Kyk, Ek kom soos 'n dief. Geseënd is hy wat wakker bly en sy klere bewaar”. Hoe troos hierdie stemme dié wat onreg ly? Wat beteken “wakker bly” vir jou – sonder om datums uit te werk?"
    ref: "16:5-16:17"
application:
  - "Skryf vanaand op 'n kaartjie: Ek behoort aan die Lam. Sit dit by die spieël, en lees elke oggend 15:3–4 hardop en dank God vir een konkrete werk wat Hy in jou lewe gedoen het."
  - "Neem een aand twee minute en vra jouself waar jy hierdie week aan die slaap geraak het – in gebed, in eerlikheid, in liefde. Bid dan vir een persoon of plek wat onreg ly, met die woorde van 16:7."
prayer: "Begin deur 15:3–4 saam hardop te lees, of sing 'n loflied wat die groep ken. Bid dan in twee- of drietalle: dank die Lam dat sy naam oor julle lewe geskryf staan, noem een situasie waarin julle voel julle is nog in die see, en bid vir een plek in die wêreld wat onreg ly. Sluit saam af met 16:7: “Ja, Here God, die Almagtige, waaragtig en regverdig is u oordele.”"
leader_notes:
  - "Hierdie byeenkoms dek drie hoofstukke en drie oordenkings (dag 20–22). Hoofstuk 16 is swaar; moenie dit oorslaan nie, maar hou tyd oor vir vrae 4 en 5 – die lied op die oewer is die hart van die aand."
  - "Die 144 000 (14:1–5) is, soos in 7:4–9, die hele volk van God, nie 'n elitegroep of 'n enkele volk nie. “Maagde” (14:4) is die Ou-Testamentiese beeld van soldate wat hulle vir die heilige oorlog rein hou (Deuteronomium 23:9–14; 1 Samuel 21:5) en van Israel wat haar God getrou volg (Jeremia 2:2) – dit beteken nie dat net ongetroudes aan die Lam behoort nie."
  - "Die bakke is nie die volgende hoofstuk in 'n kalender nie, maar dieselfde werklikheid as die trompette (8–9), nou in sy volle erns: God se geduld met die kwaad het 'n einde. Party in die groep lees dit dalk as 'n toekomstige tyd net voor Christus se wederkoms (futuristies), ander net as die oordeel oor Rome (preteristies); noem hierdie sienings regverdig in een sin en keer terug na die pastorale boodskap. Armageddon (16:16) is waarskynlik “die berg van Megiddo”, 'n simbool van die laaste opstand – die slag self word nooit beskryf nie. Stuur weg van kaarte en nuusopskrifte."
  - "Hanteer die taal van toorn versigtig (14:10–11, 19–20; 16). Party mense het grootgeword met prediking wat hulle bang gemaak het. Beklemtoon wat die oordenkings beklemtoon: dit is troos vir dié wat ly, nie 'n wapen om ander mee te dreig nie; God se toorn is sy trou aan die slagoffers; dié wat deur God verseël is, staan nie daaronder nie (7:3; Eksodus 8:22). Lees die hoofstuk oor ons eie hart, nie oor ander mense nie."
  - "Die nuwe uittog loop deur hierdie hoofstukke – die seël op die voorkop, die lied by die see, die tent van die getuienis (15:5; Eksodus 40:34–35), die plae. Laat die groep dit self in vraag 4 ontdek eerder as om dit vooraf te verduidelik."
  - "Vooruitskouing: Volgende week hoofstuk 17–19 – die hoer op die dier, die val van Babilon, die bruilof van die Lam en die Ruiter wat Getrou en Waaragtig genoem word."
