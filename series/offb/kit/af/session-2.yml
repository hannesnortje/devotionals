session: 2
lang: af
title: "Vier gemeentes, een Here"
ref: "2:1-2:29"
days: [3, 4, 5, 6]
big_idea: "Hy wat tussen die lampstaanders wandel, ken elke gemeente soos dit werklik is – Efese se liefdelose regsinnigheid, Smirna se ryk armoede, Pergamum se stil kompromie en Tiatira se liefdevolle verdraagsaamheid – en roep elkeen van hulle, en ons, om te hoor, ons te bekeer, vas te hou en te oorwin."
opening: "Stel jou voor iemand wat jou goed ken, skryf vir jou 'n kort, eerlike brief: een ding wat hy of sy in jou bewonder, en een ding wat hom of haar bekommer. Wat dink jy sou daarin staan? (Jy hoef nie die antwoord te deel nie.)"
context: >-
  Die sewe stede lê aan 'n ronde pad, waarskynlik die roete wat 'n boodskapper van Patmos af sou volg: eers Efese, dan Smirna, Pergamum en Tiatira.
  Elke brief volg 'n patroon – 'n titel van Christus uit hoofstuk 1, “Ek ken …”, lof of berisping, die oproep om jou te bekeer of vas te hou, 'n belofte aan wie oorwin, en die oproep om te hoor.
  Die briewe was nie privaat pos nie: “wat die Gees aan die gemeentes sê” is in al sewe voorgelees; elke gemeente het elke brief gehoor – en ons ook.
read_aloud_tip: "Laat die vier wat elkeen 'n gemeente geneem het, hul brief lees (vers 1–7, 8–11, 12–17, 18–29) asof dit aan hul eie gemeente gerig is. Die hele groep lees elke keer saam die refrein: “Wie 'n oor het, moet hoor wat die Gees aan die gemeentes sê.”"
hebrew:
  - word: "aphiēmi"
    hebrew: "ἀφίημι"
    gloss: "laat vaar"
    point: "Efese het nie sy eerste liefde verloor soos 'n mens jou motorsleutels verloor nie; hy het dit laat los, agtergelaat (2:4). Dieselfde werkwoord kom terug in Tiatira: “jy laat … begaan” – letterlik: jy laat haar haar gang gaan (2:20). Efese het die liefde laat vaar; Tiatira het sy plig laat vaar om die kwaad te keer."
  - word: "ptōcheia"
    hebrew: "πτωχεία"
    gloss: "armoede"
    point: "Nie die beskeie armoede van iemand wat net-net genoeg het nie (penia), maar die bedelaarsarmoede van iemand wat glad niks het nie – die prys wat die Christene in Smirna betaal het omdat hulle geweier het om die keiser te vereer. En dan Christus se drie woorde: “maar jy is ryk” (2:9)."
  - word: "psēphos leukē"
    hebrew: "ψῆφος λευκή"
    gloss: "wit klippie"
    point: "In 'n hof kon 'n wit klippie vryspraak beteken; klein klippies of plaatjies is ook as toegangskaartjies vir 'n feesmaal gebruik. Aan gelowiges wat deur Rome veroordeel en van die gildefeeste uitgesluit is, gee Christus vryspraak en 'n plek aan sy eie tafel – met 'n nuwe naam wat net hy ken wat dit ontvang (2:17)."
discussion:
  - q: "Elke verslaggewer: met watter titel stel Christus Homself in jou brief voor, en waarom pas dit by die stad? (Efese: Hy wat tussen die lampstaanders wandel; Smirna: Hy wat dood was en lewend geword het; Pergamum: die swaard, in die stad van die goewerneur se swaardreg; Tiatira: die Seun van God, in die stad van 'n “seun van Zeus”.)"
    ref: "2:1-2:18"
  - q: "Efese: “Ek ken jou werke, jou moeite en jou volharding” – en tog: “jy het jou eerste liefde laat vaar”. Hoe kan 'n gemeente, of 'n Christen, besig en regsinnig wees en tog die liefde agtergelaat het? Wat was jou eie “eerste werke” toe die genade jou die eerste keer oorweldig het?"
    ref: "2:2-2:5"
  - q: "Smirna: “Ek ken jou verdrukking en jou armoede – maar jy is ryk”. Die verdrukking is werklik, maar dit duur “tien dae” – hewig, en tog deur God afgemeet. Hoe verander dit die manier waarop jy na 'n moeilike tyd kyk, of na jou eie idee van geseënd wees?"
    ref: "2:8-2:11"
  - q: "Pergamum: “Ek weet waar jy woon: waar die troon van die Satan is.” Christus eer Antipas met sy eie titel uit 1:5: “my getuie, my getroue”. Hoe lyk jou “Pergamum” – die plek waar jy druk voel om 'n ander heer te eer of oor joune stil te bly?"
    ref: "2:12-2:13"
  - q: "Twee name uit die Ou Testament: Bileam (lees Numeri 25:1–3 en 31:16) en Isebel (1 Konings 16:31–33; 21:25). Wat het hulle aan Israel gedoen – nie deur 'n openlike aanval nie, maar deur verleiding? Waarom gebruik Jesus seker hierdie name vir leraars binne die gemeente, en waar kom ons vandag dieselfde soort redenasie teë?"
    ref: "2:14-2:20"
  - q: "Efese kon slegte mense nie verdra nie, maar het die liefde laat vaar; Tiatira het oorgeloop van liefde, geloof, diens en volharding – maar: “jy laat die vrou Isebel begaan”. Watter een van die twee is die groter gevaar vir jou, en vir ons gemeente?"
    ref: "2:19-2:25"
  - q: "Kyk na die beloftes: die boom van die lewe (Genesis 2–3), die kroon van die lewe, die verborge manna en die wit klippie, gesag saam met die Messias (Psalm 2:8–9) en die môrester (vgl. 22:16). Watter belofte spreek jou die meeste aan, en waarom? Hoe sou “oorwin” hierdie week vir jou lyk?"
    ref: "2:7-2:28"
application:
  - "Lees hierdie week elke dag weer die brief van “jou” gemeente en skryf een sin neer: wat sou die opgestane Christus in hierdie brief vir my sê?"
  - "Noem een klein kompromie – een “knippie wierook” – wat jy tot nou toe “nie so erg nie” genoem het, en neem een konkrete tree daarvan weg; of neem weer een “eerste werk” van eenvoudige liefde vir Jesus op."
prayer: "Bid om die beurt vir die vier gemeentes: vir die eerste liefde (Efese), vir moed onder druk (Smirna), vir onverdeelde lojaliteit (Pergamum), vir onderskeidingsvermoë met liefde (Tiatira). Laat elkeen wat verslag gedoen het, vir “sy” of “haar” gemeente bid en dan vir ons eie gemeente in dieselfde saak. Sluit af met 2:25: “Hou net vas aan wat julle het totdat Ek kom.”"
leader_notes:
  - "Hierdie byeenkoms dek vier oordenkings (dag 3–6) en 'n lang hoofstuk. Laat elkeen wat verslag doen, sy of haar stad in twee minute uit die oordenking voorstel (Efese: Artemis en die keisertempel; Smirna: Roma, die keiserkultus en mirre; Pergamum: die altaar van Zeus, Asklepios en die goewerneur se swaardreg; Tiatira: die gildes en hul afgodsmaaltye). As die tyd min is, kies vrae 1, 2, 4 en 6."
  - "Party lees die sewe gemeentes as sewe opeenvolgende tydperke van die kerkgeskiedenis. Noem dit regverdig; wys dan daarop dat die teks hulle as werklike gemeentes in Johannes se tyd voorstel, en dat elke brief eindig met “wat die Gees aan die gemeentes sê” – elke gemeente in elke tyd hoor al sewe."
  - "Met sorg: “sinagoge van die Satan” (2:9) is nie 'n uitspraak oor Jode in die algemeen nie. Die oordenking lees dit as 'n plaaslike konflik waarin sommige die Christene waarskynlik by die owerhede aangekla het; Christus se punt is dat ware behoort aan God in die geloof lê. Moenie toelaat dat die vers teen Jode gebruik word nie."
  - "Met sorg: “Isebel” is Christus se naam vir een leraar wat mense tot afgodediens en ontug verlei het. Dit is nie 'n etiket vir vroue nie, en vir niemand in ons gemeente nie. Die briewe roep ons tot getrouheid – “aan wie behoort ek?” – nie om oor ander te oordeel nie."
  - "“Ek sal jou lampstaander van sy plek af wegskuif” (2:5) gaan nie daaroor dat 'n individu sy redding verloor nie, maar dat 'n gemeente sy plek as ligdraer verloor. Die oordenking beskryf die Nikolaïete as 'n groep wat kompromieë met afgodediens toegelaat het (vgl. 2:14–15); ons weet nie veel meer van hulle nie."
  - "Vooruitskouing: volgende week hoofstuk 3 – Sardis, Filadelfia en Laodisea. Vra drie mense om elkeen 'n gemeente vir volgende keer te neem."
timing:
