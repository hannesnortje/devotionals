session: 7
lang: af
title: "Soet en bitter"
ref: "10:1-11:19"
days: [16, 17]
big_idea: "God se antwoord op 'n wêreld wat nie wil omdraai nie, is sy woord in die mond van sy getuies: die kerk eet die woord, soet en bitter, word deur God gemeet en bewaar, getuig in sakgoed, deel in die dood en opstanding van sy Here – en die koninkryk van die wêreld het reeds ons Here s'n en sy Christus s'n geword."
opening: "Dink aan 'n kos wat jy as kind gehaat het en nou baie lekker vind (of andersom). Wat het verander?"
context: >-
  Ná die sesde trompet verwag ons dadelik die sewende. Maar soos tussen die sesde en die sewende seël hou die verhaal stil. In hoofstuk 7 is God se volk verseël; in hoofstuk 10 en 11 word hulle gestuur.
  Johannes eet 'n klein boekrolletjie, soet in die mond en bitter in die maag, en moet weer profeteer; dan meet hy die tempel en sien twee getuies wat profeteer, doodgemaak word en weer opstaan.
  Vir die gemeentes in Asië, wat in die stede van Rome gewoon het, was dit hulle roeping: nie om te onttrek nie, maar om te getuig.
read_aloud_tip: "Hoofstuk 10: een persoon lees die verhaal, 'n tweede die stem uit die hemel en die engel (10:4, 8, 9, 11). Hoofstuk 11: een persoon lees; by 11:12 sê die hele groep “Kom hier op!”; die liedere van 11:15 en 11:17–18 lees almal saam."
hebrew:
  - word: "chronos ouketi estai"
    hebrew: "χρόνος οὐκέτι ἔσται"
    gloss: "geen uitstel meer"
    point: "*Chronos* beteken gewoonlik “tyd”, en ouer vertalings het dit gelees asof die tyd self sou ophou. Maar die eed eggo Daniël 12:7 en antwoord op die “Hoe lank?” van 6:10: God sal nie langer wag nie (10:6)."
  - word: "kataphage"
    hebrew: "κατάφαγε"
    gloss: "eet dit op"
    point: "*Kataphagein* is nie proe nie, maar heeltemal opeet (10:9). Die woord moet in die profeet ingaan voordat dit uit hom kan uitkom – soos by Esegiël, vir wie die boekrol soet soos heuning was en daarna bitter (Esegiël 2:8–3:3, 14)."
  - word: "martysin"
    hebrew: "μάρτυσίν"
    gloss: "getuies"
    point: "Ons vertaal “getuie”, nie “martelaar” nie (11:3). Maar hierdie hoofstuk wys hoe die twee woorde in die vroeë kerk saamgegroei het: wie getrou getuig, betaal soms die prys – soos Antipas (2:13), en soos Jesus self, die getroue getuie (1:5)."
discussion:
  - q: "Gehul in 'n wolk, met die reënboog oor sy kop, sit die engel een voet op die see en een op die aarde en sweer by Hom “wat die hemel geskep het en wat daarin is, en die aarde en wat daarop is, en die see en wat daarin is”. Wat sê hierdie beelde oor aan wie hierdie wêreld behoort?"
    ref: "10:1-10:6"
  - q: "Johannes hoor: “Verseël wat die sewe donders gepraat het, en moenie dit opskryf nie!” Wat sê dit vir mense wat Openbaring as 'n raaisel vir datums en spekulasie gebruik? Watter vrae oor die toekoms maak jou onrustig – en kan jy dit by God laat?"
    ref: "10:4"
  - q: "Vir die siele onder die altaar is gesê dat hulle “nog 'n kort tydjie moet rus” (6:11). Nou sweer die engel “dat daar geen uitstel meer sal wees nie”. Lees Habakuk 2:3. Waar wag jy al lank op God, en wat sê hierdie eed vir jou?"
    ref: "10:5-10:7"
  - q: "Lees Esegiël 3:1–3 en 3:14 langs Openbaring 10:9–10: “Neem en eet dit op; dit sal jou maag bitter maak, maar in jou mond sal dit soet wees soos heuning.” Lees jy die Bybel eerder soos iemand wat proe, of soos iemand wat eet? Watter deel van God se woord is op die oomblik vir jou soet, en watter deel bitter?"
    ref: "10:8-10:11"
  - q: "Johannes meet “die tempel van God en die altaar en dié wat daarin aanbid”, maar die voorhof word twee-en-veertig maande lank vertrap. In die Nuwe Testament is die kerk God se tempel (1 Korintiërs 3:16). Voel jy soms soos die voorhof wat vertrap word? Wat beteken dit vir jou dat God die binnekant gemeet het?"
    ref: "11:1-11:2"
  - q: "“Dit is die twee olyfbome en die twee lampstaanders” – en die lampstaanders is die gemeentes (1:20). Hulle tekens is dié van Elia en Moses, en hulle staan nie deur mag of krag nie, maar deur God se Gees (Sagaria 4:6). Waar is jy in die versoeking om stil te bly omdat jou getuienis jou ongewild sou maak?"
    ref: "11:3-11:10"
  - q: "Die getuies word doodgemaak en opgewek, en – anders as ná die plae (9:20–21) – gee die res aan die God van die hemel eer – deur die getuienis. Die sewende trompet sing: “Die koninkryk van die wêreld het ons Here s'n en sy Christus s'n geword”. Waar sou dit vandag 'n verskil maak as jy dit regtig geglo het?"
    ref: "11:11-11:19"
application:
  - "Kies een kort gedeelte – byvoorbeeld Openbaring 10:8–11 – en lees dit drie dae lank elke dag stadig en hardop. “Kou” daaraan. Deel dan een sin daaruit met iemand wat dit nodig het."
  - "Dink aan een persoon rondom jou wat Christus nog nie ken nie. Bid hierdie week elke dag by name vir hom of haar, en vra God vir een geleentheid om iets van jou hoop te deel – sag, nie bang nie."
prayer: "Lees 11:15 saam hardop. Bid dan twee-twee: dank God dat die koninkryk van die wêreld aan Hom en aan sy Christus behoort; vra Hom vir honger na sy woord en vir moed wanneer getuienis iets kos; bid by name vir die persoon aan wie elkeen gedink het. Sluit saam af met Sagaria 4:6: nie deur mag of krag nie, maar deur u Gees."
leader_notes:
  - "Twee oordenkings (dag 16–17). Hoofstuk 11 is een van die moeilikstes in die boek; moenie dat die groep verdwaal in die vraag wie die twee getuies is nie. Ons lesing: hulle is die getuiende kerk (die lampstaanders, 1:20), geteken met die trekke van Moses en Elia, en twee omdat die wet twee getuies vereis (Deuteronomium 19:15)."
  - "Ander lesings: futuristiese uitleggers verstaan die twee-en-veertig maande as letterlik drie en 'n half jaar aan die einde van die geskiedenis, met twee individuele profete – volgens sommige Moses en Elia self. Noem dit regverdig in een sin. In hierdie reeks is die twee-en-veertig maande / 1 260 dae Daniël se “'n tyd en tye en 'n halwe tyd” (Daniël 7:25; 12:7): die afgemete, begrensde tyd van die kerk se getuienis tussen Christus se eerste en tweede koms. Moenie uitreken nie."
  - "Sommige ken die ouer weergawe van 10:6 (“dat daar geen tyd meer sal wees nie”). Die samehang gaan oor God se wag, nie oor die einde van die kalender nie."
  - "Die engel in 10:1 dra trekke van Christus (1:16); sommige meen hy is Christus self, maar Johannes noem hom 'n engel. Moenie lank daarby stilstaan nie."
  - "Hanteer versigtig: sommige in die groep dra die pyn van getuienis wat tevergeefs lyk – 'n gemeente wat krimp, 'n kind ver van God, die enigste wat by die werk eerlik bly. Moenie sukses belowe nie; die hoofstuk belowe regverdiging (“Kom hier op!”), nie gewildheid nie."
  - "Vooruitskouing: volgende week vertel hoofstuk 12 die Kersverhaal van agter die skerms – en die aanklaer word neergewerp."
