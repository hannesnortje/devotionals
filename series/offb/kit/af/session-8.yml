session: 8
lang: af
title: "Aan wie behoort jy?"
ref: "12:1-13:18"
days: [18, 19]
big_idea: "Agter die skerms is die draak reeds deur die bloed van die Lam neergewerp; in sy woede werk hy deur diere wat die Lam namaak en aanbidding eis – maar God se volk, verseël nog voordat die dier verskyn het, oorwin deur die bloed van die Lam, die woord van hulle getuienis en volharding, want die vraag is nie “wanneer?” nie, maar “aan wie behoort jy?”."
opening: "Is jy al ooit deur 'n namaaksel geflous – 'n vervalste produk, 'n vervalste handtekening, 'n bedrogboodskap? Hoe het jy dit agtergekom?"
context: >-
  Die sewende trompet het geblaas: die koninkryk van die wêreld het ons Here s'n geword. Nou trek Johannes die gordyn verder oop en wys hoe dit gebeur het.
  Hoofstuk 12 vertel die Kersverhaal van agter die skerms: 'n vrou, 'n kind, 'n draak – en die aanklaer word neergewerp. In hoofstuk 13 roep die draak twee diere op, uit die see en uit die aarde.
  Vir die gemeentes in Asië het die dier 'n gesig gehad: Rome, die keiserkultus en die gildes, waar jy nie kon koop of verkoop sonder om wierook vir die keiser te offer nie.
read_aloud_tip: "Drie lesers: een lees die verhaal, 'n tweede die harde stem in die hemel (12:10–12, stadig gelees soos 'n oorwinningslied), en 'n derde die skare en die tweede dier (13:4, 14). Hou kort stil tussen die twee hoofstukke."
hebrew:
  - word: "ho katēgōr"
    hebrew: "ὁ κατήγωρ"
    gloss: "die aanklaer"
    point: "'n Woord uit die hofsaal (12:10) – presies wat die Hebreeuse *hassatan* in Job 1–2 en Sagaria 3 beteken: die teëstander, die aanklaer in God se hemelse raad. Hy kla hulle “dag en nag voor ons God” aan – maar nou is hy neergewerp."
  - word: "hōs esphagmenēn"
    hebrew: "ὡς ἐσφαγμένην"
    gloss: "soos geslag"
    point: "Dieselfde uitdrukking as vir die Lam in 5:6 (*hōs esphagmenon*). Johannes wil hê ons moet die ooreenkoms raaksien – en die verskil (13:3). Die Lam se wonde is vir ander; die dier se genesing is vir homself. Die bose skep niks nuuts nie. Dit boots na."
  - word: "charagma"
    hebrew: "χάραγμα"
    gloss: "merk"
    point: "'n Stempel of afdruk – ook die keiser se stempel op munte en dokumente (13:16–17). Elke muntstuk in die hand van 'n handelaar in Tiatira het die beeld en titels van die keiser gedra. Die merk is “die naam van die dier of die getal van sy naam”: dit sê aan wie jy behoort."
discussion:
  - q: "Lees Genesis 3:15 en 37:9: wat sê dit oor die vrou, die kind en die draak? Die kind is een “wat al die nasies soos 'n herder met 'n ysterstaf sal oppas” (Psalm 2:9), en hy word “na God en na sy troon weggeruk” – die hele lewe van Jesus in een sin. Wat is anders wanneer ons Betlehem van agter die skerms sien?"
    ref: "12:1-12:6"
  - q: "Lees Sagaria 3:1–5 en Job 1:9–11: die aanklaer kon nog voor God verskyn. Nou: “die aanklaer van ons broers en susters is neergewerp”. Watter beskuldiging hoor jy die meeste in jou gedagtes? Wat is die verskil tussen die oortuiging van die Gees, wat na die kruis lei, en die stem van die aanklaer, wat in wanhoop eindig?"
    ref: "12:7-12:10"
  - q: "Hulle het oorwin “deur die bloed van die Lam en deur die woord van hulle getuienis”, en “hulle het hulle lewe nie liefgehad nie, selfs tot die dood toe”. Probeer jy die aanklaer stilmaak met jou eie goeie werke, of skuil jy by die bloed van die Lam? Wat sou dit vir jou beteken om die woord van jou getuienis uit te spreek?"
    ref: "12:11-12:12"
  - q: "Aan die vrou word “die twee vlerke van die groot arend gegee”, en sy word in die woestyn gevoed (vgl. Eksodus 19:4). Die kerk is op sy uittog deur hierdie tyd – nie uit die skepping uit nie, maar uit die mag van die draak. Waar is jy op die oomblik in die woestyn, en waar kan jy sien dat God jou daar voed?"
    ref: "12:13-12:18"
  - q: "Lees Daniël 7:2–8 en 17: Johannes se dier is luiperd, beer en leeu in een liggaam. Die skare roep: “Wie is soos die dier, en wie kan teen hom oorlog voer?” – 'n namaaksel van Israel se lied (Eksodus 15:11). Hoe het die dier vir die gemeentes in Asië gelyk? Watter magte eis vandag mense se hele hart op?"
    ref: "13:1-13:8"
  - q: "Een van sy koppe “was soos geslag tot die dood toe”, en die tweede dier het “twee horings gehad soos 'n lam, en hy het gepraat soos 'n draak”. Waarom is die oortuigende namaaksel vir die kerk gevaarliker as die openlike vyand? Waar trek iets jou aan wat soos 'n lam lyk, maar soos 'n draak praat?"
    ref: "13:3-13:15"
  - q: "Die merk word gegee “op hulle regterhand of op hulle voorkop”, en sonder dit kan niemand koop of verkoop nie. Vergelyk God se seël (7:3) en die Shema (Deuteronomium 6:8): wat jy dink en wat jy doen. Niemand is ongemerk nie. As iemand jou week dopgehou het: aan wie behoort jou hand en jou voorkop?"
    ref: "13:16-13:18"
application:
  - "Skryf een beskuldiging neer wat jy telkens weer in jou kop hoor. Skryf langsaan: “want die aanklaer van ons broers en susters is neergewerp” (12:10). Lees dit hardop wanneer die stem terugkom."
  - "Kies een “hand”-keuse (iets wat jy doen) en een “voorkop”-patroon (iets wat jy dink) waar die dier aan jou trek. Bid hierdie week elke dag daaroor met die woorde: Ek behoort aan die Lam."
prayer: "Lees 12:10–11 saam hardop. Laat dan elkeen God in een sin dank dat hulle aan die Lam behoort, en – wie wil – een plek noem waar hulle die druk voel om saam te speel om te kan “koop of verkoop”. Sluit af met die belydenis uit die oordenking: Wie is 'n God soos U? (Miga 7:18), en dank Hom dat ons name geskryf is “in die boek van die lewe van die geslagte Lam” (13:8)."
leader_notes:
  - "Twee oordenkings (dag 18–19). Albei hoofstukke is vol beelde; spandeer die meeste tyd by 12:10–11 (die aanklaer is neergewerp) en 13:16–17 (die merk). Hulle dra die pastorale gewig."
  - "666: noem kortliks die twee hooflesings – die woorde “Keiser Nero” tel in Hebreeuse letters op tot 666 (en in 'n Latynse spelling tot 616, die getal in 'n paar ou manuskripte), of 'n “mensgetal”: ses wat drie keer kort skiet van sewe, die getal van volheid. Johannes roep op tot die wysheid van onderskeiding, nie dié van kodebrekers nie. Moenie die getal op hedendaagse persone toepas nie, en moenie die groep oor skyfies, strepieskodes of datums laat spekuleer nie."
  - "Die merk gaan oor behoort, nie oor vrees nie. Sommige het dalk grootgeword met angswekkende leer oor die merk; stel hulle gerus: God se seël was eerste (7:3), en die merk van die dier is nie iets wat jy per ongeluk kry nie – dit groei deur duisend klein keuses van die hand en die voorkop."
  - "Ander lesings: futuriste verwag 'n toekomstige enkele heerser en 'n letterlike merk aan die einde van die geskiedenis; preteriste sien die hoofstuk in Rome in die eerste eeu vervul. Ons reeks: Rome in Johannes se tyd, en elke mag in elke tyd wat aanbidding eis. Noem die sienings regverdig in een sin en keer terug na die vraag “aan wie behoort jy?”."
  - "“Binne of buite” is 'n oproep tot getrouheid, nie “ons teen hulle” nie. Moenie dat die groep politieke partye of leiers as die dier benoem nie; die vraag word eerste op onsself gerig – ook Laodisea se louwarm middeweg (3:15–16) is geen neutrale grond nie."
  - "Vooruitskouing: volgende week hoofstuk 14 – die Lam op die berg Sion saam met dié wat sy naam en die naam van sy Vader op hulle voorkoppe het."
