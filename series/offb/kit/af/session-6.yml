session: 6
lang: af
title: "Die hemel luister"
ref: "8:1-9:21"
days: [14, 15]
big_idea: "Die hemel word stil om die gebede van die heiliges te hoor, en daardie gebede kom as God se optrede na die aarde terug; die trompette is, soos die plae in Egipte, begrensde waarskuwings wat die wêreld tot bekering roep – maar oordeel alleen verander nie die hart nie, en wat die plae nie kan doen nie, doen die Lam deur sy getuies."
opening: "Waar vind jy in jou week regte stilte – en geniet jy dit, of maak dit jou onrustig?"
context: >-
  Die hemel was vol liedere: engele, ouderlinge, lewende wesens en 'n menigte wat niemand kan tel nie. Nou maak die Lam die sewende seël oop – en dit word stil.
  'n Engel bring reukwerk saam met die gebede van al die heiliges, gooi vuur van die altaar op die aarde, en sewe trompette klink (hoofstuk 8–9).
  Die beelde kom uit die uittog uit Egipte: hael, bloed, duisternis en sprinkane. Vir die klein gemeentes in Asië onder die mag van Rome het dit beteken: God tree steeds op teen elke ryk wat soos Egipte optree.
read_aloud_tip: "Hou ná 8:1 'n halwe minuut stilte voordat julle verder lees. Dan lees een persoon die verhaal, en ses lesers neem elkeen een trompet (8:7, 8, 10, 12; 9:1, 13); 'n laaste leser lees die uitroep van die arend (8:13) en 9:20–21."
hebrew:
  - word: "sigē"
    hebrew: "σιγὴ"
    gloss: "stilte"
    point: "'n Gewone woord vir swye (8:1). Dit is nie 'n leë stilte nie, maar die stilte van 'n hof voordat die regter praat – en van 'n Vader wat luister. Die profete het dit geken as die stilte voordat God optree (Habakuk 2:20; Sefanja 1:7)."
  - word: "to triton"
    hebrew: "τὸ τρίτον"
    gloss: "'n derde"
    point: "Twaalf keer in ses verse (8:7–12). Die seëls het 'n kwart getref (6:8), die trompette 'n derde; die bakke later alles. Die oordele is begrens. Dit is waarskuwings, nog nie die einde nie."
  - word: "ou metenoēsan"
    hebrew: "οὐ μετενόησαν"
    gloss: "hulle het hulle nie bekeer"
    point: "*Metanoeō* is 'n omkeer van denke en lewe (9:20–21). Dit is dieselfde werkwoord wat Jesus vyf keer vir die gemeentes gebruik het (2:5, 16, 21; 3:3, 19): die oproep tot bekering is eers aan die kerk gerig, dan aan die wêreld."
discussion:
  - q: "“Was daar 'n stilte in die hemel, omtrent 'n halfuur lank.” Lees Habakuk 2:20 en Sefanja 1:7. Watter soort stilte is dit? Wanneer het jy laas regtig stil geword voor God, sonder om te praat?"
    ref: "8:1"
  - q: "Die engel staan by die goue reukwerkaltaar reg voor die voorhangsel (Eksodus 30:1–8; Lukas 1:9–10), en die reukwerk styg “saam met die gebede van die heiliges” voor God op. Wat sê hierdie beeld vir klein gemeentes wie se gebede niemand in Rome gehoor het nie – en vir jou, as jy 'n gebed opgegee het?"
    ref: "8:3-8:4"
  - q: "Die engel vul die wierookvat “met die vuur van die altaar” en gooi dit op die aarde – van dieselfde altaar waaronder die siele “Hoe lank?” geroep het (6:9–10). Dan begin die trompette. Glo jy dat jou gebede deel is van hoe God in die wêreld optree? Hoe sou dit jou voorbidding verander?"
    ref: "8:5-8:6"
  - q: "Vergelyk die eerste, tweede en vierde trompet met die plae in Egipte (Eksodus 9:23–25; 7:20–21; 10:21–23). Wat sê die uittog vir ons oor die doel van die trompette – vir Rome, en vir elke mag wat God se volk onderdruk? Waarop mik God: die vernietiging van die skepping, of die bevryding van sy volk?"
    ref: "8:7-8:12"
  - q: "Die sprinkane mag skade aandoen aan “net die mense wat nie die seël van God op hulle voorkoppe het nie”. Die sleutel, die gesag en die vyf maande – alles word gegee. Hulle koning Apollion (“Verderwer”) is dalk 'n steek na Apollo. Watter troos het dit die gemeentes gegee? Waar moet jy hoor dat die bose aan 'n leiband is?"
    ref: "9:1-9:11"
  - q: "“En die res van die mense … het hulle selfs nie bekeer van die werke van hulle hande nie”; soos Farao klou hulle aan afgode vas, “wat nie kan sien of hoor of loop nie” (Psalm 115:4–8). Watter krisis het jou na God gedraai – en watter een jou eerder harder gemaak? Watter “werke van jou hande” vertrou jy meer as God?"
    ref: "9:20-9:21"
  - q: "In Israel was die trompet die alarm van die wagter (Esegiël 33:3–6) – 'n God wat waarsku, het die wêreld nog nie opgegee nie. Hoe reageer jy op nuus van rampe – met vrees, met spekulasie, of met gebed en bekering? Hoor jy die oproep tot bekering as 'n dreigement of as 'n uitnodiging?"
    ref: "8:13"
application:
  - "Sit hierdie week elke dag vyf minute in stilte voordat jy bid. Skryf dan een onreg neer waarvoor jy al lank bid, en bring dit weer voor God – met die wete dat die hemel luister."
  - "Neem tien minute en vra jouself eerlik: watter “werk van my hande” het my hart gevange geneem? Noem dit voor God, en gee een klein treetjie daarvandaan weg – en na Hom toe."
prayer: "Begin met 'n volle minuut stilte saam – geen woorde nie, net onthou wie op die troon sit. Laat dan elkeen een sin bid vir 'n situasie waarvoor hulle al lank bid, of vir vervolgde gelowiges. Sluit af met Jesus se woorde aan die gemeentes (3:20), en dank Hom dat Hy altyd lewe om vir ons in te tree (Hebreërs 7:25)."
leader_notes:
  - "Twee digte hoofstukke (dag 14–15). Moenie probeer om elke detail van die sprinkane of die perde te verklaar nie; die hoofstukke werk deur oorweldigende beelde. Hou die groep by drie dinge: die gebede styg op, die oordele is begrens, en die mense bekeer hulle nie."
  - "Vermy dit om die trompette aan vandag se rampe te koppel (of te raai watter trompet nou net geblaas het). Sommige uitleggers meen dat die eerste lesers by die brandende berg dalk aan die Vesuvius (79 n.C.) gedink het; futuristiese uitleggers verwag letterlike plae in 'n toekomstige tydperk voor Christus se wederkoms. Noem dit regverdig as daarna gevra word, en keer dan terug na die oproep tot gebed en bekering."
  - "Die sprinkane en die tweehonderd miljoen ruiters nooi uit om te ontsyfer (helikopters, moderne leërs). Wys vriendelik daarop dat Johannes self sê dat hy die getal gehoor het (9:16): 'n leër te groot om te begryp, geskilder met Joël 2 en die rook van Sodom (Genesis 19:24, 28), nie 'n kode nie."
  - "Sommige Bybels lees in 8:13 'n engel in plaas van 'n arend; ouer vertalings volg later handskrifte. Ons vertaling volg die Griekse teks van die SBLGNT. As iemand dit raaksien, verduidelik kortliks en gaan aan."
  - "Hanteer versigtig: sommige het dalk jare lank gebid sonder om 'n antwoord te sien – vir 'n kind, 'n siekte, 'n onreg. Die punt van 8:3–5 is nie dat gebed soos 'n hefboom werk nie, maar dat geen gebed verlore gaan nie. Moenie uitkomste belowe nie."
  - "Vooruitskouing: volgende week die pouse tussen die sesde en die sewende trompet – die klein boekrolletjie en die twee getuies: God se antwoord op 'n wêreld wat nie wil omdraai nie, is sy woord in die mond van sy getuies."
