session: 4
lang: af
title: "Wie is waardig?"
ref: "4:1-5:14"
days: [10, 11]
big_idea: "Agter die sigbare mag van Rome word die troon in die hemel aan Johannes gewys, waar die Skepper aanbid word, en in die middel van die troon 'n Lam wat staan, soos een wat geslag is: God regeer die geskiedenis, en sy mag lyk soos die kruis."
opening: "Het jy al ooit gehoor hoe iemand beskryf word voordat jy hom of haar ontmoet het – en was jy toe heeltemal verras toe jy die persoon sien? Wat het jy verwag?"
context: >-
  In die stede van die sewe gemeentes was Rome se troon oral sigbaar: tempels vir die keiser, sy beeld op munte en op die markpleine; Pergamum was die plek “waar die troon van die Satan is” (2:13).
  Ná die sewe briewe gaan 'n deur in die hemel oop, en die gordyn word oopgetrek: hoofstuk 4 wys die troon waar die Skepper aanbid word, hoofstuk 5 die verseëlde boekrol en die Lam wat alleen waardig is om dit oop te maak.
  Alles wat verder in die boek volg – seëls, trompette, bakke – kom uit hierdie vertrek.
read_aloud_tip: "Een persoon lees as verteller Johannes se woorde; ander lees die liedere: die vier lewende wesens (4:8), die ouderlinge (4:11 en 5:9–10), die engele (5:12). Die lied van elke skepsel (5:13) lees die hele groep saam, en antwoord saam met die lewende wesens: “Amen.”"
hebrew:
  - word: "axios ei"
    hebrew: "Ἄξιος εἶ"
    gloss: "U is waardig"
    point: "Volgens Suetonius wou keiser Domitianus as “ons heer en god” aangespreek word. In die lied van die ouderlinge – “U is waardig, ons Here en God” (4:11) – hoor baie 'n stil, moedige teenstem. In 5:9 word dieselfde woorde vir die Lam gesing: Hy ontvang die aanbidding wat aan God toekom."
  - word: "arnion"
    hebrew: "ἀρνίον"
    gloss: "Lam"
    point: "Op een uitsondering na (die dier van 13:11) gebruik Johannes hierdie woord net vir Christus – 29 keer. Daaragter staan die paaslam van Eksodus 12 en die Kneg wat soos 'n lam na die slagplek gelei word (Jesaja 53:7). Die Lam staan “soos een wat geslag is” (hōs esphagmenon): lewend, maar Hy dra steeds die wonde (5:6)."
  - word: "ēgorasas"
    hebrew: "ἠγόρασας"
    gloss: "U het gekoop"
    point: "'n Woord van die mark, wat ook die koop van slawe kon beskryf (5:9). Met sy bloed het die Lam vir God mense uit elke nasie gekoop en hulle 'n koninkryk en priesters gemaak – wat God by Sinai aan Israel belowe het (Eksodus 19:6)."
discussion:
  - q: "Ná Christus wat in Laodisea aan 'n toe deur klop, staan daar nou: “'n deur was oop in die hemel”, en Johannes hoor: “Kom hier op”. Wat sou dit vir gelowiges in stede vol keisertempels beteken het om eers die troon te sien – voor seëls en plae? Begin jou dag gewoonlik met die nuus of met die troon?"
    ref: "4:1-4:2"
  - q: "Johannes staan in 'n lang ry. Lees Jesaja 6:1–3, Esegiël 1:26–28 en Job 1:6–12 (of 1 Konings 22:19). Wat het hierdie tonele agter die skerms gemeen? Wat sê hulle oor wie werklik besluit wat op die aarde gebeur – en oor die aanklaer, wat niks sonder God se toestemming kan doen nie?"
    ref: "4:2-4:8"
  - q: "Die ouderlinge sing “U is waardig, ons Here en God” – presies die titel wat Domitianus vir homself opgeëis het – en die rede is die skepping: “want U het alles geskep”. Wat noem jy in jou besluite oor tyd, geld en aandag eintlik “waardig”?"
    ref: "4:9-4:11"
  - q: "Die ouderlinge gooi hulle krone voor die troon neer. Watter “kroon” hou jy styf vas – 'n titel, 'n prestasie, jou reputasie, selfs jou eie getrouheid? Watter vryheid kan daarin lê om dit neer te lê?"
    ref: "4:10"
  - q: "Johannes huil, omdat niemand waardig gevind word om die boekrol oop te maak nie. Dit is die trane van elke gelowige wat wonder of lyding enige betekenis het. Watter “boekrol” in jou lewe lyk toe en verseël? En wat beteken dit dat die goue bakke vol reukwerk die gebede van die heiliges is?"
    ref: "5:1-5:8"
  - q: "Johannes hoor “die Leeu uit die stam van Juda, die Wortel van Dawid, het oorwin” – en sien 'n Lam staan, “soos een wat geslag is”. Wat het mense van die Leeu verwag? Wat beteken dit dat die sien die hoor uitlê – dat God se mag soos die kruis lyk? Waar verlang jy eerder na 'n Leeu as na die Lam?"
    ref: "5:5-5:7"
  - q: "“en het met u bloed vir God mense gekoop uit elke stam en taal en volk en nasie” – en “hulle regeer op die aarde”, in die teenwoordige tyd. Hoe regeer die volk van die Lam: soos hulle Koning, deur getuienis en selfgewende liefde? Hoe sou dit hierdie week lyk in een konflik of frustrasie van jou?"
    ref: "5:9-5:14"
application:
  - "Lees hierdie week elke oggend, voordat jy jou foon oopsluit, 4:8–11 hardop. Noem dan een “troon” wat jou op die oomblik bang maak, en lê dit doelbewus neer voor die troon waarop Hy sit."
  - "Kies een plek waar jy graag sou wou “brul” – 'n konflik, 'n onreg, 'n frustrasie – en vra: hoe sou die Lam hier oorwin? Neem dan een klein tree van selfgewende liefde in daardie rigting."
prayer: "Begin met aanbidding, nie met versoeke nie: lees die liedere van 4:8, 4:11 en 5:12 saam hardop (of sing 'n lied wat daarop gegrond is). Laat elkeen dan een “verseëlde boekrol” noem en dit in die hande van die Lam lê, in die vertroue dat ons gebede voor die troon bewaar word. Sluit af deur 5:13 saam te lees en “Amen” te antwoord."
leader_notes:
  - "Hierdie byeenkoms dek twee oordenkings (dag 10–11) en twee hoofstukke. Die hart van die aand is 5:5–6 (vraag 6): Johannes hoor “Leeu” en sien 'n Lam. Hou tyd daarvoor oor; dit is die sleutel tot alles wat in die reeks volg."
  - "Party (veral dispensasionalistiese lesings) verstaan “Kom hier op” (4:1) as 'n beeld van die wegraping van die kerk voor die gebeure van hoofstuk 6–19, onder meer omdat die woord “gemeente” eers weer in 22:16 voorkom. Noem dit regverdig. Die oordenking lees dit as 'n roeping aan Johannes, soos aan die profete voor hom, om die huidige werklikheid agter die skerms te sien. Hou die fokus op die troon en die Lam."
  - "Die vier-en-twintig ouderlinge is waarskynlik die hele volk van God – twaalf stamme en twaalf apostels (vgl. 21:12–14) – hoewel ander aan engelagtige wesens dink. Die vier lewende wesens herinner aan Esegiël se gerubs en Jesaja se serafs en verteenwoordig waarskynlik die hele lewende skepping. Noem dit kortliks; moenie lank daarby stilstaan nie."
  - "Die boekrol staan waarskynlik vir God se plan met die geskiedenis – sy oordeel oor die kwaad en die koms van sy koninkryk. Moenie die seëls nou al probeer ontsyfer nie; dit kom in die volgende byeenkoms (hoofstuk 6–7)."
  - "Met sorg: “die Lam oorwin deur selfgewende liefde” mag nie gehoor word as “verdra mishandeling” nie. Die weg van die Lam is getroue getuienis en weier om terug te slaan – nie stilbly in gevaar of die weerloses onbeskermd laat nie. As iemand in die groep in 'n skadelike situasie is, praat daarna met hom of haar."
  - "Beplan die gebedstyd as aanbidding. Openbaring 4–5 is vol liedere; as julle groep sing, kies 'n lied wat op hierdie hoofstukke gegrond is."
