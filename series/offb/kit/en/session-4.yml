session: 4
lang: en
title: "Who Is Worthy?"
ref: "4:1-5:14"
days: [10, 11]
big_idea: "Behind the visible power of Rome John is shown the throne in heaven, where the Creator is worshipped, and in the middle of the throne a Lamb standing, as though slaughtered: God rules history, and his power looks like the cross."
opening: "Have you ever heard someone described before you met them – and then been completely surprised when you saw them? What had you expected?"
context: >-
  In the cities of the seven churches Rome's throne was visible everywhere: temples for the emperor, his image on coins and in the market squares; Pergamum was the place “where the throne of Satan is” (2:13).
  After the seven letters a door opens in heaven, and the curtain is drawn back: chapter 4 shows the throne where the Creator is worshipped, chapter 5 the sealed scroll and the Lamb who alone is worthy to open it.
  Everything that follows in the book – seals, trumpets, bowls – comes from this room.
read_aloud_tip: "One narrator reads John's words; others read the songs: the four living creatures (4:8), the elders (4:11 and 5:9–10), the angels (5:12). The whole group reads the song of every creature together (5:13) and answers with the living creatures: “Amen.”"
hebrew:
  - word: "axios ei"
    hebrew: "Ἄξιος εἶ"
    gloss: "worthy are you"
    point: "According to Suetonius, the emperor Domitian wished to be addressed as “our lord and god”. In the elders' song – “Worthy are you, our Lord and God” (4:11) – many hear a quiet, courageous counter-voice. In 5:9 the same words are sung to the Lamb: he receives the worship that belongs to God."
  - word: "arnion"
    hebrew: "ἀρνίον"
    gloss: "Lamb"
    point: "With one exception (the beast of 13:11) John uses this word only for Christ – 29 times. Behind it stand the Passover lamb of Exodus 12 and the Servant led like a lamb to the slaughter (Isaiah 53:7). The Lamb is standing “as though slaughtered” (hōs esphagmenon): alive, but still bearing the wounds (5:6)."
  - word: "ēgorasas"
    hebrew: "ἠγόρασας"
    gloss: "you purchased"
    point: "A word of the market, which could also describe buying slaves (5:9). By his blood the Lamb has bought people for God from every nation and made them a kingdom and priests – what God promised Israel at Sinai (Exodus 19:6)."
discussion:
  - q: "After Christ knocking at a closed door in Laodicea, now “a door stood open in heaven”, and John hears “Come up here”. What would it mean for believers in cities full of emperor temples to be shown the throne first – before any seals or plagues? Does your day usually begin with the news or with the throne?"
    ref: "4:1-4:2"
  - q: "John stands in a long line. Read Isaiah 6:1–3, Ezekiel 1:26–28 and Job 1:6–12 (or 1 Kings 22:19). What do these scenes behind the curtain have in common? What do they say about who really decides what happens on earth – and about the accuser, who can do nothing without God's permission?"
    ref: "4:2-4:8"
  - q: "The elders sing “Worthy are you, our Lord and God” – the very title Domitian claimed – and the reason is creation: “for you created all things”. In your decisions about time, money and attention, what do you actually call “worthy”?"
    ref: "4:9-4:11"
  - q: "The elders cast their crowns before the throne. What “crown” are you holding tightly – a title, an achievement, your reputation, even your own faithfulness? What freedom might there be in laying it down?"
    ref: "4:10"
  - q: "John weeps, because no one is found worthy to open the scroll. These are the tears of every believer who wonders whether suffering has any meaning. Which “scroll” in your life seems closed and sealed? And what does it mean that the golden bowls of incense “are the prayers of the saints”?"
    ref: "5:1-5:8"
  - q: "John hears “the Lion from the tribe of Judah, the Root of David, has conquered” – and sees “a Lamb standing, as though slaughtered”. What did people expect from the Lion? What does it mean that the seeing interprets the hearing – that God's power looks like the cross? Where do you long for a Lion rather than the Lamb?"
    ref: "5:5-5:7"
  - q: "“by your blood you purchased people for God from every tribe and language and people and nation” – and “they reign on the earth”, in the present tense. How does the Lamb's people reign: like their King, by witness and self-giving love? What would that look like in one conflict or frustration of yours this week?"
    ref: "5:9-5:14"
application:
  - "Each morning this week, before you unlock your phone, read 4:8–11 aloud. Then name one “throne” that frightens you at the moment and deliberately lay it before the throne on which he sits."
  - "Choose one place where you would love to “roar” – a conflict, an injustice, a frustration – and ask: how would the Lamb conquer here? Then take one small step of self-giving love in that direction."
prayer: "Begin with worship, not requests: read the songs of 4:8, 4:11 and 5:12 aloud together (or sing a song based on them). Then let each person name one “sealed scroll” and place it in the hands of the Lamb, trusting that our prayers are kept before the throne. Close by reading 5:13 together and answering “Amen.”"
leader_notes:
  - "This session covers two devotionals (days 10–11) and two chapters. The heart of the evening is 5:5–6 (question 6): John hears “Lion” and sees a Lamb. Keep time for it; it is the key to everything that follows in the series."
  - "Some (especially dispensational readings) take “Come up here” (4:1) as a picture of the church being taken up before the events of chapters 6–19, partly because the word “church” does not appear again until 22:16. Name this fairly. The devotional reads it as a call to John, like the prophets before him, to see the present reality behind the curtain. Keep the focus on the throne and the Lamb."
  - "The twenty-four elders are probably the whole people of God – twelve tribes and twelve apostles (cf. 21:12–14) – though others think of angelic beings. The four living creatures recall Ezekiel's cherubim and Isaiah's seraphim and probably represent the whole of living creation. Mention briefly; do not spend long."
  - "The scroll probably stands for God's purpose for history – his judgement on evil and the coming of his kingdom. Do not try to decode the seals yet; that is next session (chapters 6–7)."
  - "Handle with care: “the Lamb conquers by self-giving love” must not be heard as “put up with abuse”. The Lamb's way is faithful witness and refusing to hit back – not staying silent in harm or leaving the vulnerable unprotected. If someone in the group is in a harmful situation, talk with them afterwards."
  - "Plan the prayer time as worship. Revelation 4–5 is full of songs; if your group sings, choose a hymn or song based on these chapters."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
