session: 7
lang: en
title: "Sweet and Bitter"
ref: "10:1-11:19"
days: [16, 17]
big_idea: "God's answer to a world that will not repent is his word in the mouth of his witnesses: the church eats the word, sweet and bitter, is measured and kept by God, bears witness in sackcloth, shares its Lord's death and resurrection – and the kingdom of the world has already become our Lord's and his Christ's."
opening: "Think of a food that you hated as a child but love now (or the other way round). What changed?"
context: >-
  After the sixth trumpet we expect the seventh at once. But as between the sixth and the seventh seal, the story pauses. In chapter 7 God's people were sealed; in chapters 10 and 11 they are sent.
  John eats a little scroll, sweet in the mouth and bitter in the stomach, and must prophesy again; then he measures the temple and sees two witnesses who prophesy, are killed and stand up again.
  For the churches in Asia, living in Rome's cities, this was their calling: not to withdraw, but to bear witness.
read_aloud_tip: "Chapter 10: one narrator, one reader for the voice from heaven and the angel (10:4, 8, 9, 11). Chapter 11: one narrator; at 11:12 the whole group says “Come up here!”; everyone reads the songs of 11:15 and 11:17–18 together."
hebrew:
  - word: "chronos ouketi estai"
    hebrew: "χρόνος οὐκέτι ἔσται"
    gloss: "there will be no more delay"
    point: "*Chronos* usually means “time”, and older translations read as if time itself would stop. But the oath echoes Daniel 12:7 and answers the “How long?” of 6:10: God will wait no longer (10:6)."
  - word: "kataphage"
    hebrew: "κατάφαγε"
    gloss: "eat it up"
    point: "*Kataphagein* does not mean to taste but to eat up completely (10:9). The word must go into the prophet before it can come out of him – as with Ezekiel, for whom the scroll was sweet as honey and then bitter (Ezekiel 2:8–3:3, 14)."
  - word: "martysin"
    hebrew: "μάρτυσίν"
    gloss: "witnesses"
    point: "We translate “witness”, not “martyr” (11:3). But this chapter shows how the two words grew together in the early church: whoever bears faithful witness sometimes pays the price – like Antipas (2:13), and like Jesus himself, “the faithful witness” (1:5)."
discussion:
  - q: "Wrapped in a cloud, with a rainbow over his head, the angel sets one foot on the sea and the other on the earth and swears by the one “who created heaven and what is in it, and the earth and what is in it, and the sea and what is in it”. What do these images say about whose world this is?"
    ref: "10:1-10:6"
  - q: "John is told: “Seal up what the seven thunders have spoken, and do not write it down!” What does this say to people who use Revelation as a puzzle for dates and speculation? Which questions about the future make you restless – and can you leave them with God?"
    ref: "10:4"
  - q: "The souls under the altar were told “to rest a little longer” (6:11). Now the angel swears “that there will be no more delay”. Read Habakkuk 2:3. Where have you long been waiting for God, and what does this oath say to you?"
    ref: "10:5-10:7"
  - q: "Read Ezekiel 3:1–3 and 3:14 alongside Revelation 10:9–10: “Take it and eat it up; it will make your stomach bitter, but in your mouth it will be sweet as honey.” Do you read the Bible more like someone who tastes or like someone who eats? Which part of God's word is sweet to you at the moment, and which part bitter?"
    ref: "10:8-10:11"
  - q: "John measures “the temple of God and the altar and those who worship in it”, but the outer court is trampled for forty-two months. In the New Testament the church is God's temple (1 Corinthians 3:16). Do you sometimes feel like the court that is trampled? What does it mean to you that God has measured the inner part?"
    ref: "11:1-11:2"
  - q: "“These are the two olive trees and the two lampstands” – and the lampstands are the churches (1:20). Their signs are those of Elijah and Moses, and they stand not by might nor by power, but by God's Spirit (Zechariah 4:6). Where are you tempted to stay silent because your witness would make you unpopular?"
    ref: "11:3-11:10"
  - q: "The witnesses are killed and raised, and – unlike after the plagues (9:20–21) – the rest give glory to the God of heaven – through the testimony. The seventh trumpet sings: “The kingdom of the world has become our Lord's and his Christ's”. Where would it make a difference today if you truly believed that?"
    ref: "11:11-11:19"
application:
  - "Choose one short passage – Revelation 10:8–11, for example – and read it slowly and aloud every day for three days. “Chew” on it. Then share one sentence from it with someone who needs it."
  - "Think of one person around you who does not yet know Christ. Pray for him or her by name every day this week, and ask God for one opportunity to share something of your hope – gently, not fearfully."
prayer: "Read 11:15 aloud together. Then pray in pairs: thank God that the kingdom of the world belongs to him and to his Christ; ask him for hunger for his word and courage when witness costs something; pray by name for the person each of you thought of. Close together with Zechariah 4:6: not by might nor by power, but by your Spirit."
leader_notes:
  - "Two devotionals (days 16–17). Chapter 11 is one of the hardest in the book; don't let the group get lost in who the two witnesses are. Our reading: they are the witnessing church (the lampstands, 1:20), shown with the features of Moses and Elijah, and two because the law requires two witnesses (Deuteronomy 19:15)."
  - "Other readings: futurist interpreters take the forty-two months as a literal three and a half years at the end of history, with two individual prophets – according to some Moses and Elijah themselves. Name this fairly in a sentence. In this series, the forty-two months / 1,260 days are Daniel's “a time and times and half a time” (Daniel 7:25; 12:7): the measured, limited time of the church's witness between Christ's first and second coming. Don't calculate."
  - "Some members may know the older rendering of 10:6 (“that there should be time no longer”). The context is about God's waiting, not about the end of the calendar."
  - "The angel of 10:1 has features of Christ (1:16); some think he is Christ himself, but John calls him an angel. Don't spend long on it."
  - "Handle with care: some in the group carry the pain of witness that seems in vain – a shrinking congregation, a child far from God, being the only honest one at work. Don't promise success; the chapter promises vindication (“Come up here!”), not popularity."
  - "Point ahead: next week chapter 12 tells the Christmas story from behind the curtain – and the accuser is thrown down."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
