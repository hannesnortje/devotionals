session: 11
lang: en
title: "Come, Lord Jesus"
ref: "20:1-22:21"
days: [27, 28, 29, 30, 31]
big_idea: "Behind the curtain Christ reigns now and Satan is on a chain, so that he cannot stop the gospel; the story that began in Eden ends not with an escape from the world but with God making all things new and dwelling with his people face to face – and so the church waits, awake and faithful, praying: “Amen. Come, Lord Jesus!”"
opening: "What is the best homecoming you can remember – after a journey, a stay in hospital or a long time away? What made it feel like home?"
context: >-
  Chapter 19 showed Christ's return. Chapter 20 steps back once more and shows the time we live in from another angle: the dragon bound for a thousand years while Christ reigns with his people, then the last short revolt and the great white throne.
  Chapters 21–22 show what remains when everything evil is gone: a new heaven and a new earth, the bride who is a city, the river and the tree of life from Eden, and the face of God.
  And the book ends as it began – as a letter to the seven churches, with the promise “I am coming soon” and with grace.
read_aloud_tip: "Five readers: 20:1–10; 20:11–21:8; 21:9–27; 22:1–9; 22:10–21. The whole group reads the hymn of 21:3–4 together, and at the very end everyone says 22:20–21 aloud."
hebrew:
  - word: "edēsen"
    hebrew: "ἔδησεν"
    gloss: "bound"
    point: "From deō, “bind” – the same verb Jesus uses for binding the strong man before plundering his house (Mark 3:27). The binding of Satan begins at the cross (John 12:31–32): he can still do harm, but he can no longer stop the gospel among the nations (20:3)."
  - word: "Idou kaina poiō panta"
    hebrew: "Ἰδοὺ καινὰ ποιῶ πάντα"
    gloss: "Look, I am making all things new"
    point: "One of the few places where the one seated on the throne speaks himself (cf. 1:8). He does not throw his creation away; he makes all things new. And the verb is in the present tense: whoever is in Christ is already a new creation (2 Corinthians 5:17)."
  - word: "erchou, kyrie Iēsou"
    hebrew: "ἔρχου, κύριε Ἰησοῦ"
    gloss: "Come, Lord Jesus"
    point: "The early church probably prayed the same prayer in Aramaic, Marana tha – “Our Lord, come!” (1 Corinthians 16:22); according to the Didache (10:6) it belonged to the prayers at the Lord's Supper. It is the answer to his promise, “I am coming soon” (22:20)."
discussion:
  - q: "An angel binds the dragon “so that he would deceive the nations no more” (compare Mark 3:27). If the thousand years are the time we live in now, between Christ's first and second coming, where do you see that the chain holds – that Satan cannot stop the gospel? And where does it not feel like that at all?"
    ref: "20:1-20:3"
  - q: "Those “beheaded because of the testimony of Jesus” lived and reigned with Christ for a thousand years. To the world they had lost; behind the curtain they reign. What would this have meant for a church that remembered Antipas (2:13)? How does it comfort you about loved ones who have died in faith?"
    ref: "20:4-20:6"
  - q: "Before the great white throne “books were opened. And another book was opened, which is the book of life.” We are judged according to our works, but the last word comes from the book of life of the Lamb (21:27; Luke 10:20). How does this hold together the seriousness of our lives and the assurance of grace?"
    ref: "20:11-20:15"
  - q: "Read Genesis 2:8–10 and 3:17–24, then Revelation 22:1–5. What was lost in Eden, and what comes back? What is greater than at the beginning – a garden that has become a city, the tree of life in the middle of its street, no more curse, and “they will see his face”? (If there is time, compare Ezekiel 47:1–12.)"
    ref: "22:1-22:5"
  - q: "“Look, God's tent is with people” – tabernacle language (Exodus 25:8; John 1:14). We do not escape to a distant heaven; God comes to dwell with us, and “he will wipe away every tear from their eyes”. Which tear are you still carrying? What does it mean that he says “Look, I am making all things new” in the present tense?"
    ref: "21:1-21:7"
  - q: "The angel who showed John the prostitute (17:1) now shows him “the bride, the wife of the Lamb”: a city with no temple, because God and the Lamb are its temple. What does that mean for your Monday? And for your congregation, with all its quirks, that the bride is a people, not a collection of individuals?"
    ref: "21:9-21:27"
  - q: "Three times we hear “I am coming soon”, and between the warnings stands the invitation: “And the Spirit and the bride say, ‘Come!’” How does Jesus' “soon” shape the way we wait – not with dates, but with readiness? Whom could you invite this week to come and drink the water of life as a gift?"
    ref: "22:6-22:21"
application:
  - "Every morning this week, pray the last prayer of the Bible: “Amen. Come, Lord Jesus!” Add the name of one person you would like to invite to come and drink the water of life (22:17)."
  - "Write down one tear you are still carrying and read 21:3–5 aloud beside it. Then say to God: This one too you will wipe away. And pray once this week for a people or country where the gospel is still little known."
prayer: "This evening closes the series. Begin with a round of thanks: each person says in one sentence what they have seen behind the curtain in Revelation that they want to keep. Then pray for the persecuted church, for one people where the gospel is still little known, and for one another. End by standing and reading 22:20–21 aloud together: “Amen. Come, Lord Jesus! The grace of the Lord Jesus be with all.”"
leader_notes:
  - "Last session: three chapters and five devotionals (days 27–31). Choose five of the seven questions and keep at least 20 minutes for looking back and for the closing prayer."
  - "The thousand years (20:1–6): this series follows the reading known in the church since Augustine – the time between Christ's first and second coming, in which Christ reigns and his people with him, and Satan is bound so that he cannot stop the gospel among the nations. Premillennialists (already Justin and Irenaeus, later the dispensationalists) expect a literal thousand-year kingdom on earth after Christ's return; postmillennialists expect a golden age of the gospel before it. Name these views fairly and do not let the evening become a debate: all agree that Christ will return, judge and make all things new."
  - "Chapter 20 does not necessarily follow chapter 19 in time. The same final war (“the war”, 16:14; 19:19; 20:8) is seen from different angles, and each time there is no real fight: the end comes from the throne."
  - "Handle the great white throne and the lake of fire (20:11–15; 21:8) with care: some people will feel fear, others grief for loved ones. Do not speculate about who is in the book of life; point to the Lamb who holds it. “The cowardly” (21:8) are not people who are afraid and weak, but those who out of fear gave up Christ – and the door still stands open: whoever is thirsty may come (21:6; 22:17)."
  - "The measurements of the city (twelve thousand stadia, a hundred and forty-four cubits) are numbers for wonder, not for maps: twelve is the people of God, and the cube recalls the Most Holy Place (1 Kings 6:20). Interpreters differ on whether the new creation is wholly new or the old renewed; the point is the same – God does not give up his creation."
  - "“Soon” (22:7, 12, 20) is not a date but a promise that keeps every generation awake (2 Peter 3:8–9; Habakkuk 2:3). Avoid date-setting and fear. If your church's practice allows, the series can close with the Lord's Supper as a foretaste of the wedding supper of the Lamb (19:9)."
