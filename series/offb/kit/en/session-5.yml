session: 5
lang: en
title: "Who Can Stand?"
ref: "6:1-7:17"
days: [12, 13]
big_idea: "The Lamb who was slaughtered holds the seals: war, hunger and death ride out only when he opens them and only as far as God allows – and to the great question “who can stand?” the answer is a countless crowd from every nation, sealed by God and washed in the blood of the Lamb."
opening: "When you hear bad news on the radio or read it on your phone, what is your first reaction – switch off, worry, look for an explanation, or pray? Why?"
context: >-
  In chapters 4–5 John saw the throne in heaven and the Lamb who alone is worthy to take the scroll. Now the Lamb opens the seals one by one:
  four riders, the souls under the altar, and a sky rolled up like a scroll (chapter 6). For the small churches in Asia, who knew war, famine and the pressure of Rome,
  this was no fantasy. Before the seventh seal the story pauses (chapter 7): God seals his servants, and John sees the crowd that no one could count.
read_aloud_tip: "One narrator reads the chapters; at each seal the whole group says “Come!” together (6:1, 3, 5, 7). A second reader takes the cry of the souls (6:10) and the elder (7:13–17); everyone reads the songs of 7:10 and 7:12 together."
hebrew:
  - word: "edothē"
    hebrew: "ἐδόθη"
    gloss: "was given"
    point: "The crown, the sword and the authority are given to the riders (6:2, 4, 8). The passive points to God as the one who permits – and limits: the oil and the wine are spared, Death is given a fourth of the earth, not the whole. As in Job 1–2, the destroyer can go only as far as God allows."
  - word: "stathēnai / hestōtes"
    hebrew: "σταθῆναι / ἑστῶτες"
    gloss: "stand / standing"
    point: "Chapter 6 ends with the question of Nahum 1:6: “who can stand?” (6:17). Chapter 7 answers it: a crowd “standing before the throne and before the Lamb” (7:9) – not in their own strength, but because the Lamb himself stood first, “as though slaughtered” (5:6)."
  - word: "sphragida"
    hebrew: "σφραγῖδα"
    gloss: "seal"
    point: "A seal was the mark of ownership and authenticity – a signet ring in the wax of a letter, a stamp on a cargo. What is sealed belongs to someone and is guarded by him. God's servants are sealed on their foreheads before the storm comes (7:3)."
discussion:
  - q: "Each rider comes out only when the Lamb opens a seal, and each time something is given: “a crown was given to him”, “a great sword was given to him”. Which of the riders – war, economic pressure, illness, death – frightens you most at the moment? What changes when you remember who opens the seals?"
    ref: "6:1-6:8"
  - q: "Compare verse 8 with Zechariah 1:8–11 and Ezekiel 14:21. Jesus said that wars and famines would mark the whole time until his return, but that this is not yet the end (Mark 13:7–8). So how should we read the seals – as a timetable, or as a picture of the world between Christ's first and second coming?"
    ref: "6:8"
  - q: "The souls under the altar cry out: “How long, holy and true Master, will you not judge and avenge our blood on those who live on the earth?” God does not rebuke them but tells them “to rest a little longer”. What does this say about honest prayer? What have you long been crying “How long?” about?"
    ref: "6:9-6:11"
  - q: "Kings, generals and the rich hide in the caves – but also “every slave and free person”. They hide “from the wrath of the Lamb”. How can the wrath of the one who was slaughtered for the world be both the most serious and the most hopeful word in the chapter? On whom or what are you relying to stand on that day?"
    ref: "6:15-6:17"
  - q: "Before the storm God's servants are sealed on their foreheads (compare Exodus 12:13; Ezekiel 9:4–6). In Asia the emperor cult and the trade guilds asked every day whom the believers belonged to – what comfort lay in this seal? Which labels that others stick on you do you believe more than the seal of the living God?"
    ref: "7:1-7:3"
  - q: "John hears a number – a hundred and forty-four thousand from the tribes of Israel – and then sees “a great crowd that no one could count, from every nation and all tribes and peoples and languages”. How does this fulfil God's promise to Abraham (Genesis 15:5; 12:3)? How big is the church in your imagination?"
    ref: "7:4-7:10"
  - q: "“They have washed their robes and made them white in the blood of the Lamb.” The crowd sings not about its endurance but “To our God, who sits on the throne, and to the Lamb belongs salvation!” Where are you still trying to keep your robes clean yourself? Which promise of verses 15–17 do you need most this week?"
    ref: "7:13-7:17"
application:
  - "When you read or hear the news this week, choose one place of war or hunger and pray for it – and say it aloud: the Lamb holds the seals in his hand."
  - "Each morning when you see your face in the mirror, tell yourself: I am sealed, and I belong to the Lamb. Pray once this week for believers in a country and a language that are not your own."
prayer: "Begin with the song of the crowd, read aloud together: “To our God, who sits on the throne, and to the Lamb belongs salvation!” (7:10). Then let each person name, in a sentence, one “How long?” before God – for themselves or for suffering believers elsewhere. Close by thanking God that “God will wipe away every tear from their eyes”."
leader_notes:
  - "This session covers two devotionals (days 12–13). Chapter 6 is frightening and chapter 7 is its answer – don't let the discussion get stuck in chapter 6. Keep at least fifteen minutes for chapter 7."
  - "Our approach in this series: the seals show the world as it is between Christ's first and second coming, and who holds it in his hand; only the sixth seal takes us up to the great day itself. Futurist interpreters place the seals in a future period just before Christ's return. If this comes up, name it fairly in a sentence and return to the pastoral point: the Lamb opens the seals, and history is not out of control."
  - "The first rider (6:2): some see Christ himself, since he rides a white horse in 19:11; many read him as conquest and war, perhaps even as a counterfeit of Christ, because he rides out with the other three. Both readings can be mentioned; don't spend long on it."
  - "The 144,000: dispensationalists read them literally as Jewish believers, distinct from the crowd. The pattern of hearing and seeing (as in 5:5–6) makes it likely that John describes one people from two sides. Israel is not wiped out or replaced; the nations are grafted into Abraham's family (Romans 11:17–18; Galatians 3:29). Keep the tone warm – no polemics."
  - "Handle with care: the group may include people who are grieving or who have family in countries of war or persecution. Let the cry “How long?” be heard without rushing to answers, and resist any attempt to match the riders to today's headlines or to work out dates."
  - "Point ahead: next week the seventh seal – silence in heaven, the prayers of the saints, and the trumpets."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
