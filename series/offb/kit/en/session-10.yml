session: 10
lang: en
title: "Come Out of Her"
ref: "17:1-19:21"
days: [23, 24, 25, 26]
big_idea: "Babylon – the seductive power of every age that rides on the beast, lives in luxury, trades in bodies and souls and is drunk with the blood of the saints – looks impressive but falls in a single hour; God calls his people to come out of her, not out of the world, and invites them to the wedding of the Lamb, whose Rider, Faithful and True, conquers by the word of his mouth."
opening: "Think of an advertisement, a product or a lifestyle that once really impressed you. What made it so attractive – and did it keep its promise?"
context: >-
  At the last bowl the voice from the throne cried “It is done!”, and God “remembered Babylon the Great” (16:19). Chapters 17–19 show who she is.
  For the seven churches she was Rome on her seven hills, rich, glamorous and violent; in the Bible's great story she is every power since Babel that seduces people with luxury and makes them forget to whom they belong.
  Chapter 18 is the lament over her fall and the call to God's people to come out; chapter 19 answers with heaven's Hallelujah, the wedding of the Lamb and the Rider on the white horse – Christ's return, which still lies ahead of us.
read_aloud_tip: "The chapters are long: read 17:1–6 and 17:14–18, all of chapter 18 and all of chapter 19. In chapter 18 let three readers take the laments of the kings (vv. 9–10), the merchants (vv. 11–17a) and the sailors (vv. 17b–19); the whole group reads the Hallelujahs of 19:1–8 together."
hebrew:
  - word: "Exelthate, ho laos mou, ex autēs"
    hebrew: "Ἐξέλθατε, ὁ λαός μου, ἐξ αὐτῆς"
    gloss: "Come out of her, my people"
    point: "Jeremiah's call to the exiles in ancient Babylon (Jeremiah 51:6, 45). The Greek Old Testament uses the same verb for Israel's exodus from Egypt (Exodus 13:3). It is a new exodus – out of Babylon, not out of creation; the goal is the city where God dwells with people (21:1–3)."
  - word: "sōmatōn, kai psychas anthrōpōn"
    hebrew: "σωμάτων, καὶ ψυχὰς ἀνθρώπων"
    gloss: "bodies – and human souls"
    point: "The last items on Babylon's cargo list. “Bodies” was a trade word for slaves; here the Greek suddenly changes its construction, as though John interrupts the list to say what the merchants did not want to see: these are souls. The Lamb purchased people for God (5:9); Babylon buys and sells them."
  - word: "pistos … kai alēthinos"
    hebrew: "πιστὸς … καὶ ἀληθινός"
    gloss: "Faithful and True"
    point: "Pistos is someone who keeps his word; alēthinos is the genuine thing as against the counterfeit. In a book full of counterfeits – a beast that looks as though slain (13:3), a false prophet with horns like a lamb (13:11) – the Rider is the Genuine One. It is how Jesus introduced himself to Laodicea (3:14)."
discussion:
  - q: "John hears of “the great prostitute who sits on many waters”, then sees “a woman sitting on a scarlet beast”. How does the seeing interpret the hearing? What would the churches have recognised when the angel speaks of seven mountains and of “the great city that has a kingdom over the kings of the earth”?"
    ref: "17:1-17:18"
  - q: "“And when I saw her, I was greatly amazed.” The angel asks: “Why are you amazed?” Babylon appears not as a monster but as a queen in purple with a golden cup. What impresses you so much at the moment that it begins to draw your heart away from the Lamb? Behind the glamour, what is it riding on – and who pays for it?"
    ref: "17:3-17:7"
  - q: "The Old Testament in the New: read Jeremiah 51:6–8 and Isaiah 47:7–8 aloud and compare them with 18:2–8. What does it tell us that the voice from heaven uses Jeremiah's words, “Come out of her, my people”? What kind of exodus is this – out of the world, or out of something else? What would it mean for your work and your spending?"
    ref: "18:2-18:8"
  - q: "In her heart Babylon says: “I sit as a queen; I am no widow, and I will never see grief.” Laodicea said: “I am rich, I have become wealthy, and I need nothing” (3:17). Where do you hear that voice in your own heart – “if I have enough, nothing can touch me”?"
    ref: "18:7"
  - q: "The merchants do not weep over the city or over the slaves, but “because no one buys their cargo any more” – and the list ends with “bodies – and human souls”. What does our grief show about what our hearts are bound to? Who might be only “cargo” to us – people whose work we use without really seeing them?"
    ref: "18:11-18:24"
  - q: "Hallelujah, “for the wedding of the Lamb has come, and his wife has made herself ready.” The prostitute bought her purple and gold; the bride is given fine linen, shining and clean. Do you see the church more as a failure or as the bride of the Lamb? And do you try to earn your robe, or receive it as a gift?"
    ref: "19:1-19:10"
  - q: "The Rider is “called Faithful and True”; his robe is dipped in blood before any fight, and no battle is described – only the sword from his mouth. Which of God's promises do you find hard to believe at the moment? And when did you last fight with the beast's weapons – anger, manipulation, power – instead of the word?"
    ref: "19:11-19:21"
application:
  - "Choose one act of “coming out” this week: give away something you would like to keep, or, with one purchase, ask who the people behind it are and pray for them – not out of guilt, but as someone who already belongs to the Lamb."
  - "Choose one conversation in which you are tempted to win with harsh words. Pray Hebrews 4:12 beforehand, and then speak one true word in love instead of the word that wounds."
prayer: "Read 19:6–8 aloud together. Then pray in pairs: name before God one thing that amazes you more than the Lamb; pray for people who are treated as cargo – exploited workers, trafficked people, those whose worth is measured by what they produce; and thank the Rider, Faithful and True, for one promise he has kept. Close together: “Hallelujah! For the Lord God, the Almighty has begun to reign.”"
leader_notes:
  - "This is the fullest session: three long chapters and four devotionals (days 23–26). Follow the reading tip and choose five questions; 2, 4 and 6 are the heart of the evening."
  - "Who is Babylon? For the first readers clearly Rome (the seven mountains, 17:9; the great city, 17:18), but in the Bible's story she is every power since Babel (Genesis 11:4) that seduces with luxury, violence and idolatry. Do not decode the seven kings (17:9–11) into a list of emperors, or the beast into a modern state, institution or church. Futurist readers expect an end-time Babylon or world system, preterist readers see only Rome; name both fairly in a sentence and return to the book's question: whose am I?"
  - "Handle “in or out” with care. Two women and two cities are a call to faithfulness, not a tool for labelling other people as Babylon. Nor is chapter 18 a sermon against money or trade – wheat, wine and olive oil are good gifts of God. The issue is the heart that says “I will never see grief”, and the people behind the goods."
  - "The text calls Babylon a “prostitute” and speaks of “harlotry”. In the prophets this is the picture of unfaithfulness to God – giving your love and trust to other powers (Hosea 2; Ezekiel 16; Nahum 3:4). If someone is uneasy with the image, explain it briefly: it is about where we give our hearts."
  - "19:11–21 is Christ's return, which still lies ahead. The terrible supper of 19:17–18 takes up Ezekiel 39:17–20: evil is utterly and finally defeated. Point to the two suppers – everyone is first invited to the wedding supper of the Lamb (19:9). And 19:10 is a good moment to ask what we are tempted to worship in God's place: “Worship God!”"
  - "Point ahead: next week is the last session, chapters 20–22 – the dragon on a chain, all things made new, the bride who is a city, the river and the tree of life, and “Come, Lord Jesus”."
