session: 8
lang: en
title: "Whose Are You?"
ref: "12:1-13:18"
days: [18, 19]
big_idea: "Behind the curtain the dragon has already been thrown down by the blood of the Lamb; in his fury he works through beasts that imitate the Lamb and demand worship – but God's people, sealed before the beast ever appeared, conquer by the blood of the Lamb, the word of their testimony and endurance, for the question is not “when?” but “whose are you?”."
opening: "Have you ever been fooled by a fake – a counterfeit product, a forged signature, a scam message? How did you find out?"
context: >-
  The seventh trumpet has sounded: the kingdom of the world has become our Lord's. Now John draws the curtain back further and shows how it came about.
  Chapter 12 tells the Christmas story from behind the curtain: a woman, a child, a dragon – and the accuser thrown down. In chapter 13 the dragon calls up two beasts, from the sea and from the earth.
  For the churches in Asia the beast had a face: Rome, the imperial cult and the guilds, where you could not buy or sell without offering incense to the emperor.
read_aloud_tip: "Three readers: a narrator, a second reader for the loud voice in heaven (12:10–12, read slowly as a song of victory), and a third for the crowd and the second beast (13:4, 14). Pause briefly between the two chapters."
hebrew:
  - word: "ho katēgōr"
    hebrew: "ὁ κατήγωρ"
    gloss: "the accuser"
    point: "A word from the courtroom (12:10) – exactly what the Hebrew *hassatan* means in Job 1–2 and Zechariah 3: the adversary, the accuser in God's heavenly council. He accuses them “before our God day and night” – but now he has been thrown down."
  - word: "hōs esphagmenēn"
    hebrew: "ὡς ἐσφαγμένην"
    gloss: "seemed slaughtered"
    point: "The same expression as for the Lamb in 5:6 (*hōs esphagmenon*). John wants us to notice the likeness – and the difference (13:3). The Lamb's wounds are for others; the beast's healing is for itself. Evil creates nothing new. It imitates."
  - word: "charagma"
    hebrew: "χάραγμα"
    gloss: "mark"
    point: "A stamp or impression – also the emperor's stamp on coins and documents (13:16–17). Every coin in the hand of a trader in Thyatira bore the emperor's image and titles. The mark is “the name of the beast or the number of its name”: it says whom you belong to."
discussion:
  - q: "Read Genesis 3:15 and 37:9: what do they tell us about the woman, the child and the dragon? The child “is to shepherd all the nations with an iron rod” (Psalm 2:9) and is “snatched up to God and to his throne” – the whole life of Jesus in one sentence. What is different when we see Bethlehem from behind the curtain?"
    ref: "12:1-12:6"
  - q: "Read Zechariah 3:1–5 and Job 1:9–11: the accuser could still stand before God. Now “the accuser of our brothers and sisters has been thrown down”. Which accusation do you hear most often in your own thoughts? How does the Spirit's conviction, which leads to the cross, differ from the accuser's voice, which ends in despair?"
    ref: "12:7-12:10"
  - q: "They conquered “by the blood of the Lamb and by the word of their testimony”, and “they did not love their life even to death”. Do you try to silence the accuser with your own good works, or do you take refuge in the blood of the Lamb? What would it mean for you to speak the word of your testimony?"
    ref: "12:11-12:12"
  - q: "The woman is given “the two wings of the great eagle” and is fed in the wilderness (Exodus 19:4). The church is on its exodus through this age – not out of creation, but out of the dragon's power. Where are you in the wilderness at the moment, and where can you see that God is feeding you there?"
    ref: "12:13-12:18"
  - q: "Read Daniel 7:2–8 and 17: John's beast is leopard, bear and lion in one body. The crowd cries: “Who is like the beast, and who can make war against it?” – a counterfeit of Israel's song (Exodus 15:11). What did the beast look like for the churches in Asia? Which powers lay claim to people's whole heart today?"
    ref: "13:1-13:8"
  - q: "One of its heads “seemed slaughtered to death”, and the second beast “had two horns like a lamb, and it spoke like a dragon”. Why is the convincing copy more dangerous for the church than the open enemy? Where are you drawn by something that looks like a lamb but speaks like a dragon?"
    ref: "13:3-13:15"
  - q: "The mark is given “on their right hand or on their forehead”, and without it no one can buy or sell. Compare God's seal (7:3) and the Shema (Deuteronomy 6:8): what you think and what you do. No one is unmarked. If someone had watched your week: whom do your hand and your forehead belong to?"
    ref: "13:16-13:18"
application:
  - "Write down one accusation you hear again and again in your head. Next to it write: “for the accuser of our brothers and sisters has been thrown down” (12:10). Read it aloud when the voice comes back."
  - "Choose one “hand” choice (something you do) and one “forehead” pattern (something you think) where the beast is pulling at you. Pray about them every day this week with the words: I belong to the Lamb."
prayer: "Read 12:10–11 aloud together. Then let each person thank God in one sentence that they belong to the Lamb, and – if they want to – name one place where they feel the pressure to “buy or sell” by playing along. Close with the confession of the devotional: Who is a God like you? (Micah 7:18), and thank him that our names are written in “the book of life of the slaughtered Lamb” (13:8)."
leader_notes:
  - "Two devotionals (days 18–19). Both chapters are full of images; spend most of the time on 12:10–11 (the accuser thrown down) and 13:16–17 (the mark). These carry the pastoral weight."
  - "666: name the two main readings briefly – the words “Nero Caesar” in Hebrew letters add up to 666 (and in a Latin spelling to 616, the number in a few early manuscripts), or a “human number”, six falling short three times of seven. John calls for the wisdom of discernment, not of code-breakers. Do not decode the number to modern persons, and do not let the group speculate about chips, barcodes or dates."
  - "The mark is about belonging, not fear. Some members may have grown up with frightening teaching about the mark; reassure them: God's seal came first (7:3), and the mark of the beast is not something you receive by accident – it grows through a thousand small choices of the hand and the forehead."
  - "Other readings: futurists expect a future individual ruler and a literal mark at the end of history; preterists see the chapter fulfilled in Rome in the first century. Our series: Rome in John's day, and every power in every age that demands worship. Name the views fairly in a sentence and return to the question “whose are you?”."
  - "“In or out” is a call to faithfulness, not “us against them”. Don't let the group name political parties or leaders as the beast; the question is turned on ourselves first – Laodicea's lukewarm middle way (3:15–16) is also no neutral ground."
  - "Point ahead: next week chapter 14 – the Lamb on Mount Zion with those who have his name and his Father's name on their foreheads."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
