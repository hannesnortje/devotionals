session: 3
lang: en
title: "Wake Up, Hold Fast, Open the Door"
ref: "3:1-3:22"
days: [7, 8, 9]
big_idea: "Christ sees past reputation, size and wealth: he wakes up a church that only looks alive, opens a door for a church with little power, and knocks at the door of a church that thinks it needs nothing – and to all three he offers a place with him on his throne."
opening: "What is the difference between a house that looks good in photos and a house that is good to live in? Have you ever been surprised by the difference?"
context: >-
  The messenger's road ends with three more cities. Sardis was proud of its past and of a citadel it thought impregnable – yet it was taken twice because no one kept watch.
  Philadelphia was young and small, on a fertile plain shaken again and again by earthquakes. Laodicea was rich, with banks, a textile trade and a medical school, but its water arrived lukewarm.
  Three churches, three dangers – reputation, weakness, comfort – and the seven letters end with a throne (3:21).
read_aloud_tip: "Let the three members who each took a church read their letter (vv. 1–6, 7–13, 14–22); the whole group reads the refrain together. At the end, let one person read verse 20 again slowly, and keep a moment of silence."
hebrew:
  - word: "onoma"
    hebrew: "ὄνομα"
    gloss: "name"
    point: "Name means reputation: “you have the name of being alive, but you are dead” (3:1). Sardis was well known, active and respected – and before Christ a fine gravestone with an impressive inscription. Yet the same letter also knows “a few names” who have not soiled their clothes (3:4)."
  - word: "mikran dynamin"
    hebrew: "μικρὰν δύναμιν"
    gloss: "little power"
    point: "Not a rebuke for weak faith, but a description of a small, poor church without influence (3:8). And yet it kept Christ's word and did not deny his name – and the one who holds the key of David set an open door before it."
  - word: "chliaros"
    hebrew: "χλιαρός"
    gloss: "lukewarm"
    point: "The word occurs only here in the New Testament (3:16). Many interpreters hear the water of the Lycus valley behind it: hot, healing springs at Hierapolis, cold drinking water at Colossae – and lukewarm water at Laodicea that healed no one and quenched no one's thirst."
discussion:
  - q: "Each reporter: what did your city pride itself on (Sardis: its unconquerable citadel; Philadelphia: its name and its new imperial names; Laodicea: its banks, its black wool and its eye-salve)? Where does Christ's letter touch exactly that point?"
    ref: "3:1-3:18"
  - q: "Sardis: “you have the name of being alive, but you are dead.” No persecution, no false teacher – can peace with the world be a sign of spiritual sleep? How wide is the gap between your “name” and your life with God when no one is watching – and what would “Wake up, and strengthen what remains” mean for you?"
    ref: "3:1-3:4"
  - q: "Philadelphia: Christ has “the key of David, who opens and no one will shut, and who shuts and no one opens” (Isaiah 22:20–23). What did that key mean for Eliakim, and what does it mean that Jesus holds it? Which door has been shut in your face – and which door may he have opened?"
    ref: "3:7-3:8"
  - q: "“You have little power, and yet you have kept my word and have not denied my name.” What does this say to small churches and to people who feel too ordinary to matter? Why would a pillar “in the temple of my God” mean so much in a city of earthquakes?"
    ref: "3:8-3:12"
  - q: "“I too will keep you from the hour of testing”. The devotional points to John 17:15: not taken out of the world, but kept from the evil one – kept through it and brought out of it. What difference does it make whether we expect God to spare us trouble or to keep us in it?"
    ref: "3:10-3:11"
  - q: "Laodicea: “I am rich, I have become wealthy, and I need nothing”. Christ offers to sell what only he has (cf. Isaiah 55:1: buy without money and without price). Where has comfort or success made you feel, without noticing, that you need nothing? What would gold refined by fire, white clothes and salve for your eyes be for you?"
    ref: "3:15-3:19"
  - q: "“Look, I am standing at the door and knocking.” The Lord of the church stands outside his own church – and does not break the door down. Which room of your life is he still knocking at? And what does it mean that the one who opens is invited to sit with him on his throne?"
    ref: "3:20-3:22"
application:
  - "Choose one spiritual habit that is “about to die” in your life – prayer, Bible reading, worship, generosity – and strengthen it deliberately this week, at a fixed time each day."
  - "Open a door: name the area of your life where Jesus is still standing outside, tell him so in prayer, and give him the place of honour there – perhaps with one concrete change in how you spend your time or your money."
prayer: "Pray for the three churches and for ourselves: for wakefulness (Sardis), for faithfulness with little power (Philadelphia), for honest dependence (Laodicea). Then keep a minute of silence with verse 20, and let each person open one door to Christ in silence. Close by thanking him that he loves those he reproves (3:19)."
leader_notes:
  - "This session covers three devotionals (days 7–9). Let each reporter introduce their city in two minutes from the devotional (Sardis: the citadel taken by Cyrus and by Antiochus; Philadelphia: the earthquake of AD 17; Laodicea: the earthquake of AD 60, its banks, wool, eye-salve and lukewarm water). If time is short, choose questions 2, 3, 6 and 7."
  - "3:10 and the “rapture”: some (especially dispensational readings) take 3:10 as a promise that the church will be taken away before a future time of affliction. Name this fairly. The devotional reads “keep you from” as kept through and brought out of it, as in John 17:15 – for Philadelphia and for every church. Do not let the evening become a debate about it."
  - "Hot and cold: the older reading takes “hot” as zealous and “cold” as hostile. The devotional prefers the background of Hierapolis and Colossae, in which both hot and cold are useful – but it says we cannot be certain. Either way the point is the same: lukewarm faith is useless."
  - "Handle with care: someone may fear for their name in the book of life. Verse 5 is a promise, not a threat: “I will never blot his name out of the book of life”. Let the anxious hear the promise. The same care as last week applies to “the synagogue of Satan” (3:9)."
  - "Verse 20 is often used in evangelism, and it can be heard that way – but in context Christ speaks to a church that has shut him out. Let the group hear both."
  - "Point ahead: the letters end with a throne (3:21), and next week “a door stood open in heaven” (4:1) – we shall see who sits on that throne, and who stands in the middle of it."
timing:
  welcome: 10
  read: 15
  context: 10
  discussion: 40
  prayer: 15
