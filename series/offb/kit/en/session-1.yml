session: 1
lang: en
title: "The King among the Lampstands"
ref: "1:1-1:20"
days: [1, 2]
big_idea: "Revelation pulls back the curtain for small, pressured churches: the one who loves us and has freed us by his blood is the ruler of the kings of the earth, he walks among his churches, holds them in his right hand and says to them – and to us – “Do not be afraid.”"
opening: "Have you ever been allowed behind the scenes somewhere – in a theatre, a restaurant kitchen, a hospital, a stadium? How did it change the way you saw the front stage afterwards?"
context: >-
  Revelation was written, probably around AD 95, to seven real churches in the Roman province of Asia (today's western Turkey), where honouring the emperor as lord was part of everyday life
  and refusing could cost Christians their work, their freedom or their lives. John writes from exile on the island of Patmos.
  The book's first word, apokalypsis, means unveiling: God pulls back the curtain so that his people can see who really reigns – and what it meant for those seven churches, it means for the church in every age.
  Tonight we read chapter 1: the greeting and a burst of praise (vv. 1–8), and John's vision of the risen Christ among the lampstands (vv. 9–20).
read_aloud_tip: "Read with three voices: a narrator for John's words, a second reader for the song of praise and verse 7 (vv. 5b–7), and a third reader for the words of the Lord (vv. 8, 11 and 17b–20). Verse 3 blesses the one who reads aloud – so read slowly, as the first churches heard it."
hebrew:
  - word: "apokalypsis"
    hebrew: "ἀποκάλυψις"
    gloss: "revelation"
    point: "Not chaos and the end of the world, but the removing of a veil – an unveiling. The book was not written to hide God's plans behind codes, but to show believers who really sits on the throne. And it is the revelation of Jesus Christ: he is both its Giver and its Content (1:1)."
  - word: "synkoinōnos"
    hebrew: "συγκοινωνός"
    gloss: "who shares with you"
    point: "John does not stand above the churches as an exalted apostle; he is their brother, a partner who has a share together with them. And what he shares with them are three things that belong together: affliction, the kingdom and endurance (1:9)."
  - word: "lychniai"
    hebrew: "λυχνίαι"
    gloss: "lampstands"
    point: "Not the one seven-branched lampstand of the tabernacle (Exodus 25:31–37; cf. Zechariah 4:2), but seven separate golden lampstands – the seven churches (1:20). A lampstand has no light of its own; it holds up the light. And Christ stands in the middle of them (1:13)."
discussion:
  - q: "Verse 3 blesses “the one who reads aloud” and those who hear and keep what is written. Revelation was meant to be read aloud in church and lived, not first of all decoded. What difference does it make to come to this book as a letter to be heard and kept rather than a puzzle to be solved?"
    ref: "1:1-1:3"
  - q: "Before John writes one word about affliction, he bursts into praise: “To him who loves us and has freed us from our sins by his blood”. “Loves” is present, “has freed” is past. Why might the churches need to hear this first? And which of the two do you find harder to believe about yourself?"
    ref: "1:4-1:6"
  - q: "Verse 7 weaves together two Old Testament prophecies: Daniel 7:13 (one like a son of man coming with the clouds of heaven) and Zechariah 12:10 (they will look on the one they have pierced and mourn). Look them up. What did these promises mean in their own setting – and what does John see coming true in Jesus?"
    ref: "1:7"
  - q: "The emperor Domitian liked to be called “lord and god”. In verse 8 the churches hear: “the Lord God, who is and who was and who is coming, the Almighty”. What would that have meant in a city full of temples for the emperor? Which “little emperors” claim that place in our lives today?"
    ref: "1:8"
  - q: "John calls himself “your brother, who shares with you in the affliction and the kingdom and the endurance in Jesus”. Why do these three belong together? What happens to our faith if we want the kingdom without the affliction and the endurance?"
    ref: "1:9"
  - q: "The portrait in verses 13–16 is painted with Old Testament colours (Daniel 7:9; 10:5–6). What does it mean that features of the Ancient of Days – hair white like wool – are given to one like a son of man? Which detail speaks most to you: the eyes like a flame of fire, the voice like many waters, the sword from his mouth?"
    ref: "1:12-1:16"
  - q: "Christ stands “in the middle of the lampstands”, and the hand that holds the stars rests on a trembling John: “Do not be afraid. I am the First and the Last”. Which fear in your life needs to hear today that he holds “the keys of death and of Hades”?"
    ref: "1:17-1:20"
application:
  - "Each morning this week, before you look at the news or your phone, read 1:5–6 aloud and say it in your own words: he loves me – today; he has freed me – it is done."
  - "Like John on Patmos, praise God in the middle of something hard, not only after it is over: name one difficult situation this week and thank Christ, in so many words, that he holds the keys and walks among his people."
prayer: "Read verses 17–18 aloud together, slowly. Then let each person name (aloud or silently) one fear and hand it over to the one who holds the keys of death and of Hades. Close by praying the doxology of verses 5–6 together as your own praise."
leader_notes:
  - "This session covers two devotionals (days 1–2) and opens the series of eleven sessions. Set the lens at the start: Revelation was written to seven churches; what it meant for them, it means for us. Its question is not “when?” but “who really reigns, and whose side am I on?”."
  - "Some in the group may have learned to read Revelation mainly as a timetable of end-time events still to come (futurist and dispensational readings), others as something fulfilled in the first century (preterist readings). Name this fairly and without polemics, and say that this series reads the book as a message for the church in every age; keep the focus on its pastoral heart: God reigns, the Lamb has conquered, the church is called to faithful witness and endurance."
  - "“What must soon take place” and “the time is near” (1:1, 3): the devotional notes that John takes up Daniel 2:28, but replaces “in the last days” with “soon” – what was far off for Daniel has begun with Christ, and the whole time between his first and second coming is the last days. Don't let the group calculate dates."
  - "The “angels” of the seven churches (1:20) are understood in different ways – heavenly angels, or the leaders or messengers of the churches. Mention it briefly and move on. In 1:5 some older Bibles read “washed”; the oldest manuscripts read “freed”."
  - "Handle with care: some people carry real fear from end-times films, charts or sermons. The first word the risen Christ speaks to the trembling John is “Do not be afraid.” Let that set the tone of the evening."
  - "Point ahead: next week we read chapter 2 – Ephesus, Smyrna, Pergamum and Thyatira. Ask four people to take one church each, read its letter at home with the devotional of that day, and report briefly next time."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
