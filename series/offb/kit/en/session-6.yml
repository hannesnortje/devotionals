session: 6
lang: en
title: "Heaven Is Listening"
ref: "8:1-9:21"
days: [14, 15]
big_idea: "Heaven falls silent to hear the prayers of the saints, and those prayers come back to earth as God's action; the trumpets, like the plagues of Egypt, are limited warnings that call the world to repent – but judgement alone does not change the heart, and what the plagues cannot do, the Lamb does through his witnesses."
opening: "Where do you find real silence in your week – and do you enjoy it, or does it make you uneasy?"
context: >-
  Heaven has been full of songs: angels, elders, living creatures and a countless crowd. Now the Lamb opens the seventh seal – and there is silence.
  An angel offers incense with the prayers of all the saints, throws fire from the altar on the earth, and seven trumpets sound (chapters 8–9).
  The images come from the exodus: hail, blood, darkness and locusts, as in Egypt. For the small churches in Asia, under the power of Rome, this said: God still acts against every empire that behaves like Egypt.
read_aloud_tip: "Begin with half a minute of silence after 8:1 before reading on. Then one narrator reads, and six readers each take one trumpet (8:7, 8, 10, 12; 9:1, 13); a last reader takes the eagle's cry (8:13) and 9:20–21."
hebrew:
  - word: "sigē"
    hebrew: "σιγὴ"
    gloss: "silence"
    point: "An ordinary word for silence (8:1). It is not an empty silence, but the silence of a courtroom before the judge speaks – and of a Father who is listening. The prophets knew it as the silence before God acts (Habakkuk 2:20; Zephaniah 1:7)."
  - word: "to triton"
    hebrew: "τὸ τρίτον"
    gloss: "a third"
    point: "Twelve times in six verses (8:7–12). The seals struck a fourth (6:8), the trumpets a third, the bowls later everything. The judgements are limited. They are warnings, not yet the end."
  - word: "ou metenoēsan"
    hebrew: "οὐ μετενόησαν"
    gloss: "they did not repent"
    point: "*Metanoeō* is a turning round of mind and life (9:20–21). It is the same verb Jesus used five times for the churches (2:5, 16, 21; 3:3, 19): the call to repent is addressed first to the church, then to the world."
discussion:
  - q: "“There was silence in heaven for about half an hour.” Read Habakkuk 2:20 and Zephaniah 1:7. What kind of silence is this? When did you last become truly still before God, without speaking?"
    ref: "8:1"
  - q: "The angel stands at the golden altar of incense, right in front of the curtain (Exodus 30:1–8; Luke 1:9–10), and the incense rises “with the prayers of the saints” before God. What does this picture say to small churches whose prayers no one in Rome heard – and to you, if you have given up on a prayer?"
    ref: "8:3-8:4"
  - q: "The angel fills the censer “with the fire of the altar” and throws it on the earth – the same altar under which the souls cried “How long?” (6:9–10). Then the trumpets begin. Do you believe that your prayers are part of how God acts in the world? How would that change your intercession?"
    ref: "8:5-8:6"
  - q: "Compare the first, second and fourth trumpets with the plagues of Egypt (Exodus 9:23–25; 7:20–21; 10:21–23). What does the exodus tell us about the purpose of the trumpets – for Rome, and for every power that oppresses God's people? What is God aiming at: the destruction of creation, or the liberation of his people?"
    ref: "8:7-8:12"
  - q: "The locusts may harm “only the people who do not have the seal of God on their foreheads”. The key, the authority and the five months – all are given. Their king Apollyon (“Destroyer”) is perhaps a dig at Apollo. What comfort did this give the churches in Asia? Where do you need to hear that evil is on a leash?"
    ref: "9:1-9:11"
  - q: "“And the rest of humankind … did not even repent of the works of their hands”; like Pharaoh, they cling to idols “which can neither see nor hear nor walk” (Psalm 115:4–8). Which crisis in your life turned you to God – and which made you harder instead? What are the “works of your hands” that you trust more than God?"
    ref: "9:20-9:21"
  - q: "In Israel the trumpet was the watchman's alarm (Ezekiel 33:3–6) – a God who warns has not yet given up on the world. How do you respond to news of disasters – with fear, with speculation, or with prayer and repentance? Do you hear the call to repent as a threat or as an invitation?"
    ref: "8:13"
application:
  - "Sit in silence for five minutes before you pray, every day this week. Then write down one injustice you have long been praying about, and bring it before God again – knowing that heaven is listening."
  - "Take ten minutes and ask yourself honestly: which “work of my hands” has taken my heart captive? Name it before God, and take one small step away from it – and towards him."
prayer: "Begin with a full minute of silence together – no words, only remembering who sits on the throne. Then let each person pray one sentence for a situation they have long prayed about, or for persecuted believers. Close with Jesus' words to the churches (3:20), and thank him that he always lives to intercede for us (Hebrews 7:25)."
leader_notes:
  - "Two dense chapters (days 14–15). Don't try to explain every detail of the locusts or the horses; the chapters work by overwhelming images. Keep the group on three things: the prayers rise, the judgements are limited, and people do not repent."
  - "Avoid matching the trumpets to today's disasters (or even guessing which trumpet has just sounded). Some interpreters think the first readers may have thought of Vesuvius (AD 79) at the burning mountain; futurist interpreters expect literal plagues in a future period before Christ's return. Mention this fairly if asked, then return to the call to prayer and repentance."
  - "The locusts and the two hundred million horsemen invite decoding (helicopters, modern armies). Gently point out that John himself says he heard the number (9:16): it is an army too large to grasp, painted with Joel 2 and the smoke of Sodom (Genesis 19:24, 28), not a code."
  - "Some Bibles read an angel instead of an eagle in 8:13; older translations follow later manuscripts. Our translation follows the SBL Greek text. If someone notices, explain briefly and move on."
  - "Handle with care: some members may have prayed for years without seeing an answer – for a child, an illness, an injustice. The point of 8:3–5 is not that prayer works like a lever, but that no prayer is lost. Don't promise outcomes."
  - "Point ahead: next week the pause between the sixth and seventh trumpet – the little scroll and the two witnesses: God's answer to a world that will not repent is his word in the mouth of his witnesses."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
