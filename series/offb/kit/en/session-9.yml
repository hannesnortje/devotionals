session: 9
lang: en
title: "The Song on the Shore"
ref: "14:1-16:21"
days: [20, 21, 22]
big_idea: "After the dragon and the beasts, the curtain opens on the Lamb standing on Zion with his people, who bear his name and sing the song of Moses and of the Lamb before a single bowl is poured out – God's judgement on evil is real and just, but those who belong to the Lamb are kept, and the end of evil has already been decided."
opening: "Is there a song that carries you through hard times – one you sing or hum when things are difficult? What does it do for you?"
context: >-
  In chapter 13 the dragon and his two beasts seemed to rule the world, and no one could buy or sell without the beast's mark.
  Chapters 14–16 draw back the curtain again: the Lamb stands on Mount Zion with the whole people of God, angels proclaim an eternal gospel and the harvest of the earth is gathered in.
  Then come the seven last plagues: before a single bowl is poured out, the conquerors sing on the shore of the sea of glass, and then the bowls fall like the plagues of Egypt on the kingdom of the beast – until the voice from the throne cries, “It is done!”
read_aloud_tip: "Three readers, one per chapter. In 14:6–11 let three voices take the three angels; the whole group reads the song of 15:3–4 together; in chapter 16 the reader pauses briefly after each bowl, and the group reads the answer of the altar (16:7) aloud."
hebrew:
  - word: "gegrammenon epi tōn metōpōn autōn"
    hebrew: "γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν"
    gloss: "written on their foreheads"
    point: "The verb form describes something that has been written and stays written. The mark of the beast has to be enforced (13:16); the name of the Lamb and of his Father is a lasting gift (14:1; cf. 7:3; 22:4). No one is unmarked – everyone belongs to someone."
  - word: "tēn ōdēn Mōyseōs … kai tēn ōdēn tou arniou"
    hebrew: "τὴν ᾠδὴν Μωϋσέως … καὶ τὴν ᾠδὴν τοῦ ἀρνίου"
    gloss: "the song of Moses … and the song of the Lamb"
    point: "Probably not two songs but one: the song of the exodus (Exodus 15), now sung about a greater exodus. The blood of the Passover lamb brought Israel out of Egypt; the blood of the Lamb has purchased people for God from every nation (5:9)."
  - word: "Gegonen"
    hebrew: "Γέγονεν"
    gloss: "It is done!"
    point: "The perfect tense: something has happened and stands. The kings are still gathering for war, yet the outcome is already decided. The same word sounds again at the new creation (21:6)."
discussion:
  - q: "After the beast's mark: “And I looked, and there was the Lamb, standing on Mount Zion”. The dragon stood on the sand of the sea (12:18); the Lamb stands on the rock of Zion. What would this have meant to a believer in Pergamum who felt almost alone in not bowing down? Where do you need this look behind the curtain today?"
    ref: "14:1"
  - q: "The 144,000 have “his name and his Father's name written on their foreheads” and follow the Lamb wherever he goes. Which label (job, income, looks, failures) weighs on you most, and what changes when his name is written over it? Where are you reluctant to follow the Lamb at the moment?"
    ref: "14:1-14:5"
  - q: "Before the fall of Babylon and the solemn warning, an angel flies with “an eternal gospel” for every nation: “Fear God and give him glory”. Why do you think the gospel comes first? And what does verse 13 say to someone who has lost a loved one in the Lord?"
    ref: "14:6-14:13"
  - q: "The conquerors stand beside the sea of glass and sing “the song of Moses, the servant of God, and the song of the Lamb”. Read Exodus 15:1–2, 11 and Jeremiah 10:6–7 aloud. What links do you see between Israel on the shore of the Red Sea and God's people here? What is the greater exodus the Lamb has brought about?"
    ref: "15:2-15:4"
  - q: "The song comes before the bowls, and there is not a word in it about the singers' own suffering or courage – every line is about God. Where are you standing at the moment: still in the sea, or already on the shore? What would it mean to sing “just and true are your ways” there already?"
    ref: "15:3-15:4"
  - q: "The bowls bring back the plagues of Egypt (Exodus 7–10). Twice we read that “they did not repent”, and three times that they blasphemed God. What does Pharaoh's story teach about why judgement alone does not change a heart? When something hurts, do you become softer or harder towards God?"
    ref: "16:1-16:11"
  - q: "The altar says: “Yes, Lord God, the Almighty, true and just are your judgements.” And Christ says: “Look, I am coming like a thief. Blessed is the one who stays awake and keeps his clothes”. How do these voices comfort those who suffer injustice? What does “staying awake” mean for you – without calculating dates?"
    ref: "16:5-16:17"
application:
  - "Tonight write on a card: I belong to the Lamb. Put it by the mirror, and each morning read 15:3–4 aloud and thank God for one concrete work he has done in your life."
  - "Take two minutes one evening to ask where you have fallen asleep this week – in prayer, honesty or love. Then pray for one person or place that suffers injustice, using the words of 16:7."
prayer: "Begin by reading 15:3–4 aloud together, or sing a song of praise the group knows. Then pray in twos or threes: thank the Lamb that his name is written over your life, name one situation in which you feel you are still in the sea, and pray for one place in the world that suffers injustice. Close together with 16:7: “Yes, Lord God, the Almighty, true and just are your judgements.”"
leader_notes:
  - "This session covers three chapters and three devotionals (days 20–22). Chapter 16 is hard; do not skip it, but protect time for questions 4 and 5 – the song on the shore is the heart of the evening."
  - "The 144,000 (14:1–5) are, as in 7:4–9, the whole people of God, not an elite group or a single nation. “Virgins” (14:4) is the Old Testament picture of soldiers keeping themselves pure for holy war (Deuteronomy 23:9–14; 1 Samuel 21:5) and of Israel following her God faithfully (Jeremiah 2:2) – it does not mean that only the unmarried belong to the Lamb."
  - "The bowls are not the next chapter in a calendar but the same reality as the trumpets (8–9), now in full seriousness: God's patience with evil has an end. Some group members may read them as a future period just before Christ's return (futurist), others only as Rome's judgement (preterist); name these views fairly in a sentence and come back to the pastoral message. Armageddon (16:16) is most likely “the mountain of Megiddo”, a symbol of the final revolt – the battle itself is never described. Steer away from maps and news headlines."
  - "Handle the language of wrath with care (14:10–11, 19–20; 16). Some people grew up with preaching that made them afraid. Stress what the devotionals stress: this is comfort for those who suffer, not a weapon to threaten others; God's wrath is his faithfulness to the victims; those sealed by God do not stand under it (7:3; Exodus 8:22). Read the chapter about our own hearts, not about other people."
  - "The new exodus runs through these chapters – the seal on the forehead, the song by the sea, the tent of witness (15:5; Exodus 40:34–35), the plagues. Let the group discover it in question 4 rather than explaining it in advance."
  - "Point ahead: next week chapters 17–19 – the prostitute on the beast, the fall of Babylon, the wedding of the Lamb and the Rider called Faithful and True."
