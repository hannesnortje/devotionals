session: 2
lang: en
title: "Four Churches, One Lord"
ref: "2:1-2:29"
days: [3, 4, 5, 6]
big_idea: "The one who walks among the lampstands knows each church as it really is – Ephesus's loveless orthodoxy, Smyrna's rich poverty, Pergamum's quiet compromise and Thyatira's loving tolerance – and calls each of them, and us, to hear, repent, hold fast and conquer."
opening: "Imagine that someone who knows you well writes you a short, honest letter: one thing they admire in you and one thing that worries them. What do you think it would say? (You do not have to share the answer.)"
context: >-
  The seven cities lie on a circular road, probably the route a messenger from Patmos would follow: first Ephesus, then Smyrna, Pergamum and Thyatira.
  Each letter follows a pattern – a title of Christ taken from chapter 1, “I know …”, praise or rebuke, a call to repent or to hold fast, a promise to the one who conquers, and the call to hear.
  The letters were not private mail: “what the Spirit says to the churches” was read aloud in all seven, so every church heard every letter – and so do we.
read_aloud_tip: "Let the four members who each took a church read their letter (vv. 1–7, 8–11, 12–17, 18–29) as if it were addressed to their own congregation. The whole group reads the refrain together each time: “Whoever has an ear should hear what the Spirit says to the churches.”"
hebrew:
  - word: "aphiēmi"
    hebrew: "ἀφίημι"
    gloss: "abandoned"
    point: "Ephesus had not lost its first love the way you lose your car keys; it had let go of it, left it behind (2:4). The same verb returns in Thyatira: “you tolerate” – literally, you let her go on (2:20). Ephesus let go of love; Thyatira let go of its duty to stop evil."
  - word: "ptōcheia"
    hebrew: "πτωχεία"
    gloss: "poverty"
    point: "Not the modest poverty of having just enough (penia), but the beggar's poverty of having nothing at all – the price Smyrna's Christians paid for refusing to honour the emperor. And then Christ's four words: “but you are rich” (2:9)."
  - word: "psēphos leukē"
    hebrew: "ψῆφος λευκή"
    gloss: "white stone"
    point: "In a law court a white pebble could mean acquittal; small stones or tablets also served as admission tickets to a banquet. To believers condemned by Rome and shut out of the guild feasts, Christ gives acquittal and a place at his own table – with a new name known only to the one who receives it (2:17)."
discussion:
  - q: "Each reporter: with which title does Christ introduce himself in your letter, and why does it fit that city? (Ephesus: the one who walks among the lampstands; Smyrna: the one who was dead and came to life; Pergamum: the sword, in the city of the governor's sword; Thyatira: the Son of God, in the city of a “son of Zeus”.)"
    ref: "2:1-2:18"
  - q: "Ephesus: “I know your works, your toil and your endurance” – and yet “you have abandoned your first love”. How can a church, or a Christian, be busy and right and still have left love behind? What were your own “first works” when grace first overwhelmed you?"
    ref: "2:2-2:5"
  - q: "Smyrna: “I know your affliction and your poverty – but you are rich”. The affliction is real, but it lasts “ten days” – intense, yet measured out by God. How does this change the way you look at a hard season, or at your own idea of being blessed?"
    ref: "2:8-2:11"
  - q: "Pergamum: “I know where you live: where the throne of Satan is.” Christ honours Antipas with his own title from 1:5: “my witness, my faithful one”. What does your “Pergamum” look like – the place where you feel pressure to honour another lord or to keep quiet about yours?"
    ref: "2:12-2:13"
  - q: "Two names from the Old Testament: Balaam (read Numbers 25:1–3 and 31:16) and Jezebel (1 Kings 16:31–33; 21:25). What did they do to Israel – not by open attack, but by seduction? Why might Jesus use these names for teachers inside the church, and where do we meet the same kind of reasoning today?"
    ref: "2:14-2:20"
  - q: "Ephesus could not bear evil people but had let go of love; Thyatira overflowed with love, faith, service and endurance – but “you tolerate the woman Jezebel”. Which of the two is the greater danger for you, and for our church?"
    ref: "2:19-2:25"
  - q: "Look at the promises: the tree of life (Genesis 2–3), the crown of life, the hidden manna and the white stone, authority with the Messiah (Psalm 2:8–9) and the morning star (cf. 22:16). Which promise speaks most to you, and why? What would “conquering” look like for you this week?"
    ref: "2:7-2:28"
application:
  - "Read “your” church's letter once more each day this week and write down one sentence: what would the risen Christ say to me in this letter?"
  - "Name one small compromise – one “pinch of incense” – that you have been calling “not that bad”, and take one concrete step away from it; or take up again one “first work” of simple love for Jesus."
prayer: "Pray for the four churches in turn: for first love (Ephesus), for courage under pressure (Smyrna), for undivided loyalty (Pergamum), for discernment with love (Thyatira). Let each reporter pray for “their” church and then for our own church in the same matter. Close with 2:25: “Only hold fast to what you have until I come.”"
leader_notes:
  - "This session covers four devotionals (days 3–6) and a long chapter. Let each reporter give a two-minute summary of their city from the devotional (Ephesus: Artemis and the emperor temple; Smyrna: Roma, the emperor cult and myrrh; Pergamum: the altar of Zeus, Asclepius and the governor's right of the sword; Thyatira: trade guilds and their idol feasts). If time is short, choose questions 1, 2, 4 and 6."
  - "Some read the seven churches as seven successive eras of church history. Name this fairly; then point out that the text presents them as real churches of John's day, and that each letter ends with “what the Spirit says to the churches” – every church in every age hears all seven."
  - "Handle with care: “synagogue of Satan” (2:9) is not a verdict on Jewish people in general. The devotional reads it as a local conflict in which some probably denounced Christians to the authorities; Christ's point is that true belonging to God lies in faith. Do not let the verse be used against Jewish people."
  - "Handle with care: “Jezebel” is Christ's name for one teacher who led people into idolatry and immorality. It is not a label for women, or for anyone in our church. The letters call us to faithfulness – “whose am I?” – not to judging others."
  - "“I will move your lampstand” (2:5) is not about an individual losing salvation, but about a church losing its place as a light-bearer. The devotional calls the Nicolaitans a group who allowed compromise with idolatry (cf. 2:14–15); little more is known about them."
  - "Point ahead: next week chapter 3 – Sardis, Philadelphia and Laodicea. Ask three people to take one church each for next time."
timing:
  welcome: 10
  read: 15
  context: 10
  discussion: 40
  prayer: 15
