session: 9
lang: de
title: "Das Lied am Ufer"
ref: "14:1-16:21"
days: [20, 21, 22]
big_idea: "Nach dem Drachen und den Tieren öffnet sich der Vorhang: Das Lamm steht auf dem Zion mit seinem Volk, das seinen Namen trägt und das Lied des Mose und des Lammes singt, bevor auch nur eine Schale ausgegossen ist – Gottes Gericht über das Böse ist wirklich und gerecht, aber die zum Lamm gehören, sind bewahrt, und das Ende des Bösen ist schon entschieden."
opening: "Gibt es ein Lied, das dich durch schwere Zeiten trägt – eines, das du singst oder summst, wenn es schwierig wird? Was bewirkt es bei dir?"
context: >-
  In Kapitel 13 schienen der Drache und seine beiden Tiere die Welt zu beherrschen, und ohne das Kennzeichen des Tieres konnte niemand kaufen oder verkaufen.
  Die Kapitel 14–16 ziehen den Vorhang wieder zurück: Das Lamm steht mit dem ganzen Volk Gottes auf dem Berg Zion, Engel verkünden ein ewiges Evangelium, und die Ernte der Erde wird eingebracht.
  Dann kommen die sieben letzten Plagen: Bevor eine einzige Schale ausgegossen wird, singen die Sieger am Ufer des gläsernen Meeres; dann fallen die Schalen wie die Plagen Ägyptens auf das Reich des Tieres – bis die Stimme vom Thron ruft: „Es ist geschehen!“
read_aloud_tip: "Drei Vorleser, einer pro Kapitel. In 14,6–11 übernehmen drei Stimmen die drei Engel; das Lied in 15,3–4 lest ihr alle gemeinsam; in Kapitel 16 macht der Vorleser nach jeder Schale eine kurze Pause, und die Gruppe liest die Antwort des Altars (16,7) laut mit."
hebrew:
  - word: "gegrammenon epi tōn metōpōn autōn"
    hebrew: "γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν"
    gloss: "an ihren Stirnen geschrieben"
    point: "Die Verbform beschreibt etwas, das geschrieben wurde und geschrieben bleibt. Das Kennzeichen des Tieres muss erzwungen werden (13,16); der Name des Lammes und seines Vaters ist eine bleibende Gabe (14,1; vgl. 7,3; 22,4). Niemand ist ungezeichnet – jeder gehört jemandem."
  - word: "tēn ōdēn Mōyseōs … kai tēn ōdēn tou arniou"
    hebrew: "τὴν ᾠδὴν Μωϋσέως … καὶ τὴν ᾠδὴν τοῦ ἀρνίου"
    gloss: "das Lied des Mose … und das Lied des Lammes"
    point: "Wahrscheinlich nicht zwei Lieder, sondern eines: das Lied des Auszugs (2. Mose 15), jetzt gesungen über einen größeren Auszug. Das Blut des Passalammes führte Israel aus Ägypten; das Blut des Lammes hat Menschen aus allen Nationen für Gott erkauft (5,9)."
  - word: "Gegonen"
    hebrew: "Γέγονεν"
    gloss: "Es ist geschehen!"
    point: "Das Perfekt: Etwas ist geschehen und bleibt so stehen. Die Könige versammeln sich noch zum Krieg, und doch ist der Ausgang schon entschieden. Dasselbe Wort erklingt wieder bei der neuen Schöpfung (21,6)."
discussion:
  - q: "Nach dem Kennzeichen des Tieres: „Und ich sah, und sieh, das Lamm stand auf dem Berg Zion“. Der Drache stand auf dem Sand des Meeres (12,18); das Lamm steht auf dem Felsen Zion. Was hätte das einem Christen in Pergamon bedeutet, der sich fast allein nicht beugte? Wo brauchst du heute diesen Blick hinter die Kulissen?"
    ref: "14:1"
  - q: "Die 144 000 haben „seinen Namen und den Namen seines Vaters an ihren Stirnen geschrieben“ und folgen dem Lamm, wohin es auch geht. Welches Etikett (Beruf, Einkommen, Aussehen, Versagen) lastet am schwersten auf dir, und was ändert sich, wenn sein Name darüber steht? Wohin folgst du dem Lamm gerade nur ungern?"
    ref: "14:1-14:5"
  - q: "Noch vor dem Fall Babylons und der ernsten Warnung fliegt ein Engel, der „ein ewiges Evangelium“ für jede Nation hat: „Fürchtet Gott und gebt ihm die Ehre“. Warum kommt das Evangelium wohl zuerst? Und was sagt Vers 13 jemandem, der einen geliebten Menschen im Herrn verloren hat?"
    ref: "14:6-14:13"
  - q: "Die Sieger stehen am gläsernen Meer und singen „das Lied des Mose, des Knechtes Gottes, und das Lied des Lammes“. Lest 2. Mose 15,1–2.11 und Jeremia 10,6–7 laut. Welche Verbindungen seht ihr zwischen Israel am Ufer des Schilfmeeres und Gottes Volk hier? Was ist der größere Auszug, den das Lamm bewirkt hat?"
    ref: "15:2-15:4"
  - q: "Das Lied kommt vor den Schalen, und es steht kein Wort darin über das eigene Leiden oder den Mut der Sänger – jede Zeile handelt von Gott. Wo stehst du gerade: noch mitten im Meer oder schon am Ufer? Was würde es bedeuten, schon dort zu singen: „gerecht und wahrhaftig sind deine Wege“?"
    ref: "15:3-15:4"
  - q: "Die Schalen bringen die Plagen Ägyptens zurück (2. Mose 7–10). Zweimal lesen wir „sie kehrten nicht um“, und dreimal, dass sie Gott lästerten. Was lehrt uns die Geschichte des Pharao darüber, warum Gericht allein kein Herz verändert? Wenn dir etwas wehtut – wirst du weicher oder härter Gott gegenüber?"
    ref: "16:1-16:11"
  - q: "Der Altar sagt: „Ja, Herr, Gott, du Allmächtiger, wahrhaftig und gerecht sind deine Gerichte.“ Und Christus: „Sieh, ich komme wie ein Dieb. Glückselig, wer wach bleibt und seine Kleider bewahrt“. Wie trösten diese Stimmen die, die Unrecht leiden? Was heißt „wach bleiben“ für dich – ohne Daten zu berechnen?"
    ref: "16:5-16:17"
application:
  - "Schreib heute Abend auf eine Karte: Ich gehöre dem Lamm. Leg sie an den Spiegel, lies jeden Morgen 15,3–4 laut und danke Gott für ein konkretes Werk, das er in deinem Leben getan hat."
  - "Nimm dir an einem Abend zwei Minuten und frag dich, wo du in dieser Woche eingeschlafen bist – im Gebet, in der Ehrlichkeit, in der Liebe. Dann bete für einen Menschen oder einen Ort, der Unrecht leidet, mit den Worten von 16,7."
prayer: "Lest zu Beginn 15,3–4 gemeinsam laut, oder singt ein Loblied, das die Gruppe kennt. Dann betet zu zweit oder zu dritt: Dankt dem Lamm, dass sein Name über eurem Leben geschrieben steht, nennt eine Situation, in der ihr euch noch mitten im Meer fühlt, und betet für einen Ort in der Welt, der Unrecht leidet. Schließt gemeinsam mit 16,7: „Ja, Herr, Gott, du Allmächtiger, wahrhaftig und gerecht sind deine Gerichte.“"
leader_notes:
  - "Dieses Treffen umfasst drei Kapitel und drei Andachten (Tag 20–22). Kapitel 16 ist schwer; lass es nicht aus, aber halte Zeit für die Fragen 4 und 5 frei – das Lied am Ufer ist das Herz des Abends."
  - "Die 144 000 (14,1–5) sind wie in 7,4–9 das ganze Volk Gottes, keine Elitegruppe und nicht ein einzelnes Volk. „Jungfräulich“ (14,4) ist das alttestamentliche Bild von Soldaten, die sich für den heiligen Krieg rein halten (5. Mose 23,10–15; 1. Samuel 21,6), und von Israel, das seinem Gott treu folgt (Jeremia 2,2) – es heißt nicht, dass nur Unverheiratete zum Lamm gehören."
  - "Die Schalen sind nicht das nächste Kapitel eines Kalenders, sondern dieselbe Wirklichkeit wie die Trompeten (8–9), jetzt in ihrem ganzen Ernst: Gottes Geduld mit dem Bösen hat ein Ende. Manche in der Gruppe lesen sie vielleicht als eine künftige Zeit kurz vor Christi Wiederkunft (futuristisch), andere nur als Gericht über Rom (präteristisch); nenne diese Sichtweisen fair in einem Satz und kehre zur seelsorgerlichen Botschaft zurück. Harmagedon (16,16) ist wahrscheinlich „der Berg von Megiddo“, ein Sinnbild für den letzten Aufstand – die Schlacht selbst wird nie beschrieben. Lenke weg von Landkarten und Schlagzeilen."
  - "Geh behutsam mit der Sprache vom Zorn um (14,10–11.19–20; 16). Manche sind mit einer Predigt aufgewachsen, die ihnen Angst gemacht hat. Betone, was die Andachten betonen: Das ist Trost für die Leidenden, keine Waffe, um anderen zu drohen; Gottes Zorn ist seine Treue zu den Opfern; wer von Gott versiegelt ist, steht nicht unter ihm (7,3; 2. Mose 8,18). Lest das Kapitel über unser eigenes Herz, nicht über andere."
  - "Der neue Auszug zieht sich durch diese Kapitel – das Siegel an der Stirn, das Lied am Meer, das Zelt des Zeugnisses (15,5; 2. Mose 40,34–35), die Plagen. Lass die Gruppe ihn in Frage 4 selbst entdecken, statt ihn vorher zu erklären."
  - "Ausblick: Nächste Woche Kapitel 17–19 – die Hure auf dem Tier, der Fall Babylons, die Hochzeit des Lammes und der Reiter, der Treu und Wahrhaftig heißt."
