session: 5
lang: de
title: "Wer kann bestehen?"
ref: "6:1-7:17"
days: [12, 13]
big_idea: "Das geschlachtete Lamm hält die Siegel in der Hand: Krieg, Hunger und Tod ziehen nur aus, wenn es sie öffnet, und nur so weit, wie Gott es zulässt – und auf die große Frage „wer kann bestehen?“ antwortet eine Menge, die niemand zählen kann, aus jeder Nation, von Gott versiegelt und im Blut des Lammes gewaschen."
opening: "Wenn du im Radio eine schlechte Nachricht hörst oder sie auf dem Handy liest – was ist deine erste Reaktion: abschalten, dir Sorgen machen, eine Erklärung suchen oder beten? Warum?"
context: >-
  In Kapitel 4–5 sah Johannes den Thron im Himmel und das Lamm, das allein würdig ist, die Buchrolle zu nehmen. Jetzt öffnet das Lamm die Siegel eines nach dem anderen:
  vier Reiter, die Seelen unter dem Altar und ein Himmel, der sich zusammenrollt wie eine Buchrolle (Kapitel 6). Für die kleinen Gemeinden in Asia, die Krieg, Hunger und den Druck Roms kannten,
  war das keine Fantasie. Vor dem siebten Siegel hält die Geschichte inne (Kapitel 7): Gott versiegelt seine Knechte, und Johannes sieht die Menge, die niemand zählen konnte.
read_aloud_tip: "Eine Person liest die Kapitel vor; bei jedem Siegel sagt die ganze Gruppe gemeinsam „Komm!“ (6,1.3.5.7). Eine zweite Person übernimmt den Ruf der Seelen (6,10) und den Ältesten (7,13–17); die Lieder von 7,10 und 7,12 lesen alle gemeinsam."
hebrew:
  - word: "edothē"
    hebrew: "ἐδόθη"
    gloss: "wurde gegeben"
    point: "Der Kranz, das Schwert und die Vollmacht werden den Reitern gegeben (6,2.4.8). Die Passivform weist auf Gott als den, der zulässt – und begrenzt: Öl und Wein bleiben verschont, der Tod bekommt den vierten Teil der Erde, nicht die ganze. Wie in Hiob 1–2 kann der Zerstörer nur so weit gehen, wie Gott es erlaubt."
  - word: "stathēnai / hestōtes"
    hebrew: "σταθῆναι / ἑστῶτες"
    gloss: "bestehen / sie standen"
    point: "Kapitel 6 endet mit der Frage von Nahum 1,6: „wer kann bestehen?“ (6,17). Kapitel 7 beantwortet sie: eine Menge, die „vor dem Thron und vor dem Lamm“ steht (7,9) – nicht aus eigener Kraft, sondern weil das Lamm selbst zuerst stand, „wie geschlachtet“ (5,6)."
  - word: "sphragida"
    hebrew: "σφραγῖδα"
    gloss: "Siegel"
    point: "Ein Siegel war das Zeichen von Besitz und Echtheit – ein Siegelring im Wachs eines Briefes, ein Stempel auf einer Fracht. Was versiegelt ist, gehört jemandem und wird von ihm bewacht. Gottes Knechte werden an ihren Stirnen versiegelt, bevor der Sturm kommt (7,3)."
discussion:
  - q: "Jeder Reiter zieht erst aus, wenn das Lamm ein Siegel öffnet, und jedes Mal wird etwas gegeben: „ihm wurde ein Kranz gegeben“, „ihm wurde ein großes Schwert gegeben“. Welcher der Reiter – Krieg, wirtschaftlicher Druck, Krankheit, Tod – macht dir gerade am meisten Angst? Was ändert sich, wenn du daran denkst, wer die Siegel öffnet?"
    ref: "6:1-6:8"
  - q: "Vergleicht Vers 8 mit Sacharja 1,8–11 und Hesekiel 14,21. Jesus sagte, dass Kriege und Hungersnöte die ganze Zeit bis zu seiner Wiederkunft prägen, dass das aber noch nicht das Ende ist (Markus 13,7–8). Wie sollen wir also die Siegel lesen – als Fahrplan oder als Bild der Welt zwischen Christi erstem und zweitem Kommen?"
    ref: "6:8"
  - q: "Die Seelen unter dem Altar rufen: „Wie lange, heiliger und wahrhaftiger Gebieter, richtest du nicht und rächst unser Blut nicht an denen, die auf der Erde wohnen?“ Gott tadelt sie nicht, sondern sagt, sie sollten „noch eine kurze Zeit ruhen“. Was sagt das über ehrliches Gebet? Worüber rufst du schon lange „Wie lange?“"
    ref: "6:9-6:11"
  - q: "Könige, Befehlshaber und Reiche verbergen sich in den Höhlen – aber auch „jeder Sklave und Freie“. Sie verbergen sich „vor dem Zorn des Lammes“. Wie kann der Zorn dessen, der für die Welt geschlachtet wurde, zugleich das ernsteste und das hoffnungsvollste Wort des Kapitels sein? Worauf verlässt du dich, um an jenem Tag zu bestehen?"
    ref: "6:15-6:17"
  - q: "Vor dem Sturm werden Gottes Knechte an ihren Stirnen versiegelt (vgl. 2. Mose 12,13; Hesekiel 9,4–6). In Asia fragten der Kaiserkult und die Zünfte jeden Tag, wem die Gläubigen gehören – welcher Trost lag in diesem Siegel? Welchen Etiketten, die andere dir aufkleben, glaubst du mehr als dem Siegel des lebendigen Gottes?"
    ref: "7:1-7:3"
  - q: "Johannes hört eine Zahl – hundertvierundvierzigtausend aus den Stämmen Israels –, und dann sieht er „eine große Menge, die niemand zählen konnte, aus jeder Nation und allen Stämmen und Völkern und Sprachen“. Wie erfüllt sich darin Gottes Verheißung an Abraham (1. Mose 15,5; 12,3)? Wie groß ist die Gemeinde in deiner Vorstellung?"
    ref: "7:4-7:10"
  - q: "„Sie haben ihre Gewänder gewaschen und sie weiß gemacht im Blut des Lammes.“ Die Menge singt nicht von ihrer Ausdauer, sondern: „Die Rettung gehört unserem Gott, der auf dem Thron sitzt, und dem Lamm!“ Wo willst du deine Gewänder noch selbst sauber halten? Welche Verheißung aus den Versen 15–17 brauchst du diese Woche am meisten?"
    ref: "7:13-7:17"
application:
  - "Wenn du diese Woche Nachrichten liest oder hörst, wähle einen Ort, an dem Krieg oder Hunger herrscht, und bete dafür – und sprich es laut aus: Das Lamm hält die Siegel in seiner Hand."
  - "Wenn du morgens dein Gesicht im Spiegel siehst, sag dir: Ich bin versiegelt, und ich gehöre dem Lamm. Bete diese Woche einmal für Gläubige in einem Land und einer Sprache, die nicht deine sind."
prayer: "Beginnt mit dem Lied der Menge, gemeinsam laut gelesen: „Die Rettung gehört unserem Gott, der auf dem Thron sitzt, und dem Lamm!“ (7,10). Dann bringt jede und jeder in einem Satz ein „Wie lange?“ vor Gott – für sich selbst oder für leidende Gläubige anderswo. Schließt mit dem Dank für die Verheißung: „Gott wird jede Träne von ihren Augen abwischen.“"
leader_notes:
  - "Dieses Treffen umfasst zwei Andachten (Tag 12–13). Kapitel 6 macht Angst, und Kapitel 7 ist die Antwort darauf – lass das Gespräch nicht in Kapitel 6 stecken bleiben. Halte mindestens fünfzehn Minuten für Kapitel 7 frei."
  - "Unser Ansatz in dieser Reihe: Die Siegel zeigen die Welt, wie sie zwischen dem ersten und dem zweiten Kommen Christi ist, und wer sie in der Hand hält; erst das sechste Siegel führt uns bis an den großen Tag selbst. Futuristische Ausleger verlegen die Siegel in eine künftige Zeit kurz vor der Wiederkunft Christi. Wenn das zur Sprache kommt, nenne es fair in einem Satz und kehre zum seelsorgerlichen Punkt zurück: Das Lamm öffnet die Siegel, und die Geschichte ist nicht außer Kontrolle."
  - "Der erste Reiter (6,2): Manche sehen in ihm Christus selbst, weil er in 19,11 auf einem weißen Pferd reitet; viele lesen ihn als Eroberung und Krieg, vielleicht sogar als Nachahmung Christi, weil er mit den anderen dreien auszieht. Beide Deutungen können genannt werden; verweile nicht lange dabei."
  - "Die 144 000: Dispensationalisten lesen sie wörtlich als jüdische Gläubige, getrennt von der Menge. Das Muster von Hören und Sehen (wie in 5,5–6) macht wahrscheinlich, dass Johannes ein Volk von zwei Seiten beschreibt. Israel wird nicht ausgelöscht oder ersetzt; die Nationen werden in Abrahams Familie eingepfropft (Römer 11,17–18; Galater 3,29). Bleib im Ton warm – keine Polemik."
  - "Behutsam: In der Gruppe kann es Menschen geben, die trauern oder Angehörige in Ländern mit Krieg oder Verfolgung haben. Lass den Ruf „Wie lange?“ stehen, ohne vorschnell Antworten zu geben, und wehre jeden Versuch ab, die Reiter mit heutigen Schlagzeilen gleichzusetzen oder Daten zu berechnen."
  - "Ausblick: Nächste Woche das siebte Siegel – Stille im Himmel, die Gebete der Heiligen und die Trompeten."
