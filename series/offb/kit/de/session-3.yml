session: 3
lang: de
title: "Wach auf, halte fest, öffne die Tür"
ref: "3:1-3:22"
days: [7, 8, 9]
big_idea: "Christus sieht durch Ruf, Größe und Reichtum hindurch: Er weckt eine Gemeinde, die nur lebendig aussieht, er öffnet eine Tür für eine Gemeinde mit wenig Kraft, und er klopft an die Tür einer Gemeinde, die meint, nichts zu brauchen – und allen dreien bietet er einen Platz mit ihm auf seinem Thron an."
opening: "Was ist der Unterschied zwischen einem Haus, das auf Fotos gut aussieht, und einem Haus, in dem man gut wohnen kann? Hat dich dieser Unterschied schon einmal überrascht?"
context: >-
  Die Straße des Boten endet mit drei weiteren Städten. Sardes war stolz auf seine Vergangenheit und auf eine Burg, die es für uneinnehmbar hielt – und doch wurde sie zweimal erobert, weil niemand Wache hielt.
  Philadelphia war jung und klein, auf einer fruchtbaren Ebene, die immer wieder von Erdbeben erschüttert wurde. Laodizea war reich, mit Banken, Textilhandel und einer Ärzteschule, aber sein Wasser kam lau an.
  Drei Gemeinden, drei Gefahren – Ruf, Schwäche, Bequemlichkeit –, und die sieben Briefe enden mit einem Thron (3,21).
read_aloud_tip: "Die drei, die je eine Gemeinde übernommen haben, lesen ihren Brief (V. 1–6, 7–13, 14–22); die ganze Gruppe liest den Kehrvers gemeinsam. Zum Schluss liest eine Person Vers 20 noch einmal langsam, und ihr haltet einen Moment Stille."
hebrew:
  - word: "onoma"
    hebrew: "ὄνομα"
    gloss: "Name"
    point: "Name heißt hier Ruf: „Du hast den Namen, dass du lebst, und bist tot“ (3,1). Sardes war bekannt, aktiv und angesehen – und vor Christus ein schöner Grabstein mit eindrucksvoller Inschrift. Doch derselbe Brief kennt auch „einige wenige Namen“, die ihre Kleider nicht befleckt haben (3,4)."
  - word: "mikran dynamin"
    hebrew: "μικρὰν δύναμιν"
    gloss: "wenig Kraft"
    point: "Kein Vorwurf wegen schwachen Glaubens, sondern die Beschreibung einer kleinen, armen Gemeinde ohne Einfluss (3,8). Und doch hat sie Christi Wort bewahrt und seinen Namen nicht verleugnet – und der den Schlüssel Davids hat, hat ihr eine offene Tür gegeben."
  - word: "chliaros"
    hebrew: "χλιαρός"
    gloss: "lau"
    point: "Das Wort kommt im Neuen Testament nur hier vor (3,16). Viele Ausleger hören dahinter das Wasser des Lykostals: heiße, heilende Quellen in Hierapolis, kaltes Trinkwasser in Kolossä – und laues Wasser in Laodizea, das niemanden heilte und niemandes Durst stillte."
discussion:
  - q: "An jeden, der berichtet: Worauf war deine Stadt stolz (Sardes: seine uneinnehmbare Burg; Philadelphia: sein Name und seine neuen Kaisernamen; Laodizea: seine Banken, seine schwarze Wolle und seine Augensalbe)? Wo trifft der Brief Christi genau diesen Punkt?"
    ref: "3:1-3:18"
  - q: "Sardes: „Du hast den Namen, dass du lebst, und bist tot.“ Keine Verfolgung, keine Irrlehrer – kann Frieden mit der Welt ein Zeichen geistlichen Schlafs sein? Wie groß ist der Abstand zwischen deinem „Namen“ und deinem Leben mit Gott, wenn niemand zusieht – und was würde „Werde wach und stärke das Übrige“ für dich bedeuten?"
    ref: "3:1-3:4"
  - q: "Philadelphia: Christus ist der, „der den Schlüssel Davids hat, der öffnet, und niemand wird schließen, und der schließt, und niemand öffnet“ (Jesaja 22,20–23). Was bedeutete der Schlüssel für Eljakim, und was bedeutet es, dass Jesus ihn hält? Welche Tür wurde dir vor der Nase zugeschlagen – und welche hat er vielleicht geöffnet?"
    ref: "3:7-3:8"
  - q: "„Du hast nur wenig Kraft, und doch hast du mein Wort bewahrt und meinen Namen nicht verleugnet.“ Was sagt das kleinen Gemeinden und Menschen, die sich zu gewöhnlich fühlen, um etwas zu bewirken? Warum bedeutete eine Säule „im Tempel meines Gottes“ so viel in einer Stadt der Erdbeben?"
    ref: "3:8-3:12"
  - q: "„werde auch ich dich bewahren vor der Stunde der Prüfung“. Die Andacht verweist auf Johannes 17,15: nicht aus der Welt genommen, sondern vor dem Bösen bewahrt – hindurch bewahrt und herausgeführt. Was ändert es, ob wir erwarten, dass Gott uns Schweres erspart, oder dass er uns darin bewahrt?"
    ref: "3:10-3:11"
  - q: "Laodizea: „Ich bin reich, ich bin reich geworden und brauche nichts“. Christus bietet an, zu verkaufen, was nur er hat (vgl. Jesaja 55,1: kaufen ohne Geld und umsonst). Wo haben Bequemlichkeit oder Erfolg dir unbemerkt das Gefühl gegeben, nichts zu brauchen? Was wären für dich im Feuer geläutertes Gold, weiße Kleider und Augensalbe?"
    ref: "3:15-3:19"
  - q: "„Sieh, ich stehe an der Tür und klopfe an.“ Der Herr der Gemeinde steht draußen vor seiner eigenen Gemeinde – und bricht die Tür nicht auf. An welchem Raum deines Lebens klopft er noch? Und was bedeutet es, dass dem, der öffnet, ein Platz mit ihm auf seinem Thron verheißen ist?"
    ref: "3:20-3:22"
application:
  - "Wähle eine geistliche Gewohnheit, die in deinem Leben wie das Übrige in Sardes „schon im Sterben lag“ – Gebet, Bibellesen, Anbetung, Großzügigkeit – und stärke sie diese Woche bewusst, jeden Tag zu einer festen Zeit."
  - "Öffne eine Tür: Nenne den Bereich deines Lebens, in dem Jesus noch draußen steht, sag es ihm im Gebet und gib ihm dort den Ehrenplatz – vielleicht mit einer konkreten Veränderung in deinem Umgang mit Zeit oder Geld."
prayer: "Betet für die drei Gemeinden und für euch selbst: um Wachsamkeit (Sardes), um Treue mit wenig Kraft (Philadelphia), um ehrliche Abhängigkeit (Laodizea). Haltet dann eine Minute Stille mit Vers 20, und jede Person öffnet Christus im Stillen eine Tür. Schließt mit Dank, dass er die überführt und erzieht, die er lieb hat (3,19)."
leader_notes:
  - "Dieser Abend umfasst drei Andachten (Tag 7–9). Lass jede berichtende Person ihre Stadt in zwei Minuten aus der Andacht vorstellen (Sardes: die von Kyros und Antiochos eingenommene Burg; Philadelphia: das Erdbeben von 17 n. Chr.; Laodizea: das Erdbeben von 60 n. Chr., Banken, Wolle, Augensalbe und laues Wasser). Wenn die Zeit knapp ist, nimm die Fragen 2, 3, 6 und 7."
  - "3,10 und die „Entrückung“: Manche (besonders dispensationalistische Auslegungen) verstehen 3,10 als Verheißung, dass die Gemeinde vor einer zukünftigen Zeit der Bedrängnis weggenommen wird. Benenne das fair. Die Andacht liest „bewahren vor“ als hindurch bewahrt und herausgeführt, wie in Johannes 17,15 – für Philadelphia und für jede Gemeinde. Lass den Abend nicht zu einer Debatte darüber werden."
  - "Heiß und kalt: Die ältere Auslegung versteht „heiß“ als eifrig und „kalt“ als feindlich. Die Andacht bevorzugt den Hintergrund von Hierapolis und Kolossä, bei dem heiß und kalt beide nützlich sind – sagt aber, dass wir es nicht sicher wissen. So oder so bleibt der Punkt derselbe: lauer Glaube nützt nichts."
  - "Mit Sorgfalt: Vielleicht hat jemand Angst um seinen Namen im Buch des Lebens. Vers 5 ist eine Verheißung, keine Drohung: „ich werde seinen Namen keinesfalls aus dem Buch des Lebens auslöschen“. Lass die Ängstlichen die Verheißung hören. Für die „Synagoge des Satans“ (3,9) gilt dieselbe Sorgfalt wie letzte Woche."
  - "Vers 20 wird oft in der Evangelisation gebraucht, und so darf man ihn auch hören – aber im Zusammenhang spricht Christus zu einer Gemeinde, die ihn ausgesperrt hat. Lass die Gruppe beides hören."
  - "Ausblick: Die Briefe enden mit einem Thron (3,21), und nächste Woche heißt es: „eine Tür war geöffnet im Himmel“ (4,1) – wir sehen, wer auf diesem Thron sitzt und wer in seiner Mitte steht."
