session: 8
lang: de
title: "Wem gehörst du?"
ref: "12:1-13:18"
days: [18, 19]
big_idea: "Hinter den Kulissen ist der Drache durch das Blut des Lammes schon hinabgeworfen; in seinem Grimm wirkt er durch Tiere, die das Lamm nachahmen und Anbetung fordern – doch Gottes Volk, versiegelt, bevor das Tier überhaupt erschien, siegt durch das Blut des Lammes, das Wort seines Zeugnisses und Ausdauer; denn die Frage heißt nicht „wann?“, sondern „wem gehörst du?“."
opening: "Bist du schon einmal auf eine Fälschung hereingefallen – ein nachgemachtes Produkt, eine gefälschte Unterschrift, eine Betrugsnachricht? Wie hast du es gemerkt?"
context: >-
  Die siebte Trompete ist erklungen: Das Königreich der Welt ist unserem Herrn zuteilgeworden. Jetzt zieht Johannes den Vorhang weiter zurück und zeigt, wie es dazu kam.
  Kapitel 12 erzählt die Weihnachtsgeschichte hinter den Kulissen: eine Frau, ein Kind, ein Drache – und der Ankläger wird hinabgeworfen. In Kapitel 13 ruft der Drache zwei Tiere herbei, aus dem Meer und aus der Erde.
  Für die Gemeinden in Asia hatte das Tier ein Gesicht: Rom, der Kaiserkult und die Zünfte, in denen man nicht kaufen oder verkaufen konnte, ohne dem Kaiser Weihrauch zu opfern.
read_aloud_tip: "Drei Personen: eine liest den Erzähltext, eine zweite die laute Stimme im Himmel (12,10–12, langsam gelesen wie ein Siegeslied), eine dritte die Menge und das zweite Tier (13,4.14). Haltet zwischen den beiden Kapiteln kurz inne."
hebrew:
  - word: "ho katēgōr"
    hebrew: "ὁ κατήγωρ"
    gloss: "der Ankläger"
    point: "Ein Wort aus dem Gerichtssaal (12,10) – genau das, was das hebräische *hassatan* in Hiob 1–2 und Sacharja 3 bedeutet: der Widersacher, der Ankläger im himmlischen Rat Gottes. Er klagt sie „vor unserem Gott Tag und Nacht“ an – aber jetzt ist er hinabgeworfen."
  - word: "hōs esphagmenēn"
    hebrew: "ὡς ἐσφαγμένην"
    gloss: "wie geschlachtet"
    point: "Derselbe Ausdruck wie für das Lamm in 5,6 (*hōs esphagmenon*). Johannes will, dass wir die Ähnlichkeit bemerken – und den Unterschied (13,3). Die Wunden des Lammes sind für andere; die Heilung des Tieres ist für sich selbst. Das Böse schafft nichts Neues. Es ahmt nach."
  - word: "charagma"
    hebrew: "χάραγμα"
    gloss: "Kennzeichen"
    point: "Ein Stempel oder eine Prägung – auch der Stempel des Kaisers auf Münzen und Urkunden (13,16–17). Jede Münze in der Hand eines Händlers in Thyatira trug Bild und Titel des Kaisers. Wer das Kennzeichen hat, trägt „den Namen des Tieres oder die Zahl seines Namens“: Es sagt, wem du gehörst."
discussion:
  - q: "Lest 1. Mose 3,15 und 37,9: Was sagen sie über die Frau, das Kind und den Drachen? Das Kind soll „alle Nationen mit eisernem Stab weiden“ (Psalm 2,9) und wird „zu Gott und zu seinem Thron emporgerissen“ – das ganze Leben Jesu in einem Satz. Was ist anders, wenn wir Bethlehem hinter den Kulissen sehen?"
    ref: "12:1-12:6"
  - q: "Lest Sacharja 3,1–5 und Hiob 1,9–11: Der Ankläger konnte noch vor Gott treten. Jetzt: „hinabgeworfen ist der Ankläger unserer Geschwister“. Welche Anklage hörst du am häufigsten in deinen Gedanken? Was unterscheidet die Überführung durch den Geist, die zum Kreuz führt, von der Stimme des Anklägers, die in Verzweiflung endet?"
    ref: "12:7-12:10"
  - q: "Sie haben gesiegt „durch das Blut des Lammes und durch das Wort ihres Zeugnisses“, und „sie haben ihr Leben nicht geliebt bis in den Tod“. Versuchst du, den Ankläger mit eigenen guten Werken zum Schweigen zu bringen, oder nimmst du Zuflucht zum Blut des Lammes? Was hieße es für dich, das Wort deines Zeugnisses auszusprechen?"
    ref: "12:11-12:12"
  - q: "Der Frau werden „die zwei Flügel des großen Adlers gegeben“, und sie wird in der Wüste ernährt (vgl. 2. Mose 19,4). Die Gemeinde ist auf ihrem Auszug durch diese Weltzeit – nicht aus der Schöpfung heraus, sondern aus der Macht des Drachen. Wo bist du gerade in der Wüste, und wo kannst du sehen, dass Gott dich dort ernährt?"
    ref: "12:13-12:18"
  - q: "Lest Daniel 7,2–8 und 17: Das Tier des Johannes ist Leopard, Bär und Löwe in einem Leib. Die Menge ruft: „Wer ist wie das Tier, und wer kann mit ihm Krieg führen?“ – eine Fälschung von Israels Lied (2. Mose 15,11). Wie sah das Tier für die Gemeinden in Asia aus? Welche Mächte beanspruchen heute das ganze Herz der Menschen?"
    ref: "13:1-13:8"
  - q: "Einer seiner Köpfe „war wie zu Tode geschlachtet“, und das zweite Tier „hatte zwei Hörner wie ein Lamm und sprach wie ein Drache“. Warum ist die überzeugende Kopie für die Gemeinde gefährlicher als der offene Feind? Wo zieht dich etwas an, das aussieht wie ein Lamm, aber redet wie ein Drache?"
    ref: "13:3-13:15"
  - q: "Das Kennzeichen wird „an ihre rechte Hand oder an ihre Stirn“ gegeben, und ohne es kann niemand kaufen oder verkaufen. Vergleicht Gottes Siegel (7,3) und das Schma (5. Mose 6,8): was du denkst und was du tust. Niemand ist ungezeichnet. Wenn jemand deine Woche beobachtet hätte: Wem gehören deine Hand und deine Stirn?"
    ref: "13:16-13:18"
application:
  - "Schreib eine Anklage auf, die du immer wieder in deinem Kopf hörst. Schreib daneben: „denn hinabgeworfen ist der Ankläger unserer Geschwister“ (12,10). Lies es laut, wenn die Stimme wiederkommt."
  - "Wähle eine Entscheidung der „Hand“ (etwas, das du tust) und ein Muster der „Stirn“ (etwas, das du denkst), wo das Tier an dir zieht. Bete diese Woche jeden Tag darüber mit den Worten: Ich gehöre dem Lamm."
prayer: "Lest 12,10–11 gemeinsam laut. Dann dankt jede und jeder Gott in einem Satz dafür, dem Lamm zu gehören, und nennt – wer möchte – eine Stelle, wo sie oder er den Druck spürt, nur mitspielen zu können, um „kaufen oder verkaufen“ zu dürfen. Schließt mit dem Bekenntnis aus der Andacht: Wer ist ein Gott wie du? (Micha 7,18), und dankt ihm, dass unsere Namen geschrieben sind „im Buch des Lebens des geschlachteten Lammes“ (13,8)."
leader_notes:
  - "Zwei Andachten (Tag 18–19). Beide Kapitel sind voller Bilder; verwende die meiste Zeit auf 12,10–11 (der Ankläger ist hinabgeworfen) und 13,16–17 (das Kennzeichen). Sie tragen das seelsorgerliche Gewicht."
  - "666: Nenne kurz die zwei Hauptdeutungen – die Worte „Kaiser Nero“ ergeben in hebräischen Buchstaben 666 (und in einer lateinischen Schreibweise 616, die Zahl in einigen alten Handschriften), oder eine „Menschenzahl“: sechs, die dreimal hinter der Sieben, der Zahl der Fülle, zurückbleibt. Johannes ruft zur Weisheit der Unterscheidung auf, nicht zu der von Codeknackern. Entschlüssle die Zahl nicht auf heutige Personen und lass die Gruppe nicht über Chips, Strichcodes oder Daten spekulieren."
  - "Beim Kennzeichen geht es um Zugehörigkeit, nicht um Angst. Manche sind vielleicht mit beängstigender Lehre über das Kennzeichen aufgewachsen; beruhige sie: Gottes Siegel kam zuerst (7,3), und das Kennzeichen des Tieres bekommt man nicht aus Versehen – es wächst durch tausend kleine Entscheidungen der Hand und der Stirn."
  - "Andere Lesarten: Futuristen erwarten einen künftigen einzelnen Herrscher und ein wörtliches Kennzeichen am Ende der Geschichte; Präteristen sehen das Kapitel in Rom im ersten Jahrhundert erfüllt. Unsere Reihe: Rom zur Zeit des Johannes und jede Macht in jeder Zeit, die Anbetung fordert. Nenne die Sichtweisen fair in einem Satz und kehre zur Frage „wem gehörst du?“ zurück."
  - "„Drinnen oder draußen“ ist ein Ruf zur Treue, nicht „wir gegen die anderen“. Lass die Gruppe keine politischen Parteien oder Führer als das Tier benennen; die Frage richtet sich zuerst an uns selbst – auch der laue Mittelweg Laodizeas (3,15–16) ist kein neutraler Boden."
  - "Ausblick: Nächste Woche Kapitel 14 – das Lamm auf dem Berg Zion mit denen, die seinen Namen und den Namen seines Vaters an ihren Stirnen tragen."
