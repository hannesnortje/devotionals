session: 4
lang: de
title: "Wer ist würdig?"
ref: "4:1-5:14"
days: [10, 11]
big_idea: "Hinter der sichtbaren Macht Roms wird Johannes der Thron im Himmel gezeigt, wo der Schöpfer angebetet wird, und mitten auf dem Thron ein Lamm, das steht, wie geschlachtet: Gott regiert die Geschichte, und seine Macht sieht aus wie das Kreuz."
opening: "Hast du schon einmal gehört, wie jemand beschrieben wurde, bevor du ihn kennengelernt hast – und warst dann völlig überrascht, als du ihn gesehen hast? Was hattest du erwartet?"
context: >-
  In den Städten der sieben Gemeinden war der Thron Roms überall sichtbar: Tempel für den Kaiser, sein Bild auf Münzen und auf den Marktplätzen; Pergamon war der Ort, „wo der Thron des Satans ist“ (2,13).
  Nach den sieben Briefen öffnet sich eine Tür im Himmel, und der Vorhang wird zurückgezogen: Kapitel 4 zeigt den Thron, an dem der Schöpfer angebetet wird, Kapitel 5 die versiegelte Buchrolle und das Lamm, das allein würdig ist, sie zu öffnen.
  Alles, was im Buch folgt – Siegel, Trompeten, Schalen –, geht von diesem Raum aus.
read_aloud_tip: "Eine Person liest als Erzähler die Worte des Johannes; andere lesen die Lieder: die vier Lebewesen (4,8), die Ältesten (4,11 und 5,9–10), die Engel (5,12). Das Lied aller Geschöpfe (5,13) lest ihr alle gemeinsam und antwortet mit den Lebewesen: „Amen.“"
hebrew:
  - word: "axios ei"
    hebrew: "Ἄξιος εἶ"
    gloss: "würdig bist du"
    point: "Nach Sueton wollte Kaiser Domitian als „unser Herr und Gott“ angeredet werden. Im Lied der Ältesten – „Würdig bist du, unser Herr und Gott“ (4,11) – hören viele eine leise, mutige Gegenstimme. In 5,9 werden dieselben Worte dem Lamm gesungen: Es empfängt die Anbetung, die Gott gebührt."
  - word: "arnion"
    hebrew: "ἀρνίον"
    gloss: "Lamm"
    point: "Mit einer Ausnahme (dem Tier in 13,11) gebraucht Johannes dieses Wort nur für Christus – 29-mal. Dahinter stehen das Passalamm aus 2. Mose 12 und der Knecht, der wie ein Lamm zur Schlachtbank geführt wird (Jesaja 53,7). Das Lamm steht „wie geschlachtet“ (hōs esphagmenon): lebendig, aber es trägt noch die Wunden (5,6)."
  - word: "ēgorasas"
    hebrew: "ἠγόρασας"
    gloss: "du hast erkauft"
    point: "Ein Wort des Marktes, das auch den Kauf von Sklaven beschreiben konnte (5,9). Mit seinem Blut hat das Lamm für Gott Menschen aus jeder Nation erkauft und sie zu einem Königreich und zu Priestern gemacht – was Gott Israel am Sinai verheißen hatte (2. Mose 19,6)."
discussion:
  - q: "In Laodizea klopfte Christus an eine verschlossene Tür; jetzt heißt es: „eine Tür war geöffnet im Himmel“, und Johannes hört: „Komm hier herauf“. Was bedeutete es für Gläubige in Städten voller Kaisertempel, zuerst den Thron zu sehen – vor Siegeln und Plagen? Beginnt dein Tag meistens mit den Nachrichten oder mit dem Thron?"
    ref: "4:1-4:2"
  - q: "Johannes steht in einer langen Reihe. Lest Jesaja 6,1–3, Hesekiel 1,26–28 und Hiob 1,6–12 (oder 1. Könige 22,19). Was haben diese Szenen hinter dem Vorhang gemeinsam? Was sagen sie darüber, wer wirklich entscheidet, was auf der Erde geschieht – und über den Ankläger, der ohne Gottes Erlaubnis nichts tun kann?"
    ref: "4:2-4:8"
  - q: "Die Ältesten singen „Würdig bist du, unser Herr und Gott“ – genau den Titel, den Domitian beanspruchte –, und der Grund ist die Schöpfung: „denn du hast alles geschaffen“. Was nennst du in deinen Entscheidungen über Zeit, Geld und Aufmerksamkeit tatsächlich „würdig“?"
    ref: "4:9-4:11"
  - q: "Die Ältesten werfen ihre Kränze vor dem Thron nieder. Welchen „Kranz“ hältst du fest – einen Titel, eine Leistung, deinen Ruf, sogar deine eigene Treue? Welche Freiheit könnte darin liegen, ihn niederzulegen?"
    ref: "4:10"
  - q: "Johannes weint, weil niemand für würdig befunden wird, die Buchrolle zu öffnen. Das sind die Tränen aller Gläubigen, die sich fragen, ob ihr Leiden einen Sinn hat. Welche „Buchrolle“ in deinem Leben scheint verschlossen und versiegelt? Und was bedeutet es, dass die goldenen Schalen voll Räucherwerk die Gebete der Heiligen sind?"
    ref: "5:1-5:8"
  - q: "Johannes hört „der Löwe aus dem Stamm Juda, die Wurzel Davids, hat gesiegt“ – und sieht „ein Lamm stehen, wie geschlachtet“. Was erwartete man vom Löwen? Was bedeutet es, dass das Sehen das Hören deutet – dass Gottes Macht aussieht wie das Kreuz? Wo sehnst du dich eher nach einem Löwen als nach dem Lamm?"
    ref: "5:5-5:7"
  - q: "„und hast mit deinem Blut für Gott Menschen erkauft aus jedem Stamm und jeder Sprache, jedem Volk und jeder Nation“ – und: „sie herrschen auf der Erde“, in der Gegenwart. Wie herrscht das Volk des Lammes – wie sein König, durch Zeugnis und hingebende Liebe? Wie sähe das diese Woche in einem Konflikt oder Ärger von dir aus?"
    ref: "5:9-5:14"
application:
  - "Lies diese Woche jeden Morgen, bevor du dein Handy entsperrst, 4,8–11 laut. Nenne dann einen „Thron“, der dir im Moment Angst macht, und leg ihn bewusst vor den Thron, auf dem er sitzt."
  - "Wähle einen Ort, an dem du am liebsten „brüllen“ würdest – einen Konflikt, eine Ungerechtigkeit, einen Ärger – und frag: Wie würde das Lamm hier siegen? Tu dann einen kleinen Schritt hingebender Liebe in diese Richtung."
prayer: "Beginnt mit Anbetung, nicht mit Bitten: Lest die Lieder aus 4,8, 4,11 und 5,12 gemeinsam laut (oder singt ein Lied, das darauf beruht). Dann nennt jede Person eine „versiegelte Buchrolle“ und legt sie in die Hände des Lammes – im Vertrauen, dass unsere Gebete vor dem Thron aufbewahrt sind. Schließt, indem ihr 5,13 gemeinsam lest und „Amen“ antwortet."
leader_notes:
  - "Dieser Abend umfasst zwei Andachten (Tag 10–11) und zwei Kapitel. Das Herz des Abends ist 5,5–6 (Frage 6): Johannes hört „Löwe“ und sieht ein Lamm. Halte dafür Zeit frei; es ist der Schlüssel zu allem, was in der Reihe folgt."
  - "Manche (besonders dispensationalistische Auslegungen) verstehen „Komm hier herauf“ (4,1) als Bild für die Entrückung der Gemeinde vor den Ereignissen der Kapitel 6–19, unter anderem weil das Wort „Gemeinde“ erst in 22,16 wieder vorkommt. Benenne das fair. Die Andacht liest es als Ruf an Johannes, wie an die Propheten vor ihm, die gegenwärtige Wirklichkeit hinter dem Vorhang zu sehen. Halte den Blick auf dem Thron und dem Lamm."
  - "Die vierundzwanzig Ältesten sind wahrscheinlich das ganze Volk Gottes – zwölf Stämme und zwölf Apostel (vgl. 21,12–14) –, andere denken an Engelwesen. Die vier Lebewesen erinnern an die Cherubim Hesekiels und die Serafim Jesajas und stehen wohl für die ganze lebendige Schöpfung. Kurz erwähnen; nicht lange dabei bleiben."
  - "Die Buchrolle steht wohl für Gottes Plan mit der Geschichte – sein Gericht über das Böse und das Kommen seines Reiches. Versuch noch nicht, die Siegel zu entschlüsseln; das kommt beim nächsten Treffen (Kapitel 6–7)."
  - "Mit Sorgfalt: „Das Lamm siegt durch hingebende Liebe“ darf nicht als „lass dir Misshandlung gefallen“ gehört werden. Der Weg des Lammes ist treues Zeugnis und der Verzicht auf Zurückschlagen – nicht Schweigen in Gefahr oder Schutzlose ungeschützt lassen. Wenn jemand in der Gruppe in einer schädlichen Lage ist, sprich hinterher mit ihm."
  - "Plane die Gebetszeit als Anbetung. Offenbarung 4–5 ist voller Lieder; wenn eure Gruppe singt, wählt ein Lied, das auf diesen Kapiteln beruht."
