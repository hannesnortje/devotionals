session: 7
lang: de
title: "Süß und bitter"
ref: "10:1-11:19"
days: [16, 17]
big_idea: "Gottes Antwort auf eine Welt, die nicht umkehren will, ist sein Wort im Mund seiner Zeugen: Die Gemeinde isst das Wort, süß und bitter, wird von Gott vermessen und bewahrt, gibt im Sacktuch Zeugnis, teilt Tod und Auferstehung ihres Herrn – und das Königreich der Welt ist schon unserem Herrn und seinem Christus zuteilgeworden."
opening: "Denk an ein Essen, das du als Kind gehasst hast und heute liebst (oder umgekehrt). Was hat sich verändert?"
context: >-
  Nach der sechsten Trompete erwarten wir sofort die siebte. Aber wie zwischen dem sechsten und dem siebten Siegel hält die Geschichte inne. In Kapitel 7 wurde Gottes Volk versiegelt; in Kapitel 10 und 11 wird es gesandt.
  Johannes isst eine kleine Buchrolle, süß im Mund und bitter im Bauch, und muss wieder prophezeien; dann vermisst er den Tempel und sieht zwei Zeugen, die prophezeien, getötet werden und wieder aufstehen.
  Für die Gemeinden in Asia, die in den Städten Roms lebten, war das ihre Berufung: sich nicht zurückzuziehen, sondern Zeugnis zu geben.
read_aloud_tip: "Kapitel 10: eine Person liest den Erzähltext, eine zweite die Stimme aus dem Himmel und den Engel (10,4.8.9.11). Kapitel 11: eine Person liest; bei 11,12 sagt die ganze Gruppe „Kommt hier herauf!“; die Lieder von 11,15 und 11,17–18 lesen alle gemeinsam."
hebrew:
  - word: "chronos ouketi estai"
    hebrew: "χρόνος οὐκέτι ἔσται"
    gloss: "keine Frist mehr"
    point: "*Chronos* heißt gewöhnlich „Zeit“, und ältere Übersetzungen lasen es so, als würde die Zeit selbst aufhören. Aber der Schwur greift Daniel 12,7 auf und antwortet auf das „Wie lange?“ von 6,10: Gott wird nicht länger warten (10,6)."
  - word: "kataphage"
    hebrew: "κατάφαγε"
    gloss: "iss sie auf"
    point: "*Kataphagein* heißt nicht kosten, sondern ganz aufessen (10,9). Das Wort muss in den Propheten hineingehen, bevor es aus ihm herauskommen kann – wie bei Hesekiel, dem die Buchrolle süß wie Honig war und dann bitter (Hesekiel 2,8–3,3.14)."
  - word: "martysin"
    hebrew: "μάρτυσίν"
    gloss: "Zeugen"
    point: "Wir übersetzen „Zeuge“, nicht „Märtyrer“ (11,3). Doch dieses Kapitel zeigt, wie die beiden Wörter in der frühen Kirche zusammengewachsen sind: Wer treu Zeugnis gibt, bezahlt manchmal den Preis dafür – wie Antipas (2,13) und wie Jesus selbst, der treue Zeuge (1,5)."
discussion:
  - q: "In eine Wolke gehüllt, den Regenbogen über dem Kopf, setzt der Engel einen Fuß auf das Meer und einen auf die Erde und schwört bei dem, „der den Himmel geschaffen hat und was darin ist, und die Erde und was darauf ist, und das Meer und was darin ist“. Was sagen diese Bilder darüber, wem diese Welt gehört?"
    ref: "10:1-10:6"
  - q: "Johannes hört: „Versiegle, was die sieben Donner gesprochen haben, und schreib es nicht auf!“ Was sagt das Menschen, die die Offenbarung als Rätsel für Daten und Spekulationen benutzen? Welche Fragen über die Zukunft machen dich unruhig – und kannst du sie bei Gott lassen?"
    ref: "10:4"
  - q: "Den Seelen unter dem Altar wurde gesagt, sie sollten „noch eine kurze Zeit ruhen“ (6,11). Jetzt schwört der Engel, „dass keine Frist mehr sein wird“. Lest Habakuk 2,3. Wo wartest du schon lange auf Gott, und was sagt dir dieser Schwur?"
    ref: "10:5-10:7"
  - q: "Lest Hesekiel 3,1–3 und 3,14 neben Offenbarung 10,9–10: „Nimm und iss sie auf; sie wird deinen Bauch bitter machen, aber in deinem Mund wird sie süß sein wie Honig.“ Liest du die Bibel eher wie jemand, der kostet, oder wie jemand, der isst? Welcher Teil von Gottes Wort ist dir gerade süß, und welcher bitter?"
    ref: "10:8-10:11"
  - q: "Johannes vermisst „den Tempel Gottes und den Altar und die, die darin anbeten“, aber der äußere Hof wird zweiundvierzig Monate lang zertreten. Im Neuen Testament ist die Gemeinde Gottes Tempel (1. Korinther 3,16). Fühlst du dich manchmal wie der Hof, der zertreten wird? Was bedeutet es dir, dass Gott das Innere vermessen hat?"
    ref: "11:1-11:2"
  - q: "„Das sind die zwei Ölbäume und die zwei Leuchter“ – und die Leuchter sind die Gemeinden (1,20). Ihre Zeichen sind die von Elia und Mose, und sie stehen nicht durch Macht und nicht durch Kraft, sondern durch Gottes Geist (Sacharja 4,6). Wo bist du versucht zu schweigen, weil dein Zeugnis dich unbeliebt machen würde?"
    ref: "11:3-11:10"
  - q: "Die Zeugen werden getötet und auferweckt, und – anders als nach den Plagen (9,20–21) – geben die Übrigen dem Gott des Himmels die Ehre – durch das Zeugnis. Die siebte Trompete singt: „Das Königreich der Welt ist unserem Herrn und seinem Christus zuteilgeworden“. Wo würde das heute etwas ändern, wenn du es wirklich glaubtest?"
    ref: "11:11-11:19"
application:
  - "Wähle einen kurzen Abschnitt – zum Beispiel Offenbarung 10,8–11 – und lies ihn drei Tage lang jeden Tag langsam und laut. „Kau“ darauf herum. Teile dann einen Satz daraus mit jemandem, der ihn braucht."
  - "Denk an einen Menschen in deiner Umgebung, der Christus noch nicht kennt. Bete diese Woche jeden Tag mit Namen für ihn oder sie und bitte Gott um eine Gelegenheit, etwas von deiner Hoffnung weiterzugeben – sanft, nicht ängstlich."
prayer: "Lest 11,15 gemeinsam laut. Dann betet zu zweit: Dankt Gott, dass das Königreich der Welt ihm und seinem Christus gehört; bittet ihn um Hunger nach seinem Wort und um Mut, wenn das Zeugnis etwas kostet; betet mit Namen für den Menschen, an den jede und jeder gedacht hat. Schließt gemeinsam mit Sacharja 4,6: nicht durch Macht und nicht durch Kraft, sondern durch deinen Geist."
leader_notes:
  - "Zwei Andachten (Tag 16–17). Kapitel 11 gehört zu den schwierigsten des Buches; lass die Gruppe sich nicht in der Frage verlieren, wer die zwei Zeugen sind. Unsere Lesart: Sie sind die bezeugende Gemeinde (die Leuchter, 1,20), gezeichnet mit den Zügen von Mose und Elia, und zwei, weil das Gesetz zwei Zeugen verlangt (5. Mose 19,15)."
  - "Andere Lesarten: Futuristische Ausleger verstehen die zweiundvierzig Monate als wörtliche dreieinhalb Jahre am Ende der Geschichte, mit zwei einzelnen Propheten – nach manchen Mose und Elia selbst. Nenne das fair in einem Satz. In dieser Reihe sind die zweiundvierzig Monate / 1260 Tage Daniels „eine Zeit und Zeiten und eine halbe Zeit“ (Daniel 7,25; 12,7): die abgemessene, begrenzte Zeit des Zeugnisses der Gemeinde zwischen dem ersten und dem zweiten Kommen Christi. Rechne nicht."
  - "Manche kennen die ältere Wiedergabe von 10,6 („dass hinfort keine Zeit mehr sein soll“). Der Zusammenhang handelt von Gottes Warten, nicht vom Ende des Kalenders."
  - "Der Engel in 10,1 trägt Züge Christi (1,16); manche meinen, er sei Christus selbst, aber Johannes nennt ihn einen Engel. Verweile nicht lange dabei."
  - "Behutsam: Manche in der Gruppe tragen den Schmerz eines Zeugnisses, das vergeblich scheint – eine schrumpfende Gemeinde, ein Kind fern von Gott, die oder der Einzige, der bei der Arbeit ehrlich bleibt. Versprich keinen Erfolg; das Kapitel verspricht Rechtfertigung („Kommt hier herauf!“), nicht Beliebtheit."
  - "Ausblick: Nächste Woche erzählt Kapitel 12 die Weihnachtsgeschichte hinter den Kulissen – und der Ankläger wird hinabgeworfen."
