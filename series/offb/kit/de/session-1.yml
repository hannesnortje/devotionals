session: 1
lang: de
title: "Der König inmitten der Leuchter"
ref: "1:1-1:20"
days: [1, 2]
big_idea: "Die Offenbarung zieht für kleine, bedrängte Gemeinden den Vorhang zurück: Der uns liebt und uns durch sein Blut befreit hat, ist der Herrscher über die Könige der Erde; er geht mitten unter seinen Gemeinden umher, hält sie in seiner rechten Hand und sagt ihnen – und uns: „Fürchte dich nicht!“"
opening: "Durftest du schon einmal hinter die Kulissen schauen – im Theater, in einer Restaurantküche, im Krankenhaus, im Stadion? Wie hat das deinen Blick auf das verändert, was vorne auf der Bühne geschieht?"
context: >-
  Die Offenbarung wurde, wahrscheinlich um 95 n. Chr., an sieben wirkliche Gemeinden in der römischen Provinz Asia (im Westen der heutigen Türkei) geschrieben. Dort gehörte die Verehrung des Kaisers als Herrn zum Alltag,
  und wer sich verweigerte, konnte Arbeit, Freiheit oder Leben verlieren. Johannes schreibt aus der Verbannung auf der Insel Patmos.
  Das erste Wort des Buches, apokalypsis, bedeutet Enthüllung: Gott zieht den Vorhang zurück, damit sein Volk sieht, wer wirklich regiert – und was das für jene sieben Gemeinden bedeutete, bedeutet es für die Gemeinde zu allen Zeiten.
  Heute lesen wir Kapitel 1: den Gruß und einen Lobpreis (V. 1–8) und die Vision des auferstandenen Christus unter den Leuchtern (V. 9–20).
read_aloud_tip: "Lest mit drei Stimmen: eine Person als Erzähler für die Worte des Johannes, eine zweite für den Lobpreis und Vers 7 (V. 5b–7), eine dritte für die Worte des Herrn (V. 8, 11 und 17b–20). Vers 3 preist den glückselig, der vorliest – lest also langsam, so wie die ersten Gemeinden es hörten."
hebrew:
  - word: "apokalypsis"
    hebrew: "ἀποκάλυψις"
    gloss: "Offenbarung"
    point: "Nicht Chaos und Weltuntergang, sondern das Wegnehmen eines Schleiers – eine Enthüllung. Das Buch wurde nicht geschrieben, um Gottes Pläne hinter Geheimcodes zu verstecken, sondern um den Gläubigen zu zeigen, wer wirklich auf dem Thron sitzt. Und es ist die Offenbarung Jesu Christi: Er ist ihr Geber und ihr Inhalt zugleich (1,1)."
  - word: "synkoinōnos"
    hebrew: "συγκοινωνός"
    gloss: "der mit euch Anteil hat"
    point: "Johannes steht nicht als erhabener Apostel über den Gemeinden; er ist ihr Bruder, ein Partner, der zusammen mit ihnen Anteil hat. Und woran er mit ihnen Anteil hat, sind drei Dinge, die zusammengehören: Bedrängnis, Königreich und Ausdauer (1,9)."
  - word: "lychniai"
    hebrew: "λυχνίαι"
    gloss: "Leuchter"
    point: "Nicht der eine siebenarmige Leuchter der Stiftshütte (2. Mose 25,31–37; vgl. Sacharja 4,2), sondern sieben einzelne goldene Leuchter – die sieben Gemeinden (1,20). Ein Leuchter hat kein eigenes Licht; er trägt das Licht. Und Christus steht mitten unter ihnen (1,13)."
discussion:
  - q: "Vers 3 preist den glückselig, der vorliest, und die, die hören und bewahren, was geschrieben ist. Die Offenbarung sollte in der Gemeinde vorgelesen und gelebt werden – nicht zuerst entschlüsselt. Was ändert es, wenn wir dieses Buch als einen Brief zum Hören und Bewahren lesen statt als Rätsel, das gelöst werden muss?"
    ref: "1:1-1:3"
  - q: "Bevor Johannes ein einziges Wort über Bedrängnis schreibt, bricht er in Lob aus: „Ihm, der uns liebt und uns durch sein Blut von unseren Sünden befreit hat“. „Liebt“ steht in der Gegenwart, „befreit hat“ in der Vergangenheit. Warum mussten die Gemeinden das wohl zuerst hören? Und was davon fällt dir schwerer, über dich selbst zu glauben?"
    ref: "1:4-1:6"
  - q: "Vers 7 verwebt zwei alttestamentliche Verheißungen: Daniel 7,13 (einer wie ein Menschensohn kommt mit den Wolken des Himmels) und Sacharja 12,10 (sie werden auf den sehen, den sie durchbohrt haben, und klagen). Schlagt sie nach. Was bedeuteten diese Verheißungen in ihrem eigenen Zusammenhang – und was sieht Johannes in Jesus wahr werden?"
    ref: "1:7"
  - q: "Kaiser Domitian ließ sich gern „Herr und Gott“ nennen. In Vers 8 hören die Gemeinden: „der Herr, Gott, der ist und der war und der kommt, der Allmächtige“. Was bedeutete das wohl in einer Stadt voller Kaisertempel? Welche „kleinen Kaiser“ beanspruchen heute diesen Platz in unserem Leben?"
    ref: "1:8"
  - q: "Johannes nennt sich „euer Bruder, der mit euch Anteil hat an der Bedrängnis und am Königreich und an der Ausdauer in Jesus“. Warum gehören diese drei zusammen? Was geschieht mit unserem Glauben, wenn wir das Königreich ohne Bedrängnis und Ausdauer haben wollen?"
    ref: "1:9"
  - q: "Das Bild in Vers 13–16 ist mit alttestamentlichen Farben gemalt (Daniel 7,9; 10,5–6). Was bedeutet es, dass Züge des Hochbetagten – Haare weiß wie Wolle – einem wie ein Menschensohn gegeben werden? Was spricht dich am meisten an: die Augen wie eine Feuerflamme, die Stimme wie vieler Wasser, das Schwert aus seinem Mund?"
    ref: "1:12-1:16"
  - q: "Christus steht „mitten unter den Leuchtern“, und die Hand, die die Sterne hält, liegt auf dem zitternden Johannes: „Fürchte dich nicht! Ich bin der Erste und der Letzte“. Welche Angst in deinem Leben muss heute hören, dass er „die Schlüssel des Todes und des Totenreichs“ hat?"
    ref: "1:17-1:20"
application:
  - "Lies diese Woche jeden Morgen, bevor du Nachrichten oder dein Handy anschaust, 1,5–6 laut und sag es mit eigenen Worten: Er liebt mich – heute; er hat mich befreit – es ist geschehen."
  - "Lobe Gott wie Johannes auf Patmos mitten in etwas Schwerem, nicht erst, wenn es vorbei ist: Nenne diese Woche eine schwierige Situation und danke Christus ausdrücklich, dass er die Schlüssel hält und mitten unter seinem Volk umhergeht."
prayer: "Lest die Verse 17–18 gemeinsam langsam laut. Dann nennt jede Person (laut oder still) eine Angst und gibt sie dem, der die Schlüssel des Todes und des Totenreichs hat. Schließt, indem ihr den Lobpreis der Verse 5–6 gemeinsam als euer eigenes Lob betet."
leader_notes:
  - "Dieser Abend umfasst zwei Andachten (Tag 1–2) und eröffnet die Reihe von elf Treffen. Stell gleich zu Beginn die Brille ein: Die Offenbarung wurde an sieben Gemeinden geschrieben; was sie für sie bedeutete, bedeutet sie für uns. Ihre Frage ist nicht „Wann?“, sondern „Wer regiert wirklich, und auf wessen Seite stehe ich?“."
  - "Manche in der Gruppe haben vielleicht gelernt, die Offenbarung vor allem als Fahrplan zukünftiger Endzeitereignisse zu lesen (futuristische und dispensationalistische Auslegung), andere als etwas, das sich im ersten Jahrhundert erfüllt hat (präteristische Auslegung). Benenne das fair und ohne Polemik und sag, dass diese Reihe das Buch als Botschaft für die Gemeinde aller Zeiten liest; halte den Blick auf seinem seelsorgerlichen Kern: Gott regiert, das Lamm hat gesiegt, die Gemeinde ist zu treuem Zeugnis und Ausdauer gerufen."
  - "„was bald geschehen muss“ und „die Zeit ist nahe“ (1,1.3): Die Andacht zeigt, dass Johannes Daniel 2,28 aufgreift, aber „in den letzten Tagen“ durch „bald“ ersetzt – was für Daniel fern war, hat mit Christus begonnen, und die ganze Zeit zwischen seinem ersten und zweiten Kommen ist die letzte Zeit. Lass die Gruppe keine Daten ausrechnen."
  - "Die „Engel“ der sieben Gemeinden (1,20) werden verschieden verstanden – himmlische Engel oder die Leiter bzw. Boten der Gemeinden. Erwähne es kurz und geh weiter. In 1,5 lesen manche ältere Bibeln „gewaschen“; die ältesten Handschriften lesen „befreit“."
  - "Mit Sorgfalt: Manche tragen echte Angst aus Endzeitfilmen, Tabellen oder Predigten mit sich. Das erste Wort des Auferstandenen an den zitternden Johannes ist „Fürchte dich nicht!“. Lass das den Ton des Abends bestimmen."
  - "Ausblick: Nächste Woche lesen wir Kapitel 2 – Ephesus, Smyrna, Pergamon und Thyatira. Bitte vier Personen, je eine Gemeinde zu übernehmen, ihren Brief zu Hause mit der Andacht des jeweiligen Tages zu lesen und beim nächsten Mal kurz zu berichten."
