session: 10
lang: de
title: "Geht hinaus aus ihr"
ref: "17:1-19:21"
days: [23, 24, 25, 26]
big_idea: "Babylon – die verführerische Macht jeder Zeit, die auf dem Tier reitet, im Luxus lebt, mit Leibern und Seelen handelt und vom Blut der Heiligen betrunken ist – wirkt beeindruckend, fällt aber in einer einzigen Stunde; Gott ruft sein Volk heraus aus ihr, nicht aus der Welt, und lädt es zur Hochzeit des Lammes ein, dessen Reiter, Treu und Wahrhaftig, durch das Wort seines Mundes siegt."
opening: "Denk an eine Werbung, ein Produkt oder einen Lebensstil, der dich einmal richtig beeindruckt hat. Was machte ihn so anziehend – und hat er gehalten, was er versprach?"
context: >-
  Bei der letzten Schale rief die Stimme vom Thron: „Es ist geschehen!“, und Gott „gedachte an Babylon, die Große“ (16,19). Die Kapitel 17–19 zeigen, wer sie ist.
  Für die sieben Gemeinden war sie Rom auf seinen sieben Hügeln, reich, glanzvoll und gewalttätig; in der großen Geschichte der Bibel ist sie jede Macht seit Babel, die Menschen mit Luxus verführt und sie vergessen lässt, wem sie gehören.
  Kapitel 18 ist die Klage über ihren Fall und der Ruf an Gottes Volk, aus ihr hinauszugehen; Kapitel 19 antwortet mit dem Halleluja des Himmels, der Hochzeit des Lammes und dem Reiter auf dem weißen Pferd – Christi Wiederkunft, die noch vor uns liegt.
read_aloud_tip: "Die Kapitel sind lang: Lest 17,1–6 und 17,14–18, das ganze Kapitel 18 und das ganze Kapitel 19. In Kapitel 18 übernehmen drei Vorleser die Klagen der Könige (V. 9–10), der Kaufleute (V. 11–17a) und der Seeleute (V. 17b–19); die Hallelujas in 19,1–8 lest ihr alle gemeinsam."
hebrew:
  - word: "Exelthate, ho laos mou, ex autēs"
    hebrew: "Ἐξέλθατε, ὁ λαός μου, ἐξ αὐτῆς"
    gloss: "Geht hinaus aus ihr, mein Volk"
    point: "Der Ruf Jeremias an die Verbannten im alten Babylon (Jeremia 51,6.45). Das griechische Alte Testament gebraucht dasselbe Verb für Israels Auszug aus Ägypten (2. Mose 13,3). Es ist ein neuer Auszug – aus Babylon, nicht aus der Schöpfung; das Ziel ist die Stadt, in der Gott bei den Menschen wohnt (21,1–3)."
  - word: "sōmatōn, kai psychas anthrōpōn"
    hebrew: "σωμάτων, καὶ ψυχὰς ἀνθρώπων"
    gloss: "Leiber – und Menschenseelen"
    point: "Die letzten Posten auf Babylons Frachtliste. „Leiber“ war ein Handelswort für Sklaven; hier wechselt das Griechische plötzlich die Konstruktion, als würde Johannes die Liste unterbrechen, um zu sagen, was die Kaufleute nicht sehen wollten: Es sind Seelen. Das Lamm hat Menschen für Gott erkauft (5,9); Babylon kauft und verkauft sie."
  - word: "pistos … kai alēthinos"
    hebrew: "πιστὸς … καὶ ἀληθινός"
    gloss: "Treu und Wahrhaftig"
    point: "Pistos ist einer, der sein Wort hält; alēthinos ist das Echte im Gegensatz zur Fälschung. In einem Buch voller Fälschungen – ein Tier, das aussieht wie geschlachtet (13,3), ein falscher Prophet mit Hörnern wie ein Lamm (13,11) – ist der Reiter der Echte. So hat sich Jesus Laodizea vorgestellt (3,14)."
discussion:
  - q: "Johannes hört von der großen Hure, „die an vielen Wassern sitzt“, dann sieht er „eine Frau auf einem scharlachroten Tier sitzen“. Wie deutet das Sehen das Hören? Was hätten die Gemeinden erkannt, als der Engel von sieben Bergen spricht und von der Stadt, „die das Königtum über die Könige der Erde hat“?"
    ref: "17:1-17:18"
  - q: "„Und als ich sie sah, staunte ich sehr.“ Der Engel fragt: „Warum staunst du?“ Babylon erscheint nicht als Ungeheuer, sondern als Königin in Purpur mit einem goldenen Becher. Was beeindruckt dich gerade so sehr, dass es dein Herz vom Lamm wegzuziehen beginnt? Hinter dem Glanz: Worauf reitet es – und wer bezahlt dafür?"
    ref: "17:3-17:7"
  - q: "Das Alte Testament im Neuen: Lest Jeremia 51,6–8 und Jesaja 47,7–8 laut und vergleicht sie mit 18,2–8. Was sagt es uns, dass die Stimme vom Himmel Jeremias Worte gebraucht: „Geht hinaus aus ihr, mein Volk“? Was für ein Auszug ist das – aus der Welt oder aus etwas anderem? Was würde er für deine Arbeit und dein Geldausgeben bedeuten?"
    ref: "18:2-18:8"
  - q: "In ihrem Herzen sagt Babylon: „Ich sitze als Königin, und Witwe bin ich nicht, und Trauer werde ich niemals sehen.“ Laodizea sagte: „Ich bin reich, ich bin reich geworden und brauche nichts“ (3,17). Wo hörst du diese Stimme in deinem eigenen Herzen – „wenn ich genug habe, kann mir nichts passieren“?"
    ref: "18:7"
  - q: "Die Kaufleute weinen nicht über die Stadt oder die Sklaven, sondern „weil niemand mehr ihre Fracht kauft“ – und die Liste endet mit „Leiber – und Menschenseelen“. Was zeigt unsere Trauer, woran unser Herz gebunden ist? Wer ist für uns vielleicht nur „Fracht“ – Menschen, deren Arbeit wir nutzen, ohne sie wirklich zu sehen?"
    ref: "18:11-18:24"
  - q: "Halleluja, „denn die Hochzeit des Lammes ist gekommen, und seine Frau hat sich bereit gemacht.“ Die Hure kaufte sich Purpur und Gold; der Braut wird feines Leinen gegeben, glänzend und rein. Siehst du die Gemeinde eher als Versagen oder als Braut des Lammes? Und willst du dir dein Gewand verdienen oder es als Geschenk empfangen?"
    ref: "19:1-19:10"
  - q: "Der Reiter „heißt Treu und Wahrhaftig“; sein Gewand ist schon vor jedem Kampf in Blut getaucht, und keine Schlacht wird beschrieben – nur das Schwert aus seinem Mund. Welche Verheißung fällt dir gerade schwer zu glauben? Und wann hast du zuletzt mit den Waffen des Tieres gekämpft – Zorn, Manipulation, Macht – statt mit dem Wort?"
    ref: "19:11-19:21"
application:
  - "Wähle in dieser Woche einen Schritt des „Hinausgehens“: Verschenke etwas, das du gern behalten würdest, oder frag bei einem Einkauf, wer die Menschen dahinter sind, und bete für sie – nicht aus Schuldgefühl, sondern als jemand, der schon dem Lamm gehört."
  - "Wähle ein Gespräch, in dem du versucht bist, mit harten Worten zu gewinnen. Bete vorher Hebräer 4,12 und sag dann ein wahres Wort in Liebe statt des Wortes, das verletzt."
prayer: "Lest 19,6–8 gemeinsam laut. Dann betet zu zweit: Nennt vor Gott eine Sache, die euch mehr beeindruckt als das Lamm; betet für Menschen, die wie Fracht behandelt werden – ausgebeutete Arbeiter, Opfer von Menschenhandel, alle, deren Wert an ihrer Leistung gemessen wird; und dankt dem Reiter, der Treu und Wahrhaftig heißt, für eine Verheißung, die er gehalten hat. Schließt gemeinsam: „Halleluja! Denn der Herr, Gott, der Allmächtige, hat die Herrschaft angetreten.“"
leader_notes:
  - "Das ist das umfangreichste Treffen: drei lange Kapitel und vier Andachten (Tag 23–26). Folge dem Lesetipp und wähle fünf Fragen aus; 2, 4 und 6 sind das Herz des Abends."
  - "Wer ist Babylon? Für die ersten Leser eindeutig Rom (die sieben Berge, 17,9; die große Stadt, 17,18), aber in der Geschichte der Bibel ist sie jede Macht seit Babel (1. Mose 11,4), die mit Luxus, Gewalt und Götzendienst verführt. Deute die sieben Könige (17,9–11) nicht auf eine Liste von Kaisern und das Tier nicht auf einen heutigen Staat, eine Institution oder eine Kirche. Futuristische Ausleger erwarten ein endzeitliches Babylon oder Weltsystem, präteristische sehen nur Rom; nenne beide fair in einem Satz und kehre zur Frage des Buches zurück: Wem gehöre ich?"
  - "Geh behutsam mit „drinnen oder draußen“ um. Zwei Frauen und zwei Städte sind ein Ruf zur Treue, kein Werkzeug, um andere als Babylon abzustempeln. Kapitel 18 ist auch keine Predigt gegen Geld oder Handel – Weizen, Wein und Öl sind gute Gaben Gottes. Es geht um das Herz, das sagt „Trauer werde ich niemals sehen“, und um die Menschen hinter den Waren."
  - "Der Text nennt Babylon eine „Hure“ und spricht von „Hurerei“. Bei den Propheten ist das das Bild der Untreue gegen Gott – seine Liebe und sein Vertrauen anderen Mächten zu schenken (Hosea 2; Hesekiel 16; Nahum 3,4). Wenn sich jemand an dem Bild stößt, erkläre es kurz: Es geht darum, wem wir unser Herz geben."
  - "19,11–21 ist Christi Wiederkunft, die noch vor uns liegt. Das schreckliche Mahl in 19,17–18 nimmt Hesekiel 39,17–20 auf: Das Böse ist völlig und endgültig besiegt. Weise auf die zwei Mahle hin – alle werden zuerst zum Hochzeitsmahl des Lammes eingeladen (19,9). Und 19,10 ist ein guter Moment für die Frage, was wir an Gottes Stelle anzubeten versucht sind: „Bete Gott an!“"
  - "Ausblick: Nächste Woche ist das letzte Treffen, Kapitel 20–22 – der Drache an der Kette, alles wird neu, die Braut, die eine Stadt ist, der Strom und der Baum des Lebens und „Komm, Herr Jesus“."
