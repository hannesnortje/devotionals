session: 2
lang: de
title: "Vier Gemeinden, ein Herr"
ref: "2:1-2:29"
days: [3, 4, 5, 6]
big_idea: "Der mitten unter den Leuchtern umhergeht, kennt jede Gemeinde, wie sie wirklich ist – die lieblose Rechtgläubigkeit von Ephesus, die reiche Armut von Smyrna, den stillen Kompromiss von Pergamon und die liebevolle Duldsamkeit von Thyatira – und ruft jede von ihnen, und uns, zum Hören, Umkehren, Festhalten und Siegen."
opening: "Stell dir vor, jemand, der dich gut kennt, schreibt dir einen kurzen, ehrlichen Brief: eine Sache, die er an dir bewundert, und eine, die ihm Sorgen macht. Was würde wohl darin stehen? (Du musst die Antwort nicht erzählen.)"
context: >-
  Die sieben Städte liegen an einer Rundstraße, vermutlich der Weg, den ein Bote von Patmos aus nehmen würde: zuerst Ephesus, dann Smyrna, Pergamon und Thyatira.
  Jeder Brief folgt einem Muster – ein Titel Christi aus Kapitel 1, „Ich kenne …“, Lob oder Tadel, der Ruf zur Umkehr oder zum Festhalten, eine Verheißung für den, der siegt, und der Ruf zum Hören.
  Die Briefe waren keine Privatpost: „was der Geist den Gemeinden sagt“ wurde in allen sieben vorgelesen; jede Gemeinde hörte jeden Brief – und wir auch.
read_aloud_tip: "Die vier, die je eine Gemeinde übernommen haben, lesen ihren Brief (V. 1–7, 8–11, 12–17, 18–29), als wäre er an ihre eigene Gemeinde gerichtet. Die ganze Gruppe liest jedes Mal gemeinsam den Kehrvers: „Wer ein Ohr hat, soll hören, was der Geist den Gemeinden sagt.“"
hebrew:
  - word: "aphiēmi"
    hebrew: "ἀφίημι"
    gloss: "verlassen"
    point: "Ephesus hatte seine erste Liebe nicht verloren, wie man einen Autoschlüssel verliert; es hatte sie losgelassen, zurückgelassen (2,4). Dasselbe Verb kehrt in Thyatira wieder: „du lässt … gewähren“ – wörtlich: du lässt sie machen (2,20). Ephesus ließ die Liebe los; Thyatira ließ seine Pflicht los, dem Bösen zu wehren."
  - word: "ptōcheia"
    hebrew: "πτωχεία"
    gloss: "Armut"
    point: "Nicht die bescheidene Armut dessen, der gerade genug hat (penia), sondern die Bettelarmut dessen, der gar nichts hat – der Preis, den die Christen in Smyrna dafür zahlten, dass sie den Kaiser nicht verehrten. Und dann die vier Worte Christi: „aber du bist reich“ (2,9)."
  - word: "psēphos leukē"
    hebrew: "ψῆφος λευκή"
    gloss: "weißer Stein"
    point: "Vor Gericht konnte ein weißes Steinchen Freispruch bedeuten; kleine Steine oder Täfelchen dienten auch als Eintrittskarte zu einem Festmahl. Gläubigen, die von Rom verurteilt und von den Zunftfesten ausgeschlossen wurden, schenkt Christus Freispruch und einen Platz an seinem eigenen Tisch – mit einem neuen Namen, den nur kennt, wer ihn empfängt (2,17)."
discussion:
  - q: "Für jeden Bericht: Mit welchem Titel stellt Christus sich in deinem Brief vor, und warum passt er zur Stadt? (Ephesus: der unter den Leuchtern umhergeht; Smyrna: der tot war und lebendig wurde; Pergamon: das Schwert, in der Stadt des Schwertrechts des Statthalters; Thyatira: der Sohn Gottes, in der Stadt eines „Sohnes des Zeus“.)"
    ref: "2:1-2:18"
  - q: "Ephesus: „Ich kenne deine Werke, deine Mühe und deine Ausdauer“ – und doch: „Du hast deine erste Liebe verlassen“. Wie kann eine Gemeinde oder ein Christ fleißig und rechtgläubig sein und die Liebe trotzdem zurückgelassen haben? Was waren deine eigenen „ersten Werke“, als die Gnade dich zum ersten Mal überwältigte?"
    ref: "2:2-2:5"
  - q: "Smyrna: „Ich kenne deine Bedrängnis und deine Armut – aber du bist reich“. Die Bedrängnis ist echt, aber sie dauert „zehn Tage“ – heftig, und doch von Gott bemessen. Wie verändert das deinen Blick auf eine schwere Zeit, oder auf deine eigene Vorstellung von Segen?"
    ref: "2:8-2:11"
  - q: "Pergamon: „Ich weiß, wo du wohnst: wo der Thron des Satans ist.“ Christus ehrt Antipas mit seinem eigenen Titel aus 1,5: „meines Zeugen, meines Treuen“. Wie sieht dein „Pergamon“ aus – der Ort, an dem du Druck spürst, einen anderen Herrn zu ehren oder über deinen zu schweigen?"
    ref: "2:12-2:13"
  - q: "Zwei Namen aus dem Alten Testament: Bileam (lest 4. Mose 25,1–3 und 31,16) und Isebel (1. Könige 16,31–33; 21,25). Was haben sie Israel angetan – nicht durch offenen Angriff, sondern durch Verführung? Warum gebraucht Jesus diese Namen wohl für Lehrer in der Gemeinde, und wo begegnet uns heute dieselbe Art zu argumentieren?"
    ref: "2:14-2:20"
  - q: "Ephesus konnte die Bösen nicht ertragen, hatte aber die Liebe losgelassen; Thyatira war reich an Liebe, Glauben, Dienst und Ausdauer – aber: „Du lässt die Frau Isebel gewähren“. Welche der beiden ist die größere Gefahr für dich und für unsere Gemeinde?"
    ref: "2:19-2:25"
  - q: "Schaut auf die Verheißungen: der Baum des Lebens (1. Mose 2–3), der Kranz des Lebens, das verborgene Manna und der weiße Stein, Vollmacht mit dem Messias (Psalm 2,8–9) und der Morgenstern (vgl. 22,16). Welche Verheißung spricht dich am meisten an, und warum? Wie würde „Siegen“ diese Woche für dich aussehen?"
    ref: "2:7-2:28"
application:
  - "Lies diese Woche jeden Tag noch einmal den Brief „deiner“ Gemeinde und schreib einen Satz auf: Was würde der auferstandene Christus mir in diesem Brief sagen?"
  - "Nenne einen kleinen Kompromiss – eine „Prise Weihrauch“ –, den du bisher „nicht so schlimm“ genannt hast, und tu einen konkreten Schritt weg davon; oder nimm ein „erstes Werk“ schlichter Liebe zu Jesus wieder auf."
prayer: "Betet der Reihe nach für die vier Gemeinden: um die erste Liebe (Ephesus), um Mut unter Druck (Smyrna), um ungeteilte Treue (Pergamon), um Unterscheidungsvermögen mit Liebe (Thyatira). Jede Person, die berichtet hat, betet für „ihre“ Gemeinde und dann für unsere eigene Gemeinde in derselben Sache. Schließt mit 2,25: „Nur haltet fest, was ihr habt, bis ich komme.“"
leader_notes:
  - "Dieser Abend umfasst vier Andachten (Tag 3–6) und ein langes Kapitel. Lass jede berichtende Person in zwei Minuten ihre Stadt aus der Andacht vorstellen (Ephesus: Artemis und der Kaisertempel; Smyrna: Roma, der Kaiserkult und die Myrrhe; Pergamon: der Zeusaltar, Asklepios und das Schwertrecht des Statthalters; Thyatira: die Zünfte und ihre Götzenmahlzeiten). Wenn die Zeit knapp ist, nimm die Fragen 1, 2, 4 und 6."
  - "Manche lesen die sieben Gemeinden als sieben aufeinanderfolgende Epochen der Kirchengeschichte. Benenne das fair; zeig dann, dass der Text sie als wirkliche Gemeinden zur Zeit des Johannes vorstellt und dass jeder Brief mit „was der Geist den Gemeinden sagt“ endet – jede Gemeinde zu jeder Zeit hört alle sieben."
  - "Mit Sorgfalt: „Synagoge des Satans“ (2,9) ist kein Urteil über Juden im Allgemeinen. Die Andacht liest es als einen örtlichen Konflikt, in dem einige die Christen vermutlich bei den Behörden anzeigten; Christus sagt, dass die wahre Zugehörigkeit zu Gott im Glauben liegt. Lass nicht zu, dass der Vers gegen Juden verwendet wird."
  - "Mit Sorgfalt: „Isebel“ ist Christi Name für eine Lehrerin, die Menschen zu Götzendienst und Unzucht verführte. Es ist keine Bezeichnung für Frauen und für niemanden in unserer Gemeinde. Die Briefe rufen zur Treue – „wem gehöre ich?“ –, nicht zum Richten über andere."
  - "„werde deinen Leuchter von seinem Platz rücken“ (2,5) handelt nicht davon, dass ein Einzelner sein Heil verliert, sondern dass eine Gemeinde ihren Platz als Lichtträgerin verliert. Die Andacht beschreibt die Nikolaiten als eine Gruppe, die Kompromisse mit dem Götzendienst erlaubte (vgl. 2,14–15); viel mehr wissen wir nicht über sie."
  - "Ausblick: Nächste Woche Kapitel 3 – Sardes, Philadelphia und Laodizea. Bitte drei Personen, je eine Gemeinde für das nächste Mal zu übernehmen."
