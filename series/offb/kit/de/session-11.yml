session: 11
lang: de
title: "Komm, Herr Jesus"
ref: "20:1-22:21"
days: [27, 28, 29, 30, 31]
big_idea: "Hinter den Kulissen regiert Christus schon jetzt, und der Satan liegt an der Kette, sodass er das Evangelium nicht aufhalten kann; die Geschichte, die in Eden begann, endet nicht mit einer Flucht aus der Welt, sondern damit, dass Gott alles neu macht und von Angesicht zu Angesicht bei seinem Volk wohnt – und darum wartet die Gemeinde wach und treu und betet: „Amen, komm, Herr Jesus!“"
opening: "Was war die schönste Heimkehr, an die du dich erinnerst – nach einer Reise, einem Krankenhausaufenthalt oder einer langen Zeit in der Ferne? Was hat dir das Gefühl gegeben, zu Hause zu sein?"
context: >-
  Kapitel 19 zeigte Christi Wiederkunft. Kapitel 20 tritt noch einmal zurück und zeigt die Zeit, in der wir leben, aus einem anderen Blickwinkel: Der Drache ist für tausend Jahre gebunden, während Christus mit seinem Volk herrscht; dann kommen der letzte kurze Aufstand und der große weiße Thron.
  Die Kapitel 21–22 zeigen, was bleibt, wenn alles Böse vergangen ist: einen neuen Himmel und eine neue Erde, die Braut, die eine Stadt ist, den Strom und den Baum des Lebens aus Eden und das Angesicht Gottes.
  Und das Buch endet, wie es begann – als Brief an die sieben Gemeinden, mit der Verheißung „ich komme bald“ und mit Gnade.
read_aloud_tip: "Fünf Vorleser: 20,1–10; 20,11–21,8; 21,9–27; 22,1–9; 22,10–21. Den Hymnus in 21,3–4 lest ihr alle gemeinsam, und ganz am Ende sprechen alle 22,20–21 laut."
hebrew:
  - word: "edēsen"
    hebrew: "ἔδησεν"
    gloss: "band"
    point: "Von deō, „binden“ – dasselbe Verb, das Jesus für das Binden des Starken gebraucht, bevor man sein Haus plündert (Markus 3,27). Die Bindung des Satans beginnt am Kreuz (Johannes 12,31–32): Er kann noch Schaden anrichten, aber er kann das Evangelium unter den Nationen nicht mehr aufhalten (20,3)."
  - word: "Idou kaina poiō panta"
    hebrew: "Ἰδοὺ καινὰ ποιῶ πάντα"
    gloss: "Sieh, ich mache alles neu"
    point: "Eine der wenigen Stellen, an denen der, der auf dem Thron sitzt, selbst spricht (vgl. 1,8). Er wirft seine Schöpfung nicht weg; er macht alles neu. Und das Verb steht im Präsens: Wer in Christus ist, ist schon eine neue Schöpfung (2. Korinther 5,17)."
  - word: "erchou, kyrie Iēsou"
    hebrew: "ἔρχου, κύριε Ἰησοῦ"
    gloss: "komm, Herr Jesus"
    point: "Die frühe Gemeinde hat wahrscheinlich dasselbe Gebet auf Aramäisch gebetet, Marana tha – „Unser Herr, komm!“ (1. Korinther 16,22); nach der Didache (10,6) gehörte es zu den Gebeten beim Abendmahl. Es ist die Antwort auf seine Verheißung „ich komme bald“ (22,20)."
discussion:
  - q: "Ein Engel bindet den Drachen, „damit er die Nationen nicht mehr verführe“ (vgl. Markus 3,27). Wenn die tausend Jahre die Zeit zwischen Christi erstem und zweitem Kommen sind, in der wir jetzt leben – wo siehst du, dass die Kette hält, dass der Satan das Evangelium nicht aufhalten kann? Und wo fühlt es sich überhaupt nicht so an?"
    ref: "20:1-20:3"
  - q: "Die, die „enthauptet worden waren wegen des Zeugnisses Jesu“, lebten und herrschten mit Christus tausend Jahre. Für die Welt hatten sie verloren; hinter den Kulissen herrschen sie. Was hätte das einer Gemeinde bedeutet, die an Antipas dachte (2,13)? Wie tröstet es dich im Blick auf Geliebte, die im Glauben gestorben sind?"
    ref: "20:4-20:6"
  - q: "Vor dem großen weißen Thron heißt es: „Bücher wurden geöffnet. Und ein anderes Buch wurde geöffnet, das ist das Buch des Lebens.“ Wir werden nach unseren Werken gerichtet, aber das letzte Wort kommt aus dem Buch des Lebens des Lammes (21,27; Lukas 10,20). Wie hält das den Ernst unseres Lebens und die Gewissheit der Gnade zusammen?"
    ref: "20:11-20:15"
  - q: "Lest 1. Mose 2,8–10 und 3,17–24, dann Offenbarung 22,1–5. Was ging in Eden verloren, und was kommt zurück? Was ist größer als am Anfang – ein Garten, der zur Stadt geworden ist, der Baum des Lebens mitten auf ihrer Straße, kein Fluch mehr und „sie werden sein Angesicht sehen“? (Wenn Zeit ist, vergleicht Hesekiel 47,1–12.)"
    ref: "22:1-22:5"
  - q: "„Sieh, das Zelt Gottes ist bei den Menschen“ – die Sprache der Stiftshütte (2. Mose 25,8; Johannes 1,14). Wir fliehen nicht in einen fernen Himmel; Gott wohnt bei uns, und „er wird jede Träne von ihren Augen abwischen“. Welche Träne trägst du noch mit dir? Was bedeutet es, dass er „Sieh, ich mache alles neu“ im Präsens sagt?"
    ref: "21:1-21:7"
  - q: "Der Engel, der Johannes die Hure zeigte (17,1), zeigt ihm jetzt „die Braut, die Frau des Lammes“: eine Stadt ohne Tempel, weil Gott und das Lamm ihr Tempel sind. Was bedeutet das für deinen Montag? Und für deine Gemeinde mit all ihren Eigenheiten, dass die Braut ein Volk ist und keine Ansammlung von Einzelnen?"
    ref: "21:9-21:27"
  - q: "Dreimal hören wir „ich komme bald“, und zwischen den Warnungen steht die Einladung: „Und der Geist und die Braut sagen: ‚Komm!‘“ Wie prägt Jesu „bald“ die Art, wie wir warten – nicht mit Daten, sondern mit Bereitschaft? Wen könntest du in dieser Woche einladen, zu kommen und das Wasser des Lebens umsonst zu trinken?"
    ref: "22:6-22:21"
application:
  - "Bete in dieser Woche jeden Morgen das letzte Gebet der Bibel: „Amen, komm, Herr Jesus!“ Füge den Namen eines Menschen hinzu, den du einladen möchtest, zu kommen und vom Wasser des Lebens zu trinken (22,17)."
  - "Schreib eine Träne auf, die du noch mit dir trägst, und lies 21,3–5 laut daneben. Dann sag zu Gott: Auch diese wirst du abwischen. Und bete in dieser Woche einmal für ein Volk oder Land, in dem das Evangelium noch wenig bekannt ist."
prayer: "Dieser Abend schließt die Reihe ab. Beginnt mit einer Dankrunde: Jeder sagt in einem Satz, was er in der Offenbarung hinter den Kulissen gesehen hat und behalten möchte. Dann betet für die verfolgte Gemeinde, für ein Volk, in dem das Evangelium noch wenig bekannt ist, und füreinander. Steht zum Schluss auf und lest gemeinsam 22,20–21 laut: „Amen, komm, Herr Jesus! Die Gnade des Herrn Jesus sei mit allen.“"
leader_notes:
  - "Letztes Treffen: drei Kapitel und fünf Andachten (Tag 27–31). Wähle fünf der sieben Fragen und halte mindestens 20 Minuten für den Rückblick und das Abschlussgebet frei."
  - "Die tausend Jahre (20,1–6): Diese Reihe folgt der Auslegung, die in der Kirche seit Augustinus bekannt ist – die Zeit zwischen Christi erstem und zweitem Kommen, in der Christus herrscht und sein Volk mit ihm, und der Satan gebunden ist, sodass er das Evangelium unter den Nationen nicht aufhalten kann. Prämillenaristen (schon Justin und Irenäus, später die Dispensationalisten) erwarten nach Christi Wiederkunft ein buchstäbliches tausendjähriges Reich auf Erden; Postmillenaristen erwarten davor ein goldenes Zeitalter des Evangeliums. Nenne diese Sichtweisen fair und lass den Abend nicht zur Debatte werden: Alle sind sich einig, dass Christus wiederkommt, richtet und alles neu macht."
  - "Kapitel 20 folgt zeitlich nicht unbedingt auf Kapitel 19. Derselbe letzte Krieg (im Griechischen jedes Mal „der Krieg“, 16,14; 19,19; 20,8) wird aus verschiedenen Blickwinkeln gezeigt, und jedes Mal gibt es keinen wirklichen Kampf: Das Ende kommt vom Thron."
  - "Geh behutsam mit dem großen weißen Thron und dem Feuersee um (20,11–15; 21,8): Manche werden Angst spüren, andere Trauer um geliebte Menschen. Spekuliere nicht darüber, wer im Buch des Lebens steht; weise auf das Lamm hin, dem das Buch gehört. „Die Feigen“ (21,8) sind nicht Menschen, die Angst haben und schwach sind, sondern die, die aus Angst Christus aufgegeben haben – und die Tür steht noch offen: Wer Durst hat, darf kommen (21,6; 22,17)."
  - "Die Maße der Stadt (zwölftausend Stadien, hundertvierundvierzig Ellen) sind Zahlen zum Staunen, nicht für Landkarten: Zwölf ist das Volk Gottes, und der Würfel erinnert an das Allerheiligste (1. Könige 6,20). Die Ausleger sind sich uneinig, ob die neue Schöpfung völlig neu oder die alte erneuert ist; der Punkt ist derselbe – Gott gibt seine Schöpfung nicht auf."
  - "„Bald“ (22,7.12.20) ist kein Datum, sondern eine Verheißung, die jede Generation wach hält (2. Petrus 3,8–9; Habakuk 2,3). Vermeide Datumsberechnungen und Angst. Wenn es in eurer Gemeinde möglich ist, kann die Reihe mit dem Abendmahl schließen, als Vorgeschmack auf das Hochzeitsmahl des Lammes (19,9)."
