session: 3
lang: de
title: "Umgekehrt"
ref: "3:1-3:10"
days: [6, 7]
big_idea: >-
  Gott spricht seinen geflohenen Propheten ein zweites Mal an, und eine
  gewalttätige Stadt glaubt Gott und kehrt um – Gottes Gnade kehrt Herzen um,
  nicht nur Städte.
opening: >-
  Hast du schon einmal eine zweite Chance bekommen – einen zweiten Versuch bei
  einer Prüfung, im Beruf oder in einer Freundschaft? Wie hat sich das angefühlt?
context: >-
  Jona ist gerade auf das trockene Land ausgespien worden. Kapitel 3 beginnt fast
  wortgleich wie Kapitel 1: Das Wort des HERRN erging zum zweiten Mal an Jona – mit
  demselben Auftrag. Diesmal steht Jona auf und geht. Und eine Predigt aus nur fünf
  hebräischen Wörtern löst die größte Umkehr einer Stadt in der Bibel aus.
read_aloud_tip: >-
  Lest mit drei Stimmen: Erzähler, der HERR (V. 2) und der Ausrufer des Königs
  (V. 7–9). Eine Person liest Jonas Ein-Satz-Predigt in V. 4 langsam, mit einer
  kurzen Pause davor.
hebrew:
  - word: "schenit"
    hebrew: "שֵׁנִית"
    gloss: "zum zweiten Mal"
    point: >-
      Ein kleines Wort voller Gnade. Gott hätte einen anderen Propheten wählen
      können, aber sein Wort erging erneut an Jona: Seine Berufung ruht auf seiner
      Treue, nicht auf unserem Versagen.
  - word: "nehpachet"
    hebrew: "נֶהְפָּכֶת"
    gloss: "umgekehrt"
    point: >-
      Von hafach, dem Wort für die Zerstörung Sodoms (1. Mose 19,25) – es kann aber
      auch „umgewendet“, „völlig verwandelt“ heißen. Ninive wurde tatsächlich
      innerhalb von vierzig Tagen umgekehrt: nicht durch Feuer, sondern durch Umkehr.
  - word: "schuv"
    hebrew: "שׁוּב"
    gloss: "umkehren"
    point: >-
      Das Scharnier von Kapitel 3. Die Leute sollen von ihrem bösen Weg umkehren
      (V. 8); der König hofft, dass Gott von der Glut seines Zorns umkehrt (V. 9);
      und als sie umkehren, reut Gott das Böse, das er angekündigt hatte (V. 10).
discussion:
  - q: >-
      Legt 1,1–3 und 3,1–3 nebeneinander. Was ist gleich, was hat sich verändert?
      Achtet auf den Wechsel von „rufe gegen sie aus“ (1,2) zu „rufe ihr die
      Botschaft aus, die ich dir sage“ (3,2).
    ref: "3:1"
  - q: >-
      Jonas ganze Predigt lautet: „Noch vierzig Tage, und Ninive wird umgekehrt!“
      Was fehlt darin? Warum hat sie trotzdem gewirkt?
    ref: "3:4"
  - q: >-
      „Umgekehrt“ kann zerstört oder verwandelt bedeuten. In welchem Sinn wurde
      Ninive am Ende doch „umgekehrt“?
    ref: "3:10"
  - q: >-
      Die Umkehr beginnt bei den einfachen Leuten und erreicht dann den Thron.
      Schaut euch die vier Dinge an, die der König in Vers 6 tut. Was sagt jedes davon?
    ref: "3:6"
  - q: >-
      Der König sagt: „Wer weiß, vielleicht kehrt Gott um und es reut ihn.“
      Vergleicht den Kapitän in 1,6: „Vielleicht denkt dieser Gott an uns.“ Was
      verstehen diese beiden Heiden darüber, wie man Gott begegnet, was Jona
      vergessen zu haben scheint?
    ref: "3:9"
  - q: >-
      „Und Gott sah ihre Taten, dass sie umkehrten von ihrem bösen Weg.“ Wie sieht
      echte Umkehr in den Versen 8 und 10 aus? Was könnte „die Gewalt, die an seinen
      Händen klebt“, heute für uns sein?
    ref: "3:8"
  - q: >-
      Ninive war „eine große Stadt – groß sogar vor Gott“. Wen haben wir als für Gott
      unerreichbar abgeschrieben? Was würde sich ändern, wenn wir sie als groß vor
      Gott sähen?
    ref: "3:3"
application:
  - >-
    Benenne einen „Punkt des Ungehorsams“, zu dem du zurückkehren musst – etwas, um
    das Gott dich gebeten hat und das liegen geblieben ist – und geh diese Woche
    die erste „Tagesreise“.
  - >-
    Wähle einen Menschen oder eine Gruppe, die du abgeschrieben hast. Bete diese
    Woche jeden Tag mit Namen für sie.
prayer: >-
  Dankt Gott gemeinsam, dass sein Wort „zum zweiten Mal“ ergeht. Haltet dann eine
  Minute Stille, in der jede und jeder vor Gott bringt, was an den eigenen Händen
  klebt und losgelassen werden will. Schließt, indem ihr laut, kurz und mit Namen
  für Menschen und Orte betet, die unerreichbar scheinen.
leader_notes:
  - >-
    Manche tragen echte Schuld wegen ihres eigenen „Tarsis“. Kommt immer wieder auf
    3,1 zurück – das Wort ergeht ein zweites Mal. Frage 6 kann in Stille beantwortet
    werden; niemand soll sich gedrängt fühlen, in der Gruppe etwas zu bekennen.
  - >-
    Der geschichtliche Hintergrund aus Tag 6 (Seuchen 765 und 759 v. Chr., die
    Sonnenfinsternis von 763 v. Chr.) erklärt Ninives Offenheit. Erwähne ihn in
    zwei, drei Minuten; es geht um die Kraft von Gottes Wort, nicht um die Finsternis.
  - >-
    Gruppen bleiben oft bei „Da reute Gott das Böse“ hängen: Ändert Gott seine Meinung? Tag 7
    verweist auf Jeremia 18,7–8 – Gottes Wesen ändert sich nicht; sein Handeln an
    einer Stadt ändert sich, wenn sie von ihrer Sünde umkehrt.
  - >-
    Das Vieh in Sacktuch sorgt vielleicht für ein Lächeln. Tag 7 zeigt, dass es ein
    bekannter Brauch war (Herodot; Judit 4,10). Kurz aufnehmen und weitergehen.
  - >-
    Schließe mit einem Ausblick: In 3,10 tut Gott „das Böse“ nicht. Das nächste
    Treffen beginnt damit, dass Jona genau das „ein großes Böses“ nennt.
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
