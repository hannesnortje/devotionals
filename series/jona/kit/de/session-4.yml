session: 4
lang: de
title: "Die unbeantwortete Frage"
ref: "4:1-4:11"
days: [8, 9, 10]
big_idea: >-
  Jona ist zornig, weil Gott gnädig ist. Durch eine Rizinusstaude, einen Wurm und
  einen glühenden Wind deckt Gott sein enges Herz auf – und stellt eine Frage, die
  das Buch für uns offenlässt: Sollte ich kein Mitleid haben?
opening: >-
  Welche Kleinigkeit kann dir sofort die Laune verderben – ein heißer Tag, langsames
  Internet, ein verpasster Bus? Was sagt das über uns?
context: >-
  Ninive wurde verschont. Statt sich zu freuen, ist Jona wütend – und endlich
  erfahren wir, warum er nach Tarsis geflohen ist. Er setzt sich östlich der Stadt
  hin, um zu sehen, was geschieht, und Gott lehrt ihn mit einer Rizinusstaude,
  einem Wurm und einem glühenden Ostwind. Das Buch endet mit Gottes Frage – und
  ohne Antwort von Jona.
read_aloud_tip: >-
  Lest es als Dialog mit drei Stimmen: Erzähler, Jona und der HERR. Lasst nach der
  letzten Frage in Vers 11 einen Moment Stille – das Buch gibt keine Antwort.
hebrew:
  - word: "ra'ah gedolah"
    hebrew: "רָעָה גְדוֹלָה"
    gloss: "ein großes Böses"
    point: >-
      Ninives Bosheit stieg vor Gott hinauf (1,2); sie kehrten um von ihrem bösen
      Weg (3,8); Gott reute das Böse (3,10). Und jetzt: „Das aber war in Jonas Augen
      böse – ein großes Böses.“ Gottes Gnade selbst ist in Jonas Augen böse.
  - word: "chara"
    hebrew: "חָרָה"
    gloss: "sein Zorn entbrannte"
    point: >-
      In dem Moment, in dem Gottes glühender Zorn aufhört (3,9), entbrennt Jonas Zorn.
      Gott antwortet mit einer leisen Frage, wie bei Kain (1. Mose 4,6): „Ist es
      recht, dass dein Zorn entbrannt ist?“
  - word: "chus"
    hebrew: "חוּס"
    gloss: "Mitleid haben"
    point: >-
      Jona hat Mitleid – aber mit einer Pflanze, die ein „Sohn einer Nacht“ war.
      Gott schließt vom Kleineren auf das Größere: Wenn du Mitleid mit der Staude
      hast, sollte ich kein Mitleid haben mit Ninive?
discussion:
  - q: >-
      Lest 4,1–2. Warum ist Jona wirklich nach Tarsis geflohen? Wie verändert das
      euren Blick auf Kapitel 1?
    ref: "4:2"
  - q: >-
      Jona zitiert Israels großes Bekenntnis – „ein gnädiger und barmherziger Gott
      …, langsam zum Zorn und reich an Gnade“ (2. Mose 34,6) – als Vorwurf. Wie
      kann man Wahres über Gott wissen und es ihm trotzdem übel nehmen?
    ref: "4:2"
  - q: >-
      Gott antwortet auf Jonas Ausbruch mit einer Frage: „Ist es recht, dass dein
      Zorn entbrannt ist?“ Warum eine Frage und keine Zurechtweisung? Was tut Gott hier?
    ref: "4:4"
  - q: >-
      Die Rizinusstaude ist das Einzige im ganzen Buch, worüber Jona sich freut
      (4,6); die Hitze lässt ihn den Tod wünschen (4,8). Was verraten unsere Freude
      und unser Ärger darüber, was uns am wichtigsten ist?
    ref: "4:6"
  - q: >-
      Gott „bestellte“ den Fisch, die Staude, den Wurm und den Wind. Was bedeutet es,
      dass sogar der Wurm bestellt war? Kennst du so einen „Wurm“ aus deinem Leben?
    ref: "4:7"
  - q: >-
      Lest 4,10–11. Vergleicht, womit Jona Mitleid hat und womit Gott Mitleid hat.
      Welches Argument führt Gott – und warum erwähnt er ganz am Ende das Vieh?
    ref: "4:11"
  - q: >-
      Das Buch endet mit einer Frage. Wie würdest du sie beantworten – für dich
      selbst und für das „Ninive“ in deinem Leben, das du schwer lieben kannst?
    ref: "4:11"
application:
  - >-
    Denk an einen Menschen, gegenüber dem du die Haltung des „älteren Bruders“ hast
    (Lukas 15,25–32). Bete diese Woche jeden Tag um Segen für ihn.
  - >-
    Schreib deine eigene Antwort auf Gottes Frage in 4,11 in einem Satz auf und teile
    sie mit einer Person aus der Gruppe.
prayer: >-
  Beginnt mit einer Minute Stille vor Gottes Frage in 4,11. Betet dann für Menschen
  und Orte, die wir schwer lieben können, und dankt Gott, dass er „langsam zum Zorn
  und reich an Gnade“ ist – ihnen gegenüber und uns gegenüber.
leader_notes:
  - >-
    Dieses Treffen umfasst drei Andachten (Tag 8–10) und ein langes Kapitel. Wenn die
    Zeit knapp ist, legt die Fragen 4 und 5 zusammen oder plant 15 Minuten mehr ein.
  - >-
    Jona wünscht sich zweimal den Tod (4,3; 4,8). Geh behutsam damit um: Vielleicht
    kennt jemand in der Gruppe Verzweiflung von innen. Richte den Blick auf Gottes
    geduldige Antwort, spiel es nicht herunter und biete ein Gespräch danach an.
  - >-
    Der „ältere Bruder“ aus Lukas 15 ist eine hilfreiche Brücke – aber der Fokus
    bleibt auf unserem eigenen Herzen, nicht auf dem Urteil über Jona oder andere im Raum.
  - >-
    Tag 10 erwägt, dass Jona das Buch selbst als sein Bekenntnis geschrieben haben
    könnte. Stell das als Möglichkeit vor, nicht als Tatsache.
  - >-
    Es ist das letzte Treffen. Nimm dir am Ende zehn Minuten für einen Rückblick auf
    alle vier Kapitel: Welches Bild oder welche Frage nehmen die Teilnehmenden mit?
  - >-
    Füll die Stille nach der letzten Lesung nicht zu schnell. Die offene Frage ist der Punkt.
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
