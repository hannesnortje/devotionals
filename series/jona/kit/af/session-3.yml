session: 3
lang: af
title: "Omgekeer"
ref: "3:1-3:10"
days: [6, 7]
big_idea: >-
  God praat 'n tweede keer met sy weggevlugte profeet, en 'n gewelddadige stad
  glo God en draai om – God se genade keer harte om, nie net stede nie.
opening: >-
  Het jy al ooit 'n tweede kans gekry – 'n tweede poging by 'n eksamen, in 'n werk
  of in 'n vriendskap? Hoe het dit gevoel?
context: >-
  Jona is pas op die droë land uitgespoeg. Hoofstuk 3 begin byna woord vir woord
  soos hoofstuk 1: die woord van die HERE het vir die tweede keer tot Jona gekom –
  met dieselfde opdrag. Hierdie keer staan Jona op en gaan. En 'n preek van net vyf
  Hebreeuse woorde ontketen die grootste ommekeer van 'n stad in die Bybel.
read_aloud_tip: >-
  Lees met drie stemme: 'n verteller, die HERE (v. 2) en die koning se uitroeper
  (vv. 7–9). Laat een persoon Jona se eensin-preek in v. 4 stadig lees, met 'n
  kort pouse vooraf.
hebrew:
  - word: "shenit"
    hebrew: "שֵׁנִית"
    gloss: "vir die tweede keer"
    point: >-
      Een klein woordjie vol genade. God kon 'n ander profeet gekies het, maar sy
      woord kom weer tot Jona: sy roeping rus op sy getrouheid, nie op ons mislukking nie.
  - word: "nehpakhet"
    hebrew: "נֶהְפָּכֶת"
    gloss: "omgekeer"
    point: >-
      Van hafakh, die woord vir die verwoesting van Sodom (Genesis 19:25) – maar dit
      kan ook "omgedraai", "heeltemal verander" beteken. Ninevé is inderdaad binne
      veertig dae omgekeer: nie deur vuur nie, maar deur bekering.
  - word: "shuv"
    hebrew: "שׁוּב"
    gloss: "omdraai"
    point: >-
      Die skarnier van hoofstuk 3. Elkeen moet omdraai van sy bose weg (v. 8); die
      koning hoop dat God sal omdraai van sy brandende toorn (v. 9); en toe hulle
      omdraai, het God berou oor die kwaad wat Hy gesê het Hy sou doen (v. 10).
discussion:
  - q: >-
      Sit 1:1–3 en 3:1–3 langs mekaar. Wat is dieselfde, en wat het verander? Let op
      die verskuiwing van "roep teen haar uit" (1:2) na "roep vir haar die boodskap
      uit wat Ek vir jou sê" (3:2).
    ref: "3:1"
  - q: >-
      Jona se hele preek is: "Nog veertig dae, en Ninevé word omgekeer!" Wat ontbreek
      daarin? Waarom het dit tog gewerk?
    ref: "3:4"
  - q: >-
      "Omgekeer" kan verwoes of omgedraai beteken. In watter sin is Ninevé uiteindelik
      tog "omgekeer"?
    ref: "3:10"
  - q: >-
      Die ommekeer begin by gewone mense en bereik dan die troon. Kyk na die vier
      dinge wat die koning in vers 6 doen. Wat sê elkeen daarvan?
    ref: "3:6"
  - q: >-
      Die koning sê: "Wie weet, miskien draai God om en het Hy berou." Vergelyk die
      kaptein in 1:6: "Miskien sal daardie god aan ons dink." Wat verstaan hierdie
      twee heidene oor hoe 'n mens God nader wat Jona skynbaar vergeet het?
    ref: "3:9"
  - q: >-
      "En God het hulle dade gesien, dat hulle omgedraai het van hulle bose weg." Hoe
      lyk egte omdraai in verse 8 en 10? Wat kan "die geweld wat aan sy hande kleef"
      vandag vir ons wees?
    ref: "3:8"
  - q: >-
      Ninevé was "'n groot stad – groot selfs voor God". Wie het ons afgeskryf as
      buite God se bereik? Wat sou verander as ons hulle sien as groot voor God?
    ref: "3:3"
application:
  - >-
    Noem een "punt van ongehoorsaamheid" waarheen jy moet teruggaan – iets wat God
    van jou gevra het en wat jy laat lê het – en loop hierdie week die eerste "dagreis".
  - >-
    Kies een persoon of groep wat jy afgeskryf het. Bid hierdie week elke dag by
    name vir hulle.
prayer: >-
  Dank God saam dat sy woord "vir die tweede keer" kom. Hou dan 'n minuut stilte
  waarin elkeen voor God bring wat aan hulle hande kleef en losgelaat moet word.
  Sluit af deur hardop, kort en by name te bid vir mense en plekke wat buite
  bereik lyk.
leader_notes:
  - >-
    Party mense dra werklike skuld oor hulle eie "Tarsis". Kom telkens terug na 3:1 –
    die woord kom 'n tweede keer. Vraag 6 kan in stilte beantwoord word; niemand
    moet gedruk voel om in die groep iets te bely nie.
  - >-
    Die historiese agtergrond van Dag 6 (pesepidemies in 765 en 759 v.C., die
    sonsverduistering van 763 v.C.) verklaar Ninevé se oopheid. Noem dit in twee of
    drie minute; dit gaan oor die krag van God se woord, nie oor die verduistering nie.
  - >-
    Groepe steek dikwels vas by "Toe het God berou gehad": verander God van plan? Dag 7
    verwys na Jeremia 18:7–8 – God se karakter verander nie; sy handelinge met 'n
    stad verander wanneer dit van sy sonde omdraai.
  - >-
    Die vee in rouklere lok dalk 'n glimlag uit. Dag 7 wys dat dit 'n bekende gebruik
    was (Herodotus; Judit 4:10). Erken dit kortliks en gaan aan.
  - >-
    Sluit af met 'n vooruitblik: in 3:10 doen God nie "die kwaad" nie. Die volgende
    byeenkoms begin daarmee dat Jona juis dit "'n groot kwaad" noem.
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
