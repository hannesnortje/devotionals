session: 4
lang: af
title: "Die Onbeantwoorde Vraag"
ref: "4:1-4:11"
days: [8, 9, 10]
big_idea: >-
  Jona is kwaad dat God genadig is. Deur 'n komkommerplant, 'n wurm en 'n
  skroeiende wind ontbloot God sy klein hart – en vra 'n vraag wat die boek vir
  ons ooplaat: Sou Ek nie jammer kry nie?
opening: >-
  Watter klein dingetjie kan jou bui in 'n oomblik bederf – 'n warm dag, stadige
  internet, 'n bus wat jy mis? Wat sê dit oor ons?
context: >-
  Ninevé is gespaar. In plaas daarvan om bly te wees, is Jona woedend – en nou
  hoor ons eindelik waarom hy na Tarsis gevlug het. Hy gaan sit oos van die stad
  om te sien wat gaan gebeur, en God leer hom met 'n komkommerplant, 'n wurm en
  'n skroeiende oostewind. Die boek eindig met God se vraag – en geen antwoord van Jona nie.
read_aloud_tip: >-
  Lees dit as 'n gesprek met drie stemme: verteller, Jona en die HERE. Laat ná die
  laaste vraag in vers 11 'n oomblik stilte – die boek gee geen antwoord nie.
hebrew:
  - word: "ra'ah gedolah"
    hebrew: "רָעָה גְדוֹלָה"
    gloss: "'n groot kwaad"
    point: >-
      Ninevé se boosheid het voor God opgestyg (1:2); hulle het omgedraai van hulle
      bose weg (3:8); God het berou gehad oor die kwaad (3:10). En nou: "Maar vir Jona
      was dit kwaad – 'n groot kwaad." God se genade self is in Jona se oë kwaad.
  - word: "charah"
    hebrew: "חָרָה"
    gloss: "sy toorn het ontvlam"
    point: >-
      Die oomblik wanneer God se brandende toorn ophou (3:9), ontvlam Jona s'n. God
      antwoord met 'n stil vraag, soos by Kain (Genesis 4:6): "Is dit reg dat jou
      toorn ontvlam?"
  - word: "chus"
    hebrew: "חוּס"
    gloss: "jammer kry"
    point: >-
      Jona het wel medelye – maar met 'n plant wat 'n "seun van 'n nag" was. God
      redeneer van die kleinere na die grotere: as jy jammer kry oor die plant, sou Ek
      nie jammer kry oor Ninevé nie?
discussion:
  - q: >-
      Lees 4:1–2. Waarom het Jona werklik na Tarsis gevlug? Hoe verander dit die
      manier waarop jy hoofstuk 1 lees?
    ref: "4:2"
  - q: >-
      Jona haal Israel se groot belydenis aan – "'n genadige en barmhartige God …,
      lankmoedig en groot in goedertierenheid" (Eksodus 34:6) – as 'n verwyt. Hoe kan
      'n mens ware dinge oor God weet en Hom dit tog kwalik neem?
    ref: "4:2"
  - q: >-
      God antwoord op Jona se uitbarsting met 'n vraag: "Is dit reg dat jou toorn
      ontvlam?" Waarom 'n vraag en nie 'n teregwysing nie? Wat doen God hier?
    ref: "4:4"
  - q: >-
      Die komkommerplant is die enigste ding in die hele boek waaroor Jona bly is
      (4:6); die hitte laat hom wens om te sterwe (4:8). Wat verklap ons blydskap en
      ons ergernis oor wat vir ons die belangrikste is?
    ref: "4:6"
  - q: >-
      God het die vis, die plant, die wurm en die wind "beskik". Wat beteken dit dat
      selfs die wurm beskik was? Ken jy so 'n "wurm" uit jou eie lewe?
    ref: "4:7"
  - q: >-
      Lees 4:10–11. Vergelyk waaroor Jona jammer kry met waaroor God jammer kry. Watter
      argument voer God – en waarom noem Hy heel aan die einde die diere?
    ref: "4:11"
  - q: >-
      Die boek eindig met 'n vraag. Hoe sou jy dit beantwoord – vir jouself, en vir die
      "Ninevé" in jou lewe wat jy moeilik kan liefhê?
    ref: "4:11"
application:
  - >-
    Dink aan een persoon teenoor wie jy die houding van die "oudste broer" het (Lukas
    15:25–32). Bid hierdie week elke dag 'n seën oor hom of haar.
  - >-
    Skryf jou eie antwoord op God se vraag in 4:11 in een sin neer, en deel dit met
    een persoon in die groep.
prayer: >-
  Begin met 'n minuut stilte voor God se vraag in 4:11. Bid dan vir die mense en
  plekke wat ons moeilik kan liefhê, en dank God dat Hy "lankmoedig en groot in
  goedertierenheid" is – teenoor hulle, en teenoor ons.
leader_notes:
  - >-
    Hierdie byeenkoms dek drie oordenkings (Dag 8–10) en 'n lang hoofstuk. As tyd min
    is, voeg vrae 4 en 5 saam, of beplan 15 minute ekstra.
  - >-
    Jona wens twee keer om te sterwe (4:3; 4:8). Hanteer dit met sorg: iemand in die
    groep ken dalk wanhoop van binne. Fokus op God se geduldige antwoord, moet dit nie
    afmaak nie, en bied aan om ná die tyd te gesels.
  - >-
    Die "oudste broer" van Lukas 15 is 'n nuttige brug – maar hou die fokus op ons eie
    harte, nie op 'n oordeel oor Jona of ander in die vertrek nie.
  - >-
    Dag 10 stel voor dat Jona die boek self as sy belydenis geskryf het. Bied dit aan
    as 'n moontlikheid, nie as 'n feit nie.
  - >-
    Dit is die laaste byeenkoms. Hou aan die einde tien minute oor vir 'n terugblik oor
    al vier hoofstukke: watter beeld of vraag neem die deelnemers saam?
  - >-
    Moenie die stilte ná die laaste lesing te gou vul nie. Die oop vraag is die punt.
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
