session: 3
lang: en
title: "Overturned"
ref: "3:1-3:10"
days: [6, 7]
big_idea: >-
  God speaks to his runaway prophet a second time, and a violent city believes
  God and turns – God's grace overturns hearts, not only cities.
opening: >-
  Have you ever been given a second chance – a second attempt at an exam, a job
  or a friendship? What did it feel like?
context: >-
  Jonah has just been vomited out onto the dry land. Chapter 3 opens almost word
  for word like chapter 1: the word of the LORD comes to Jonah a second time,
  with the same assignment. This time Jonah gets up and goes – and a sermon of
  just five Hebrew words sets off the greatest turning of a city in the Bible.
read_aloud_tip: >-
  Use three voices: a narrator, the LORD (v. 2) and the king's herald (vv. 7–9).
  Let one person read Jonah's one-line sermon in v. 4 slowly, with a pause before it.
hebrew:
  - word: "shenit"
    hebrew: "שֵׁנִית"
    gloss: "a second time"
    point: >-
      One small word holds an ocean of grace. God could have chosen another
      prophet, but his word comes to Jonah again: his calling rests on his
      faithfulness, not on our failure.
  - word: "nehpakhet"
    hebrew: "נֶהְפָּכֶת"
    gloss: "overturned"
    point: >-
      From hafakh, the word used for the destruction of Sodom (Genesis 19:25) –
      but it can also mean "turned around", "completely changed". Nineveh was
      indeed overturned within forty days: not by fire, but by repentance.
  - word: "shuv"
    hebrew: "שׁוּב"
    gloss: "turn"
    point: >-
      The hinge of chapter 3. The people are to turn from their evil way (v. 8);
      the king hopes God may turn from his burning anger (v. 9); and when they
      turn, God relents of the evil he had said he would do (v. 10).
discussion:
  - q: >-
      Put 1:1–3 and 3:1–3 side by side. What is the same, and what has changed?
      Notice the shift from "cry out against it" (1:2) to "cry out to it the
      message that I am telling you" (3:2).
    ref: "3:1"
  - q: >-
      Jonah's whole sermon is: "Forty more days, and Nineveh will be overturned!"
      What is missing from it? Why do you think it worked anyway?
    ref: "3:4"
  - q: >-
      "Overturned" can mean destroyed or turned around. In what sense was
      Nineveh "overturned" after all?
    ref: "3:10"
  - q: >-
      The turning starts among ordinary people and then reaches the throne. Look
      at the four things the king does in verse 6. What does each one say?
    ref: "3:6"
  - q: >-
      The king says, "Who knows? God may turn and relent." Compare the captain in
      1:6: "Perhaps that god will give a thought to us." What do these two pagans
      understand about approaching God that Jonah seems to have forgotten?
    ref: "3:9"
  - q: >-
      "And God saw what they did, that they turned from their evil way." What
      does real turning look like in verses 8 and 10? What might "the violence
      that is in his hands" be for us today?
    ref: "3:8"
  - q: >-
      Nineveh was "a great city – great even before God". Whom have we written
      off as beyond God's reach? What would change if we saw them as great before God?
    ref: "3:3"
application:
  - >-
    Name one "point of disobedience" you need to go back to – something God asked
    of you that you left undone – and take the first "one day's journey" step this week.
  - >-
    Choose one person or group you have written off. Pray for them by name every
    day this week.
prayer: >-
  Thank God together that his word comes "a second time". Then hold a minute of
  silence in which each person brings before God what is in their hands that
  they need to let go of. Close by praying aloud, briefly and by name, for people
  and places that seem beyond reach.
leader_notes:
  - >-
    Some people carry real guilt about their own "Tarshish". Keep coming back to
    3:1 – the word comes a second time. Question 6 can be answered in silence; no
    one should feel pressed to confess in the group.
  - >-
    The historical background in Day 6 (plagues in 765 and 759 BC, the solar
    eclipse of 763 BC) helps explain Nineveh's openness. Mention it in two or three
    minutes; the point is the power of God's word, not the eclipse.
  - >-
    Groups often get stuck on "God relented": does God change his mind? Day 7
    points to Jeremiah 18:7–8 – God's character does not change; his dealings with
    a city change when it turns from its sin.
  - >-
    The animals in sackcloth may draw a smile. Day 7 notes it was a known custom
    (Herodotus; Judith 4:10). Acknowledge it and move on.
  - >-
    End by pointing ahead: in 3:10 God does not do "the evil". Next session opens
    with Jonah calling exactly that "a great evil".
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
