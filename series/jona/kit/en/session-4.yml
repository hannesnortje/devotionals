session: 4
lang: en
title: "The Unanswered Question"
ref: "4:1-4:11"
days: [8, 9, 10]
big_idea: >-
  Jonah is angry that God is gracious. Through a plant, a worm and a scorching
  wind God exposes his small heart – and asks a question the book leaves open
  for us to answer: should I not have pity?
opening: >-
  What small thing can ruin your mood in an instant – a hot day, a slow internet
  connection, a missed bus? What does that say about us?
context: >-
  Nineveh has been spared. Instead of rejoicing, Jonah is furious – and now we
  finally learn why he ran to Tarshish. He sits east of the city to see what will
  happen, and God teaches him with a plant, a worm and a scorching east wind. The
  book ends with God's question, and no answer from Jonah.
read_aloud_tip: >-
  Read it as a dialogue with three voices: narrator, Jonah and the LORD. After the
  last question in verse 11, leave a moment of silence – the book gives no answer.
hebrew:
  - word: "ra'ah gedolah"
    hebrew: "רָעָה גְדוֹלָה"
    gloss: "a great evil"
    point: >-
      Nineveh's evil came up before God (1:2); they turned from their evil way
      (3:8); God relented of the evil (3:10). Now: "But to Jonah this was evil – a
      great evil." God's grace itself is evil in Jonah's eyes.
  - word: "charah"
    hebrew: "חָרָה"
    gloss: "anger burned"
    point: >-
      The moment God's burning anger stops (3:9), Jonah's starts. God answers with a
      quiet question, as he did with Cain (Genesis 4:6): "Is it right for your anger
      to burn?"
  - word: "chus"
    hebrew: "חוּס"
    gloss: "have pity"
    point: >-
      Jonah has compassion – but for a plant that was "a son of a night". God argues
      from the lesser to the greater: if you pity the plant, should I not have pity
      on Nineveh?
discussion:
  - q: >-
      Read 4:1–2. Why did Jonah really run to Tarshish? How does this change the
      way you read chapter 1?
    ref: "4:2"
  - q: >-
      Jonah quotes Israel's great confession – "a gracious and compassionate God,
      slow to anger and abounding in faithful love" (Exodus 34:6) – as an
      accusation. How can we know true things about God and still resent them?
    ref: "4:2"
  - q: >-
      God answers Jonah's outburst with a question: "Is it right for your anger to
      burn?" Why a question and not a rebuke? What is God doing?
    ref: "4:4"
  - q: >-
      The plant is the only thing in the whole book that makes Jonah happy (4:6);
      the heat makes him want to die (4:8). What do our joys and our anger reveal
      about what we value most?
    ref: "4:6"
  - q: >-
      God "appointed" the fish, the plant, the worm and the wind. What does it mean
      that even the worm was appointed? Have you known a "worm" like that?
    ref: "4:7"
  - q: >-
      Read 4:10–11. Compare what Jonah pities with what God pities. What argument is
      God making – and why does he mention the animals at the very end?
    ref: "4:11"
  - q: >-
      The book ends with a question. How would you answer it – for yourself, and
      for the "Nineveh" in your own life that you find hard to love?
    ref: "4:11"
application:
  - >-
    Think of one person you hold an "older brother" resentment against (Luke
    15:25–32). Pray a blessing on them every day this week.
  - >-
    Write down your own one-sentence answer to God's question in 4:11, and share it
    with one person in the group.
prayer: >-
  Begin with a minute of silence before God's question in 4:11. Then pray for the
  people and places we find hard to love, and thank God that he is "slow to anger
  and abounding in faithful love" – towards them, and towards us.
leader_notes:
  - >-
    This session covers three devotionals (Days 8–10) and a long chapter. If time
    is short, combine questions 4 and 5, or give the session 15 extra minutes.
  - >-
    Jonah twice wishes to die (4:3, 4:8). Handle this with care: someone in the group
    may know despair from the inside. Keep the focus on God's patient response, don't
    make light of it, and offer to talk afterwards.
  - >-
    The "older brother" in Luke 15 is a helpful bridge, but keep the focus on our own
    hearts, not on judging Jonah – or others in the room.
  - >-
    Day 10 suggests that Jonah himself may have written the book as his confession.
    Present this as a possibility, not a fact.
  - >-
    This is the last session. Keep ten minutes at the end to look back over all four
    chapters: which image or question will people take with them?
  - >-
    After the final reading, don't fill the silence too quickly. The open question is
    the point.
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
