session: 2
lang: en
title: "From the Depths"
ref: "2:1-2:11"
days: [4, 5]
big_idea: "At the lowest point of his flight, Jonah discovers that God was in charge all along – and that salvation belongs to the LORD alone."
opening: "Think of a time when you were completely stuck – a flat tyre, a lost key, a cancelled flight. What went through your mind?"
context: >-
  Jonah has been thrown into the sea, and the storm has stopped. But the story is not over: the LORD appoints a great fish.
  From inside it, in total darkness, Jonah prays. Note: this chapter follows the Hebrew verse numbers – English Bibles number 2:1 as 1:17 and 2:2–11 as 2:1–10.
read_aloud_tip: "Let one person read 2:1–2 and 2:11 (the narrator), and another read the psalm (2:3–10) slowly, as a prayer."
hebrew:
  - word: "manah"
    hebrew: "מָנָה"
    gloss: "appoint"
    point: "God appoints the great fish (2:1) – and later the plant, the worm and the wind (4:6–8). The fish is not an accident or a punishment but God's chosen means of rescue."
  - word: "chesed"
    hebrew: "חֶסֶד"
    gloss: "faithful love"
    point: "God's loyal covenant love that never gives up. “Those who cling to worthless idols abandon their faithful love” (2:9): whatever we cling to instead of God robs us of it."
  - word: "yeshu'ah"
    hebrew: "יְשׁוּעָה"
    gloss: "salvation"
    point: "“Salvation belongs to the LORD!” (2:10). The name Yeshua – Jesus – comes from the same root."
discussion:
  - q: "How do you read the great fish: as punishment or as rescue? What does the word “appointed” suggest?"
    ref: "2:1"
  - q: "Jonah says to God, “You had thrown me into the deep” – although the sailors threw him. What does it mean to see God's hand behind our crisis?"
    ref: "2:4"
  - q: "“I am driven away from before your eyes. Yet I will look again towards your holy temple.” What is the “yet” of faith, and where have you needed it?"
    ref: "2:5"
  - q: "“To the roots of the mountains I went down … But you brought my life up from the pit.” How does this verse complete the “going down” we saw in chapter 1?"
    ref: "2:7"
  - q: "Jonah says, “I remembered the LORD” when his soul was fainting. What helps you to remember God when you are exhausted?"
    ref: "2:8"
  - q: "Jonah praises God before he is out of the fish. Why is praise in the dark so powerful – and so hard?"
    ref: "2:10"
  - q: "Jesus calls his death and resurrection “the sign of Jonah” (Matthew 12:40). Where do you see the gospel in this chapter?"
application:
  - "Learn one verse of Jonah's psalm by heart this week, so that you carry God's word with you into “dark” days."
  - "Name one “worthless idol” you cling to for security, and each day say aloud instead: “Salvation belongs to the LORD!”"
prayer: "Read 2:3 together aloud. Then let each person who wishes name one situation where they need a “yet” of faith, and pray for each other briefly. Close by saying together: “Salvation belongs to the LORD!”"
leader_notes:
  - "Some will want to discuss whether the fish story is literal. Acknowledge the question briefly, then steer towards what the text emphasises: God's sovereignty and Jonah's prayer."
  - "Explain the verse numbering at the start, so that people using English Bibles are not confused."
  - "Jonah's psalm echoes many Psalms. If your group knows them, invite them to spot the echoes (e.g. Psalm 42:7 and 31:6 in English Bibles)."
  - "Some members may be in a real “belly of the fish” – illness, loss, unemployment. Be gentle; don't suggest that every crisis is a punishment."
  - "Point ahead: Jonah promised to keep his vows (2:10). Next week we see whether he keeps them."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
