session: 1
lang: en
title: "On the Run"
ref: "1:1-1:16"
days: [1, 2, 3]
big_idea: "God's call does not let go of us when we run – he sends a storm of grace that brings us, and those around us, back to him."
opening: "As a child, what did you do to get out of a chore you didn't want to do – and did it work?"
context: >-
  Jonah was a well-known prophet in Israel who had announced good news for his own nation (2 Kings 14:25).
  Now God sends him to Nineveh, a capital of the brutal Assyrian Empire – Israel's most feared enemy.
  Tonight we follow Jonah from the call, onto a ship heading the opposite way, and into a storm.
read_aloud_tip: "Read with four voices: a narrator, the LORD, the captain, and the sailors (as a group) – Jonah's own lines can be read by a fifth person."
hebrew:
  - word: "qum"
    hebrew: "קוּם"
    gloss: "get up"
    point: "God says “Get up, go” (1:2). Jonah does get up – but to flee (1:3). And the pagan captain later shakes him with the very same word: “Get up, call out to your god!” (1:6)."
  - word: "yarad"
    hebrew: "יָרַד"
    gloss: "go down"
    point: "Jonah goes down to Joppa, down into the ship, down into its innermost part (1:3, 5). Every step away from God's call is a step downward, while Nineveh's evil “has come up” before God (1:2)."
  - word: "tul"
    hebrew: "טוּל"
    gloss: "hurl"
    point: "The LORD hurls a great wind (1:4), the sailors hurl the cargo (1:5) and finally hurl Jonah (1:15). The same verb shows who is really in control of the storm."
discussion:
  - q: "What exactly does God ask Jonah to do, and what does Jonah do instead? Look closely at the words in verses 2 and 3."
    ref: "1:2-1:3"
  - q: "Everything seems to go smoothly for Jonah: a ship is ready and he can pay the fare. Why is an “open door” not always proof of God's will?"
    ref: "1:3"
  - q: "While the sailors pray and work, Jonah sleeps. What does this picture tell us about spiritual numbness?"
    ref: "1:5-1:6"
  - q: "Jonah says, “A Hebrew am I, and the LORD, the God of heaven, I fear.” In what way is his confession right, and in what way does his life contradict it?"
    ref: "1:9"
  - q: "The men “rowed hard” to reach land (literally, they “dug”). Where do we try to solve with our own strength something only obedience can solve?"
    ref: "1:13"
  - q: "The storm starts with men who fear the sea and ends with men who “feared the LORD with a great fear”. What has God done through Jonah's disobedience?"
    ref: "1:16"
  - q: "What is your “Nineveh” – and your “Tarshish” – at the moment? Share only what you are comfortable sharing."
application:
  - "Name one specific “Nineveh” (a conversation, an act of forgiveness, a task) and take one small step towards it this week."
  - "Notice one “Tarshish” you use to escape God's voice (busyness, screens, overwork) and set aside ten quiet minutes each day instead."
prayer: "Pray in pairs or threes: thank God that he pursues us even when we run, and ask him for the courage to “get up” in the one area each person named. Close by praying together for people who are suffering because of our own “storms”."
leader_notes:
  - "This session covers three devotionals; you won't use every question. Choose four or five and give the last one enough time."
  - "Groups easily get stuck on whether a man could survive in a fish – that is next week. Gently keep the focus on Jonah's flight."
  - "Verse 1:6 is rich: a pagan sea captain says to the prophet what God said. Let the group discover this before you point it out."
  - "The question about “Nineveh” can touch painful relationships. Don't push anyone to share; offer to talk afterwards."
  - "Point ahead: in 1:15–16 Jonah is thrown into the sea so that others can live. Leave the Christ connection open for next week."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
