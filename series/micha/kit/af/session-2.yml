session: 2
lang: af
title: "Hebsug en die Deurbreker"
ref: "2:1-2:13"
days: [3, 4]
big_idea: "God sien die planne wat ons snags beraam en die mag wat ons teen die swakkes gebruik; Hy laat Hom nie deur strelende predikers stilmaak nie – en tog trek Hy self as die Deurbreker voor sy volk uit."
opening: "Watter advertensie, slagspreuk of deuntjie uit jou kinderdae kan jy nog opsê – en wat het dit vir jou belowe?"
context: >-
  In hoofstuk 1 het Miga Juda se verhouding met God blootgelê: afgode en valse sekuriteite. Nou draai hy na die manier waarop hulle hul naaste behandel.
  In Israel was elke familie se grond 'n erfdeel, 'n gawe van die HERE wat sy vryheid en brood gewaarborg het (Levitikus 25:23; 1 Konings 21:3). Maar in die agtste eeu v.C. het 'n ryk elite met skuld, omgekoopte howe en blote mag die kleinboere se lande ingepalm.
  Vanaand lees ons die wee oor die grondrowers (v. 1–5), Miga se botsing met die predikers wat hom wil stilmaak (v. 6–11), en 'n skielike belofte: die HERE versamel sy kudde, en die Deurbreker trek voor hulle uit (v. 12–13).
read_aloud_tip: "Lees in drie dele: een persoon lees Miga se woorde, 'n klein groepie die stemme van sy teenstanders (“Moenie preek nie!”, v. 6; “Is die Gees van die HERE ongeduldig?”, v. 7), en 'n derde persoon die belofte in vers 12–13."
hebrew:
  - word: "chamad"
    hebrew: "חָמַד"
    gloss: "begeer"
    point: "“Hulle begeer lande en roof dit” (2:2). Chamad is die woord van die Tiende Gebod (Eksodus 20:17). Wat as 'n stil begeerte snags op die bed begin, eindig met dagbreek in gazal – om met geweld te roof."
  - word: "chashav"
    hebrew: "חָשַׁב"
    gloss: "beplan"
    point: "Die onderdrukkers lê op hul beddens en beplan onheil (2:1). Die HERE antwoord met dieselfde werkwoord: “Kyk, Ek beplan teen hierdie geslag kwaad” (2:3). Die slinkse planmakers loop hulle vas in die Een wat die geskiedenis van die wêreld beplan."
  - word: "haporets"
    hebrew: "הַפֹּרֵץ"
    gloss: "die Deurbreker"
    point: "Van parats, om 'n gat in 'n muur te breek. Die kudde is ingesluit soos skape in 'n kraal, maar “Die Deurbreker trek voor hulle uit op” (2:13), en hulle koning en die HERE lei hulle uit. Die oordenking sien die volle betekenis daarvan in Christus, die Goeie Herder (Johannes 10)."
discussion:
  - q: "“Wee dié wat onheil beplan en kwaad doen op hulle beddens!” Waaroor maal jou gedagtes gewoonlik in die stil ure van die nag? Waarom begin Miga by die bed en nie by die daad nie?"
    ref: "2:1"
  - q: "“Want dit is in die mag van hulle hand” – die woord vir mag (el) is dieselfde as die woord vir God; 'n mens kan dit dus ook hoor as: hulle hand is vir hulle 'n god. Waar het jy mag of invloed oor ander (werk, geld, huis), en hoe gebruik jy dit?"
    ref: "2:1-2:2"
  - q: "Vir die hebsugtige gaan dit oor “lande” en “huise”; God sien “'n man en sy huis, 'n mens en sy erfdeel”. Waar word mense vandag in die naam van wins soos dinge behandel – en waar is ons deel daarvan?"
    ref: "2:2-2:5"
  - q: "Die teenstanders sê: “Oor sulke dinge moet 'n mens nie preek nie; die skande sal ons nie inhaal nie.” Waarom verkies ons so maklik gemaklike stemme – die prediker van “wyn en sterk drank” – bo die waarheid wat genees?"
    ref: "2:6-2:11"
  - q: "“Doen my woorde nie goed aan hom wat opreg lewe nie?” Hoe reageer jy innerlik wanneer 'n Bybelgedeelte of 'n vriend die vinger op 'n seer plek in jou lewe lê?"
    ref: "2:7"
  - q: "“Van haar klein kindertjies neem julle my prag vir altyd weg.” Hoe beroof onreg teenoor gesinne die volgende geslag? Wie is die kwesbares rondom jou wie se waardigheid beskerming nodig het?"
    ref: "2:8-2:10"
  - q: "“Die Deurbreker trek voor hulle uit op.” Voor watter muur van vrees, mislukking of onmoontlikheid staan jy nou – en wat sou dit beteken om die Koning te volg wat voor jou uitgaan?"
    ref: "2:12-2:13"
application:
  - "Kyk na een terrein waar jy “mag” in jou hand het (as werkgewer, ouer, klant of buurman) en doen hierdie week een konkrete ding wat die waardigheid van iemand swakker beskerm."
  - "Gee elke aand voor jy gaan slaap die dag se gedagtes in 'n kort gebed vir God – veral afguns of wrewel – in plaas daarvan om dit in die bed om en om te draai."
prayer: "Bid saam: vra God om die geheime kamers van ons gedagtes te reinig en ons tevrede te maak met die erfdeel wat Hy ons in Christus gegee het. Bid vir mense in julle omgewing wat huis, grond of werk verloor. Dank dan vir Jesus, die Deurbreker, dat Hy elkeen voorgaan in die situasie wat hy of sy genoem het."
leader_notes:
  - "Vers 1–5 gaan oor grond, maar moenie die aand 'n debat oor politiek of ekonomie laat word nie. Hou die fokus op die hart (begeerte) en op hoe elkeen van ons mag gebruik."
  - "Die geldvraag kan sensitief wees: sommige in die groep is dalk in skuld, of is verhuurders, werkgewers of huurders. Praat oor gesindhede, nie oor iemand se situasie nie."
  - "Vers 6–11 is moeilik om te volg. Verduidelik kortliks dat “preek” die woord nataf vertaal, letterlik “drup” – die teenstanders spot met Miga se woorde as 'n aanhoudende gedrup (dag 4)."
  - "Uitleggers lees 2:12–13 op verskillende maniere (belofte, die valse profete se woorde, of oordeel). Die oordenking lees dit as 'n belofte wat in Christus vervul word; die groep hoef nie die debat te besleg nie."
  - "Laat genoeg tyd vir die laaste vraag: ná twee swaar gedeeltes het die groep die hoop van vers 12–13 nodig."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
