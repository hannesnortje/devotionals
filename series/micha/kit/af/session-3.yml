session: 3
lang: af
title: "Vol Krag"
ref: "3:1-3:12"
days: [5, 6]
big_idea: "God roep leiers, regters en predikers tot verantwoording vir hoe hulle sy volk behandel, en Hy laat Hom nie met vroom slagspreuke omkoop nie – maar wie op sy Gees staatmaak, vul Hy met krag, reg en mag om die waarheid te spreek."
opening: "Wie is iemand wat jy geken het – 'n onderwyser, 'n baas, 'n afrigter – wie se leierskap jou beter gemaak het? Wat het hy of sy gedoen?"
context: >-
  Met “Hoor tog” begin hoofstuk 3 'n nuwe reeks godsprake. Miga stap nou reguit in die hoogste magsposisies van Jerusalem in: die hoofde en leiers wat by die stadspoort oor die reg moes waak (v. 1–4), en die profete wat die volk se gewete moes wees, maar hul stemme verkoop (v. 5–7).
  Teenoor hulle staan Miga se eie belydenis: “Maar ek, ek is vol krag” (v. 8). Die hoofstuk eindig met 'n woord wat ondenkbaar gelyk het: Sion soos 'n land omgeploeg (v. 12).
  Meer as honderd jaar later herinner Jeremia 26:17–19 daaraan dat koning Hiskia hierdie woord gehoor het, hom verootmoedig het, en dat die HERE die ramp teruggehou het.
read_aloud_tip: "Lees in drie dele met 'n kort pouse tussenin: een persoon vir die leiers (v. 1–4), 'n tweede vir die profete (v. 5–7) en 'n derde vir Miga se “Maar ek” en die slotoordeel (v. 8–12)."
hebrew:
  - word: "mishpat"
    hebrew: "מִשְׁפָּט"
    gloss: "reg"
    point: "“Is dit nie julle taak om die reg te ken nie?” (3:1). Om te “ken” (jada') beteken 'n geleefde verbintenis, nie net kennis van die wet nie. Die leiers “verafsku” die reg (3:9) – maar Miga is vol krag “met reg en met mag” (3:8)."
  - word: "nashakh"
    hebrew: "נָשַׁךְ"
    gloss: "byt"
    point: "Die profete roep “Vrede!” as hulle “iets het om met hul tande te byt” (3:5). Nashakh word gebruik vir die byt van 'n slang (Numeri 21:6), en van dieselfde stam kom neshekh, woeker. Wie niks betaal nie, teen hom word heilige taal gekeer: “teen hom heilig hulle oorlog”."
  - word: "sha'an"
    hebrew: "שָׁעַן"
    gloss: "steun"
    point: "Hoofde, priesters en profete werk almal vir geld, “en tog steun hulle op die HERE” (3:11) – hulle leun met hul volle gewig op God se beloftes soos op 'n staf, as 'n godsdienstige kruk, terwyl hulle in openlike ongehoorsaamheid lewe: “Is die HERE nie in ons midde nie?”"
discussion:
  - q: "“Is dit nie julle taak om die reg te ken nie?” Miga beskryf die leiers met skokkende slagtersbeelde (v. 2–3). Waarom gebruik God sulke rou beelde vir iets wat soos netjiese boekhouding en hofbevele gelyk het?"
    ref: "3:1-3:3"
  - q: "“Dan sal hulle tot die HERE roep, maar Hy sal hulle nie antwoord nie.” Hoe kan die manier waarop ons mense behandel, tussen ons en God in gebed staan? Is daar 'n verhouding wat jy moet regstel?"
    ref: "3:4"
  - q: "Die profete roep “Vrede!” vir dié wat hulle voed, en verklaar oorlog teen dié wat dit nie doen nie. Waar is ons veral vriendelik teenoor mense wat vir ons iets kan teruggee – en hoe behandel ons dié wat dit nie kan nie?"
    ref: "3:5-3:7"
  - q: "“Maar ek, ek is vol krag, met die Gees van die HERE, met reg en met mag.” Miga het geen koning of invloedryke familie agter hom gehad nie. In watter situasie het jy die Gees se krag, reg en mag nodig om reg te praat of op te tree?"
    ref: "3:8"
  - q: "Hulle maak “alles wat reguit is, krom” en bou “Sion met bloed”. Waarmee bou jy jou loopbaan, jou finansies of jou gesinslewe? Waar word ons versoek om wat reguit is net 'n klein bietjie te buig?"
    ref: "3:9-3:10"
  - q: "“Is die HERE nie in ons midde nie? Geen kwaad sal oor ons kom nie.” Hoe kan kerkgewoontes en Christelike slagspreuke 'n kruk word waarmee ons aanhou met iets waarvan God nie hou nie?"
    ref: "3:11"
  - q: "Hiskia het 3:12 gehoor en hom verootmoedig (Jeremia 26:17–19). As jy terugkyk oor Miga 1–3: watter een konkrete verandering wil die Here in jou lewe bring?"
    ref: "3:12"
application:
  - "Dink aan een persoon onder jou gesag of in 'n diensrol rondom jou ('n kollega, 'n kassier, 'n kind) en doen hierdie week iets wat sy of haar waardigheid opbou – sonder om iets terug te verwag."
  - "Kies een situasie hierdie week waarin jy versoek word om stil te bly of die waarheid te buig; bid vooraf om die krag van die Gees, en praat of tree dan sagmoedig maar sonder kompromie op."
prayer: "Bid saam dat die Heilige Gees elkeen met krag, reg en mag sal vul vir die situasies wat genoem is. Bely waar ons op godsdienstige gewoontes gesteun het in plaas van om gehoorsaam te wees. Bid dan vir leiers – in die regering, die sakewêreld en die kerk – dat hulle die reg sal ken en die swakkes sal beskerm."
leader_notes:
  - "Die slagtersbeelde in vers 2–3 is skokkend. Lees dit soos dit staan, en noem dan wat dit blootlê: onreg wat mense se lewe en waardigheid verslind."
  - "Hierdie hoofstuk nooi ons uit om politici en TV-predikers te kritiseer. Laat dit kortliks toe as dit moet, en bring dit dan terug huis toe: elkeen van ons is 'n “hoof” in 'n klein wêreld (werk, bediening, gesin)."
  - "Vraag 2 (onbeantwoorde gebed) is sensitief. Die teks praat van leiers wat ander skade aandoen, nie van elke onbeantwoorde gebed nie. Moenie toelaat dat iemand aflei dat lyding of God se stilte persoonlike skuld beteken nie."
  - "Vers 12 sluit die eerste groot deel van die boek (hoofstuk 1–3) af. Volgende keer begin met 4:1–3, byna dieselfde woorde as Jesaja 2:2–4 – van puin tot paradys. Jy kan reeds daarna verwys."
  - "As die tyd min is, gebruik vrae 1, 4, 6 en 7."
