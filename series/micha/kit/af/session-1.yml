session: 1
lang: af
title: "Die HERE Daal Neer"
ref: "1:1-1:16"
days: [1, 2]
big_idea: "Wanneer die heilige God neerdaal, smelt elke valse “hoogte” waarop ons vertrou soos was – en die profeet wat dit sien kom, kraai nie oor ander se val nie, maar huil oor sy eie volk."
opening: "Dink aan 'n plek waar jy as kind heeltemal veilig gevoel het – 'n kamer, 'n huis, 'n boom. Wat het dit so veilig laat voel?"
context: >-
  Miga was 'n man van die platteland, van die boeredorpie Moreset-Gat in die Sefela, die heuwelagtige laeveld suidwes van Jerusalem.
  Hy het geprofeteer onder Jotam, Agas en Hiskia (omstreeks 740–686 v.C.), terwyl Assirië die nasies verswelg het, die elite in Samaria en Jerusalem ryk geword het en die gewone kleinboere die prys betaal het.
  Sy naam is self 'n vraag – wie is soos die HERE? – en dit is die vraag wat deur hierdie hele reeks loop. Vanaand lees ons hoofstuk 1: God daal neer om Samaria te oordeel (v. 1–7), en Miga weeklaag wanneer die ramp sy eie tuisdorpe en die poort van Jerusalem bereik (v. 8–16).
read_aloud_tip: "Lees met twee stemme: een persoon lees die HERE se dagvaarding en oordeel (v. 2–7) met 'n vaste stem; 'n tweede lees Miga se weeklag (v. 8–16) stadig en wag 'n oomblik ná elke pleknaam."
hebrew:
  - word: "shim'u"
    hebrew: "שִׁמְעוּ"
    gloss: "Hoor"
    point: "Die eerste woord van 1:2 is 'n dagvaarding hof toe: “Hoor, volke, almal saam!” Dieselfde roep open elkeen van die boek se drie hoofdele (1:2; 3:1; 6:1). Die Here, die HERE, is hier nie net Regter nie, maar ook die getuie teen sy eie volk."
  - word: "bamot"
    hebrew: "בָּמוֹת"
    gloss: "hoogtes"
    point: "Die HERE “trap op die hoogtes van die aarde” (1:3) – die bergpieke en vestings waarop mense vertrou. Maar bamot is ook die heidense heiligdomme op die heuwels. Daarom vra Miga ironies: “En wat is die hoogtes van Juda? Is dit nie Jerusalem nie?” (1:5)."
  - word: "akhzav"
    hebrew: "אַכְזָב"
    gloss: "bedrog"
    point: "In 1:10–15 speel Miga met die name van die dorpe rondom sy tuiste. Agsib klink soos akhzav, 'n spruit wat in die droogte opdroog: “die huise van Agsib word 'n bedrog vir die konings van Israel” (1:14) – 'n leë belofte presies wanneer die dors die grootste is."
discussion:
  - q: "Miga begin nie met 'n sagte aanmoediging nie, maar met 'n dagvaarding van die hele aarde. Wat sê dit vir jou van God dat Hy “uit sy heilige tempel” neerdaal om met sy volk af te reken?"
    ref: "1:2-1:4"
  - q: "“Wat is die opstand van Jakob? Is dit nie Samaria nie? En wat is die hoogtes van Juda? Is dit nie Jerusalem nie?” Waarom begin geestelike verval so dikwels by die sentrums van invloed – en wat beteken dit vir leiers vandag, ook in die kerk?"
    ref: "1:5"
  - q: "'n “Hoogte” is enigiets waarheen ons hardloop vir troos, identiteit en veiligheid in plaas van na die lewende God. Wat is die “hoogtes” van ons kultuur? Watter een daarvan lok jou die meeste?"
    ref: "1:3-1:7"
  - q: "Voordat Miga een woord oor sy eie streek sê, sê hy: “Daaroor wil ek rou en weeklaag.” Wat is die verskil tussen 'n kritikus en 'n profeet? Hoe reageer jy gewoonlik op die gebrokenheid om jou?"
    ref: "1:8-1:9"
  - q: "Juda het gedink Samaria se oordeel sal by die grens stop. Maar “dit het die poort van my volk bereik”. Waar laat ons 'n “klein kompromie” aan die buitewyke van ons lewe toe, en dink dit sal nooit die middelpunt bereik nie?"
    ref: "1:9-1:12"
  - q: "Lakis het op sy strydwaens vertrou: “Sy was die begin van sonde vir die dogter Sion.” Wat is jou “Lakis” – 'n goeie gawe waarop jy geleidelik begin vertrou het in plaas van op die Here?"
    ref: "1:13"
  - q: "Het 'n aardse sekuriteit jou al in die steek gelaat soos Agsib, die spruit wat opdroog? Hoe het God jou in daardie teleurstelling ontmoet? Deel net wat jy gemaklik voel om te deel."
    ref: "1:14-1:16"
application:
  - "Noem een “hoogte” in jou lewe (werk, geld, goedkeuring, jou eie slimheid) en sê elke dag hierdie week vir God in 'n kort gebed dat jy Hom meer vertrou as dit."
  - "Kies een situasie in jou dorp, gemeente of land wat jy gewoonlik kritiseer, en bid hierdie week eerder met deernis daarvoor – ten minste drie keer."
prayer: "Bid in pare of drietjies: dank God dat Hy heilig is en neerdaal om dinge reg te stel, en vra Hom om die “hoogtes” wat elkeen genoem het, af te breek. Bid dan vir julle dorp of land soos Miga oor sy tuiste geweeklaag het – met trane eerder as met klippe."
leader_notes:
  - "Hierdie eerste byeenkoms open die reeks. Neem twee minute om Miga en die reekstitel bekend te stel (7:18: “Wie is 'n God soos U?”) – dit is ook die betekenis van Miga se naam."
  - "Die lys dorpe in 1:10–15 kan verwarrend wees. Moenie al elf verduidelik nie; kies twee of drie (Gat, Lakis, Agsib) en gee die betekenis van die name uit die blik op die Hebreeus."
  - "Groepe wil dalk debatteer of God vandag nog nasies oordeel. Stuur sagkens terug na die persoonlike vraag: waarop vertrou ek in plaas van op God?"
  - "Die weeklag in 1:8 (ontklee en naak rondloop) kan glimlagte of verbasing uitlok. Verduidelik dit as die voorkoms van 'n treurende en 'n balling – Miga deel die pyn van sy volk."
  - "Die vrae oor teleurstellings (Agsib) kan aan werklike verliese raak – werk, gesondheid, 'n huwelik. Moet niemand druk nie; bied aan om ná die tyd te gesels."
  - "Met twee oordenkings in hierdie byeenkoms gaan jy nie elke vraag gebruik nie. Kies vier of vyf en gee die laaste een genoeg tyd."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
