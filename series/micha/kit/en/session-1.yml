session: 1
lang: en
title: "The LORD Comes Down"
ref: "1:1-1:16"
days: [1, 2]
big_idea: "When the holy God comes down, every false “high place” we trust in melts like wax – and the prophet who sees it coming does not gloat, but weeps for his own people."
opening: "Think of a place you felt completely safe as a child – a room, a house, a tree. What made it feel so safe?"
context: >-
  Micah was a man from the countryside, from the farming village of Moresheth-gath in the Shephelah, the hilly lowlands south-west of Jerusalem.
  He prophesied under Jotham, Ahaz and Hezekiah (about 740–686 BC), while Assyria swallowed up the nations, the elite in Samaria and Jerusalem grew rich, and ordinary smallholders paid the price.
  His name is itself a question – who is like the LORD? – and it is the question that runs through this whole series. Tonight we read chapter 1: God comes down to judge Samaria (vv. 1–7), and Micah laments as the disaster reaches his own home towns and the gate of Jerusalem (vv. 8–16).
read_aloud_tip: "Use two readers: one reads the LORD's court summons and judgement (vv. 2–7) firmly; a second reads Micah's lament (vv. 8–16) slowly, pausing after each town name."
hebrew:
  - word: "shim'u"
    hebrew: "שִׁמְעוּ"
    gloss: "Hear"
    point: "The first word of 1:2 is a summons into court: “Hear, you peoples, all of you!” The same call opens each of the book's three main sections (1:2; 3:1; 6:1). The Lord, the LORD, is not only judge here but also the witness against his own people."
  - word: "bamot"
    hebrew: "בָּמוֹת"
    gloss: "high places"
    point: "The LORD “treads on the high places of the earth” (1:3) – the peaks and strongholds people trust in. But bamot are also the pagan shrines on the hills. So Micah asks with irony: “And what are the high places of Judah? Is it not Jerusalem?” (1:5)."
  - word: "akhzav"
    hebrew: "אַכְזָב"
    gloss: "deceit"
    point: "In 1:10–15 Micah plays on the names of the towns around his home. Achzib sounds like akhzav, a brook that dries up in the drought: “the houses of Achzib will be a deceit to the kings of Israel” (1:14) – an empty promise just when the thirst is greatest."
discussion:
  - q: "Micah opens not with gentle encouragement but with a court summons to the whole earth. What does it tell you about God that he comes down “from his holy temple” to deal with his people?"
    ref: "1:2-1:4"
  - q: "“What is the rebellion of Jacob? Is it not Samaria? And what are the high places of Judah? Is it not Jerusalem?” Why does spiritual decay so often begin at the centres of influence – and what does that mean for leaders today, including in the church?"
    ref: "1:5"
  - q: "A “high place” is anything we run to for comfort, identity and safety instead of the living God. What are the “high places” of our culture? Which of them tempt you most?"
    ref: "1:3-1:7"
  - q: "Before Micah speaks a single word about his own region, he says: “Because of this I will lament and wail.” What is the difference between a critic and a prophet? How do you usually react to the brokenness you see around you?"
    ref: "1:8-1:9"
  - q: "Judah thought Samaria's judgement would stop at the border. But “it has reached the gate of my people”. Where do we allow a “small compromise” at the edges of our life, thinking it will never reach the centre?"
    ref: "1:9-1:12"
  - q: "Lachish trusted in its chariots: “She was the beginning of sin for Daughter Zion.” What is your “Lachish” – a good gift you have slowly begun to trust instead of the Lord?"
    ref: "1:13"
  - q: "Have you ever had an earthly security let you down like Achzib, the brook that dries up? How did God meet you in that disappointment? Share only what you are comfortable sharing."
    ref: "1:14-1:16"
application:
  - "Name one “high place” in your life (work, money, approval, your own cleverness) and each day this week tell God in a short prayer that you trust him more than it."
  - "Choose one situation in your community, church or country that you usually criticise, and this week pray for it with compassion instead – at least three times."
prayer: "Pray in pairs or threes: thank God that he is holy and comes down to set things right, and ask him to break down the “high places” each person named. Then pray for your own town or country as Micah lamented for his – with tears rather than stones."
leader_notes:
  - "This first session opens the series. Take two minutes to introduce Micah and the series title (7:18, “Who is a God like you?”), which is also the meaning of Micah's name."
  - "The list of towns in 1:10–15 can be confusing. Don't explain all eleven; pick two or three (Gath, Lachish, Achzib) and give the meaning of the names from the word study."
  - "Groups may want to debate whether God still judges nations today. Gently steer back to the personal question: what do I trust instead of God?"
  - "The lament in 1:8 (going stripped and naked) can raise smiles or puzzlement. Explain it as the appearance of a mourner and an exile – Micah shares the pain of his people."
  - "The questions about disappointments (Achzib) can touch real losses – a job, health, a marriage. Don't push anyone; offer to talk afterwards."
  - "With two devotionals in this session you won't use every question. Choose four or five and give the last one enough time."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
