session: 2
lang: en
title: "Greed and the Breaker"
ref: "2:1-2:13"
days: [3, 4]
big_idea: "God sees the schemes we devise at night and the power we use against the weak, he will not be silenced by soothing preachers – and yet he himself goes ahead of his people as the one who breaks open the way."
opening: "Which advert, slogan or jingle from your childhood can you still recite – and what did it promise you?"
context: >-
  In chapter 1 Micah exposed Judah's relationship with God: idols and false securities. Now he turns to how they treat their neighbours.
  In Israel every family's land was an inheritance, a gift from the LORD that guaranteed its freedom and bread (Leviticus 25:23; 1 Kings 21:3). But in the eighth century BC a wealthy elite used debts, bribed courts and sheer power to take the smallholders' fields.
  Tonight we read the woe over the land-grabbers (vv. 1–5), Micah's clash with the preachers who want him silenced (vv. 6–11), and a sudden promise: the LORD gathers his flock and the Breaker goes before them (vv. 12–13).
read_aloud_tip: "Read in three parts: a narrator for Micah's words, a small group for the voices of his opponents (“Do not preach!”, v. 6; “Is the Spirit of the LORD impatient?”, v. 7), and a third reader for the promise in verses 12–13."
hebrew:
  - word: "chamad"
    hebrew: "חָמַד"
    gloss: "covet"
    point: "“They covet fields and seize them” (2:2). Chamad is the word of the Tenth Commandment (Exodus 20:17). What begins as a quiet desire on the bed at night ends at daybreak in gazal – seizing by force."
  - word: "chashav"
    hebrew: "חָשַׁב"
    gloss: "devise"
    point: "The oppressors lie on their beds and devise wickedness (2:1). The LORD answers with the same verb: “Look, against this family I am devising evil” (2:3). The schemers run headlong into the one who plans the history of the world."
  - word: "haporets"
    hebrew: "הַפֹּרֵץ"
    gloss: "the one who breaks open"
    point: "From parats, to break a gap in a wall. The flock is shut in like sheep in a fold, but “The one who breaks open goes up before them” (2:13), and their king and the LORD lead the way out. The devotional sees its full meaning in Christ, the Good Shepherd (John 10)."
discussion:
  - q: "“Woe to those who devise wickedness and work evil on their beds!” What do your thoughts usually turn over in the quiet hours of the night? Why does Micah start with the bed and not with the deed?"
    ref: "2:1"
  - q: "“Because it is in the power of their hand” – the word for power (el) is the same as the word for God, so one can also hear it as: their hand is a god to them. Where do you have power or leverage over others (work, money, home), and how do you use it?"
    ref: "2:1-2:2"
  - q: "For the greedy it is about “fields” and “houses”; God sees “a man and his house, a person and his inheritance”. Where are people today treated as things in the name of profit – and where are we part of it?"
    ref: "2:2-2:5"
  - q: "The opponents say: “One should not preach about such things; disgrace will not overtake us.” Why do we so easily prefer comfortable voices – the preacher of “wine and strong drink” – to the truth that heals?"
    ref: "2:6-2:11"
  - q: "“Do my words not do good to the one who walks uprightly?” How do you react inwardly when a passage of Scripture or a friend puts a finger on a sore spot in your life?"
    ref: "2:7"
  - q: "“From her little children you take away my splendour for ever.” How does injustice against families rob the next generation? Who are the vulnerable people around you whose dignity needs protecting?"
    ref: "2:8-2:10"
  - q: "“The one who breaks open goes up before them.” What wall of fear, failure or impossibility are you facing right now – and what would it mean to follow the King who goes ahead of you?"
    ref: "2:12-2:13"
application:
  - "Look at one area where the power is in your hand (as an employer, parent, customer or neighbour) and do one concrete thing this week that protects the dignity of someone weaker."
  - "Before going to sleep each night, give your thoughts of the day to God in a short prayer – especially any envy or resentment – instead of turning them over in bed."
prayer: "Pray together: ask God to cleanse the secret rooms of our thoughts and to make us content with the inheritance he has given us in Christ. Pray for people in your area who are losing home, land or work. Then thank Jesus, the Breaker, for going ahead of each person into the situation they named."
leader_notes:
  - "Verses 1–5 are about land, but avoid turning the evening into a debate on politics or economics. Keep the focus on the heart (coveting) and on how each of us uses power."
  - "The money question can be sensitive: some in the group may be in debt or be landlords, employers or tenants. Speak about attitudes, not about anyone's situation."
  - "Verses 6–11 are hard to follow. Explain briefly that “preach” translates nataf, literally “to drip” – the opponents mock Micah's words as dripping on and on (day 4)."
  - "Scholars read 2:12–13 in different ways (promise, the false prophets' words, or judgement). The devotional reads it as a promise fulfilled in Christ; you don't need to settle the debate in the group."
  - "Leave enough time for the last question: after two heavy passages the group needs the hope of verses 12–13."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
