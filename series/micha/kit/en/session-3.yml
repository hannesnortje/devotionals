session: 3
lang: en
title: "Filled with Power"
ref: "3:1-3:12"
days: [5, 6]
big_idea: "God holds leaders, judges and preachers to account for how they treat his people, and he will not be bribed by pious slogans – but he fills those who rely on his Spirit with power, justice and might to speak the truth."
opening: "Who is someone you have known – a teacher, a boss, a coach – whose leadership made you better? What did they do?"
context: >-
  With “Hear, please” chapter 3 begins a new series of oracles. Micah now walks into the highest seats of power in Jerusalem: the heads and rulers who should guard justice at the city gate (vv. 1–4), and the prophets who should be the nation's conscience but sell their voices (vv. 5–7).
  Over against them stands Micah's own confession: “But as for me, I am filled with power” (v. 8). The chapter ends with a word that seemed unthinkable: Zion ploughed like a field (v. 12).
  More than a hundred years later Jeremiah 26:17–19 recalls that King Hezekiah heard this word, humbled himself, and the LORD held back the disaster.
read_aloud_tip: "Read in three parts, with a short pause between them: one reader for the leaders (vv. 1–4), another for the prophets (vv. 5–7), and a third for Micah's “But as for me” and the closing judgement (vv. 8–12)."
hebrew:
  - word: "mishpat"
    hebrew: "מִשְׁפָּט"
    gloss: "justice"
    point: "“Is it not for you to know justice?” (3:1). To “know” (yada') means a lived commitment, not just knowledge of the law. The leaders “abhor justice” (3:9) – but Micah is filled “with justice and with might” (3:8)."
  - word: "nashakh"
    hebrew: "נָשַׁךְ"
    gloss: "bite"
    point: "The prophets cry “Peace!” when they have “something to bite with their teeth” (3:5). Nashakh is used for the bite of a snake (Numbers 21:6), and from the same root comes neshekh, usury. Whoever pays nothing finds holy language turned against him: “against him they sanctify war”."
  - word: "sha'an"
    hebrew: "שָׁעַן"
    gloss: "lean"
    point: "Heads, priests and prophets all work for money, “yet they lean on the LORD” (3:11) – they put their full weight on God's promises like a staff, as a religious crutch, while living in open disobedience: “Is not the LORD in our midst?”"
discussion:
  - q: "“Is it not for you to know justice?” Micah uses shocking butcher language for the leaders (vv. 2–3). Why does God use such raw images for what looked like tidy bookkeeping and court orders?"
    ref: "3:1-3:3"
  - q: "“Then they will cry out to the LORD, but he will not answer them.” How can the way we treat people stand between us and God in prayer? Is there a relationship you need to put right?"
    ref: "3:4"
  - q: "The prophets proclaim “Peace!” to those who feed them and declare war on those who don't. Where do we show friendliness mainly to people who can give us something back – and how do we treat those who can't?"
    ref: "3:5-3:7"
  - q: "“But as for me, I am filled with power, with the Spirit of the LORD, with justice and with might.” Micah had no royal backing or family connections. In which situation do you need the Spirit's power, justice and might to speak or act rightly?"
    ref: "3:8"
  - q: "They “twist everything that is straight” and “build Zion with blood”. What are you building your career, finances or family life with? Where are we tempted to bend what is straight just a little?"
    ref: "3:9-3:10"
  - q: "“Is not the LORD in our midst? No evil will come upon us.” How can church habits and Christian slogans become a crutch that lets us carry on with something God disapproves of?"
    ref: "3:11"
  - q: "Hezekiah heard 3:12 and humbled himself (Jeremiah 26:17–19). Looking back over Micah 1–3, what one concrete change is the Lord calling you to make?"
    ref: "3:12"
application:
  - "Think of one person under your authority or in a service role around you (a colleague, a cashier, a child) and this week do something to build up their dignity – without expecting anything back."
  - "Pick one situation this week where you are tempted to keep quiet or bend the truth; before it, pray for the Spirit's power, and then speak or act with gentleness but without compromise."
prayer: "Pray together for the Holy Spirit to fill each of you with power, justice and might for the situations you named. Confess where we have leaned on religious habits instead of obeying. Then pray for leaders – in government, business and the church – that they may know justice and protect the weak."
leader_notes:
  - "The butcher images in verses 2–3 are graphic. Read them as they stand, then name what they expose: injustice that devours people's lives and dignity."
  - "This chapter invites us to criticise politicians and TV preachers. Let the group do that briefly if it must, then bring it home: each of us is a “head” in some small world (work, ministry, family)."
  - "Question 2 (unanswered prayer) is sensitive. The text is about leaders who harm others, not about every unanswered prayer. Don't let anyone conclude that suffering or silence from God means personal guilt."
  - "Verse 12 closes the first great part of the book (chapters 1–3). Next week begins with 4:1–3, almost the same words as Isaiah 2:2–4 – from ruins to paradise. You can point ahead to it."
  - "If time is short, use questions 1, 4, 6 and 7."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
