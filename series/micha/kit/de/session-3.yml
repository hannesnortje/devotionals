session: 3
lang: de
title: "Erfüllt mit Kraft"
ref: "3:1-3:12"
days: [5, 6]
big_idea: "Gott zieht Führer, Richter und Prediger zur Rechenschaft dafür, wie sie mit seinem Volk umgehen, und er lässt sich durch fromme Parolen nicht bestechen – aber wer sich auf seinen Geist verlässt, den erfüllt er mit Kraft, Recht und Stärke, die Wahrheit zu sagen."
opening: "Wer war ein Mensch in deinem Leben – eine Lehrerin, ein Chef, eine Trainerin –, dessen Leitung dich besser gemacht hat? Was hat er oder sie getan?"
context: >-
  Mit „Hört doch“ beginnt in Kapitel 3 eine neue Reihe von Gottessprüchen. Micha geht jetzt mitten hinein in die höchsten Machtzentren Jerusalems: zu den Häuptern und Anführern, die im Tor über das Recht wachen sollten (V. 1–4), und zu den Propheten, die das Gewissen des Volkes sein sollten, aber ihre Stimme verkaufen (V. 5–7).
  Ihnen gegenüber steht Michas eigenes Bekenntnis: „Ich aber bin erfüllt mit Kraft“ (V. 8). Das Kapitel endet mit einem Wort, das undenkbar schien: Zion als Feld umgepflügt (V. 12).
  Mehr als hundert Jahre später erinnert Jeremia 26,17–19 daran, dass König Hiskia dieses Wort hörte, sich demütigte und der HERR das Unheil zurückhielt.
read_aloud_tip: "Lest in drei Teilen mit einer kurzen Pause dazwischen: eine Person für die Führer (V. 1–4), eine zweite für die Propheten (V. 5–7) und eine dritte für Michas „Ich aber“ und das abschließende Gerichtswort (V. 8–12)."
hebrew:
  - word: "mischpat"
    hebrew: "מִשְׁפָּט"
    gloss: "Recht"
    point: "„Ist es nicht eure Sache, das Recht zu kennen?“ (3,1). „Kennen“ (jada') meint eine gelebte Verbindlichkeit, nicht nur Gesetzeswissen. Den Führern hält Micha vor: „die ihr das Recht verabscheut“ (3,9) – er selbst aber ist erfüllt „mit Recht und mit Stärke“ (3,8)."
  - word: "naschakh"
    hebrew: "נָשַׁךְ"
    gloss: "zwischen den Zähnen haben"
    point: "Die Propheten rufen „Friede!“, wenn sie „etwas zwischen den Zähnen“ haben (3,5); wörtlich: wenn sie mit ihren Zähnen beißen. Naschakh steht für den Biss einer Schlange (4. Mose 21,6), und von derselben Wurzel kommt neschekh, Wucher. Wer nichts zahlt, gegen den wird heilige Sprache gekehrt: „gegen den heiligen sie den Krieg“."
  - word: "scha'an"
    hebrew: "שָׁעַן"
    gloss: "sich stützen"
    point: "Häupter, Priester und Propheten arbeiten alle für Geld, „und doch stützen sie sich auf den HERRN“ (3,11) – sie lehnen sich mit ihrem ganzen Gewicht auf Gottes Verheißungen wie auf einen Stab, als religiöse Krücke, während sie in offenem Ungehorsam leben: „Ist nicht der HERR in unserer Mitte?“"
discussion:
  - q: "„Ist es nicht eure Sache, das Recht zu kennen?“ Micha beschreibt die Führer mit schockierenden Bildern vom Schlachter (V. 2–3). Warum gebraucht Gott so rohe Bilder für etwas, das nach ordentlicher Buchführung und Gerichtsbeschlüssen aussah?"
    ref: "3:1-3:3"
  - q: "„Dann werden sie zum HERRN schreien, aber er wird ihnen nicht antworten.“ Wie kann unser Umgang mit Menschen zwischen uns und Gott im Gebet stehen? Gibt es eine Beziehung, die du in Ordnung bringen musst?"
    ref: "3:4"
  - q: "Die Propheten rufen „Friede!“ für die, die sie versorgen, und erklären denen den Krieg, die es nicht tun. Wo sind wir vor allem zu Menschen freundlich, die uns etwas zurückgeben können – und wie behandeln wir die, die das nicht können?"
    ref: "3:5-3:7"
  - q: "„Ich aber bin erfüllt mit Kraft, mit dem Geist des HERRN, mit Recht und mit Stärke.“ Micha hatte weder einen König noch einflussreiche Verwandte hinter sich. In welcher Situation brauchst du die Kraft, das Recht und die Stärke des Geistes, um richtig zu reden oder zu handeln?"
    ref: "3:8"
  - q: "Sie machen „alles Gerade krumm“ und bauen „Zion mit Blut“. Womit baust du deine Laufbahn, deine Finanzen oder dein Familienleben? Wo sind wir versucht, das Gerade nur ein kleines bisschen zu verbiegen?"
    ref: "3:9-3:10"
  - q: "„Ist nicht der HERR in unserer Mitte? Kein Böses wird über uns kommen.“ Wie können Gemeindegewohnheiten und christliche Parolen zu einer Krücke werden, mit der wir an etwas festhalten, das Gott missfällt?"
    ref: "3:11"
  - q: "Hiskia hörte 3,12 und demütigte sich (Jeremia 26,17–19). Wenn du auf Micha 1–3 zurückschaust: Welche eine konkrete Veränderung möchte der Herr bei dir bewirken?"
    ref: "3:12"
application:
  - "Denk an einen Menschen, der unter deiner Verantwortung steht oder dir dient (eine Kollegin, ein Kassierer, ein Kind), und tu diese Woche etwas, das seine Würde stärkt – ohne etwas zurückzuerwarten."
  - "Wähle eine Situation in dieser Woche, in der du versucht bist zu schweigen oder die Wahrheit zu verbiegen; bete vorher um die Kraft des Geistes und rede oder handle dann freundlich, aber ohne Kompromiss."
prayer: "Betet gemeinsam darum, dass der Heilige Geist jeden von euch mit Kraft, Recht und Stärke für die genannten Situationen erfüllt. Bekennt, wo wir uns auf religiöse Gewohnheiten gestützt haben, statt zu gehorchen. Betet dann für Verantwortliche – in Politik, Wirtschaft und Gemeinde –, dass sie das Recht kennen und die Schwachen schützen."
leader_notes:
  - "Die Schlachterbilder in Vers 2–3 sind drastisch. Lest sie, wie sie dastehen, und benenne dann, was sie aufdecken: Unrecht, das das Leben und die Würde von Menschen verschlingt."
  - "Dieses Kapitel lädt dazu ein, über Politiker und Fernsehprediger zu schimpfen. Lass das kurz zu, wenn es sein muss, und hol es dann zurück: Jeder von uns ist ein „Haupt“ in einer kleinen Welt (Arbeit, Dienst, Familie)."
  - "Frage 2 (unerhörte Gebete) ist sensibel. Der Text spricht von Führern, die anderen schaden, nicht von jedem unerhörten Gebet. Lass niemanden zu dem Schluss kommen, Leid oder Gottes Schweigen bedeute persönliche Schuld."
  - "Vers 12 schließt den ersten großen Teil des Buches (Kapitel 1–3) ab. Nächstes Mal beginnt es mit 4,1–3, fast denselben Worten wie Jesaja 2,2–4 – von Trümmern zum Paradies. Du kannst schon darauf hinweisen."
  - "Wenn die Zeit knapp ist, nimm die Fragen 1, 4, 6 und 7."
