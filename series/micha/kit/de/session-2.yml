session: 2
lang: de
title: "Habgier und der Durchbrecher"
ref: "2:1-2:13"
days: [3, 4]
big_idea: "Gott sieht die Pläne, die wir nachts schmieden, und die Macht, die wir gegen die Schwachen einsetzen; er lässt sich von beschwichtigenden Predigern nicht zum Schweigen bringen – und doch zieht er selbst als der Durchbrecher seinem Volk voran."
opening: "Welchen Werbespruch oder welches Werbelied aus deiner Kindheit kannst du heute noch aufsagen – und was hat es dir versprochen?"
context: >-
  In Kapitel 1 hat Micha Judas Verhältnis zu Gott aufgedeckt: Götzen und falsche Sicherheiten. Jetzt wendet er sich dem Umgang mit dem Nächsten zu.
  In Israel war das Land jeder Familie ein Erbteil, ein Geschenk des HERRN, das ihre Freiheit und ihr Brot sicherte (3. Mose 25,23; 1. Könige 21,3). Doch im 8. Jahrhundert v. Chr. nahm eine reiche Oberschicht den Kleinbauern mit Schulden, bestochenen Gerichten und nackter Macht ihre Felder weg.
  Heute lesen wir das Wehe über die Landräuber (V. 1–5), Michas Zusammenstoß mit den Predigern, die ihn zum Schweigen bringen wollen (V. 6–11), und eine überraschende Verheißung: Der HERR sammelt seine Herde, und der Durchbrecher zieht vor ihnen her (V. 12–13).
read_aloud_tip: "Lest in drei Teilen: Eine Person liest Michas Worte, eine kleine Gruppe die Stimmen seiner Gegner („Predigt nicht!“, V. 6; „Ist der Geist des HERRN ungeduldig?“, V. 7), und eine dritte Person die Verheißung in Vers 12–13."
hebrew:
  - word: "chamad"
    hebrew: "חָמַד"
    gloss: "begehren"
    point: "„Sie begehren Felder und rauben sie“ (2,2). Chamad ist das Wort des zehnten Gebots (2. Mose 20,17). Was als stilles Verlangen nachts auf dem Lager beginnt, endet bei Tagesanbruch in gazal – gewaltsamem Rauben."
  - word: "chaschav"
    hebrew: "חָשַׁב"
    gloss: "planen"
    point: "Die Unterdrücker liegen auf ihren Lagern und planen Unheil (2,1). Der HERR antwortet mit demselben Verb: „Sieh, ich plane gegen diese Sippe Böses“ (2,3). Die Ränkeschmiede laufen geradewegs dem in die Arme, der die Geschichte der Welt plant."
  - word: "haporets"
    hebrew: "הַפֹּרֵץ"
    gloss: "der Durchbrecher"
    point: "Von parats, eine Bresche in eine Mauer schlagen. Die Herde ist eingeschlossen wie Schafe im Pferch, doch „Der Durchbrecher zieht vor ihnen hinauf“ (2,13), und ihr König und der HERR führen sie hinaus. Die Andacht sieht die volle Bedeutung in Christus, dem guten Hirten (Johannes 10)."
discussion:
  - q: "„Wehe denen, die Unheil planen und Böses tun auf ihren Lagern!“ Womit beschäftigen sich deine Gedanken gewöhnlich in den stillen Stunden der Nacht? Warum beginnt Micha beim Lager und nicht bei der Tat?"
    ref: "2:1"
  - q: "„Denn es steht in der Macht ihrer Hand“ – das Wort für Macht (el) ist dasselbe wie das Wort für Gott; man kann also auch hören: Ihre Hand ist ihnen ein Gott. Wo hast du Macht oder Einfluss über andere (Arbeit, Geld, Familie), und wie gehst du damit um?"
    ref: "2:1-2:2"
  - q: "Dem Habgierigen geht es um „Felder“ und „Häuser“; Gott sieht „einen Mann und sein Haus, einen Menschen und sein Erbteil“. Wo werden Menschen heute im Namen des Gewinns wie Dinge behandelt – und wo sind wir daran beteiligt?"
    ref: "2:2-2:5"
  - q: "Die Gegner sagen: „Über solche Dinge soll man nicht predigen; die Schande wird uns nicht einholen.“ Warum ziehen wir so leicht bequeme Stimmen – den Prediger von „Wein und Bier“ – der heilenden Wahrheit vor?"
    ref: "2:6-2:11"
  - q: "„Tun meine Worte nicht Gutes dem, der aufrichtig lebt?“ Wie reagierst du innerlich, wenn ein Bibelwort oder ein Freund den Finger auf einen wunden Punkt in deinem Leben legt?"
    ref: "2:7"
  - q: "„Ihren kleinen Kindern nehmt ihr meine Pracht für immer.“ Wie raubt Unrecht an Familien der nächsten Generation etwas? Wer sind die Verletzlichen um dich herum, deren Würde Schutz braucht?"
    ref: "2:8-2:10"
  - q: "„Der Durchbrecher zieht vor ihnen hinauf.“ Vor welcher Mauer aus Angst, Versagen oder Unmöglichkeit stehst du gerade – und was würde es bedeuten, dem König zu folgen, der dir vorangeht?"
    ref: "2:12-2:13"
application:
  - "Schau dir einen Bereich an, in dem du „Macht“ in deiner Hand hast (als Arbeitgeber, Mutter oder Vater, Kunde oder Nachbar), und tu diese Woche eine konkrete Sache, die die Würde eines Schwächeren schützt."
  - "Gib Gott jeden Abend vor dem Einschlafen in einem kurzen Gebet die Gedanken des Tages ab – besonders Neid oder Groll –, statt sie im Bett hin und her zu wälzen."
prayer: "Betet gemeinsam: Bittet Gott, die verborgenen Kammern unserer Gedanken zu reinigen und uns zufrieden zu machen mit dem Erbteil, das er uns in Christus geschenkt hat. Betet für Menschen in eurer Gegend, die Wohnung, Land oder Arbeit verlieren. Dankt dann Jesus, dem Durchbrecher, dass er jedem in die Situation vorangeht, die er genannt hat."
leader_notes:
  - "Vers 1–5 handeln von Land, aber lass den Abend nicht zu einer Debatte über Politik oder Wirtschaft werden. Halte den Blick auf dem Herzen (Begehren) und darauf, wie jeder von uns mit Macht umgeht."
  - "Das Thema Geld kann heikel sein: Manche in der Gruppe haben vielleicht Schulden oder sind Vermieter, Arbeitgeber oder Mieter. Sprich über Haltungen, nicht über die Lage Einzelner."
  - "Vers 6–11 sind schwer zu verstehen. Erkläre kurz, dass „predigen“ das Wort nataf übersetzt, wörtlich „träufeln“ – die Gegner verspotten Michas Worte als ständiges Tröpfeln (Tag 4)."
  - "Ausleger verstehen 2,12–13 unterschiedlich (Verheißung, Worte der falschen Propheten oder Gericht). Die Andacht liest es als Verheißung, die sich in Christus erfüllt; die Gruppe muss diese Frage nicht entscheiden."
  - "Lass genug Zeit für die letzte Frage: Nach zwei schweren Abschnitten braucht die Gruppe die Hoffnung von Vers 12–13."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
