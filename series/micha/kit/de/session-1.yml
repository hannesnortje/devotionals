session: 1
lang: de
title: "Der HERR steigt herab"
ref: "1:1-1:16"
days: [1, 2]
big_idea: "Wenn der heilige Gott herabsteigt, zerschmilzt jede falsche „Höhe“, auf die wir vertrauen, wie Wachs – und der Prophet, der es kommen sieht, triumphiert nicht, sondern weint um sein eigenes Volk."
opening: "Denk an einen Ort, an dem du dich als Kind völlig sicher gefühlt hast – ein Zimmer, ein Haus, ein Baum. Was hat ihn so sicher gemacht?"
context: >-
  Micha war ein Mann vom Land, aus dem Bauerndorf Moreschet-Gat in der Schefela, dem Hügelland südwestlich von Jerusalem.
  Er wirkte unter Jotam, Ahas und Hiskia (etwa 740–686 v. Chr.), als Assyrien die Völker verschlang, die Oberschicht in Samaria und Jerusalem reich wurde und die einfachen Kleinbauern den Preis bezahlten.
  Sein Name ist selbst eine Frage – wer ist wie der HERR? –, und genau diese Frage zieht sich durch die ganze Reihe. Heute lesen wir Kapitel 1: Gott steigt herab, um Samaria zu richten (V. 1–7), und Micha klagt, als das Unheil seine eigenen Heimatorte und das Tor Jerusalems erreicht (V. 8–16).
read_aloud_tip: "Lest mit zwei Stimmen: Eine Person liest die gerichtliche Vorladung und das Gerichtswort des HERRN (V. 2–7) mit fester Stimme; eine zweite liest Michas Klage (V. 8–16) langsam und macht nach jedem Ortsnamen eine kleine Pause."
hebrew:
  - word: "schim'u"
    hebrew: "שִׁמְעוּ"
    gloss: "Hört"
    point: "Das erste Wort von 1,2 ist eine Vorladung vor Gericht: „Hört, ihr Völker alle!“ Derselbe Ruf eröffnet jeden der drei Hauptteile des Buches (1,2; 3,1; 6,1). Der Herr, der HERR, ist hier nicht nur Richter, sondern auch Zeuge gegen sein eigenes Volk."
  - word: "bamot"
    hebrew: "בָּמוֹת"
    gloss: "Höhen"
    point: "Der HERR „tritt auf die Höhen der Erde“ (1,3) – die Gipfel und Festungen, auf die Menschen vertrauen. Aber bamot sind auch die heidnischen Heiligtümer auf den Hügeln. Darum fragt Micha voller Ironie: „Und was sind die Höhen Judas? Ist es nicht Jerusalem?“ (1,5)."
  - word: "akhzav"
    hebrew: "אַכְזָב"
    gloss: "Täuschung"
    point: "In 1,10–15 spielt Micha mit den Namen der Orte rund um seine Heimat. Achsib klingt wie akhzav, ein Bach, der in der Dürre versiegt: „die Häuser von Achsib werden zur Täuschung für die Könige Israels“ (1,14) – ein leeres Versprechen genau dann, wenn der Durst am größten ist."
discussion:
  - q: "Micha beginnt nicht mit sanfter Ermutigung, sondern mit einer Vorladung der ganzen Erde vor Gericht. Was sagt es dir über Gott, dass er „aus seinem heiligen Tempel“ herabsteigt, um sich mit seinem Volk auseinanderzusetzen?"
    ref: "1:2-1:4"
  - q: "„Was ist die Auflehnung Jakobs? Ist es nicht Samaria? Und was sind die Höhen Judas? Ist es nicht Jerusalem?“ Warum beginnt geistlicher Verfall so oft in den Zentren des Einflusses – und was bedeutet das für Leitende heute, auch in der Gemeinde?"
    ref: "1:5"
  - q: "Eine „Höhe“ ist alles, wohin wir laufen, um Trost, Identität und Sicherheit zu finden, statt beim lebendigen Gott. Was sind die „Höhen“ unserer Kultur? Welche davon locken dich am meisten?"
    ref: "1:3-1:7"
  - q: "Bevor Micha ein einziges Wort über seine eigene Gegend sagt, spricht er: „Darum will ich klagen und heulen.“ Was ist der Unterschied zwischen einem Kritiker und einem Propheten? Wie reagierst du gewöhnlich auf das Zerbrochene um dich herum?"
    ref: "1:8-1:9"
  - q: "Juda meinte, Samarias Gericht würde an der Grenze haltmachen. Doch „es hat das Tor meines Volkes erreicht“. Wo dulden wir einen „kleinen Kompromiss“ am Rand unseres Lebens und denken, er werde nie die Mitte erreichen?"
    ref: "1:9-1:12"
  - q: "Lachisch vertraute auf seine Streitwagen: „Sie war der Anfang der Sünde für die Tochter Zion.“ Was ist dein „Lachisch“ – eine gute Gabe, auf die du allmählich statt auf den Herrn vertraust?"
    ref: "1:13"
  - q: "Hat dich schon einmal eine irdische Sicherheit im Stich gelassen wie Achsib, der Bach, der versiegt? Wie ist Gott dir in dieser Enttäuschung begegnet? Erzählt nur, was ihr erzählen möchtet."
    ref: "1:14-1:16"
application:
  - "Benenne eine „Höhe“ in deinem Leben (Arbeit, Geld, Anerkennung, deine eigene Klugheit) und sag Gott diese Woche jeden Tag in einem kurzen Gebet, dass du ihm mehr vertraust als ihr."
  - "Wähle eine Situation in deinem Ort, deiner Gemeinde oder deinem Land, die du sonst kritisierst, und bete diese Woche stattdessen mit Mitgefühl dafür – mindestens dreimal."
prayer: "Betet zu zweit oder zu dritt: Dankt Gott, dass er heilig ist und herabsteigt, um zurechtzubringen, und bittet ihn, die „Höhen“ niederzureißen, die jeder genannt hat. Betet dann für euren Ort oder euer Land, wie Micha um seine Heimat geklagt hat – mit Tränen statt mit Steinen."
leader_notes:
  - "Dieses erste Treffen eröffnet die Reihe. Nimm dir zwei Minuten, um Micha und den Titel der Reihe vorzustellen (7,18: „Wer ist ein Gott wie du?“) – das ist zugleich die Bedeutung von Michas Namen."
  - "Die Liste der Orte in 1,10–15 kann verwirren. Erkläre nicht alle elf; wähle zwei oder drei aus (Gat, Lachisch, Achsib) und nenne die Bedeutung der Namen aus dem Blick ins Hebräische."
  - "Gruppen wollen vielleicht darüber diskutieren, ob Gott heute noch Völker richtet. Lenke behutsam zurück zur persönlichen Frage: Worauf vertraue ich statt auf Gott?"
  - "Die Klage in 1,8 (entblößt und nackt umhergehen) kann Schmunzeln oder Verwunderung auslösen. Erkläre sie als das Erscheinungsbild eines Trauernden und eines Verbannten – Micha teilt den Schmerz seines Volkes."
  - "Die Fragen nach Enttäuschungen (Achsib) können echte Verluste berühren – Arbeit, Gesundheit, eine Ehe. Dränge niemanden; biete an, hinterher zu reden."
  - "Mit zwei Andachten in diesem Treffen brauchst du nicht jede Frage. Wähle vier oder fünf aus und gib der letzten genug Zeit."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
