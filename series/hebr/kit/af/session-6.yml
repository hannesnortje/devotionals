session: 6
lang: af
title: "'n Anker van die siel"
ref: "6:1-6:20"
days: [10, 11, 12]
big_idea: "Moenie by die fondament bly staan nie: die skrywer waarsku ernstig teen afval, en tog is hy oortuig van beter dinge by sy lesers – en ons hoop rus op God se belofte en God se eed, 'n anker wat agter die voorhangsel vasgemaak is, waar Jesus ons voorgegaan het."
opening: "Dink aan iets waarvoor jy eens lank moes wag. Wat het jou gehelp om aan te hou – of wat het jou amper laat moed opgee?"
context: >-
  Aan die einde van hoofstuk 5 het die skrywer sy lesers berispe: hulle het traag geword om te hoor en het nog melk nodig gehad.
  Hoofstuk 6 roep hulle verder na volwassenheid (verse 1–3) en gee dan een van die ernstigste waarskuwings in die brief (verse 4–8).
  Maar dadelik daarna noem hy hulle “geliefdes” en verseker hy hulle van beter dinge (verse 9–12), voordat hy hulle wys op God se eed aan Abraham en op die hoop wat 'n anker van die siel is (verse 13–20).
read_aloud_tip: "Lees in vier dele met vier lesers: verse 1–3, verse 4–8 (lees stadig en rustig, nie dreigend nie), verse 9–12 (lees warm), verse 13–20 (die eed en die anker)."
hebrew:
  - word: "nōthroi"
    hebrew: "νωθροί"
    gloss: "traag"
    point: "Dof, lusteloos, afgestomp. Die woord raam die gedeelte: in 5:11 sê hy dat die lesers “traag geword het om te hoor”, en in 6:12 vermaan die skrywer hulle om nie traag te word nie, maar om dié na te volg wat die beloftes erf. Die teenoorgestelde is ywer, geloof en geduld (makrothymia, 'n lang asem)."
  - word: "ametathetos"
    hebrew: "ἀμετάθετος"
    gloss: "onveranderlik"
    point: "'n Woord uit die regstaal vir 'n testament of ooreenkoms wat nie gekanselleer of verander kan word nie. God se woord alleen was al genoeg, maar ter wille van ons twyfel het Hy 'n eed bygevoeg – twee onveranderlike dinge, “waarin dit vir God onmoontlik is om te lieg” (6:17–18)."
  - word: "prodromos"
    hebrew: "πρόδρομος"
    gloss: "voorloper"
    point: "Onder die ou verbond het die hoëpriester alleen, een keer per jaar, agter die voorhangsel ingegaan, en niemand kon hom volg nie. Jesus het “as voorloper vir ons ingegaan”: Hy het vooruitgegaan om die weg oop te maak, sodat ons Hom in God se teenwoordigheid kan volg (6:20)."
discussion:
  - q: "Verse 1–2 noem ses fondamentstene in drie pare. Watter daarvan is in jou eie lewe goed gelê? Hoekom moet ons nie die fondament telkens weer lê nie – en wat voeg die woorde “as God dit maar toelaat” by?"
    ref: "6:1-6:3"
  - q: "Verse 4–5 beskryf mense wat “een keer verlig is” en “die hemelse gawe gesmaak het”. Hoe kan iemand soveel van naby beleef en tog wegdraai? (Dink aan die woestyngeslag in hoofstuk 3.)"
    ref: "6:4-6:5"
  - q: "Vers 6 beskryf mense wat “vir hulleself die Seun van God weer kruisig en Hom aan die spot prysgee”. Hoekom is dit belangrik dat die onmoontlikheid gekoppel is aan 'n voortdurende verwerping van Jesus, die enigste Hoëpriester en die enigste offer?"
    ref: "6:6"
  - q: "Twee stukke grond drink dieselfde reën: die een bring nuttige plante voort, die ander dorings en distels. Hoe lyk die geestelike reën in jou lewe, en wat bring dit voort?"
    ref: "6:7-6:8"
  - q: "Net ná die waarskuwing sê die skrywer: “is ons tog oortuig van beter dinge by julle”. Wat sien hy by sy lesers (vers 10)? Waar sien julle by mekaar “dinge wat by redding hoort”?"
    ref: "6:9-6:10"
  - q: "“Want God is nie onregverdig dat Hy julle werk sou vergeet en die liefde wat julle vir sy Naam bewys het.” Vir wie se verborge diens wil jy God vanaand dank? Wat sê hierdie vers vir iemand wat voel niemand sien hulle raak nie?"
    ref: "6:10-6:12"
  - q: "Ons hoop is “'n anker van die siel, seker en vas” – maar dit word opwaarts gewerp, agter die voorhangsel in, nie af in die see nie. Waaraan is jou anker vasgemaak wanneer die storm kom, en watter verskil maak dit dat Jesus ons daarheen voorgegaan het?"
    ref: "6:13-6:20"
application:
  - "Abraham het die belofte verkry “nadat hy geduldig gewag het”. Noem een belofte van God waarop jy wag, en bring dit hierdie week elke dag weer met geloof en geduld voor Hom."
  - "Bemoedig een persoon wie se diens gewoonlik ongesiens bly – sê vir hulle in 'n boodskap of persoonlik dat God hulle werk en hulle liefde nie vergeet nie."
prayer: "Lees verse 19–20 saam hardop. Bid dan in pare vir mekaar: noem een storm of een lang wagtyd waarin julle nou is, en dank God dat sy belofte en sy eed nie kan faal nie. Dank God laastens vir die getroue, verborge diens van mense in julle gemeente."
leader_notes:
  - "Hierdie sessie steun op drie oordenkings: dag 10 (5:11–6:3, vir verse 1–3), dag 11 (6:4–12) en dag 12 (6:13–20). Moenie dat verse 4–6 die hele aand opslurp nie – hou minstens 15 minute vir die eed en die anker (verse 13–20)."
  - "6:4–6 is een van die mees omstrede gedeeltes in die Nuwe Testament, en opregte Christene in jou groep lees dit dalk verskillend, na gelang van hulle tradisie. Laat elkeen aan die woord kom sonder dat die vraag beslis hoef te word; die doel is om die waarskuwing en die troos saam te hoor, nie om 'n debat te wen nie."
  - "Volg die lyn van die oordenking van dag 11: die lesers het oorweeg om Christus openlik te verloën en na die tempeloffers terug te keer om vervolging te ontvlug; afval beteken hier 'n totale, doelbewuste verwerping van Christus, nie 'n gelowige wat in swakheid in sonde struikel nie; en die teenwoordige deelwoorde koppel die onmoontlikheid aan volharding in daardie verwerping. Daar is geen ander offer nie."
  - "Iemand is dalk bang dat hulle hierdie sonde gepleeg het. Sê duidelik wat dag 11 sê: die blote feit dat jou hart sag is, dat jy oor jou sonde treur en na Jesus verlang, wys dat jy nie in die verharde toestand van vers 6 verkeer nie. As die vrees diep lê, bied aan om ná die tyd saam te praat en te bid."
  - "Vers 9 is die skrywer se eie sleutel: net hier in die brief noem hy sy lesers “geliefdes”, en hy is oortuig van beter dinge by hulle. Lees die waarskuwing nooit sonder verse 9–12 nie."
  - "Agtergrond (dag 12): die anker is op vroeë Christelike grafte gevind; die gewilde preekverhaal van 'n bootjie wat die anker die hawe in roei, het geen duidelike antieke bewys nie – gebruik dit as illustrasie, nie as geskiedenis nie. Vooruitskouing: volgende week hoofstuk 7 – Melgisedek en 'n priester vir ewig."
