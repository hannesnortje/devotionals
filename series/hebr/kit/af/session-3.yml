session: 3
lang: af
title: "Vandag"
ref: "3:1-3:19"
days: [6, 7]
big_idea: "Jesus, die Seun oor God se huis, is groter as Moses, die getroue dienaar daarin – daarom rig ons ons aandag op Hom, verhard ons nie ons harte wanneer Hy vandag praat nie, en bemoedig ons mekaar elke dag, want om tot die einde toe vas te hou, wys dat ons werklik deelgenote van Christus geword het."
opening: "Dink aan iets wat jy telkens tot môre uitgestel het – 'n oproep, 'n herstelwerk, 'n gesprek. Hoe het dit uiteindelik uitgedraai?"
context: >-
  Ná die profete en die engele kom die skrywer nou by die grootste figuur in Israel se geskiedenis: Moses.
  Hy eer Moses as getrou, en wys dan dat Jesus die bouer en die Seun oor die huis is (verse 1–6).
  Dan open hy met Psalm 95 die tweede waarskuwingsgedeelte: die geslag wat veertig jaar lank God se werke gesien het, kon weens ongeloof tog nie in sy rus ingaan nie (verse 7–19).
read_aloud_tip: "Verse 1–6 deur een leser; Psalm 95 (verse 7–11) deur 'n tweede leser as die stem van die Heilige Gees; verse 12–19 deur 'n derde. Laat die hele groep die woord “Vandag” elke keer saam sê (verse 7, 13, 15)."
hebrew:
  - word: "katanoēsate"
    hebrew: "κατανοήσατε"
    gloss: "rig julle aandag op"
    point: "Nie 'n vinnige blik nie, maar om jou gedagtes diep op iets te vestig, dit noukeurig te bestudeer en tot op die bodem te deurgrond. Die voorwerp is Jesus in sy dubbele amp as apostel en hoëpriester – die enigste plek in die Nuwe Testament waar Hy 'n apostel genoem word (3:1)."
  - word: "therapōn"
    hebrew: "θεράπων"
    gloss: "dienaar"
    point: "Nie die gewone woord vir 'n slaaf (doulos) nie, maar 'n edel woord vir 'n vertroude dienaar en vertroueling van sy heer (Numeri 12:7). Moses was getrou in die huis as dienaar; Christus is getrou as Seun oor die huis – die erfgenaam aan wie die hele huis behoort (3:5–6)."
  - word: "sklērynō"
    hebrew: "σκληρύνω"
    gloss: "verhard"
    point: "Hiervandaan kom die mediese term sklerose: iets sags en lewends word geleidelik styf en gevoelloos. Dit gebeur deur die bedrog van die sonde (apatē), wat nooit met 'n waarskuwingsetiket kom nie (3:8, 13, 15)."
discussion:
  - q: "“Rig julle aandag op die apostel en hoëpriester van ons belydenis, Jesus.” Wat kry op 'n gewone dag jou diepste aandag – en hoe sou dit lyk om hierdie week jou aandag op Jesus te rig?"
    ref: "3:1"
  - q: "Moses was getrou as dienaar in die huis, “maar Christus as Seun oor sy huis”. Die skrywer eer Moses en kleineer hom nie. Op watter dienaars in die huis – leiers, tradisies, gemeentes – is ons in die versoeking om ons sekerheid te bou in plaas van op die Seun?"
    ref: "3:2-3:6"
  - q: "“En sy huis is ons.” Wat beteken dit vir ons groep – en vir jou persoonlik – dat God se huis nie meer 'n gebou van klip is nie, maar sy volk?"
    ref: "3:6"
  - q: "Die skrywer lei Psalm 95 in met “soos die Heilige Gees sê” – in die teenwoordige tyd. Is daar 'n area waar die Gees met jou gewete praat, terwyl jy telkens sê: nie vandag nie, Here?"
    ref: "3:7-3:11"
  - q: "Die uittog-geslag het veertig jaar lank God se werke gesien en tog in hulle hart gedwaal. Hoe gebeur verharding geleidelik – en hoe werk “die bedrog van die sonde” in die praktyk?"
    ref: "3:8-3:13"
  - q: "God se teenmiddel is gemeenskaplik: “Bemoedig eerder mekaar elke dag.” Wie het die vryheid om God se waarheid in jou lewe in te praat – en wie kan jy hierdie week bemoedig?"
    ref: "3:13"
  - q: "Lees vers 14 weer: “Want ons het deelgenote van Christus geword – as ons maar die sekerheid wat ons aan die begin gehad het, tot die einde toe vas behou.” Hoe troos hierdie vers ons, en hoe daag dit ons uit?"
    ref: "3:14-3:19"
application:
  - "Neem een saak waar jy God telkens tot môre uitgestel het, en wees hierdie week gehoorsaam – vandag."
  - "Bemoedig hierdie week elke dag een gelowige – met 'n boodskap, 'n oproep of 'n woord van aangesig tot aangesig wat na die getrouheid van Christus wys."
prayer: "Lees verse 7–8 saam hardop. Bid in pare: vra die Here vir 'n sagte hart wat antwoord wanneer Hy roep, noem een plek waar jy vandag gehoorsaam moet wees, en bid by name vir mekaar. Sluit af deur God saam te dank dat ons sy huis is."
leader_notes:
  - "Twee oordenkings (dag 6–7). Verse 7–19 is die middelpunt van die aand; moenie te lank by Moses vertoef nie."
  - "3:6 en 3:14 (“as ons vashou aan die vrymoedigheid …”, “as ons maar die sekerheid … vas behou”) raak 'n vraag waaroor Christene verskillende oortuigings het: kan 'n ware gelowige finaal afvallig word? Die oordenkings van dag 6–7 lees hierdie voorwaardes so dat volharding die bewys van egte geloof is: ons word nie deelgenote van Christus deur aan die einde te volhard nie; volharding tot die einde toe wys dat ons van die begin af werklik deelgenote geword het. Stel dit voor as die lesing van die oordenkings, laat lede met respek sê hoe hulle tradisie dit lees, en hou die groep by dit waaroor almal kan saamstem: die waarskuwing is ernstig, en die teenmiddel is om aan Christus vas te hou en mekaar elke dag te bemoedig."
  - "Vers 6: sommige ouer vertalings voeg hier tot die einde toe vas by. Daardie woorde staan nie in die oudste handskrifte nie; die skrywer gebruik dit wel in vers 14. As iemand se Bybel dit in vers 6 het, is dit die rede."
  - "Meriba en Massa (Eksodus 17:1–7): in Hebreeus beteken die name twis en beproewing; die Griekse teks wat Hebreërs aanhaal, het in plaas van die name opstand en beproewing. Ons vertaling volg die Grieks, soos Hebreërs dit het."
  - "Sommige hoor vers 12 dalk as 'n oordeel oor eerlike twyfel. Die oordenking van dag 7 onderskei: ongeloof in Hebreërs is nie intellektuele twyfel of 'n eerlike worsteling met vrae nie, maar 'n wilsbesluit om God se beloftes te wantrou en terug te deins van gehoorsaamheid. Maak ruimte vir eerlike vrae in die groep."
  - "Vooruitskouing: Volgende week hoofstuk 4 – die belofte van rus, die lewende woord van God, en die troon van genade."
