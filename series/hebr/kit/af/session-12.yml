session: 12
lang: af
title: "Die wedloop en die berg"
ref: "12:1-12:29"
days: [25, 26]
big_idea: "Met die oë op Jesus gevestig hardloop ons die wedloop met volharding en aanvaar ons die Vader se tug as liefde; en omdat ons na die berg Sion nader gekom het, nie na Sinai nie, ontvang ons 'n koninkryk wat nie geskud kan word nie en dien ons God met dankbaarheid, eerbied en ontsag."
opening: "Dink aan 'n keer toe jy iets lank en swaar klaargemaak het – 'n wedloop, 'n bergklim, 'n projek – terwyl jy halfpad wou opgee. Wat het jou laat aanhou?"
context: >-
  Hoofstuk 11 het geëindig met 'n groot galery van getuies; nou word die aflosstokkie in ons hande gesit.
  Die eerste lesers was uitgeput, soos langafstandatlete wat halfpad deur 'n marathon 'n kramp kry.
  In hoofstuk 12 gee die skrywer hulle nuwe krag met drie beelde: 'n stadion (verse 1–3), 'n ouerhuis waar kinders grootgemaak word (verse 4–13) en twee berge – Sinai en Sion (verse 18–24) – gevolg deur die laaste waarskuwing van die brief (verse 25–29).
read_aloud_tip: "Gebruik vier lesers: verse 1–13 (die wedloop en die Vader se tug), 14–21 (Esau en die berg Sinai – lees 18–21 stadig en swaar), 22–24 (die berg Sion – lees met vreugde, sodat die kontras gehoor word), 25–29 (die koninkryk wat nie geskud kan word nie)."
hebrew:
  - word: "aphorōntes"
    hebrew: "ἀφορῶντες"
    gloss: "met die oë … gevestig"
    point: "Die voorvoegsel apo- (weg van) beteken dat jy jou oë doelbewus van alles anders wegdraai om dit op een punt te vestig: Jesus, “die baanbreker en voltooier van die geloof” (12:2). Geen atleet wen deur na sy eie voete of na die skare te kyk nie."
  - word: "paideia"
    hebrew: "παιδεία"
    gloss: "tug"
    point: "Van pais (kind): die hele proses om 'n kind groot te maak, karakter te vorm en liefdevol reg te help. 'n Hof se straf kyk terug na die oortreding om dit te vergeld – en ons straf het reeds op Jesus geval; die Vader se paideia kyk vorentoe na die kind se groei (12:5–11)."
  - word: "panēgyris"
    hebrew: "πανήγυρις"
    gloss: "feesvergadering"
    point: "'n Groot volksfees, soos by die Olimpiese Spele wanneer die hele stad feesgevier het. By Sinai het die engele die ontsagwekkende gee van die wet omring; by Sion vier hulle fees oor die verlossing van sondaars (12:22)."
discussion:
  - q: "Ons word omring deur “so 'n groot wolk van getuies” – nie toeskouers wat wag dat ons val nie, maar getuies wat met hulle eie wedloop getuig dat God se beloftes hou. Watter “las” – dalk nie eers 'n sonde nie – rem jou op die oomblik?"
    ref: "12:1"
  - q: "“Ter wille van die vreugde wat voor Hom gelê het, het Hy die kruis verduur en die skande verag.” Wat beteken dit prakties om jou oë op Jesus gevestig te hou wanneer teenstand, onreg of jou eie swakheid jou oorweldig?"
    ref: "12:2-12:3"
  - q: "Vers 5 waarsku teen twee teenoorgestelde reaksies op swaarkry: “moenie die tug van die Here gering ag nie” en “moenie moed verloor” nie. Na watter een neig jy eerder? Wat verander as jy swaarkry sien as die Vader se opleiding eerder as sy straf?"
    ref: "12:4-12:10"
  - q: "“Later lewer dit egter vir dié wat daardeur geoefen is, die vreedsame vrug van geregtigheid.” Kan jy vertel van 'n moeilike tyd waarvan jy die vrug eers later gesien het?"
    ref: "12:11-12:13"
  - q: "Esau het “vir een enkele maaltyd sy eersgeboortereg verkoop”, en 'n wortel van bitterheid kan baie besoedel. Watter “enkele maaltyd” lok ons vandag? En hoe kan ons as groep vir mekaar sorg sonder om veroordelend te word?"
    ref: "12:14-12:17"
  - q: "Vergelyk die twee berge: wat sien, hoor en voel julle by Sinai (verse 18–21) en by Sion (verse 22–24)? Wanneer jy bid, kom jy eerder na God soos by Sinai of soos by Sion?"
    ref: "12:18-12:24"
  - q: "Die bloed van Jesus is die bloed “wat beter praat as Abel”, en “omdat ons 'n koninkryk ontvang wat nie geskud kan word nie, laat ons dankbaar wees”. Wat word op die oomblik rondom jou geskud, en hoe sou dankbare aanbidding as jou antwoord lyk?"
    ref: "12:24-12:29"
application:
  - "Noem een “las” en sit dit hierdie week op 'n konkrete manier neer – 'n aand sonder 'n skerm, 'n verpligting wat jy teruggee, 'n bekommernis wat jy elke oggend in gebed aan God gee."
  - "As 'n wortel van bitterheid teenoor iemand begin groei het, neem hierdie week een stap na vrede: bid by die naam vir daardie persoon, stuur 'n boodskap, of vra vir 'n gesprek."
prayer: "Begin deur vers 2 saam hardop te lees. Hou 'n minuut stilte waarin elkeen 'n las voor God neersit. Bid dan vir dié in die groep wat moeg is in die wedloop, dank God dat ons in Christus na die berg Sion nader gekom het, en sluit af deur verse 28–29 saam te lees."
leader_notes:
  - "Hierdie sessie dek twee oordenkings (dag 25–26) en drie groot beelde. As die tyd min is, fokus op verse 1–3 en 18–24, en kies een vraag uit die gedeelte oor tug."
  - "Verse 5–11 kan pynlik wees vir mense wat 'n harde of gewelddadige vader gehad het, en die woorde “Hy gésel elke seun” kan vreesaanjaend klink. Bly by die oordenking: paideia is nie straf nie, dit kyk in liefde vorentoe, en God tugtig “tot ons beswil”. Moenie te kenne gee dat 'n bepaalde siekte of verlies God se straf vir 'n bepaalde sonde is nie."
  - "12:17 (Esau het “geen ruimte vir bekering gevind nie”) kan sensitiewe gelowiges bang maak dat hulle te ver gegaan het. Die oordenking van dag 26 sê dat Esau se trane net spyt oor sy verlies was, nie ware bekering tot God nie. Iemand wat hieroor bekommerd is, toon die teenoorgestelde van Esau se onverskilligheid; bied 'n persoonlike gesprek aan indien nodig."
  - "Verse 25–29 is die brief se laaste waarskuwing. Die oordenking hou albei saam: die God van Sion is dieselfde verterende vuur as die God van Sinai, maar in Christus word ons vrees dankbare eerbied. Moenie dat een van die twee kante wegval nie."
  - "Vertaling: in 12:2 het ons teks “die baanbreker en voltooier van die geloof” in plaas van die bekende bewoording van ouer Bybels; dit bly naby aan die Griekse archēgos (reeds in 2:10) en teleiōtēs. Die titel van die reeks kom uit hierdie vers."
  - "Kyk vorentoe: volgende week hoofstuk 13, die laaste sessie – liefde in die praktyk, buite die laer, en die groot herder."
