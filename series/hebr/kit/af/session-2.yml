session: 2
lang: af
title: "Moenie wegdryf nie"
ref: "2:1-2:18"
days: [3, 4, 5]
big_idea: "Omdat die Seun so groot is, mag ons nie wegdryf van so 'n groot redding nie: Jesus het een van ons geword, deur die genade van God vir elkeen die dood gesmaak, die mag van die duiwel gebreek, en is nou die barmhartige en getroue hoëpriester wat ons help wanneer ons op die proef gestel word."
opening: "Was jy al ooit op 'n lugmatras, in 'n boot of op 'n roeiplank en het skielik agtergekom hoe ver die stroom jou weggedra het sonder dat jy dit gemerk het? Wat het gebeur?"
context: >-
  Hoofstuk 1 het die Seun hoog bo die engele gewys. Nou volg die eerste van vyf waarskuwingsgedeeltes:
  as die woord wat by Sinai deur engele gespreek is, al bindend was, hoeveel te meer die redding waaroor die Here self gespreek het (verse 1–4).
  Dan antwoord die skrywer op 'n struikelblok vir sy Joodse lesers – waarom sou die Seun 'n broos mens word en sterf? – met Psalm 8, en wys hy Jesus as ons baanbreker, ons broer en ons hoëpriester (verse 5–18).
read_aloud_tip: "Drie lesers: verse 1–4 (die waarskuwing), verse 5–9 (Psalm 8 en Jesus wat gekroon is – wag 'n oomblik voor “Wel sien ons”), verse 10–18 (ons broer en hoëpriester)."
hebrew:
  - word: "pararyōmen"
    hebrew: "παραρυῶμεν"
    gloss: "wegdryf"
    point: "'n Woord uit die seevaart vir 'n boot wat nie behoorlik vasgemaak is nie en stilletjies met die stroom verby die veilige hawe dryf – of vir 'n ring wat ongemerk van 'n vinger afgly. Die teenoorgestelde in dieselfde vers, prosechein (aandag gee), het beteken om 'n skip op koers te hou en vas te meer. Die gevaar is nie skielike opstand nie, maar stadige, ongemerkte wegdrywing (2:1)."
  - word: "archēgos"
    hebrew: "ἀρχηγός"
    gloss: "baanbreker"
    point: "'n Pionier, baanbreker of kampioen – soos die matroos in 'n bekende preekillustrasie wat deur die branders na die rotsagtige kus swem en 'n reddingstou vasmaak, sodat almal aan boord veilig kan oorkom. God het hierdie baanbreker “deur lyding tot volmaaktheid” gebring: teleioō beteken ten volle gekwalifiseer vir sy taak, nie moreel verbeter nie (2:10)."
  - word: "boētheō"
    hebrew: "βοηθέω"
    gloss: "help"
    point: "Saamgestel uit boē ('n noodkreet) en theō (hardloop): om op 'n noodkreet af te storm. Omdat Hy self gely het toe Hy op die proef gestel is, “kan Hy dié help wat op die proef gestel word” (2:18)."
discussion:
  - q: "“Hoe sal ons ontkom as ons so 'n groot redding veronagsaam?” Die gevaar hier is nie openlike opstand nie, maar wegdryf uit moegheid en nalatigheid. Watter onderstrome in ons daaglikse lewe trek ons aandag weg van die Here?"
    ref: "2:1-2:3"
  - q: "Verse 3–4 noem 'n drievoudige fondament vir hierdie redding: die Here wat eerste daaroor gespreek het, dié wat Hom gehoor het, en God wat sy getuienis daarby gevoeg het. Waarom help dit om te weet dat ons geloof op hierdie getuienis rus en nie op ons gevoelens nie?"
    ref: "2:3-2:4"
  - q: "“Maar nou sien ons nog nie dat alles aan hom onderwerp is nie.” Waar voel jy dit die pynlikste – in die wêreld, in jou gesin, in jouself?"
    ref: "2:5-2:8"
  - q: "“Wel sien ons Hom wat 'n bietjie laer as die engele gestel is, Jesus, met heerlikheid en eer gekroon.” Wat verander wanneer ons ons blik verskuif van wat ons nog nie sien nie, na Hom wat ons deur die geloof wel sien?"
    ref: "2:8-2:9"
  - q: "Jesus is 'n bietjie laer as die engele gestel “sodat Hy deur die genade van God vir elkeen die dood sou smaak”. Hy het nie net sy vingerpunte in die dood gedoop nie; Hy het die beker leeggedrink. Wat beteken dit vir jou?"
    ref: "2:9"
  - q: "“Daarom skaam Hy Hom nie om hulle broers en susters te noem nie.” Wanneer voel jy soos die swart skaap van God se familie? Hoe spreek vers 11 daarin?"
    ref: "2:10-2:13"
  - q: "Vers 15 praat van mense wat deur vrees vir die dood “hulle hele lewe lank aan slawerny onderworpe was”, en vers 18 belowe hulp aan almal wat op die proef gestel word. Waar bepaal vrees – vir siekte, verlies, die toekoms – ons besluite? En wanneer jy versoek word: veg jy eers alleen, of roep jy dadelik na jou hoëpriester?"
    ref: "2:14-2:18"
application:
  - "Toets jou ankerpunte: kies een daaglikse gewoonte wat jy laat glip het (stilte voor die Here, die Woord lees, gemeenskap met gelowiges) en meer jou hierdie week weer daaraan vas."
  - "Wanneer versoeking of vrees hierdie week kom, maak vers 18 jou eerste reaksie: roep dadelik met 'n kort gebed na Jesus om hulp, voordat jy probeer om in jou eie krag te veg."
prayer: "Lees verse 17–18 saam hardop. Bid in groepies van drie: bely waar julle weggedryf het, dank Jesus dat Hy Hom nie skaam om julle broers en susters te noem nie, en bring na Hom een area waar vrees of versoeking op julle druk. Sluit af deur te bid vir mense wat julle ken wat besig is om weg te dryf."
leader_notes:
  - "Drie oordenkings (dag 3–5) en agtien verse maak 'n vol aand. As die tyd min is, gebruik vrae 1, 4, 6 en 7."
  - "Dit is die eerste van vyf waarskuwingsgedeeltes (2:1–4; 3:7–4:13; 5:11–6:12; 10:19–39; 12:14–29). Die toon is pastorale dringendheid, nie paniek nie. Hou die klem van die oordenking van dag 3 vas: heilige waaksaamheid, en om ons harte elke dag doelbewus aan die evangelie vas te meer."
  - "2:9 “deur die genade van God”: ons vertaling volg die meerderheidslesing (chariti theou). Sommige handskrifte en die SBL-teks lees chōris theou (sonder God). Noem dit net as iemand se Bybel anders lees; moenie dat dit die tema van die aand word nie."
  - "2:10 beteken nie dat Jesus ooit sondig of moreel onvolmaak was nie (sien 4:15). Teleioō beteken om iemand tot die volle doel te bring, hom ten volle vir 'n taak te kwalifiseer – hier om die Verlosser en hoëpriester van lydende mense te wees. Verwag hierdie vraag."
  - "Die vrees vir die dood (vers 15) kan mense raak wat siek is, rou, of 'n sterwende familielid versorg. Hanteer dit sensitief: die vers gaan oor bevryding, nie oor 'n verwyt omdat iemand bang is nie."
  - "Vooruitskouing: Volgende week hoofstuk 3 – Jesus groter as Moses, en die oproep “Vandag, as julle sy stem hoor”."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
