session: 10
lang: af
title: "Die nuwe en lewende weg"
ref: "10:1-10:39"
days: [19, 20, 21]
big_idea: "Deur een offergawe het Christus dié wat geheilig word, vir altyd tot volmaaktheid gebring; laat ons daarom na God nader kom, aan die hoop vashou en op mekaar ag gee – en ons vrymoedigheid nie weggooi nie, want Hy wat kom, sal kom."
opening: "Dink aan iets wat jy oor en oor moes herhaal – 'n medisyne, 'n herstelwerk, 'n huistakie. Hoe weet jy wanneer 'n probleem vir goed opgelos is?"
context: >-
  Hoofstuk 10 bring die groot lering oor Christus as hoëpriester tot sy slotakkoord: die jaarlikse offers het mense net aan hulle sondes herinner, maar Christus se een offergawe het gedoen wat hulle nooit kon nie (10:1–18).
  Dan, by 10:19, draai die brief van wat Christus gedoen het na hoe ons moet leef: drie keer “laat ons”. 'n Vierde ernstige waarskuwing volg (10:26–31), en daarna 'n warm bemoediging wat oorlei na die groot geloofshoofstuk, Hebreërs 11.
read_aloud_tip: "Drie lesers: verse 1–18 (een offer – lees die Psalm in verse 5–7 as die stem van die Seun), verse 19–25 (in die Grieks een lang sin – luister na die drie keer “laat ons”), verse 26–39 (waarskuwing en bemoediging – hou ná vers 31 kort stil)."
hebrew:
  - word: "teteleiōken … tous hagiazomenous"
    hebrew: "τετελείωκεν … τοὺς ἁγιαζομένους"
    gloss: "het Hy … tot volmaaktheid gebring … dié wat geheilig word"
    point: "Twee werkwoordtye langs mekaar in 10:14: 'n perfektum – ons posisie voor God is reeds afgehandel – en 'n teenwoordige deelwoord – ons word dag ná dag geheilig. In God se oë reeds volmaak, en tog nog besig om te groei."
  - word: "prosphatos"
    hebrew: "πρόσφατος"
    gloss: "nuwe"
    point: "Oorspronklik vars, pas gemaak. Die weg wat Jesus deur die voorhangsel ingewy het (10:20), bly altyd vars: sy offer is vandag voor God net so kragtig soos op die dag van die kruis – en omdat Hy opgestaan het, is dit 'n lewende weg."
  - word: "parrēsia"
    hebrew: "παρρησία"
    gloss: "vrymoedigheid"
    point: "'n Vrye, onbelemmerde reg van toegang: ons het deur die bloed van Jesus vrymoedigheid om die heiligdom in te gaan (10:19). In 10:35 kom dieselfde woord terug: moenie dit weggooi nie – soos 'n soldaat wat sy skild weggooi en vlug."
discussion:
  - q: "As 'n medisyne regtig genees, hou jy op om dit te drink. “Deur hierdie offers word daar jaar ná jaar aan sondes herinner” – maar vers 18 sê: “Waar daar vergewing hiervan is, is daar geen offergawe vir sonde meer nie.” Waar rig ons klein syaltare langs die kruis op – deur onsself te straf of boete te doen voordat ons vergewing aanvaar?"
    ref: "10:1-10:4"
  - q: "“Kyk, Ek het gekom om u wil te doen.” God het nie bloot rituele gesoek nie, maar 'n liggaam wat gewillig is om sy wil te doen. Hoe sou dit lyk om hierdie week jou alledaagse liggaam – jou tyd, jou werk, jou gesinslewe – tot sy beskikking te stel?"
    ref: "10:5-10:10"
  - q: "Elke priester staan elke dag; Hy het een offer aangebied en gaan sit. “Want deur een offergawe het Hy dié wat geheilig word, vir altyd tot volmaaktheid gebring.” Hoe help hierdie vers jou wanneer jy moedeloos is omdat jy so stadig verander?"
    ref: "10:11-10:18"
  - q: "Verse 19–23 rus op twee besittings – die oop weg en 'n groot priester – en roep ons om nader te kom en vas te hou, want “Hy wat die belofte gegee het, is getrou”. Waarom is dit belangrik dat ons vashou op sy trou rus en nie op die krag van ons greep nie?"
    ref: "10:19-10:23"
  - q: "“En laat ons op mekaar ag gee om mekaar aan te spoor tot liefde en goeie werke.” Dieselfde werkwoord staan in 3:1 vir ag gee op Jesus. Hoe sou dit lyk as ons as groep so op mekaar ag gee – en wie onder ons het nou bemoediging nodig?"
    ref: "10:24-10:25"
  - q: "Verse 26–31 is van die ernstigste woorde in die brief: “Dit is vreesaanjaend om in die hande van die lewende God te val.” Tog skryf die skrywer direk daarna: “Onthou egter die vroeëre dae”. Waarom hoort waarskuwing en bemoediging hier bymekaar?"
    ref: "10:26-10:31"
  - q: "Die lesers het eens die beroof van hulle besittings met blydskap aanvaar, omdat hulle geweet het dat hulle 'n beter en blywende besitting het. “Moet julle vrymoedigheid dan nie weggooi nie; dit hou 'n groot beloning in.” Watter vroeëre stryd, waardeur God jou gedra het, gee jou moed vir die huidige een?"
    ref: "10:32-10:39"
application:
  - "Noem een syaltaar in jou lewe – 'n manier waarop jy vir jou eie mislukkings probeer betaal – en elke keer as jy dit hierdie week raaksien, lees vers 18 en aanvaar eerder die vergewing."
  - "Gee hierdie week ag op een mens – dalk iemand wat by julle byeenkomste weggebly het – en spoor hom of haar aan met 'n besoek, 'n oproep of 'n bemoedigende boodskap."
prayer: "Lees eers verse 22–24 saam hardop. Bid dan in drie bewegings: kom nader na God met dank vir die oop weg deur Jesus se bloed; hou vas – bring na God die plekke waar julle hoop onder druk is; gee ag op mekaar – bid by name vir een persoon in die groep. Sluit saam af met vers 39."
leader_notes:
  - "Hierdie byeenkoms steun op drie oordenkings (dag 19–21), en hoofstuk 10 het 39 verse. As die tyd min is, lees verse 1–18 in een slag en bestee meer tyd aan verse 19–39. Kies vyf vrae."
  - "In 10:5 lees ons teks “maar 'n liggaam het U vir My berei”, omdat Hebreërs Psalm 40 volgens die Grieks aanhaal. Die Hebreeus van Psalm 40:7 sê letterlik: ore het U vir My gegrawe. As die Bybels in die groep verskil, is dit die rede; die oordenking meen dat die deel (die ore) moontlik vir die geheel (die liggaam) staan."
  - "10:26–31 en verskillende oortuigings: gelowiges in jou groep verstaan hierdie verse dalk verskillend, veral die vraag of 'n ware gelowige finaal kan afval. Laat mense aan die woord kom en luister met respek na mekaar; jy hoef nie die debat te beslis nie. Hou by wat die oordenking van dag 21 sê: die waarskuwing gaan oor afvalligheid – om jou doelbewus en volhardend van Christus af te keer nadat jy die kennis van die waarheid ontvang het – nie oor 'n gelowige wat uit swakheid struikel en in bekering terugkeer nie (4:15–16). Wie die enigste offer verwerp, het geen ander oor nie."
  - "Teer gewetes: sommige sal vrees dat hulle hierdie sonde gepleeg het. Die oordenkings antwoord dat die hande van die lewende God vir die gelowige wat by Christus skuiling soek, die veiligste plek is (Johannes 10:28–29), en (dag 11, oor 6:4–6) dat 'n teer hart wat oor sonde treur en na Jesus verlang, self die bewys is dat jy nie in daardie verharde toestand is nie. Sê dit duidelik, en bied 'n gesprek daarna aan."
  - "Twee kleiner punte om versigtig te hanteer: die oordenking lees “ons liggaam gewas met skoon water” (10:22) as 'n verwysing na die doop – groepe het verskillende sienings oor die doop, so moenie dat dit 'n debat word nie. En vers 25 gaan oor bemoediging, nie oor kontrole nie: sommige bly weg weens siekte, skofwerk of die versorging van ander."
  - "Vooruitskouing: vers 39 bou die brug na hoofstuk 11 – volgende week die wese van geloof en die groot getuies van die verlede."
