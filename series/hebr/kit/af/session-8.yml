session: 8
lang: af
title: "Skaduwee en werklikheid"
ref: "8:1-8:13"
days: [15]
big_idea: "Ons het 'n hoëpriester wat in die ware tent gaan sit het en die Middelaar is van 'n beter verbond, waarvan die beloftes op God se eie “Ek sal” rus: Hy skryf sy wette op ons harte en sal nooit meer aan ons sondes dink nie."
opening: "Het jy al ooit 'n argitek se model of 'n skets van 'n huis gesien voordat dit gebou is? Hoe het die regte gebou daarmee vergelyk?"
context: >-
  In hoofstuk 7 het die skrywer gewys dat die persoon van ons hoëpriester volgens die orde van Melgisedek ver bo die Levitiese priesters verhewe is.
  Nou draai hoofstuk 8 na sy diens: 'n beter heiligdom en 'n beter verbond. Vir die eerste lesers, wat van die tempel in Jerusalem afgesny was en dalk bespot is omdat hulle geen tempel, geen priester en geen altaar gehad het nie, was dit 'n brandende vraag.
  Die skrywer antwoord met die langste Ou-Testamentiese aanhaling in die Nuwe Testament, Jeremia 31:31–34, aangehaal soos die Griekse vertaling dit het.
read_aloud_tip: "Twee lesers: een lees verse 1–7 en vers 13; die ander lees die Jeremia-aanhaling in verse 8–12 as die stem van die Here – stadig, met 'n kort pouse ná elke “Ek sal”."
hebrew:
  - word: "kephalaion"
    hebrew: "κεφάλαιον"
    gloss: "die hoofsaak"
    point: "Nie bloot 'n opsomming nie, maar die kroonpunt van die hele argument (8:1). En die kern is 'n hoëpriester wat sit: die aardse priesters moes elke dag staan omdat hulle werk nooit klaar was nie (vgl. 10:11); ons s'n het gaan sit."
  - word: "hypodeigma kai skia"
    hebrew: "ὑπόδειγμα καὶ σκιά"
    gloss: "afbeelding en skaduwee"
    point: "'n Hypodeigma is 'n kopie of skets; Moses moes bou volgens die typos, die patroon of bouplan wat op die berg aan hom gewys is (8:5). Soos 'n skaduwee op die grond of 'n argitek se skaalmodel was die tent-erediens goed en deur God gegee, maar dit het heengewys na 'n groter werklikheid: Christus se diens in die hemel."
  - word: "diathēkē kainē"
    hebrew: "διαθήκη καινή"
    gloss: "'n nuwe verbond"
    point: "Kainos word dikwels van neos onderskei: nie net nuut in tyd nie, maar kwalitatief nuut (die onderskeid is nie streng nie – in 12:24 gebruik Hebreërs ook nea). Sy beloftes is beter omdat God nie meer sê “As julle …” nie, maar “Ek sal!” (8:8–12)."
discussion:
  - q: "Die hoofsaak is dit: “Ons het so 'n hoëpriester, wat aan die regterhand van die troon van die Majesteit in die hemele gaan sit het.” Waarom maak die skrywer juis 'n priester wat sit die kern van sy hele argument?"
    ref: "8:1-8:2"
  - q: "Die aardse priesters dien “'n afbeelding en skaduwee van die hemelse dinge”. Die eerste lesers het die sigbare tempel verloor. Aan watter sigbare dinge – vorme, rituele, mense se goedkeuring – hou ons vas om geestelik veilig te voel?"
    ref: "8:3-8:5"
  - q: "As die eerste verbond sonder gebrek was, sou daar nie 'n tweede nodig gewees het nie. Lees vers 8: “Want Hy berispe hulle wanneer Hy sê”. Waar het die fout gelê – en wat het die ou verbond nie gegee nie?"
    ref: "8:6-8:9"
  - q: "“Ek sal my wette in hulle denke gee en dit op hulle harte skryf.” Ervaar jy God se wil op die oomblik eerder soos kliptafels – 'n las van buite – of soos iets wat die Gees van binne in jou skryf? Wat maak die verskil?"
    ref: "8:10"
  - q: "“Want hulle sal My almal ken, van die kleinste tot die grootste van hulle.” Onder die ou verbond was gewone mense van profete, priesters en konings afhanklik. Wat beteken dit vir die jongstes en die oudstes in ons groep dat elkeen die Here persoonlik kan ken?"
    ref: "8:11"
  - q: "Vers 12 begin met “Want”: alles rus daarop. “Want Ek sal genadig wees oor hulle ongeregtighede, en aan hulle sondes sal Ek nooit meer dink nie.” Die Grieks het 'n dubbele ontkenning – nooit, ooit weer nie. Is daar 'n sonde wat jy lankal bely het, maar waaroor jy jouself steeds aankla? Wat sou verander as jy hierdie vers glo?"
    ref: "8:12"
  - q: "“Wat oud word en verouder, is naby aan verdwyning.” Hoe kan ons die eerste verbond eer as deur God gegee, en tog nie na die skaduwees terugkeer nie?"
    ref: "8:13"
application:
  - "Bid hierdie week elke oggend vers 10 vir een bepaalde area van jou lewe waar jy jouself met saamgeperste kake aandryf: vra die Here om sy wil daar op jou hart te skryf en jou begeertes van binne te verander."
  - "Skryf een ou, reeds bely sonde neer wat jy telkens weer opgrawe. Lees vers 12 hardop daaroor, dank God dat Hy dit nooit weer teen jou sal gebruik nie – en skeur dan die papier op."
prayer: "Lees verse 10–12 saam hardop. Bid dan in twee- of drietalle: dank Jesus dat Hy as ons hoëpriester in die ware tent gaan sit het, vra Hom om sy wette op julle harte te skryf, en dank die Vader in julle eie woorde vir die belofte van vers 12. Laat 'n oomblik stilte sodat elkeen dit persoonlik kan ontvang."
leader_notes:
  - "Hierdie byeenkoms steun op 'n enkele oordenking (dag 15) vir die hele hoofstuk, sodat daar tyd is vir die Jeremia-aanhaling. Kies vyf of ses vrae; moenie die vraag oor vers 12 oorslaan nie."
  - "Hebreërs haal Jeremia aan soos die Grieks (Septuagint) dit het. In 8:9 lees ons teks “en Ek het My nie meer oor hulle bekommer nie”, waar die Hebreeus van Jeremia 31:32 sê: hoewel Ek hulle man (of heer) was. As iemand se Bybel anders lees, is dit die rede – ons vertaling volg doelbewus die Grieks van Hebreërs."
  - "Die oordenking is duidelik: die fout het nie by God of sy heilige wet gelê nie, maar by sondige mense (8:8). Die tent is op God se opdrag gebou (8:5). Pas op dat die aand nie omslaan in minagting vir die Ou Testament of vir die Joodse volk nie."
  - "Vers 12 beteken nie dat die alwetende God aan geheueverlies ly nie; Hy belowe om ons beleide sonde nooit weer teen ons te gebruik of ons volgens ons verlede te behandel nie. Vir sommige raak die vraag oor vers 12 diep skuld aan – laat stilte toe en bied aan om daarna saam met iemand te bid."
  - "Vers 13: Baie meen dat die brief voor 70 n.C. geskryf is, toe die tempel inderdaad naby aan verdwyning was. Dit is interessante agtergrond, maar moenie dat dateringsvrae die gesprek oorneem nie."
  - "Vooruitskouing: volgende week hoofstuk 9 – 'n rondleiding deur die aardse tent, en dan “Maar Christus …”: deur sy eie bloed."
