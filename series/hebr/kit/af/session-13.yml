session: 13
lang: af
title: "Die groot herder"
ref: "13:1-13:25"
days: [27, 28]
big_idea: "Dankbare aanbidding in 'n koninkryk wat nie geskud kan word nie, word praktiese liefde, tevredenheid en die moed om na Jesus toe uit te gaan, buite die laer; ons bring vir God die offers van lof en van deel – en die God van vrede, wat die groot herder uit die dode opgebring het, rus ons self toe om sy wil te doen."
opening: "Wanneer 'n lang tyd saam tot 'n einde kom – 'n reis, 'n kursus, 'n werk – wat wil jy die graagste hê moet die ander saamneem?"
context: >-
  Aan die einde van hoofstuk 12 het die skrywer gesê dat ons 'n koninkryk ontvang wat nie geskud kan word nie, en dat ons God met dankbaarheid, eerbied en ontsag moet dien.
  Hoofstuk 13 wys hoe daardie erediens op 'n gewone weeksdag lyk: liefde, gasvryheid, die huwelik en geld (verse 1–6), leiers en die onveranderlike Christus (7–9), om na Jesus toe uit te gaan, buite die laer (10–14), die offers van lof en van deel (15–19), en laastens 'n groot seënbede en persoonlike groete (20–25).
  Vanaand voltooi ons die brief – en hierdie reeks.
read_aloud_tip: "Gebruik drie lesers: verse 1–9, 10–19 en 22–25. Laat die hele groep vers 8 saam lees, en lees verse 20–21 aan die einde van die lesing saam as 'n seën."
hebrew:
  - word: "ou mē se anō oud' ou mē se enkatalipō"
    hebrew: "οὐ μή σε ἀνῶ οὐδʼ οὐ μή σε ἐγκαταλίπω"
    gloss: "nooit … nooit"
    point: "In 13:5 stapel die Grieks vyf ontkennings op mekaar; vry weergegee: Ek sal jou nooit, ooit, los nie, en Ek sal jou nooit, ooit, in die steek laat nie. Ons sekuriteit lê nie in wát ons het nie, maar in wíé ons het – daarom kan ons tevrede wees (13:5–6)."
  - word: "exō tēs parembolēs"
    hebrew: "ἔξω τῆς παρεμβολῆς"
    gloss: "buite die laer"
    point: "Op die Groot Versoendag is die liggame van die sondoffers buite die laer verbrand (Levitikus 16:27). Jesus het buite die poort gely. Vir die eerste lesers was die laer die veilige, gerespekteerde wêreld van die tempel – maar Jesus is buite (13:11–13)."
  - word: "katartizō"
    hebrew: "καταρτίζω"
    gloss: "toerus"
    point: "In die geneeskunde gebruik vir die spalk en set van 'n gebreekte been, en deur vissers vir die heelmaak van nette (Matteus 4:21); in 11:3 beskryf dieselfde werkwoord hoe die wêrelde deur God se woord gevorm is. Wat God van ons vra, werk Hy self in ons (13:21)."
discussion:
  - q: "Verse 1–4 noem vier rigtings van liefde: liefde vir mekaar as broers en susters, gasvryheid teenoor vreemdelinge, meegevoel met gevangenes en mishandeldes, en eer vir die huwelik. Watter een is sterk in ons groep, en watter een het ons aandag nodig?"
    ref: "13:1-13:4"
  - q: "“Wees tevrede met wat julle het” – en die rede is nie 'n begroting nie, maar 'n belofte: “Ek sal jou nooit los nie en jou nooit in die steek laat nie.” Waarom rus tevredenheid op 'n Persoon eerder as op besittings? Waar is jy op die oomblik onrustig oor geld of die toekoms?"
    ref: "13:5-13:6"
  - q: "“Jesus Christus is gister en vandag dieselfde – en vir ewig.” Dink aan jou eie gister, vandag en toekoms: waar het jy die meeste nodig om hierdie sin te hoor?"
    ref: "13:7-13:8"
  - q: "“Dit is goed dat die hart deur genade versterk word, nie deur voedsel nie.” Wat is vandag die “voedsel” – reëls, prestasies of vorme waarmee ons voel ons is in beheer? Hoe lyk dit as genade jou hart versterk?"
    ref: "13:9"
  - q: "“Laat ons dan na Hom toe uitgaan, buite die laer, en sy smaad dra.” Wat is die gemaklike “laer” in ons omgewing, en hoe sou dit vir jou hierdie maand lyk om na Jesus toe uit te gaan?"
    ref: "13:10-13:14"
  - q: "Verse 15–16 noem twee offers: “die vrug van lippe wat sy Naam bely” en “Moenie vergeet om goed te doen en met ander te deel nie”. Wat kom vir jou natuurliker – die lippe of die hande? En hoe kan ons die werk van die leiers wat “oor julle siele” waak, 'n vreugde maak eerder as 'n gesug?"
    ref: "13:15-13:19"
  - q: "Terugskouend oor die hele reeks: Hebreërs het Jesus aan ons gewys as die Seun deur wie God gepraat het, die barmhartige hoëpriester, die voorloper, die baanbreker van die geloof en nou die groot herder. Watter beeld van Jesus het vir jou die belangrikste geword, en waarom?"
    ref: "13:20-13:21"
application:
  - "Kies een van die rigtings van liefde in verse 1–3 en doen dit hierdie week prakties: nooi iemand vir 'n ete, besoek of skryf aan iemand in die tronk, die hospitaal of 'n versorgingsoord, of deel iets wat jy het met iemand in nood."
  - "Noudat die reeks eindig: kies die een vers uit Hebreërs wat die meeste met jou gepraat het. Skryf dit uit, sit dit waar jy dit elke dag sal sien, en vertel hierdie week vir een persoon waarom dit vir jou saak maak."
prayer: "Dank God saam vir wat Hy deur hierdie reeks in die groep gedoen het. Bid vir julle leiers en vir mekaar, soos die skrywer in vers 18 vra. Draai aan die einde na mekaar toe, spreek verse 20–21 as 'n seën oor die groep uit, en sluit af met die laaste woorde van die brief: “Die genade sy met julle almal.”"
leader_notes:
  - "Dit is die laaste sessie: beplan ekstra tyd om terug te kyk oor die reeks (vraag 7 en die gebed), selfs al kies julle minder van die ander vrae. Vers 2 nooi tot gasvryheid – oorweeg dit om met 'n ete saam af te sluit."
  - "13:4: sommige in die groep is ongetroud, geskei of weduwee of wewenaar, of leef in 'n pynlike huwelik. Hou die fokus op die huwelik as kosbaar en iets wat deur almal in ere gehou moet word, en sorg dat niemand veroordeel voel nie. Bied 'n persoonlike gesprek aan waar nodig."
  - "13:17: sommige mense is al deur kerkleiers seergemaak. Die teks beskryf leiers wat oor siele waak en rekenskap sal moet gee; die oordenking van dag 28 verklaar “luister” as om jou deur hulle woord uit die Skrif te laat oortuig. Moenie dat die aand in kritiek op bepaalde leiers ontaard nie."
  - "13:10 (“Ons het 'n altaar”): die oordenking van dag 27 lees dit as Christus se offer aan die kruis, waaraan gelowiges deur geloof deel het. As die vraag oor die Nagmaal opkom, noem hierdie lesing en laat 'n langer bespreking vir 'n ander keer."
  - "13:23 noem “ons broer Timoteus”, en sommige sal aflei dat Paulus die brief geskryf het. Hebreërs noem geen skrywer nie; die skrywer noem die hele brief 'n “woord van bemoediging” en sê hy het “maar kortliks” geskryf – dit neem omtrent 'n uur om dit hardop te lees."
  - "Afsluiting van die reeks: bedank die groep, vra wat hulle geleer het en wat hulle volgende wil doen, en stel voor dat hulle die hele brief tuis in een sitting hardop lees."
