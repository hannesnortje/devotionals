session: 4
lang: af
title: "Die belofte van rus"
ref: "4:1-4:16"
days: [8, 9]
big_idea: "Daar bly 'n sabbatsrus oor vir die volk van God: ons gaan dit deur die geloof in, nie deur ons eie werke nie, onder die lewende woord wat ons harte blootlê – en ons kan met vrymoedigheid nader kom na die troon van genade, want ons groot hoëpriester voel mee met ons swakhede."
opening: "Hoe lyk ware rus vir jou – nie net slaap nie, maar die soort waarna jy werklik verkwik is? Wanneer het jy dit laas gehad?"
context: >-
  Hoofstuk 3 het geëindig met die woestyngeslag wat weens ongeloof nie kon ingaan nie. Nou bring die skrywer die waarskuwing na die hede: die belofte om in God se rus in te gaan, geld nog steeds.
  Hy verbind drie Ou-Testamentiese kruispaaie – God se rus op die sewende dag, Josua en Kanaän, en die “Vandag” van Psalm 95 (verse 1–11) –
  en wys dan die lewende woord wat oor die hart oordeel (verse 12–13), en die groot hoëpriester wat die weg na die troon van genade oopmaak (verse 14–16).
read_aloud_tip: "Twee lesers wissel mekaar af met die paragrawe van verse 1–11; een leser lees verse 12–13 stadig; dan lees die hele groep verse 14–16 saam."
hebrew:
  - word: "sabbatismos"
    hebrew: "σαββατισμός"
    gloss: "sabbatsrus"
    point: "Deurgaans in hoofstuk 3–4 gebruik die skrywer katapausis (rus, 'n rusplek, soos die land Kanaän). In 4:9 gebruik hy hierdie baie seldsame woord vir 'n ware, feestelike sabbatsrus – Hebreërs is die vroegste bekende plek waar dit voorkom, en die skrywer het dit dalk self geskep. Josua (in Grieks Iēsous, dieselfde naam as Jesus) kon net 'n aardse skaduwee-rus gee; die ware Jesus bring ons in God se eie rus in."
  - word: "tetrachēlismena"
    hebrew: "τετραχηλισμένα"
    gloss: "blootgelê"
    point: "Van trachēlos, nek of keel. In die antieke stoeisport het die werkwoord 'n greep beskryf wat die teenstander se kop agtertoe buig sodat hy nie kan wegkyk nie; sommige sien ook 'n eggo van die offerdier wat die priester ondersoek het. Voor God se oë lê alles “naak en blootgelê” (4:13)."
  - word: "sympatheō"
    hebrew: "συμπαθέω"
    gloss: "meevoel"
    point: "Baie sterker as ons woord simpatie: letterlik om saam met iemand van binne af te ly. Jesus is een “wat in alle opsigte op dieselfde manier op die proef gestel is – sonder sonde”. Omdat Hy nooit toegegee het nie, het Hy die volle krag van die versoeking gevoel (4:15)."
discussion:
  - q: "“Die woord wat hulle gehoor het, het hulle nie gebaat nie, omdat hulle nie deur die geloof verbind was met dié wat werklik gehoor het nie.” Die oordenking vergelyk dit met 'n maaltyd wat geëet maar nooit verteer word nie. Hoe kan ons God se woord hoor sonder dat dit ons verander?"
    ref: "4:1-4:2"
  - q: "Josua het Israel in 'n land ingebring, maar nie in God se finale rus nie; “daar bly dus 'n sabbatsrus oor vir die volk van God”. Wat is hierdie rus – en in watter area van jou lewe hardloop jy nog op 'n geestelike trapmeul, besig om vir God se goedkeuring te werk in plaas daarvan om daaruit te leef?"
    ref: "4:3-4:10"
  - q: "“Laat ons dan alles in die werk stel om in daardie rus in te gaan.” Hoe kan dit inspanning verg om te rus? Hoe lyk die stryd van die geloof vir jou?"
    ref: "4:11"
  - q: "Die woord van God is “lewend en werksaam en skerper as enige tweesnydende swaard”. Wanneer het 'n Skrifgedeelte deur jou verskonings gesny? Hoe reageer jy wanneer dit aan 'n seer of verborge plek raak?"
    ref: "4:12"
  - q: "“Alles lê naak en blootgelê voor die oë van Hom aan wie ons rekenskap moet gee.” Is dit vir jou skrikwekkend of bevrydend – en waarom, dink jy, laat die skrywer dit dadelik deur vers 14 volg?"
    ref: "4:13-4:14"
  - q: "“Want ons het nie 'n hoëpriester wat nie met ons swakhede kan meevoel nie.” Sommige dink dat Jesus, omdat Hy nooit gesondig het nie, nie werklik kan weet hoe swaar versoeking is nie. Waarom sê die oordenking dat die teenoorgestelde waar is?"
    ref: "4:15"
  - q: "“Laat ons dan met vrymoedigheid nader kom na die troon van genade.” Wanneer jy misluk het – sien jy God se troon as 'n regbank waarvoor jy wegkruip, of as 'n troon van genade waarheen jy hardloop? Wat het jy vandag nodig – barmhartigheid vir die verlede, of genade vir die hede?"
    ref: "4:16"
application:
  - "Kies een area waar jy rusteloos probeer om die uitkoms in jou eie krag te dra. Gee dit hierdie week elke dag doelbewus aan die Here oor en rus in Christus se voltooide werk."
  - "Wanneer jy hierdie week misluk of versoek word, moenie wag totdat jy jouself eers opgeruim het nie: gaan reguit na die troon van genade met 'n kort, eerlike gebed om barmhartigheid en genade."
prayer: "Lees vers 16 saam hardop. Wees dan 'n oomblik stil voor die lewende woord, en laat elkeen die Here vra wat Hy wil blootlê. Bid in pare om barmhartigheid en om hulp op die regte tyd, en sluit af deur vers 16 vir mekaar te bid."
leader_notes:
  - "Twee oordenkings (dag 8 en 9). Dag 9 strek tot 5:10; gebruik vanaand net die deel oor 4:14–16 – die res behoort by volgende week se byeenkoms oor hoofstuk 5."
  - "In 4:2 is daar twee lesings in die handskrifte. Ons vertaling lees dat hulle nie deur die geloof verbind was met dié wat werklik gehoor het nie (Josua en Kaleb); ouer vertalings sê dat die woord by die hoorders nie met geloof vermeng was nie. Albei kom op dieselfde punt uit: hoor sonder geloof baat niks."
  - "Rus beteken nie luiheid of passiwiteit nie (dag 8): ons hou op om vir God se goedkeuring te werk en begin leef vanuit sy voltooide goedkeuring in Christus. Mense met 'n sterk pligsbesef mag dalk teenstribbel; laat die inspanning van vers 11 en die rus van vers 10 langs mekaar staan."
  - "Verse 12–13 kan swaar voel vir sensitiewe gewetes. Die beeld in die oordenking is 'n liefdevolle chirurg, nie 'n vyand nie. Sluit die gesprek af met verse 14–16, sodat niemand met net vers 13 huis toe gaan nie."
  - "Vers 15 kan spekulatiewe vrae oor Jesus se versoekings uitlok. Bly by die punt van die teks: Hy is werklik in alle opsigte op die proef gestel en het nooit toegegee nie, en daarom voel Hy werklik met ons mee."
  - "Vooruitskouing: Volgende week hoofstuk 5 – Jesus, hoëpriester volgens die orde van Melgisedek, en die oproep om van melk na vaste kos te beweeg."
