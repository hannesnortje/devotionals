session: 5
lang: af
title: "'n Hoëpriester wat verstaan"
ref: "5:1-5:14"
days: [9, 10]
big_idea: "Jesus het nie die eer van hoëpriester vir Homself geneem nie: deur God geroep, het Hy deur wat Hy gely het, gehoorsaamheid geleer en die bron van ewige redding geword – en Hy roep ons verder van melk na vaste kos, na 'n geloof wat deur oefening gevorm is."
opening: "Dink aan 'n keer toe iemand jou gehelp het wat self deur dieselfde ding gegaan het. Wat was anders aan hulle hulp?"
context: >-
  Hoofstuk 4 het geëindig met die uitnodiging om met vrymoedigheid na die troon van genade te kom, omdat ons 'n groot hoëpriester het wat met ons swakhede kan meevoel (4:14–16).
  Hoofstuk 5 verduidelik nou wat 'n ware hoëpriester is: hy word uit die mense geneem en deur God geroep – en Jesus vervul albei, tot in die trane van Getsemane.
  Dan steek die skrywer skielik vas: voordat hy meer oor Melgisedek kan sê, moet hy eers die dowwe gehoor van sy lesers aanspreek.
read_aloud_tip: "Lees in drie dele: verse 1–4 (wat elke hoëpriester is), verse 5–10 (Christus, Seun en priester – laat 'n tweede leser die twee psalmaanhalings lees), verse 11–14 (melk en vaste kos)."
hebrew:
  - word: "metriopathein"
    hebrew: "μετριοπαθεῖν"
    gloss: "geduldig omgaan"
    point: "Om jou emosies in maat te hou: nie in woede opvlieg oor dié wat struikel nie, en ook nie koud van hulle wegdraai nie. 'n Aardse hoëpriester het dit nodig gehad omdat hy self met swakheid belaai was (5:2); Christus het geen eie sonde gehad nie, en tog toon Hy volmaakte sagmoedigheid teenoor sondaars."
  - word: "emathen aph' hōn epathen"
    hebrew: "ἔμαθεν ἀφʼ ὧν ἔπαθεν"
    gloss: "het Hy deur wat Hy gely het, gehoorsaamheid geleer"
    point: "'n Woordspel: Hy het geleer (emathen) deur wat Hy gely het (epathen). As die ewige Seun was Jesus nooit ongehoorsaam nie; maar as mens het Hy uit ervaring geleer wat dit kos om gehoorsaam te bly wanneer gehoorsaamheid alles kos. So is Hy tot volmaaktheid gebring – ten volle bevoeg – en het Hy die bron van ewige redding geword (5:8–9)."
  - word: "gegymnasmena"
    hebrew: "γεγυμνασμένα"
    gloss: "geoefen"
    point: "Van gymnazō, waarvan ons gimnastiek en gimnasium kry. Volwassenheid is nie hoeveel ons weet nie, maar sintuie wat deur gewoonte (hexis, herhaalde oefening) geoefen is om tussen goed en kwaad te onderskei – onderskeidingsvermoë word soos spiere opgebou, nie oornag in 'n klaskamer geleer nie (5:14)."
discussion:
  - q: "Verse 1–4 noem twee dinge wat elke hoëpriester nodig het: hy word “uit die mense geneem” en “deur God geroep”. Hoekom is albei belangrik vir iemand wat tussen ons en God moet staan?"
    ref: "5:1-5:4"
  - q: "'n Aardse hoëpriester kon “met die onkundiges en dwalendes geduldig omgaan, omdat hy self ook met swakheid belaai is”. Waar het jy al sulke sagmoedigheid beleef – nie hard nie, maar ook nie onverskillig nie? Wat maak dit moeilik om dit te toon?"
    ref: "5:2"
  - q: "“So het ook Christus Homself nie verheerlik om hoëpriester te word nie.” Wat sê dit oor Jesus dat Hy hierdie eer nie gegryp het nie, maar dit van die Vader ontvang het (Psalm 2:7; Psalm 110:4)?"
    ref: "5:4-5:6"
  - q: "Vers 7 neem ons na Getsemane: “gebede en smekinge met harde roepe en met trane”. Wat beteken dit vir jou eie gebede dat Jesus so gebid het? Durf jy so eerlik bid?"
    ref: "5:7"
  - q: "“Al was Hy Seun, het Hy deur wat Hy gely het, gehoorsaamheid geleer.” Jesus was nooit ongehoorsaam nie – wat het Hy dan geleer? En wat sou God jou in 'n moeilike tyd nou kon leer?"
    ref: "5:8-5:10"
  - q: "Die skrywer sê dat die lesers “traag geword het om te hoor” – hulle was nie altyd so nie. Hoe gly 'n gelowige in geestelike traagheid in, en wat is die vroeë tekens?"
    ref: "5:11-5:13"
  - q: "Volgens vers 14 behoort volwassenheid aan dié “wie se sintuie deur gewoonte geoefen is om tussen goed en kwaad te onderskei”. Hoe sou jou geestelike oefening hierdie week lyk?"
    ref: "5:14"
application:
  - "Bring hierdie week een eerlike, onopgesmukte gebed na God – jou werklike vrese en nood, soos Jesus “met harde roepe en met trane” gebid het – en onthou dat jou Hoëpriester verstaan."
  - "Kies een waarheid wat jy reeds ken (om te vergewe, om die waarheid te praat al kos dit jou iets, om iemand te dien) en pas dit in een konkrete situasie toe – een oefensessie in die geestelike gimnasium."
prayer: "Lees verse 7–9 saam hardop. Bid dan in pare: dank Jesus dat Hy swakheid en trane van binne ken, noem een plek waar julle nou sy hulp nodig het, en vra Hom om julle te oefen om tussen goed en kwaad te onderskei. Bid laastens vir enigiemand in die groep wat deur 'n moeilike tyd gaan."
leader_notes:
  - "Hierdie sessie steun op twee oordenkings wat oor die hoofstukgrens gaan: dag 9 (4:14–5:10) en dag 10 (5:11–6:3). Fokus op hoofstuk 5; 4:14–16 is die brug van verlede week, en 6:1–3 kom volgende week."
  - "Vers 7 sê: “Hy is verhoor weens sy eerbied” – en tog het Hy gesterf. Die oordenking van dag 9 antwoord: God het Hom nie van die sterwe gered nie, maar Hom deur die dood heen en in die opstanding uit die dood uit gebring. (Sommige verstaan die frase só dat Hy verhoor en van sy angs bevry is.)"
  - "Vers 8 kan klink asof Jesus eens ongehoorsaam was. Maak saam met dag 9 duidelik: as die ewige Seun het Hy nooit gerebelleer nie; as mens het Hy uit ervaring geleer wat gehoorsaamheid kos. Moenie dat die aand 'n lang debat oor die twee nature van Christus word nie."
  - "Mense wat ly, kan vers 8 hoor as 'n oordeel oor hulle pyn. Hanteer dit sag: dag 9 sê dat huidige lyding nie 'n teken is dat God ons vergeet het nie, maar 'n klaskamer waarin die Gees ons vorm – nie dat elke swaarkry verdien is nie."
  - "Vrae 6–7 kan soos 'n teregwysing voel. Mense wat al lank in die geloof is, voel dalk geoordeel, en nuwe gelowiges voel dalk hulle word babas genoem. Dag 10 sê melk is natuurlik en gesond vir 'n pasgebore baba; die probleem is net om daar te bly staan. Hou die toon bemoedigend."
  - "Vooruitskouing: volgende week hoofstuk 6 – die ernstigste waarskuwing van die brief (6:4–6), en die hoop as anker van die siel."
