session: 9
lang: af
title: "Deur sy eie bloed"
ref: "9:1-9:28"
days: [16, 17, 18]
big_idea: "Die aardse tent het gewys dat die weg na God se teenwoordigheid nog nie oop was nie; Christus het deur sy eie bloed eens en vir altyd die heiligdom ingegaan, Hy reinig ons gewete van dooie werke sodat ons die lewende God kan dien, Hy verskyn nou vir ons voor God en sal 'n tweede keer verskyn tot redding."
opening: "Dink aan 'n plek waar jy as kind nie mag ingaan het nie – 'n personeelkamer, 'n werkswinkel, jou ouers se studeerkamer. Wat het daardie toe deur vir jou gesê?"
context: >-
  Aan die einde van hoofstuk 8 het God die eerste verbond oud verklaar. Nou neem die skrywer ons met eerbied op 'n rondleiding deur die woestyntent van Moses: twee vertrekke, 'n swaar voorhangsel, een hoëpriester, een keer per jaar, nooit sonder bloed nie.
  Dan kom twee kragtige woorde: “Maar Christus …”. Hoofstuk 9 wys wat sy eie bloed vermag wat geen diereoffer kon nie, waarom 'n dood nodig was – die verbond werk ook soos 'n testament – en hoe Christus vir ons verskyn: in die verlede, die hede en die toekoms.
read_aloud_tip: "Drie lesers: verse 1–10 (die aardse tent – lees stadig, soos 'n rondleiding), verse 11–14 (Christus se eie bloed – beklemtoon die “Maar” aan die begin), verse 15–28 (die testament, die bloed en die drievoudige verskyning)."
hebrew:
  - word: "syneidēsis"
    hebrew: "συνείδησις"
    gloss: "gewete"
    point: "Letterlik om saam met jouself te weet: ons innerlike morele bewussyn dat ons skuldig voor 'n heilige God staan. Gawes en offers kon die een wat God dien, nie na die gewete tot volmaaktheid bring nie (9:9); die bloed van Christus sal ons gewete van dooie werke reinig (9:14)."
  - word: "lytrōsis"
    hebrew: "λύτρωσις"
    gloss: "loskoping"
    point: "Die vrykoop van 'n slaaf of krygsgevangene deur 'n duur losprys te betaal. Die Ou Testament het net 'n jaarlikse versoening geken; Christus het eens en vir altyd (ephapax) ingegaan en 'n ewige loskoping verkry, waarvan die waarde nooit verval nie (9:12)."
  - word: "diathēkē"
    hebrew: "διαθήκη"
    gloss: "verbond / testament"
    point: "Dieselfde Griekse woord beteken verbond en testament. Ons vertaling sê in 9:16–17 “testament” en elders “verbond”, sodat die woordspel sigbaar word: 'n testament word eers geldig wanneer die een wat dit gemaak het, gesterf het – en Christus laat vir ons die belofte van die ewige erfenis na (9:15)."
discussion:
  - q: "Loop in verse 1–5 deur die tent. In die ark het herinneringe gelê aan die volk se gemor, opstand en gebroke wet – en daarbo die versoeningsdeksel waarop die bloed gesprinkel is. Wat sê daardie beeld vir jou oor God?"
    ref: "9:1-9:5"
  - q: "“Maar in die tweede gaan net die hoëpriester, een keer per jaar, en nie sonder bloed nie.” Wat het die Heilige Gees volgens vers 8 deur hierdie ontwerp geleer? Voel jou verhouding met God soms nog asof jy voor 'n toe voorhangsel staan?"
    ref: "9:6-9:8"
  - q: "Gawes en offers kan “die een wat God dien, nie na die gewete tot volmaaktheid” bring nie; hulle reinig net die buitekant. Watter uiterlike “wassings” gebruik ons vandag om 'n skuldige gewete stil te maak – ekstra moeite, goeie voornemens, dae lank selfverwyt?"
    ref: "9:9-9:10"
  - q: "“Hoeveel te meer sal die bloed van Christus … ons gewete van dooie werke reinig, sodat ons die lewende God kan dien!” Let op die volgorde: gereinig sodat ons kan dien – nie dien sodat ons gereinig word nie. Wat verander as jy in daardie volgorde leef?"
    ref: "9:11-9:14"
  - q: "In vers 14 is die hele Drie-eenheid aan die werk: die Seun het Homself deur die ewige Gees aan God aangebied. Wat beteken dit vir jou dat jou redding die werk van Vader, Seun en Gees saam is?"
    ref: "9:14"
  - q: "“Want 'n testament word eers by die dood geldig.” En vers 22: “sonder bloedvergieting is daar geen vergewing nie”. Waarom moes die Messias sterf – kon God ons nie bloot vergewe verklaar het nie? Wat beteken dit dat niemand die erfenis wat Christus aan jou nagelaat het, kan betwis nie?"
    ref: "9:15-9:22"
  - q: "Verse 24–28 praat van 'n drievoudige verskyning: een keer by die voleinding van die eeue om die sonde tersyde te stel (verlede), “om nou ter wille van ons voor die aangesig van God te verskyn” (hede), en 'n tweede keer, sonder sonde, tot redding (toekoms). Watter een van die drie het jy hierdie week die nodigste, en waarom?"
    ref: "9:23-9:28"
application:
  - "Wanneer jou gewete jou hierdie week aankla, moenie self boete doen nie: noem die sonde voor God, dank Hom vir die bloed van Christus (9:14) – en doen dan vir iemand 'n diens, vry en dankbaar."
  - "Begin hierdie week elke dag met vers 24: Christus verskyn nou ter wille van jou voor God. Bring dan jou dag met daardie vrymoedigheid na die Vader."
prayer: "Lees vers 14 saam hardop. Bid in kort sinne: dank God vir iets in die tent wat na Christus heenwys, bely stil die dooie werke waarop julle staatmaak, en dank Jesus dat Hy nou vir ons verskyn. Sluit af met vers 28: dank Hom dat Hy 'n tweede keer sal verskyn tot redding."
leader_notes:
  - "Hierdie byeenkoms steun op drie oordenkings (dag 16–18), en hoofstuk 9 is lank. Kies vyf vrae. Moenie in die besonderhede van die meubels verdwaal nie – die skrywer sê self in 9:5: “Daaroor kan ons nou nie in besonderhede praat nie.”"
  - "Iemand sal dalk raaksien dat die reukofferaltaar volgens Eksodus 30:6 voor die voorhangsel gestaan het, terwyl 9:4 sê dat die Allerheiligste dit “gehad” het. Die oordenking van dag 16 verduidelik: in sy funksie het dit by die Allerheiligste behoort – sy rook moes dit vul, en op die Versoendag het die hoëpriester die wierookpan daarin gedra (Levitikus 16:12–13)."
  - "In 9:16–17 staan “testament”, elders in die hoofstuk “verbond” – dit is dieselfde Griekse woord, doelbewus so vertaal ('n besluit van die reeks). As die Bybels in die groep verskil, verduidelik die woordspel eerder as om oor vertalings te stry."
  - "Sommige vind die praat oor bloed moeilik of afstootlik. Die oordenking verduidelik dit vanuit Levitikus 17:11 (die lewe van die vlees is in die bloed): sonde is nie 'n klein foutjie nie, en vergewing vereis dat 'n plaasvervangende lewe afgelê word. Gee ruimte vir eerlike vrae."
  - "Vers 27 (om een keer te sterwe en daarna die oordeel) kan iemand wat rou of bang is vir die dood, hard tref. Die oordenking laat vers 27 nooit alleen staan nie: vers 28 volg dadelik – “so sal ook Christus”. Vir dié wat in Christus is, is die toekoms 'n blye verwagting."
  - "Vooruitskouing: volgende week hoofstuk 10 – een offer vir altyd, die nuwe en lewende weg, en 'n ernstige waarskuwing (10:26–31), gevolg deur “Moet julle vrymoedigheid dan nie weggooi nie”."
