session: 11
lang: af
title: "Deur geloof"
ref: "11:1-11:40"
days: [22, 23, 24]
big_idea: "Geloof hou God se beloftes soos 'n titelakte in die hand: dit maak ons pelgrims op pad na die stad waarvan God die bouer is, dit ag die smaad van die Christus meer as die skatte van Egipte, en dit hou vol – of God ons nou verlos of ons deur die lyding dra."
opening: "Het jy al ooit vir iets betaal lank voordat jy dit kon geniet – 'n kaartjie, 'n stuk grond, 'n vakansie? Hoe het dit gevoel om die bewys in jou hand te hou terwyl jy nog gewag het?"
context: >-
  Aan die einde van hoofstuk 10 het die skrywer sy moeë, vervolgde lesers daaraan herinner dat hulle nie behoort aan dié wat terugdeins nie, maar aan dié wat glo.
  Nou maak hy 'n galery van getuies uit hulle eie Skrifte oop – van Abel, Henog en Noag, deur Abraham en die aartsvaders, tot by Moses, Ragab en naamlose martelare.
  Nie een van hulle het geleef van wat hulle oë kon sien nie; almal het van God se beloftes geleef. Vanaand lees ons die hele hoofstuk 11.
read_aloud_tip: "Gebruik vier lesers: verse 1–7 (geloof en die eerste getuies), 8–22 (Abraham tot Josef), 23–31 (Moses tot Ragab), 32–40 (die helde en die naamloses). Laat die hele groep elke keer saam die woorde “Deur geloof” sê."
hebrew:
  - word: "hypostasis"
    hebrew: "ὑπόστασις"
    gloss: "sekerheid"
    point: "Ons het hierdie woord in 1:3 (“wese”) en 3:14 (“sekerheid”) teëgekom. In sommige Griekse papiri uit die eerste eeue word dit gebruik vir dokumente wat eienaarskap bewys – 'n soort titelakte. Geloof hou die titelakte van God se beloftes in die hand voordat ons ingetrek het (11:1)."
  - word: "aspazomai"
    hebrew: "ἀσπάζομαι"
    gloss: "gegroet"
    point: "Om iets met vreugde te verwelkom, met oop arms te omhels – soos seelui wat die berge van hulle tuiste op die horison sien verskyn en juig, al is hulle nog myle van die hawe af. Die aartsvaders het gesterf sonder die vervulling, maar hulle het die beloftes van ver af gesien en gegroet (11:13)."
  - word: "kartereō"
    hebrew: "καρτερέω"
    gloss: "volgehou"
    point: "Soos 'n soldaat wat sterk en onwrikbaar bly staan. Dit is die geheim van Moses se uithouvermoë: wie die onsigbare Koning met die oog van die geloof sien, vir hom krimp die woede van 'n aardse farao tot niks (11:27)."
discussion:
  - q: "“Die geloof is die sekerheid van wat gehoop word, die bewys van dinge wat nie gesien word nie.” Die oordenking vergelyk hierdie sekerheid met 'n titelakte. Wat is die verskil tussen om 'n belofte van God soos 'n titelakte te behandel en om dit soos 'n wens te behandel?"
    ref: "11:1-11:3"
  - q: "Abel wys die aanbidding van die geloof, Henog sy daaglikse wandel, Noag sy werk en volharding. Vers 6 sê wie na God nader kom, moet glo dat Hy bestaan en “dat Hy dié beloon wat Hom ernstig soek”. Hoe verander hierdie beeld van God die manier waarop jy bid?"
    ref: "11:4-11:7"
  - q: "Abraham het weggetrek “sonder om te weet waarheen hy gaan”. Wanneer moes jy 'n stap van gehoorsaamheid neem sonder om die hele padkaart te sien? Wat het jou gehelp?"
    ref: "11:8-11:12"
  - q: "Die aartsvaders het bely dat hulle “vreemdelinge en deurreisigers op die aarde” is. Waar slaan ons ons tentpenne te diep in hierdie wêreld in? En wat beteken dit vir jou: “Daarom skaam God Hom nie vir hulle om hulle God genoem te word nie”?"
    ref: "11:13-11:16"
  - q: "Op Moria het Abraham “gereken dat God selfs uit die dode kan opwek”. Wat is die “Isak” in jou lewe – 'n goeie gawe van God waaraan jy dalk stywer vashou as aan die Gewer?"
    ref: "11:17-11:22"
  - q: "Moses het “die smaad van die Christus as groter rykdom geag as die skatte van Egipte”. Wat is vandag die skatte van Egipte, en wat help ons om deur “die verbygaande genot van die sonde” te sien?"
    ref: "11:23-11:28"
  - q: "In verse 33–35 sluit sommige die bekke van leeus toe; dan draai die teks: “Ander is gefolter en het die vrylating nie aanvaar nie”. Albei groepe staan in dieselfde lys, en van die lydendes word gesê: “die wêreld was hulle nie werd nie”. Hoe kan dit iemand in 'n lang, moeilike tyd help?"
    ref: "11:32-11:40"
application:
  - "Skryf een belofte van God neer waaraan jy vashou sonder dat jy die vervulling al sien. Lees dit hierdie week elke oggend soos 'n titelakte, en dank God daarvoor voordat jy enigiets sien verander."
  - "Noem een tentpen wat jou te styf aan hierdie wêreld vasbind – 'n besitting, 'n ambisie of 'n bekommernis – en doen hierdie week een konkrete ding om dit los te maak: gee iets weg, deel, of gee dit in gebed aan God oor."
prayer: "Begin deur vers 1 saam hardop te lees. Dank God vir die mense van geloof wat voor julle gegaan het, in die Bybel en in julle eie lewe. Bid dan vir enigeen in die groep wat in 'n “Ander”-seisoen is – wat wag, ly of nog geen antwoord sien nie – en vra dat julle almal sal volhou soos mense wat die Onsigbare sien."
leader_notes:
  - "Hierdie sessie dek drie oordenkings (dag 22–24) en 40 verse. Moenie probeer om elke naam te bespreek nie; die vier leesgedeeltes gee die struktuur, en vier of vyf vrae is genoeg."
  - "11:11: ons vertaling volg die Griekse grondteks, waarin Abraham die onderwerp is (“saam met Sara self”); baie ouer Bybels maak Sara die onderwerp. As iemand die verskil raaksien, verduidelik dit kortliks – vers 12 praat ook van “een man” – en wys daarop dat Sara steeds ingesluit is. Moenie dat dit die onderwerp van die aand word nie."
  - "Die sensitiefste punt is verse 35–38. Sommige mense glo dat groot geloof altyd genesing of redding bring. Die oordenking van dag 24 sê dat dié wat gely het, nie minder geloof gehad het as dié wat wonderwerke beleef het nie. Hanteer dit saggies met enigeen wat siek is, rou, of lank sonder antwoord gebid het, en moenie uitkomste belowe nie."
  - "Abel se offer: die oordenking verklaar God se aanvaarding uit die geloof in Abel se hart. Genesis sê min oor die rede, so moenie lank by bespiegelings oor die offers stilstaan nie."
  - "Verse 39–40 berei volgende week voor: die getuies van hoofstuk 11 word saam met ons tot volmaaktheid gebring. Kyk vorentoe: hoofstuk 12 – die wedloop, die Vader se tug en die twee berge, Sinai en Sion."
