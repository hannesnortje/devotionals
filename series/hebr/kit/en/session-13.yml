session: 13
lang: en
title: "The Great Shepherd"
ref: "13:1-13:25"
days: [27, 28]
big_idea: "Grateful worship in a kingdom that cannot be shaken becomes practical love, contentment and the courage to go out to Jesus outside the camp; we offer God the sacrifices of praise and sharing – and the God of peace, who brought up the great shepherd from the dead, himself equips us to do his will."
opening: "When a long time together comes to an end – a trip, a course, a job – what do you most want the others to take with them?"
context: >-
  At the end of chapter 12 the author said that we are receiving a kingdom that cannot be shaken and should worship God with thankfulness, reverence and awe.
  Chapter 13 shows what that worship looks like on an ordinary weekday: love, hospitality, marriage and money (verses 1–6), leaders and the unchanging Christ (7–9), going out to Jesus outside the camp (10–14), the sacrifices of praise and sharing (15–19), and finally a great blessing and personal greetings (20–25).
  Tonight we finish the letter – and this series.
read_aloud_tip: "Use three readers: verses 1–9, 10–19 and 22–25. Let the whole group read verse 8 together, and read verses 20–21 together as a blessing at the end of the reading."
hebrew:
  - word: "ou mē se anō oud' ou mē se enkatalipō"
    hebrew: "οὐ μή σε ἀνῶ οὐδʼ οὐ μή σε ἐγκαταλίπω"
    gloss: "never … never"
    point: "In 13:5 the Greek piles up five negatives: freely rendered: I will never, ever loosen my grip on you, and I will never, ever abandon you. Our security lies not in what we have, but in whom we have – that is why we can be content (13:5–6)."
  - word: "exō tēs parembolēs"
    hebrew: "ἔξω τῆς παρεμβολῆς"
    gloss: "outside the camp"
    point: "On the Day of Atonement the bodies of the sin offerings were burned outside the camp (Leviticus 16:27). Jesus suffered outside the gate. For the first readers the camp was the safe, respected world of the temple – but Jesus is outside (13:11–13)."
  - word: "katartizō"
    hebrew: "καταρτίζω"
    gloss: "equip"
    point: "Used in medicine for setting a broken bone and by fishermen for mending nets (Matthew 4:21); in 11:3 the same verb describes the worlds being fashioned by God's word. What God asks of us, he himself works in us (13:21)."
discussion:
  - q: "Verses 1–4 name four directions of love: love for brothers and sisters, hospitality to strangers, compassion for prisoners and the mistreated, and honour for marriage. Which of these is strong in our group, and which needs our attention?"
    ref: "13:1-13:4"
  - q: "“Be content with what you have” – and the reason given is not a budget but a promise: “I will never let you go and never abandon you.” Why does contentment rest on a person rather than on possessions? Where are you uneasy about money or the future?"
    ref: "13:5-13:6"
  - q: "“Jesus Christ is yesterday and today the same – and for ever.” Think of your own yesterday, today and future: where do you most need to hear this sentence?"
    ref: "13:7-13:8"
  - q: "“It is good for the heart to be strengthened by grace, not by foods.” What are today's “foods” – rules, achievements or forms we use to feel in control? What does it look like to let grace strengthen your heart?"
    ref: "13:9"
  - q: "“So let us go out to him outside the camp, bearing his reproach.” What is the comfortable “camp” in our setting, and what could going out to Jesus look like for you this month?"
    ref: "13:10-13:14"
  - q: "Verses 15–16 name two sacrifices: “the fruit of lips that confess his name” and “Do not forget to do good and to share”. Which comes more naturally to you – the lips or the hands? And how can we make the work of those who “keep watch over your souls” a joy rather than a groaning?"
    ref: "13:15-13:19"
  - q: "Looking back over the whole series: Hebrews has shown us Jesus as the Son through whom God has spoken, the merciful high priest, the forerunner, the pioneer of faith and now the great shepherd. Which picture of Jesus has become most important to you, and why?"
    ref: "13:20-13:21"
application:
  - "Choose one of the directions of love in verses 1–3 and put it into practice this week: invite someone for a meal, visit or write to someone in prison, hospital or a care home, or share something you have with someone in need."
  - "As the series ends, choose the one verse from Hebrews that has spoken to you most. Write it out, put it where you will see it every day, and tell one person this week why it matters to you."
prayer: "Thank God together for what he has done in the group through this series. Pray for your leaders and for one another, as the author asks in verse 18. Close by turning to one another and speaking verses 20–21 as a blessing over the group, and end with the last words of the letter: “Grace be with you all.”"
leader_notes:
  - "This is the last session: plan extra time for looking back over the series (question 7 and the prayer), even if you choose fewer of the other questions. Verse 2 invites hospitality – consider ending with a meal together."
  - "13:4: some in the group are single, divorced or widowed, or live in a painful marriage. Keep the focus on marriage as precious and to be honoured by all, and make sure no one leaves feeling judged. Offer a personal conversation where needed."
  - "13:17: some people have been hurt by church leaders. The text describes leaders who keep watch over souls and will give account; the day 28 devotional explains “listen” as letting yourself be persuaded by their word from Scripture. Don't let the evening turn into criticism of particular leaders."
  - "13:10 (“We have an altar”): the day 27 devotional reads this as Christ's sacrifice on the cross, in which believers share by faith. If the question of the Lord's Supper comes up, note this reading and leave a longer discussion for another time."
  - "13:23 mentions “our brother Timothy”, and some will conclude that Paul wrote the letter. Hebrews names no author; the author calls the whole letter a “word of encouragement” and says he has written “only briefly” – it takes about an hour to read aloud."
  - "Closing the series: thank the group, ask what they have learned and what they would like to do next, and suggest reading the whole letter aloud in one sitting at home."
timing:
  welcome: 10
