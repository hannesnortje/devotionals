session: 5
lang: en
title: "Our Understanding High Priest"
ref: "5:1-5:14"
days: [9, 10]
big_idea: "Jesus did not take the honour of high priest for himself: called by God, he learned obedience through what he suffered and became the source of eternal salvation – and he calls us on from milk to solid food, to a faith trained by practice."
opening: "Think of a time when someone helped you who had been through the same thing themselves. What made their help different?"
context: >-
  Chapter 4 ended with an invitation to approach the throne of grace with confidence, because we have a great high priest who can sympathize with our weaknesses (4:14–16).
  Chapter 5 now explains what makes a true high priest: he is taken from among human beings and called by God – and Jesus fulfils both, right through the tears of Gethsemane.
  Then the author suddenly stops: before he can say more about Melchizedek, he has to deal with his readers' dull hearing.
read_aloud_tip: "Read in three parts: verses 1–4 (what every high priest is), verses 5–10 (Christ, Son and priest – let a second reader read the two Psalm quotations), verses 11–14 (milk and solid food)."
hebrew:
  - word: "metriopathein"
    hebrew: "μετριοπαθεῖν"
    gloss: "deal gently"
    point: "To keep one's emotions in measure: neither flaring up in anger at those who stumble nor turning away from them coldly. An earthly high priest needed this because he himself was beset with weakness (5:2); Christ had no sin of his own, yet shows perfect gentleness towards sinners."
  - word: "emathen aph' hōn epathen"
    hebrew: "ἔμαθεν ἀφʼ ὧν ἔπαθεν"
    gloss: "he learned obedience through what he suffered"
    point: "A wordplay: he learned (emathen) through what he suffered (epathen). As the eternal Son, Jesus was never disobedient; but as a human being he learned by experience what it costs to stay obedient when obedience costs everything. So he was made perfect – fully qualified – and became the source of eternal salvation (5:8–9)."
  - word: "gegymnasmena"
    hebrew: "γεγυμνασμένα"
    gloss: "trained"
    point: "From gymnazō, which gives us gymnastics and gymnasium. Maturity is not how much we know but faculties trained by practice (hexis, repeated habit) to distinguish good from evil – discernment is built up like muscle, not learned overnight in a classroom (5:14)."
discussion:
  - q: "Verses 1–4 name two things every high priest needs: he is “taken from among human beings” and “called by God”. Why do both matter for someone who is to stand between us and God?"
    ref: "5:1-5:4"
  - q: "An earthly high priest could “deal gently with those who are ignorant and going astray, since he himself is beset with weakness”. When have you met gentleness like that – neither harsh nor indifferent? What makes it hard to show?"
    ref: "5:2"
  - q: "“Christ did not glorify himself to become high priest.” What does it tell us about Jesus that he did not seize this honour but received it from the Father (Psalm 2:7; Psalm 110:4)?"
    ref: "5:4-5:6"
  - q: "Verse 7 takes us to Gethsemane: “prayers and pleas with loud cries and tears”. What does it mean for your own prayers that Jesus prayed like this? Do you dare to pray that honestly?"
    ref: "5:7"
  - q: "“Although he was a Son, he learned obedience through what he suffered.” Jesus was never disobedient – so what did he learn? And what might God be teaching you in a hard season right now?"
    ref: "5:8-5:10"
  - q: "The readers had “become sluggish in hearing” – they had not always been like this. How does a believer drift into spiritual sluggishness, and what are the early signs?"
    ref: "5:11-5:13"
  - q: "Maturity, says verse 14, belongs to those “whose faculties have been trained by practice to distinguish good from evil”. What would your spiritual gym look like this week?"
    ref: "5:14"
application:
  - "Bring one honest, unpolished prayer to God this week – your real fears and needs, as Jesus prayed “with loud cries and tears” – and remember that your high priest understands."
  - "Choose one truth you already know (to forgive, to speak the truth when it costs you, to serve someone) and put it into practice in one concrete situation – one session in the spiritual gym."
prayer: "Read verses 7–9 aloud together. Then pray in pairs: thank Jesus that he knows weakness and tears from the inside, name one place where you need his help right now, and ask him to train you to distinguish good from evil. Close by praying for anyone in the group who is going through a hard season."
leader_notes:
  - "This session draws on two devotionals that cross the chapter boundary: day 9 (4:14–5:10) and day 10 (5:11–6:3). Focus on chapter 5; 4:14–16 is the bridge from last week, and 6:1–3 comes next week."
  - "Verse 7 says “he was heard because of his reverence” – yet he died. The day 9 devotional answers: God did not save him from dying, but brought him through death and out of death in the resurrection. (Some take the phrase to mean that he was heard and set free from his anguish.)"
  - "Verse 8 can sound as if Jesus was once disobedient. Make clear, with day 9: as the eternal Son he never rebelled; in becoming human he learned by experience what obedience costs. Don't let the evening become a long debate about the two natures of Christ."
  - "People who are suffering may hear verse 8 as a verdict on their pain. Handle it gently: day 9 says that present suffering is not a sign that God has forgotten us, but a classroom in which the Spirit shapes us – it does not say that every hardship is deserved."
  - "Questions 6–7 can feel like a rebuke. Long-standing members may feel judged, and new believers may feel they are being called babies. Day 10 says milk is natural and healthy for a newborn; the problem is only staying there. Keep the tone encouraging."
  - "Point ahead: next week chapter 6 – the sternest warning of the letter (6:4–6), and hope as the anchor of the soul."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
