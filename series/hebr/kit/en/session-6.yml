session: 6
lang: en
title: "The Soul's Anchor"
ref: "6:1-6:20"
days: [10, 11, 12]
big_idea: "Don't stand still at the foundation: the author warns earnestly against falling away, yet he is convinced of better things for his readers – and our hope rests on God's promise and God's oath, an anchor fixed behind the curtain where Jesus has gone ahead of us."
opening: "Think of something you once had to wait a long time for. What helped you keep going – or what made you want to give up?"
context: >-
  At the end of chapter 5 the author stopped to rebuke his readers: they had become sluggish in hearing and still needed milk.
  Chapter 6 calls them on to maturity (vv. 1–3) and then gives one of the sternest warnings in the letter (vv. 4–8).
  But straight away he calls them “dear friends” and assures them of better things (vv. 9–12), before pointing them to God's oath to Abraham and to the hope that is an anchor of the soul (vv. 13–20).
read_aloud_tip: "Read in four parts with four readers: verses 1–3, verses 4–8 (read slowly and calmly, not threateningly), verses 9–12 (read warmly), verses 13–20 (the oath and the anchor)."
hebrew:
  - word: "nōthroi"
    hebrew: "νωθροί"
    gloss: "sluggish"
    point: "Dull, listless, numb. The word frames the passage: in 5:11 the readers have “become sluggish in hearing”, and in 6:12 the author urges them not to become sluggish but to imitate those who inherit the promises. Its opposite is eagerness, faith and patience (makrothymia, a long breath)."
  - word: "ametathetos"
    hebrew: "ἀμετάθετος"
    gloss: "unchangeable"
    point: "A word used in legal language for a will or agreement that cannot be cancelled or altered. God's word was already enough, but for the sake of our doubt he added an oath – two unchangeable things, “in which it is impossible for God to lie” (6:17–18)."
  - word: "prodromos"
    hebrew: "πρόδρομος"
    gloss: "forerunner"
    point: "Under the old covenant the high priest went behind the curtain alone, once a year, and no one could follow him. Jesus has entered “as a forerunner on our behalf”: he has gone ahead to open the way, so that we may follow him into God's presence (6:20)."
discussion:
  - q: "Verses 1–2 name six foundation stones in three pairs. Which of them were laid well in your own life? Why must we not keep laying the foundation again – and what does “if indeed God permits” add?"
    ref: "6:1-6:3"
  - q: "Verses 4–5 describe people who “have once been enlightened” and “have tasted the heavenly gift”. How can someone experience so much at close quarters and still turn away? (Think of the wilderness generation in chapter 3.)"
    ref: "6:4-6:5"
  - q: "Verse 6 describes people who keep on “crucifying the Son of God again for themselves and holding him up to contempt”. Why does it matter that the impossibility is tied to an ongoing rejection of Jesus, the only high priest and the only sacrifice?"
    ref: "6:6"
  - q: "Two pieces of land drink the same rain: one produces useful vegetation, the other thorns and thistles. What does the spiritual rain in your life look like, and what is it producing?"
    ref: "6:7-6:8"
  - q: "Right after the warning the author says: “we are convinced of better things in your case”. What does he see in his readers (v. 10)? Where do you see “things that belong to salvation” in one another?"
    ref: "6:9-6:10"
  - q: "“For God is not unjust; he will not forget your work and the love you have shown for his name.” Whose hidden service do you want to thank God for tonight? What does this verse say to someone who feels unnoticed?"
    ref: "6:10-6:12"
  - q: "Our hope is “an anchor of the soul, sure and firm” – but it is cast upwards, behind the curtain, not down into the sea. What is your anchor fastened to when the storm comes, and what difference does it make that Jesus has gone there ahead of us?"
    ref: "6:13-6:20"
application:
  - "Abraham obtained the promise “after waiting patiently”. Name one promise of God you are waiting on, and each day this week bring it before him again with faith and patience."
  - "Encourage one person whose service usually goes unnoticed – tell them, in a note or in person, that God does not forget their work and their love."
prayer: "Read verses 19–20 aloud together. Then pray in pairs for each other: name one storm or one long wait you are in, and thank God that his promise and his oath cannot fail. Close by thanking God for the faithful, hidden service of people in your church."
leader_notes:
  - "This session draws on three devotionals: day 10 (5:11–6:3, for verses 1–3), day 11 (6:4–12) and day 12 (6:13–20). Don't let verses 4–6 swallow the whole evening – keep at least 15 minutes for the oath and the anchor (vv. 13–20)."
  - "6:4–6 is one of the most debated passages in the New Testament, and sincere Christians in your group may read it differently, depending on their tradition. Let each person speak without having to settle the question; the aim is to hear the warning and the comfort together, not to win a debate."
  - "Follow the line of the day 11 devotional: the readers were considering openly denying Christ and going back to the temple sacrifices to escape persecution; falling away here means a total, deliberate rejection of Christ, not a believer stumbling into sin out of weakness; and the present participles tie the impossibility to persisting in that rejection. There is no other sacrifice."
  - "Someone may be afraid of having committed this sin. Say clearly what day 11 says: the very fact that your heart is tender, that you grieve over your sin and long for Jesus, shows that you are not in the hardened state of verse 6. If the fear runs deep, offer to talk and pray together afterwards."
  - "Verse 9 is the author's own key: the only time in the letter he calls his readers “dear friends”, and he is convinced of better things in their case. Never read the warning without verses 9–12."
  - "Background (day 12): the anchor was found on early Christian graves; the popular sermon story of a small boat rowing the anchor into the harbour has no clear ancient evidence – use it as an illustration, not as history. Point ahead: next week chapter 7 – Melchizedek and a priest for ever."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
