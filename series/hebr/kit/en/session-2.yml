session: 2
lang: en
title: "Do Not Drift"
ref: "2:1-2:18"
days: [3, 4, 5]
big_idea: "Because the Son is so great, we must not drift away from a salvation this great: Jesus became one of us, tasted death for everyone by the grace of God, broke the power of the devil, and is now the merciful and faithful high priest who helps us when we are tested."
opening: "Have you ever been on a lilo, a boat or a paddleboard and suddenly noticed how far the current had carried you without your noticing? What happened?"
context: >-
  Chapter 1 showed the Son exalted far above the angels. Now the author turns to the first of five warning passages:
  if the word spoken through angels at Sinai was binding, how much more the salvation the Lord himself spoke of (vv. 1–4).
  Then he answers a stumbling block for his Jewish readers – why would the Son become a frail human being and die? – with Psalm 8, showing Jesus as our pioneer, our brother and our high priest (vv. 5–18).
read_aloud_tip: "Three readers: verses 1–4 (the warning), verses 5–9 (Psalm 8 and Jesus crowned – pause briefly before “But we do see”), verses 10–18 (our brother and high priest)."
hebrew:
  - word: "pararyōmen"
    hebrew: "παραρυῶμεν"
    gloss: "drift away"
    point: "A seafaring word for a boat that has not been properly moored and quietly drifts with the current past the safe harbour – or a ring that slips unnoticed off a finger. Its opposite in the same verse, prosechein (pay attention), meant holding a ship on course and mooring it. The danger is not sudden rebellion but slow, unnoticed drifting (2:1)."
  - word: "archēgos"
    hebrew: "ἀρχηγός"
    gloss: "pioneer"
    point: "A pioneer, trailblazer or champion – like the sailor in a well-known sermon illustration who swims through the breakers to the rocky shore and ties a rescue line, so that everyone on board can cross safely. God made this pioneer “perfect through sufferings”: teleioō means fully qualified for his task, not morally improved (2:10)."
  - word: "boētheō"
    hebrew: "βοηθέω"
    gloss: "help"
    point: "Made up of boē (a cry for help) and theō (to run): to rush towards a cry for help. Because he himself suffered when he was tested, Jesus “is able to help those who are being tested” (2:18)."
discussion:
  - q: "“How shall we escape if we disregard a salvation this great?” The danger here is not open rebellion but drifting through tiredness and neglect. Which undercurrents in our daily lives pull our attention away from the Lord?"
    ref: "2:1-2:3"
  - q: "Verses 3–4 give a threefold foundation for this salvation: the Lord who first spoke of it, those who heard him, and God who added his testimony. Why does it help to know that our faith rests on this testimony and not on our feelings?"
    ref: "2:3-2:4"
  - q: "“As it is, we do not yet see everything subjected to him.” Where do you feel this most painfully – in the world, in your family, in yourself?"
    ref: "2:5-2:8"
  - q: "“But we do see … Jesus, crowned with glory and honour.” What changes when we shift our gaze from what we do not yet see to the one we do see by faith?"
    ref: "2:8-2:9"
  - q: "Jesus was made a little lower than the angels “so that by the grace of God he might taste death for everyone”. He did not merely dip his fingertips into death; he drained the cup. What does that mean to you?"
    ref: "2:9"
  - q: "“He is not ashamed to call them brothers and sisters.” When do you feel like the black sheep of God's family? How does verse 11 speak into that?"
    ref: "2:10-2:13"
  - q: "Verse 15 speaks of people “held in slavery all their lives” through fear of death, and verse 18 promises help to “those who are being tested”. Where does fear – of illness, loss, the future – dictate our decisions? And when you are tempted, do you fight alone first, or call on your high priest straight away?"
    ref: "2:14-2:18"
application:
  - "Check your anchor points: choose one daily habit you have let slip (stillness before the Lord, reading the word, fellowship with believers) and moor yourself to it again this week."
  - "When temptation or fear comes this week, make verse 18 your first response: call to Jesus at once with a short prayer for help, before you try to fight it in your own strength."
prayer: "Read verses 17–18 aloud together. Pray in threes: confess where you have been drifting, thank Jesus that he is not ashamed to call you his brother or sister, and bring him one area where fear or temptation is pressing on you. Close by praying for people you know who are drifting away."
leader_notes:
  - "Three devotionals (days 3–5) and eighteen verses make a full evening. If time is short, use questions 1, 4, 6 and 7."
  - "This is the first of five warning passages (2:1–4; 3:7–4:13; 5:11–6:12; 10:19–39; 12:14–29). Its tone is pastoral urgency, not panic. Keep the emphasis of the day 3 devotional: holy watchfulness, and deliberately mooring our hearts to the gospel every day."
  - "2:9 “by the grace of God”: our translation follows the majority reading (chariti theou). Some manuscripts and the SBL Greek text read chōris theou (apart from God). Mention it only if someone's Bible reads differently; don't let it become the topic of the evening."
  - "2:10 does not mean that Jesus was ever sinful or morally imperfect (see 4:15). Teleioō means bringing someone to the full goal, fully qualifying him for a task – here, to be the Redeemer and high priest of suffering people. Expect this question."
  - "Fear of death (v. 15) can touch people who are ill, grieving or caring for a dying relative. Handle it gently: the verse is about being set free, not a rebuke for feeling afraid."
  - "Point ahead: next week chapter 3 – Jesus greater than Moses, and the call “Today, if you hear his voice”."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
