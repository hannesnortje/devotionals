session: 9
lang: en
title: "Through His Own Blood"
ref: "9:1-9:28"
days: [16, 17, 18]
big_idea: "The earthly tent showed that the way into God's presence was not yet open; Christ entered the sanctuary once for all through his own blood, cleanses our conscience from dead works so that we may worship the living God, appears now before God for us and will appear a second time for salvation."
opening: "Think of a place you were not allowed into as a child – a staff room, a workshop, your parents' study. What did that closed door say to you?"
context: >-
  At the end of chapter 8 God declared the first covenant old. Now the author takes us on a reverent tour of the wilderness tent of Moses: two compartments, a heavy curtain, one high priest, once a year, never without blood.
  Then come two powerful words: “But Christ …”. Chapter 9 shows what his own blood achieves that no animal sacrifice could, why a death was necessary – the covenant also works like a will – and how Christ appears for us in the past, the present and the future.
read_aloud_tip: "Three readers: verses 1–10 (the earthly tent – read slowly, like a guided tour), verses 11–14 (Christ's own blood – stress the word “But” at the start), verses 15–28 (the will, the blood and the three appearings)."
hebrew:
  - word: "syneidēsis"
    hebrew: "συνείδησις"
    gloss: "conscience"
    point: "Literally knowing together with oneself: our inner moral awareness that we stand guilty before a holy God. Gifts and sacrifices could not make the worshipper perfect with respect to conscience (9:9); the blood of Christ will cleanse our conscience from dead works (9:14)."
  - word: "lytrōsis"
    hebrew: "λύτρωσις"
    gloss: "redemption"
    point: "Buying the freedom of a slave or prisoner of war by paying a costly ransom. The Old Testament knew only a yearly atonement; Christ entered once for all (ephapax) and obtained eternal redemption, whose value never expires (9:12)."
  - word: "diathēkē"
    hebrew: "διαθήκη"
    gloss: "covenant / will"
    point: "The same Greek word means both covenant and last will and testament. Our translation renders it “will” in 9:16–17 and “covenant” elsewhere, so that the change of meaning can be seen: a will takes effect only when the one who made it has died – and Christ leaves us the promise of the eternal inheritance (9:15)."
discussion:
  - q: "Walk through the tent in verses 1–5. Inside the ark lay reminders of the people's grumbling, rebellion and broken law – and above it the atonement cover where the blood was sprinkled. What does that picture tell you about God?"
    ref: "9:1-9:5"
  - q: "“But into the second only the high priest goes, once a year, and not without blood.” According to verse 8, what was the Holy Spirit teaching through this design? Does your relationship with God sometimes still feel like standing before a closed curtain?"
    ref: "9:6-9:8"
  - q: "Gifts and sacrifices “cannot make the worshipper perfect with respect to conscience”; they cleanse only the outside. Which outward “washings” do we use today to quiet a guilty conscience – extra effort, good resolutions, days of self-reproach?"
    ref: "9:9-9:10"
  - q: "“How much more will the blood of Christ … cleanse our conscience from dead works to worship the living God!” Notice the order: cleansed so that we may serve, not serving so that we may be cleansed. What changes when you live in that order?"
    ref: "9:11-9:14"
  - q: "In verse 14 the whole Trinity is at work: the Son offered himself, through the eternal Spirit, to God. What does it mean to you that your salvation is the work of Father, Son and Spirit together?"
    ref: "9:14"
  - q: "“For a will takes effect only at death.” And verse 22: “without the shedding of blood there is no forgiveness”. Why did the Messiah have to die – could God not simply have declared us forgiven? What does it mean that no one can contest the inheritance Christ has left you?"
    ref: "9:15-9:22"
  - q: "Verses 24–28 speak of three appearings: once at the end of the ages to set aside sin (past), “now to appear in the presence of God on our behalf” (present), and a second time, apart from sin, for salvation (future). Which of the three do you need most this week, and why?"
    ref: "9:23-9:28"
application:
  - "When your conscience accuses you this week, don't do penance: name the sin before God, thank him for the blood of Christ (9:14) – and then do one act of service for someone, freely and gratefully."
  - "Begin each day this week by reminding yourself of verse 24: Christ is now in the presence of God on your behalf. Then bring your day to the Father with that confidence."
prayer: "Read verse 14 aloud together. Pray in short sentences: thank God for one thing in the tent that points to Christ, confess quietly any dead works you rely on, and thank Jesus that he appears for us now. Close with verse 28: thank him that he will appear a second time for salvation."
leader_notes:
  - "This session draws on three devotionals (days 16–18), and chapter 9 is long. Choose five questions. Don't get lost in the details of the furniture – the author himself says in 9:5: “Of these things we cannot now speak in detail.”"
  - "Someone may notice that in Exodus 30:6 the altar of incense stood in front of the curtain, while 9:4 says the Most Holy Place “had” it. The day 16 devotional explains: it belonged to the Most Holy Place in its function – its smoke was meant to fill it, and on the Day of Atonement the high priest carried the censer inside (Leviticus 16:12–13)."
  - "9:16–17 uses “will” and the rest of the chapter “covenant” – this is the same Greek word, rendered so on purpose (series decision). If the group's Bibles differ, explain the play on words rather than debating translations."
  - "Some find the talk of blood difficult or off-putting. The devotional explains it from Leviticus 17:11 (the life of the flesh is in the blood): sin is not a small mistake, and forgiveness requires that a substitute life be laid down. Give people space to ask honest questions."
  - "Verse 27 (to die once, and after that judgment) can hit hard for someone who is grieving or anxious about death. The devotional never leaves verse 27 on its own: verse 28 follows immediately – “just as … so Christ also”. For those in Christ the future is joyful expectation."
  - "Point ahead: next week chapter 10 – one sacrifice for all time, the new and living way, and a serious warning (10:26–31) followed by “do not throw away your confidence”."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
