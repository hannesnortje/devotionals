session: 11
lang: en
title: "By Faith"
ref: "11:1-11:40"
days: [22, 23, 24]
big_idea: "Faith treats God's promises as a title deed in our hand: it makes us pilgrims on the way to the city whose builder is God, it values the reproach of the Christ above the treasures of Egypt, and it holds on – whether God delivers us or carries us through suffering."
opening: "Have you ever paid for something long before you could enjoy it – a ticket, a plot of land, a holiday? What did it feel like to hold the proof in your hand while you were still waiting?"
context: >-
  At the end of chapter 10 the author reminded his tired, persecuted readers that they are not of those who draw back, but of those who have faith.
  Now he opens a gallery of witnesses from their own Scriptures – from Abel, Enoch and Noah, through Abraham and the patriarchs, to Moses, Rahab and nameless martyrs.
  None of them lived by what their eyes could see; all of them lived by God's promises. Tonight we read the whole of chapter 11.
read_aloud_tip: "Use four readers: verses 1–7 (faith and the first witnesses), 8–22 (Abraham to Joseph), 23–31 (Moses to Rahab), 32–40 (the heroes and the nameless). Let the whole group say the words “By faith” together each time they come."
hebrew:
  - word: "hypostasis"
    hebrew: "ὑπόστασις"
    gloss: "assurance"
    point: "We met this word in 1:3 (“being”) and 3:14 (“assurance”). In some Greek papyri of the first centuries it is used for documents that prove ownership – a kind of title deed. Faith holds the title deed of God's promises before we have moved in (11:1)."
  - word: "aspazomai"
    hebrew: "ἀσπάζομαι"
    gloss: "greeted"
    point: "To welcome something with joy, to embrace it with open arms – like sailors who see the hills of home on the horizon and cheer, though they are still miles from the harbour. The patriarchs died without the fulfilment, but they saw the promises from afar and greeted them (11:13)."
  - word: "kartereō"
    hebrew: "καρτερέω"
    gloss: "held on"
    point: "Like a soldier who stays standing, strong and unshaken. This is the secret of Moses' staying power: when you see the invisible King with the eye of faith, the fury of an earthly pharaoh shrinks to nothing (11:27)."
discussion:
  - q: "“Now faith is the assurance of what is hoped for, the proof of things that are not seen.” The devotional compares this assurance to a title deed. What is the difference between treating a promise of God as a title deed and treating it as a wish?"
    ref: "11:1-11:3"
  - q: "Abel shows the worship of faith, Enoch its daily walk, Noah its work and perseverance. Verse 6 says that whoever approaches God must believe that he exists and that he “rewards those who earnestly seek him”. How does that picture of God change the way you pray?"
    ref: "11:4-11:7"
  - q: "Abraham “went out, not knowing where he was going”. When have you had to take a step of obedience without seeing the whole map? What helped you take it?"
    ref: "11:8-11:12"
  - q: "The patriarchs confessed that they were “strangers and temporary residents on the earth”. Where do we drive our tent pegs too deep into this world? And what does it mean to you that “God is not ashamed of them, to be called their God”?"
    ref: "11:13-11:16"
  - q: "On Moriah Abraham “reckoned that God is able even to raise from the dead”. What is the “Isaac” in your life – a good gift from God that you may be clinging to more tightly than to the Giver?"
    ref: "11:17-11:22"
  - q: "Moses “considered the reproach of the Christ greater wealth than the treasures of Egypt”. What are today's treasures of Egypt, and what helps us see through “the fleeting enjoyment of sin”?"
    ref: "11:23-11:28"
  - q: "In verses 33–35 some shut the mouths of lions; then the text turns: “Others were tortured and refused to accept release”. Both groups stand in the same list, and of the suffering ones it says “the world was not worthy of them”. How can this help someone in a long, hard season?"
    ref: "11:32-11:40"
application:
  - "Write down one promise of God you are holding on to without yet seeing it fulfilled. Read it every morning this week as a title deed, and thank God for it before you see anything change."
  - "Name one tent peg that holds you too tightly to this world – a possession, an ambition or a worry – and do one concrete thing this week to loosen it: give something away, share, or hand it over to God in prayer."
prayer: "Begin by reading verse 1 aloud together. Thank God for the people of faith who went before you, in the Bible and in your own life. Then pray for anyone in the group who is in an “Others” season – waiting, suffering or not yet seeing an answer – and ask that all of you may hold on as those who see the invisible One."
leader_notes:
  - "This session covers three devotionals (days 22–24) and 40 verses. Don't try to discuss every name; the four reading parts give the structure, and four or five questions are enough."
  - "11:11: our translation follows the Greek base text, in which Abraham is the subject (“together with Sarah herself”); many older Bibles make Sarah the subject. If someone notices the difference, explain it briefly – verse 12 also speaks of “one man” – and point out that Sarah is still included. Don't let it become the topic of the evening."
  - "The most sensitive point is verses 35–38. Some people believe that great faith always brings healing or rescue. The day 24 devotional says that those who suffered did not have less faith than those who saw miracles. Handle this gently with anyone who is ill, grieving or has prayed long without an answer, and don't promise outcomes."
  - "Abel's sacrifice: the devotional explains God's acceptance by the faith of Abel's heart. Genesis says little about the reason, so don't spend long on speculation about the offerings."
  - "Verses 39–40 prepare for next week: the witnesses of chapter 11 are made perfect together with us. Point ahead: chapter 12 – the race, the Father's discipline and the two mountains, Sinai and Zion."
timing:
  welcome: 10
  read: 15
  context: 5
  discussion: 40
  prayer: 15
