session: 10
lang: en
title: "The New and Living Way"
ref: "10:1-10:39"
days: [19, 20, 21]
big_idea: "By one offering Christ has made perfect for all time those who are made holy; so let us approach God, hold fast to our hope and consider one another – and not throw away our confidence, for the one who is coming will come."
opening: "Think of something you had to repeat again and again – a medicine, a repair, a chore. How do you know when a problem has been fixed for good?"
context: >-
  Chapter 10 brings the great teaching on Christ as high priest to its closing chord: the yearly sacrifices only reminded people of their sins, but Christ's one offering has done what they never could (10:1–18).
  Then, at 10:19, the letter turns from what Christ has done to how we are to live: three times “let us”. A fourth serious warning follows (10:26–31), and then warm encouragement that leads into the great faith chapter, Hebrews 11.
read_aloud_tip: "Three readers: verses 1–18 (one sacrifice – read the Psalm in verses 5–7 as the voice of the Son), verses 19–25 (one long sentence in the Greek – listen for the three “let us”), verses 26–39 (warning and encouragement – pause briefly after verse 31)."
hebrew:
  - word: "teteleiōken … tous hagiazomenous"
    hebrew: "τετελείωκεν … τοὺς ἁγιαζομένους"
    gloss: "he has made perfect … those who are made holy"
    point: "Two tenses side by side in 10:14: a perfect tense – our standing before God is already settled – and a present participle – we are being made holy day by day. Already perfect in God's eyes, and still growing."
  - word: "prosphatos"
    hebrew: "πρόσφατος"
    gloss: "new"
    point: "Originally fresh, recently made. The way Jesus inaugurated through the curtain (10:20) always stays fresh: his sacrifice is as powerful before God today as on the day of the cross – and because he is risen, it is a living way."
  - word: "parrēsia"
    hebrew: "παρρησία"
    gloss: "confidence"
    point: "A free, unhindered right of access: we have confidence to enter the sanctuary by the blood of Jesus (10:19). In 10:35 the same word returns: don't throw it away – like a soldier who throws away his shield and flees."
discussion:
  - q: "If a medicine really cures, you stop taking it. “In these sacrifices there is a reminder of sins year after year” – but verse 18 says: “Where there is forgiveness of these, there is no longer any offering for sin.” Where do we set up little side altars next to the cross – punishing ourselves or doing penance before we accept forgiveness?"
    ref: "10:1-10:4"
  - q: "“See, I have come to do your will.” God was looking not for mere rituals but for a body willing to do his will. What would it look like to put your everyday body – your time, your work, your family life – at his disposal this week?"
    ref: "10:5-10:10"
  - q: "Every priest stands day after day; this one offered one sacrifice and took his seat. “For by one offering he has made perfect for all time those who are made holy.” How does this verse help when you are discouraged by how slowly you change?"
    ref: "10:11-10:18"
  - q: "Verses 19–23 rest on two possessions – the open way and a great priest – and call us to approach and to hold fast, “for the one who made the promise is faithful”. Why does it matter that our holding on rests on his faithfulness rather than on the strength of our grip?"
    ref: "10:19-10:23"
  - q: "“And let us consider one another, so as to spur one another on to love and good works.” The same verb is used in 3:1 for considering Jesus. What would it look like for us as a group to consider one another in this way – and who among us needs encouraging right now?"
    ref: "10:24-10:25"
  - q: "Verses 26–31 are among the most serious words in the letter: “To fall into the hands of the living God is a fearful thing.” Yet straight after them the author writes: “But remember the earlier days”. Why do warning and encouragement belong together here?"
    ref: "10:26-10:31"
  - q: "The readers had once accepted the loss of their possessions with joy, knowing they had a better possession, one that lasts. “So do not throw away your confidence, which has a great reward.” Which earlier struggle, through which God carried you, gives you courage for the present one?"
    ref: "10:32-10:39"
application:
  - "Name one side altar in your life – a way you try to pay for your own failures – and each time you notice it this week, read verse 18 and receive forgiveness instead."
  - "Consider one person this week – perhaps someone who has been missing from your meetings – and spur them on with a visit, a call or a message of encouragement."
prayer: "Begin by reading verses 22–24 aloud together. Then pray in three movements: approach God with thanks for the open way through Jesus' blood; hold fast – bring to God the places where your hope is under pressure; consider one another – pray by name for one person in the group. Close together with verse 39."
leader_notes:
  - "This session draws on three devotionals (days 19–21), and chapter 10 has 39 verses. If time is short, read verses 1–18 in one go and spend more time on verses 19–39. Choose five questions."
  - "In 10:5 our text reads “but a body you have prepared for me”, as Hebrews quotes Psalm 40 from the Greek. The Hebrew of Psalm 40:6 says, literally, ears you have dug for me. If the group's Bibles differ, that is the reason; the devotional suggests the part (the ears) may stand for the whole (the body)."
  - "10:26–31 and different convictions: Christians in your group may understand these verses differently, especially on the question whether a true believer can finally fall away. Let people speak and listen respectfully; you don't need to settle the debate. Keep to what the day 21 devotional says: the warning concerns apostasy – deliberately and persistently turning one's back on Christ after receiving the knowledge of the truth – not a believer who stumbles through weakness and returns in repentance (4:15–16). Whoever rejects the one sacrifice has no other left."
  - "Tender consciences: some will fear they have committed this sin. The devotionals answer that for the believer who takes refuge in Christ, the hands of the living God are the safest place (John 10:28–29), and (day 11, on 6:4–6) that a tender heart that grieves over sin and longs for Jesus is itself proof of not being in that hardened state. Say this clearly, and offer to talk afterwards."
  - "Two smaller points to handle with care: the devotional reads “our bodies washed with pure water” (10:22) as pointing to baptism – groups may hold different views on baptism, so don't let it become a debate. And verse 25 is about encouraging, not policing: some miss meetings because of illness, shift work or caring for others."
  - "Point ahead: verse 39 builds the bridge to chapter 11 – next week the nature of faith and the great witnesses of the past."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
