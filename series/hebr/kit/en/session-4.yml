session: 4
lang: en
title: "The Promise of Rest"
ref: "4:1-4:16"
days: [8, 9]
big_idea: "A Sabbath rest remains for the people of God: we enter it by faith, not by our own works, under the living word that lays our hearts bare – and we can approach the throne of grace with confidence, because our great high priest sympathizes with our weaknesses."
opening: "What does real rest look like for you – not just sleep, but the kind that leaves you truly refreshed? When did you last have it?"
context: >-
  Chapter 3 ended with the wilderness generation that could not enter because of unbelief. Now the author brings the warning into the present: the promise of entering God's rest still stands.
  He links three Old Testament crossroads – God's rest on the seventh day, Joshua and Canaan, and the “Today” of Psalm 95 (vv. 1–11) –
  then shows the living word that judges the heart (vv. 12–13), and the great high priest who opens the way to the throne of grace (vv. 14–16).
read_aloud_tip: "Two readers take turns with the paragraphs of verses 1–11; one reader reads verses 12–13 slowly; then the whole group reads verses 14–16 together."
hebrew:
  - word: "sabbatismos"
    hebrew: "σαββατισμός"
    gloss: "Sabbath rest"
    point: "Throughout chapters 3–4 the author uses katapausis (rest, a place of rest, such as Canaan). In 4:9 he uses this very rare word for a true, festive Sabbath rest – Hebrews is the earliest known place it occurs, and the author may have coined it. Joshua (in Greek Iēsous, the same name as Jesus) could give only an earthly shadow-rest; the true Jesus brings us into God's own rest."
  - word: "tetrachēlismena"
    hebrew: "τετραχηλισμένα"
    gloss: "laid bare"
    point: "From trachēlos, neck or throat. In ancient wrestling the verb described a hold that bent the opponent's head back so that he could not look away; some also see an echo of the sacrificial animal inspected by the priest. Before God's eyes all things are “naked and laid bare” (4:13)."
  - word: "sympatheō"
    hebrew: "συμπαθέω"
    gloss: "sympathize"
    point: "Far stronger than our word sympathy: literally to suffer with someone from the inside. Jesus “has been tested in every respect in the same way – yet without sin”. Because he never gave in, he felt the full force of temptation (4:15)."
discussion:
  - q: "“The word they heard did not benefit them, because they were not united by faith with those who truly heard.” The devotional compares this to a meal that is eaten but never digested. How can we hear God's word without it changing us?"
    ref: "4:1-4:2"
  - q: "Joshua brought Israel into a land, but not into God's final rest; “a Sabbath rest remains for the people of God”. What is this rest – and in which area of your life are you still on a spiritual treadmill, working for God's approval instead of living from it?"
    ref: "4:3-4:10"
  - q: "“Let us therefore make every effort to enter that rest.” How can it take effort to rest? What does the fight of faith look like for you?"
    ref: "4:11"
  - q: "The word of God is “living and effective and sharper than any double-edged sword”. When has a passage of Scripture cut through your excuses? How do you respond when it touches a sore or hidden place?"
    ref: "4:12"
  - q: "“All things are naked and laid bare to the eyes of the one to whom we must give account.” Is that frightening or freeing for you – and why do you think the author follows it immediately with verse 14?"
    ref: "4:13-4:14"
  - q: "“We do not have a high priest who is unable to sympathize with our weaknesses.” Some think that because Jesus never sinned, he cannot really know how hard temptation is. Why does the devotional say the opposite is true?"
    ref: "4:15"
  - q: "“Let us therefore approach the throne of grace with confidence.” When you have failed, do you picture God's throne as a judge's bench to hide from or as a throne of grace to run to? What do you need today – mercy for the past, or grace for the present?"
    ref: "4:16"
application:
  - "Choose one area where you are restlessly trying to carry the outcome in your own strength. Each day this week, hand it over to the Lord on purpose and rest in Christ's finished work."
  - "When you fail or are tempted this week, don't wait until you have cleaned yourself up: go straight to the throne of grace with a short, honest prayer for mercy and grace."
prayer: "Read verse 16 aloud together. Then keep a moment of silence before the living word, and let each person ask the Lord what he wants to lay bare. Pray in pairs for mercy and for help at the right time, and close by praying verse 16 over one another."
leader_notes:
  - "Two devotionals (days 8 and 9). Day 9 runs on to 5:10; tonight use only its part on 4:14–16 – the rest of it belongs to next week's session on chapter 5."
  - "4:2 has two readings in the manuscripts. Our translation reads that they were not united by faith with those who truly heard (Joshua and Caleb); older translations say that the word was not mixed with faith in those who heard it. Both come to the same point: hearing without faith does no good."
  - "Rest is not laziness or passivity (day 8): we stop working for God's approval and start living from his finished approval in Christ. People with a strong sense of duty may push back; let the effort of verse 11 and the rest of verse 10 stand side by side."
  - "Verses 12–13 can feel heavy for sensitive consciences. The devotional's picture is a loving surgeon, not an enemy. End the discussion with verses 14–16, so that no one goes home with verse 13 alone."
  - "Verse 15 may raise speculative questions about Jesus' temptations. Keep to the text's point: he was really tested in every respect and never gave in, and so he truly sympathizes with us."
  - "Point ahead: next week chapter 5 – Jesus, high priest according to the order of Melchizedek, and the call to move from milk to solid food."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
