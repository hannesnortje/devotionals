session: 7
lang: en
title: "A Priest for Ever"
ref: "7:1-7:28"
days: [13, 14]
big_idea: "Melchizedek, without genealogy and greater than Abraham, points to Jesus: a priest not by descent but by the power of an indestructible life and by God's oath, who always lives to intercede for us and who offered himself once for all."
opening: "Have you ever had to start again with a new doctor, teacher or adviser because the old one left? What was lost?"
context: >-
  At the end of chapter 6 Jesus entered behind the curtain as our forerunner, high priest for ever according to the order of Melchizedek.
  Now the author finally opens the subject he has been circling since 5:6–10. For Jewish believers it raised a fair question: how can Jesus be a priest if he came from the tribe of Judah and not from Levi?
  The author answers from the only two places in the Old Testament where Melchizedek appears: Genesis 14:18–20 and Psalm 110:4.
read_aloud_tip: "First let someone read Genesis 14:18–20. Then read Hebrews 7 in three parts: verses 1–10 (Melchizedek and Abraham), verses 11–22 (another priest and a sworn oath), verses 23–28 (a priest who always lives – read verse 25 slowly)."
hebrew:
  - word: "agenealogētos"
    hebrew: "ἀγενεαλόγητος"
    gloss: "without genealogy"
    point: "Genesis introduces almost every important figure with ancestors, birth and death – but not Melchizedek. He is not an angel or an appearance of Christ; the author reads the silence of Scripture: in the text Melchizedek is “made like the Son of God”, a portrait painted in advance of the Original (7:3)."
  - word: "engyos"
    hebrew: "ἔγγυος"
    gloss: "guarantor"
    point: "Found only here in the New Testament (7:22). A mediator negotiates between two parties; a guarantor puts his own life, property and honour at stake that the terms will be kept – if we fail, the guarantor pays. Jesus was appointed with God's sworn oath, and so he guarantees a better covenant."
  - word: "eis to panteles"
    hebrew: "εἰς τὸ παντελές"
    gloss: "completely"
    point: "The phrase has a double shade: completely, to the deepest corner of our brokenness, and for all time, to the very end. He can save like this “since he always lives to intercede for them” (7:25)."
discussion:
  - q: "Melchizedek is first “king of righteousness” and then “king of peace”. Why does the order matter? Where do we look for peace without letting righteousness touch the matter?"
    ref: "7:1-7:2"
  - q: "Genesis is silent about Melchizedek's parents, birth and death, and the author sees in that silence a portrait of the Son of God. How does it free us that Jesus' priesthood – and his blessing – do not depend on pedigree, background or a spiritual CV?"
    ref: "7:3"
  - q: "“See how great he is.” Abraham gave a tenth of the best of the spoils – centuries before the law, out of gratitude. What would it mean for you to give Jesus the best part of your time and your heart rather than the leftovers?"
    ref: "7:4-7:10"
  - q: "Verse 19 says “the law made nothing perfect”, but “a better hope is brought in, through which we draw near to God”. Where are you tempted to rely on a list of rules instead of drawing near?"
    ref: "7:11-7:19"
  - q: "Jesus became a priest “according to the power of an indestructible life” and with a sworn oath. What does his resurrection – and God's oath – have to do with your confidence before God?"
    ref: "7:16-7:22"
  - q: "The former priests were many “because they were prevented by death from continuing in office”, but Jesus “holds his priesthood permanently”. What does it mean for you that your high priest never retires and never has to be replaced?"
    ref: "7:23-7:24"
  - q: "“He is able to save completely those who approach God through him, since he always lives to intercede for them.” Is there a part of your life you secretly think is beyond his reach? What does verse 25 say to it?"
    ref: "7:25-7:28"
application:
  - "Each morning this week, remind yourself that Jesus is interceding for you today, and bring him one thing you fear you cannot manage."
  - "When old guilt comes back this week, remember that he did it “once for all when he offered up himself” – and refuse to add your own self-punishment to his sacrifice."
prayer: "Read verses 24–25 aloud together. Then pray in pairs: thank Jesus that he is your guarantor and that he is praying for you now, and name before him one area you think is beyond his reach. Close with thanks for his once-for-all sacrifice (v. 27)."
leader_notes:
  - "This session covers two devotionals: day 13 (7:1–10) and day 14 (7:11–28). Chapter 7 is a sustained argument; reading Genesis 14:18–20 first helps the group know the story the author builds on."
  - "Verse 3 often raises the question whether Melchizedek was an angel or Christ himself before the incarnation. The day 13 devotional says no: he was a historical king of Salem, and the point lies in the silence of Genesis about his origins. Answer briefly and move on."
  - "Verses 9–10 (Levi still in his ancestor's body) can sound strange to modern ears. Explain briefly with day 13: the father of the whole nation acknowledged a greater priesthood, and through him Levi himself, as it were, bowed before it."
  - "The tenth (vv. 4–10) can turn into a sensitive conversation about money. Day 13's point is Abraham's free, grateful giving of the best part – before any law – applied to time, gifts, attention and means. Don't let the evening become a discussion of church finances, and don't put anyone under pressure."
  - "Some in the group may struggle with assurance or lingering guilt. Let verses 22, 25 and 27 do the work: with day 14, our perseverance does not rest on the strength of our grip but on Jesus as guarantor and intercessor, and nothing can be added to his sacrifice."
  - "Point ahead: next week chapter 8 – the true tent and a better covenant."
timing:
  welcome: 10
  read: 10
  context: 10
  discussion: 40
  prayer: 15
