session: 9
lang: de
title: "Durch sein eigenes Blut"
ref: "9:1-9:28"
days: [16, 17, 18]
big_idea: "Das irdische Zelt zeigte, dass der Weg in Gottes Gegenwart noch nicht offen war; Christus ist durch sein eigenes Blut ein für alle Mal in das Heiligtum hineingegangen, reinigt unser Gewissen von toten Werken, damit wir dem lebendigen Gott dienen, erscheint jetzt vor Gott für uns und wird zum zweiten Mal erscheinen zur Rettung."
opening: "Denk an einen Raum, in den du als Kind nicht hineindurftest – ein Lehrerzimmer, eine Werkstatt, das Arbeitszimmer deiner Eltern. Was hat dir diese geschlossene Tür gesagt?"
context: >-
  Am Ende von Kapitel 8 hat Gott den ersten Bund für alt erklärt. Jetzt führt uns der Verfasser ehrfürchtig durch das Wüstenzelt des Mose: zwei Räume, ein schwerer Vorhang, ein Hoherpriester, einmal im Jahr, nie ohne Blut.
  Dann kommen zwei gewaltige Worte: „Christus aber …“. Kapitel 9 zeigt, was sein eigenes Blut bewirkt, was kein Tieropfer konnte, warum ein Tod nötig war – der Bund wirkt auch wie ein Testament – und wie Christus für uns erscheint: in der Vergangenheit, in der Gegenwart und in der Zukunft.
read_aloud_tip: "Drei Leser: Verse 1–10 (das irdische Zelt – langsam lesen, wie bei einer Führung), Verse 11–14 (Christi eigenes Blut – das „aber“ am Anfang betonen), Verse 15–28 (das Testament, das Blut und das dreifache Erscheinen)."
hebrew:
  - word: "syneidēsis"
    hebrew: "συνείδησις"
    gloss: "Gewissen"
    point: "Wörtlich das Mitwissen mit sich selbst: unser inneres sittliches Bewusstsein, dass wir vor einem heiligen Gott schuldig sind. Gaben und Opfer konnten den, der Gott dient, im Gewissen nicht zur Vollendung bringen (9,9); das Blut Christi wird unser Gewissen von toten Werken reinigen (9,14)."
  - word: "lytrōsis"
    hebrew: "λύτρωσις"
    gloss: "Erlösung"
    point: "Der Freikauf eines Sklaven oder Kriegsgefangenen durch ein teures Lösegeld. Das Alte Testament kannte nur eine jährliche Sühne; Christus ist ein für alle Mal (ephapax) hineingegangen und hat eine ewige Erlösung erlangt, deren Wert nie verfällt (9,12)."
  - word: "diathēkē"
    hebrew: "διαθήκη"
    gloss: "Bund / Testament"
    point: "Dasselbe griechische Wort bedeutet Bund und Testament. Unsere Übersetzung sagt in 9,16–17 „Testament“ und sonst „Bund“, damit das Wortspiel sichtbar wird: Ein Testament wird erst gültig, wenn der gestorben ist, der es gemacht hat – und Christus hinterlässt uns die Verheißung des ewigen Erbes (9,15)."
discussion:
  - q: "Geht in den Versen 1–5 durch das Zelt. In der Lade lagen Erinnerungen an das Murren, die Auflehnung und das gebrochene Gesetz des Volkes – und darüber der Sühnedeckel, auf den das Blut gesprengt wurde. Was sagt dir dieses Bild über Gott?"
    ref: "9:1-9:5"
  - q: "„In das zweite aber geht nur der Hohepriester, einmal im Jahr, und nicht ohne Blut.“ Was hat der Heilige Geist nach Vers 8 durch diese Bauweise gelehrt? Fühlt sich deine Beziehung zu Gott manchmal noch an, als stündest du vor einem geschlossenen Vorhang?"
    ref: "9:6-9:8"
  - q: "Gaben und Opfer können „den, der Gott dient, im Gewissen nicht zur Vollendung bringen“; sie reinigen nur das Äußere. Mit welchen äußeren „Waschungen“ versuchen wir heute, ein schlechtes Gewissen zu beruhigen – mit mehr Einsatz, guten Vorsätzen, tagelangen Selbstvorwürfen?"
    ref: "9:9-9:10"
  - q: "„Wie viel mehr wird das Blut Christi … unser Gewissen von toten Werken reinigen, damit wir dem lebendigen Gott dienen!“ Achte auf die Reihenfolge: gereinigt, damit wir dienen – nicht dienen, damit wir gereinigt werden. Was ändert sich, wenn du in dieser Reihenfolge lebst?"
    ref: "9:11-9:14"
  - q: "In Vers 14 wirkt die ganze Dreieinigkeit: Der Sohn hat sich selbst durch den ewigen Geist Gott dargebracht. Was bedeutet es dir, dass deine Rettung das gemeinsame Werk von Vater, Sohn und Geist ist?"
    ref: "9:14"
  - q: "„Denn ein Testament wird erst mit dem Tod gültig.“ Und Vers 22: „ohne Blutvergießen gibt es keine Vergebung“. Warum musste der Messias sterben – hätte Gott uns nicht einfach für vergeben erklären können? Was bedeutet es, dass niemand das Erbe anfechten kann, das Christus dir hinterlassen hat?"
    ref: "9:15-9:22"
  - q: "Die Verse 24–28 sprechen von einem dreifachen Erscheinen: einmal bei der Vollendung der Zeitalter, um die Sünde aufzuheben (Vergangenheit), „um jetzt vor dem Angesicht Gottes für uns zu erscheinen“ (Gegenwart), und zum zweiten Mal, ohne Sünde, zur Rettung (Zukunft). Welches der drei brauchst du diese Woche am meisten, und warum?"
    ref: "9:23-9:28"
application:
  - "Wenn dein Gewissen dich diese Woche anklagt, tu keine Buße aus eigener Kraft: Nenne die Sünde vor Gott, danke ihm für das Blut Christi (9,14) – und tu dann jemandem einen Dienst, frei und dankbar."
  - "Beginne diese Woche jeden Tag mit Vers 24: Christus ist jetzt vor dem Angesicht Gottes für dich da. Bring dann deinen Tag mit dieser Zuversicht zum Vater."
prayer: "Lest Vers 14 gemeinsam laut. Betet in kurzen Sätzen: Dankt Gott für etwas im Zelt, das auf Christus hinweist, bekennt still die toten Werke, auf die ihr euch verlasst, und dankt Jesus, dass er jetzt für uns erscheint. Schließt mit Vers 28: Dankt ihm, dass er zum zweiten Mal erscheinen wird zur Rettung."
leader_notes:
  - "Dieses Treffen stützt sich auf drei Andachten (Tag 16–18), und Kapitel 9 ist lang. Wähle fünf Fragen. Verliert euch nicht in den Einzelheiten der Einrichtung – der Verfasser sagt selbst in 9,5: „Darüber ist jetzt nicht im Einzelnen zu reden.“"
  - "Vielleicht fällt jemandem auf, dass der Räucheraltar nach 2. Mose 30,6 vor dem Vorhang stand, während es in 9,4 heißt, das Allerheiligste „hatte“ ihn. Die Andacht von Tag 16 erklärt: Er gehörte seiner Funktion nach zum Allerheiligsten – sein Rauch sollte es erfüllen, und am Versöhnungstag trug der Hohepriester das Räuchergefäß hinein (3. Mose 16,12–13)."
  - "In 9,16–17 steht „Testament“, sonst im Kapitel „Bund“ – es ist dasselbe griechische Wort, bewusst so übersetzt (Entscheidung der Reihe). Wenn die Bibeln in der Gruppe sich unterscheiden, erkläre das Wortspiel, statt über Übersetzungen zu streiten."
  - "Manche tun sich mit dem Reden vom Blut schwer oder finden es abstoßend. Die Andacht erklärt es von 3. Mose 17,11 her (das Leben des Fleisches ist im Blut): Sünde ist kein kleiner Fehler, und Vergebung erfordert, dass ein stellvertretendes Leben hingegeben wird. Gib Raum für ehrliche Fragen."
  - "Vers 27 (einmal zu sterben, danach das Gericht) kann jemanden hart treffen, der trauert oder Angst vor dem Tod hat. Die Andacht lässt Vers 27 nie allein stehen: Vers 28 folgt sofort – „wie … so wird auch Christus“. Für die, die in Christus sind, ist die Zukunft frohe Erwartung."
  - "Ausblick: Nächste Woche Kapitel 10 – ein einziges Opfer für immer, der neue und lebendige Weg und eine ernste Warnung (10,26–31), auf die „Werft also eure Zuversicht nicht weg“ folgt."
