session: 8
lang: de
title: "Schatten und Wirklichkeit"
ref: "8:1-8:13"
days: [15]
big_idea: "Wir haben einen Hohenpriester, der sich im wahren Zelt gesetzt hat und Mittler eines besseren Bundes ist, dessen Verheißungen auf Gottes eigenem „Ich werde“ ruhen: Er schreibt seine Gesetze in unsere Herzen und denkt nie mehr an unsere Sünden."
opening: "Hast du schon einmal ein Architekturmodell oder eine Skizze von einem Haus gesehen, bevor es gebaut wurde? Wie war das echte Gebäude im Vergleich dazu?"
context: >-
  In Kapitel 7 hat der Verfasser gezeigt, dass die Person unseres Hohenpriesters nach der Ordnung Melchisedeks weit über den levitischen Priestern steht.
  Jetzt wendet sich Kapitel 8 seinem Dienst zu: ein besseres Heiligtum und ein besserer Bund. Für die ersten Leser, die vom Tempel in Jerusalem abgeschnitten waren und vielleicht verspottet wurden, weil sie keinen Tempel, keinen Priester und keinen Altar hatten, war das eine brennende Frage.
  Der Verfasser antwortet mit dem längsten alttestamentlichen Zitat im Neuen Testament, Jeremia 31,31–34, so zitiert, wie es die griechische Übersetzung hat.
read_aloud_tip: "Zwei Leser: Einer liest die Verse 1–7 und Vers 13; der andere liest das Jeremia-Zitat in den Versen 8–12 als Stimme des Herrn – langsam, mit einer kurzen Pause nach jedem „Ich werde“."
hebrew:
  - word: "kephalaion"
    hebrew: "κεφάλαιον"
    gloss: "die Hauptsache"
    point: "Nicht bloß eine Zusammenfassung, sondern der Kernpunkt des ganzen Arguments (8,1). Und der Kern ist ein Hoherpriester, der sitzt: Die irdischen Priester mussten täglich stehen, weil ihre Arbeit nie fertig war (vgl. 10,11); unserer hat sich gesetzt."
  - word: "hypodeigma kai skia"
    hebrew: "ὑπόδειγμα καὶ σκιά"
    gloss: "Abbild und Schatten"
    point: "Ein hypodeigma ist eine Kopie oder Skizze; Mose musste nach dem typos bauen, dem Vorbild oder Bauplan, der ihm auf dem Berg gezeigt wurde (8,5). Wie ein Schatten auf dem Boden oder ein maßstabsgetreues Modell war der Zeltgottesdienst gut und von Gott gegeben, aber er wies auf eine größere Wirklichkeit hin: den Dienst Christi im Himmel."
  - word: "diathēkē kainē"
    hebrew: "διαθήκη καινή"
    gloss: "ein neuer Bund"
    point: "Kainos unterscheidet man oft von neos: nicht nur zeitlich neu, sondern der Art nach neu (die Unterscheidung ist nicht streng – in 12,24 sagt der Hebräerbrief auch nea). Seine Verheißungen sind besser, weil Gott nicht mehr sagt: „Wenn ihr …“, sondern: „Ich werde!“ (8,8–12)."
discussion:
  - q: "Die Hauptsache ist: „Wir haben einen solchen Hohenpriester, der sich zur Rechten des Thrones der Majestät in den Himmeln gesetzt hat.“ Warum macht der Verfasser ausgerechnet einen sitzenden Priester zum Kern seines ganzen Arguments?"
    ref: "8:1-8:2"
  - q: "Die irdischen Priester dienen „einem Abbild und Schatten des Himmlischen“. Die ersten Leser hatten den sichtbaren Tempel verloren. An welchen sichtbaren Dingen – Formen, Ritualen, Anerkennung von Menschen – halten wir uns fest, um uns geistlich sicher zu fühlen?"
    ref: "8:3-8:5"
  - q: "Wäre der erste Bund ohne Tadel gewesen, hätte es keinen zweiten gebraucht. Lies Vers 8: „Denn er tadelt sie, wenn er sagt“. Wo lag der Fehler – und was hat der alte Bund nicht gegeben?"
    ref: "8:6-8:9"
  - q: "„Ich lege meine Gesetze in ihr Denken, und ich schreibe sie auf ihre Herzen.“ Erlebst du Gottes Willen im Moment eher wie steinerne Tafeln – eine Last von außen – oder wie etwas, das der Geist in dich hineinschreibt? Was macht den Unterschied?"
    ref: "8:10"
  - q: "„Denn sie werden mich alle kennen, vom Kleinsten bis zum Größten unter ihnen.“ Im alten Bund waren einfache Leute auf Propheten, Priester und Könige angewiesen. Was bedeutet es für die Jüngsten und die Ältesten in unserer Gruppe, dass jeder den Herrn persönlich kennen kann?"
    ref: "8:11"
  - q: "Vers 12 beginnt mit „Denn“: Darauf ruht alles. „Denn ich werde gnädig sein gegenüber ihren Ungerechtigkeiten, und an ihre Sünden werde ich nie mehr denken.“ Das Griechische hat eine doppelte Verneinung – nie, nie mehr. Gibt es eine Sünde, die du längst bekannt hast und für die du dich trotzdem noch anklagst? Was würde sich ändern, wenn du diesem Vers glaubst?"
    ref: "8:12"
  - q: "„Was aber alt wird und veraltet, ist dem Verschwinden nahe.“ Wie können wir den ersten Bund als von Gott gegeben ehren und trotzdem nicht zu den Schatten zurückkehren?"
    ref: "8:13"
application:
  - "Bete diese Woche jeden Morgen Vers 10 für einen bestimmten Bereich deines Lebens, in dem du dich mit zusammengebissenen Zähnen antreibst: Bitte den Herrn, seinen Willen dort in dein Herz zu schreiben und dein Wollen von innen her zu verändern."
  - "Schreib eine alte, schon bekannte Sünde auf, die du immer wieder ausgräbst. Lies Vers 12 laut darüber, danke Gott, dass er sie nie mehr gegen dich verwenden wird – und zerreiß dann den Zettel."
prayer: "Lest die Verse 10–12 gemeinsam laut. Betet dann zu zweit oder zu dritt: Dankt Jesus, dass er sich als unser Hoherpriester im wahren Zelt gesetzt hat, bittet ihn, seine Gesetze in eure Herzen zu schreiben, und dankt dem Vater mit euren eigenen Worten für die Verheißung von Vers 12. Lasst einen Moment Stille, damit jeder sie persönlich annehmen kann."
leader_notes:
  - "Dieses Treffen stützt sich auf eine einzige Andacht (Tag 15) für das ganze Kapitel; so bleibt Zeit für das Jeremia-Zitat. Wähle fünf oder sechs Fragen; die Frage zu Vers 12 nicht auslassen."
  - "Der Hebräerbrief zitiert Jeremia nach dem Griechischen (Septuaginta). In 8,9 steht bei uns „und ich habe mich nicht mehr um sie gekümmert“, wo das Hebräische von Jeremia 31,32 sagt: obwohl ich ihr Ehemann (oder Herr) war. Wenn eine Bibel in der Gruppe anders liest, ist das der Grund – unsere Übersetzung folgt bewusst dem Griechischen des Hebräerbriefs."
  - "Die Andacht sagt klar: Der Fehler lag nicht bei Gott oder seinem heiligen Gesetz, sondern bei sündigen Menschen (8,8). Das Zelt wurde auf Gottes Anweisung gebaut (8,5). Achte darauf, dass der Abend nicht in Geringschätzung des Alten Testaments oder des jüdischen Volkes umschlägt."
  - "Vers 12 heißt nicht, dass der allwissende Gott an Gedächtnisverlust leidet; er verspricht, unsere bekannte Sünde nie mehr gegen uns zu verwenden und uns nicht nach unserer Vergangenheit zu behandeln. Für manche berührt die Frage zu Vers 12 tiefe Schuld – lass Stille zu und biete an, danach mit jemandem zu beten."
  - "Vers 13: Viele nehmen an, dass der Brief vor 70 n. Chr. geschrieben wurde, als der Tempel tatsächlich dem Verschwinden nahe war. Das ist interessanter Hintergrund, aber lass Datierungsfragen nicht das Gespräch bestimmen."
  - "Ausblick: Nächste Woche Kapitel 9 – ein Rundgang durch das irdische Zelt und dann „Christus aber …“: durch sein eigenes Blut."
