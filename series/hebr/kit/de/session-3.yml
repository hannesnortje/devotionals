session: 3
lang: de
title: "Heute"
ref: "3:1-3:19"
days: [6, 7]
big_idea: "Jesus, der Sohn über Gottes Haus, ist größer als Mose, der treue Diener darin – darum betrachten wir ihn genau, verhärten unsere Herzen nicht, wenn er heute spricht, und ermutigen einander jeden Tag, denn das Festhalten bis zum Ende zeigt, dass wir wirklich Teilhaber an Christus geworden sind."
opening: "Denk an etwas, das du immer wieder auf morgen verschoben hast – einen Anruf, eine Reparatur, ein Gespräch. Wie ist es am Ende ausgegangen?"
context: >-
  Nach den Propheten und den Engeln kommt der Verfasser nun zur größten Gestalt der Geschichte Israels: Mose.
  Er ehrt Mose als treu und zeigt dann, dass Jesus der Erbauer und der Sohn über das Haus ist (V. 1–6).
  Dann eröffnet er mit Psalm 95 den zweiten Warnabschnitt: Die Generation, die vierzig Jahre lang Gottes Werke sah, konnte wegen ihres Unglaubens doch nicht in seine Ruhe hineinkommen (V. 7–19).
read_aloud_tip: "Verse 1–6 liest eine Person; Psalm 95 (V. 7–11) eine zweite als Stimme des Heiligen Geistes; Verse 12–19 eine dritte. Sprecht das Wort „Heute“ jedes Mal gemeinsam mit (V. 7, 13, 15)."
hebrew:
  - word: "katanoēsate"
    hebrew: "κατανοήσατε"
    gloss: "betrachtet genau"
    point: "Nicht ein kurzer Blick, sondern die Gedanken tief auf etwas richten, es sorgfältig studieren und ihm auf den Grund gehen. Der Gegenstand ist Jesus in seinem doppelten Amt als Apostel und Hoherpriester – die einzige Stelle im Neuen Testament, an der er Apostel genannt wird (3,1)."
  - word: "therapōn"
    hebrew: "θεράπων"
    gloss: "Diener"
    point: "Nicht das gewöhnliche Wort für einen Sklaven (doulos), sondern ein ehrenvolles Wort für einen vertrauten Diener und Vertrauten seines Herrn (4. Mose 12,7). Mose war treu im Haus als Diener; Christus ist treu als Sohn über das Haus – der Erbe, dem das ganze Haus gehört (3,5–6)."
  - word: "sklērynō"
    hebrew: "σκληρύνω"
    gloss: "verhärten"
    point: "Davon kommt der medizinische Begriff Sklerose: Etwas Weiches und Lebendiges wird allmählich steif und gefühllos. Das geschieht durch den Betrug der Sünde (apatē), der nie mit einem Warnhinweis daherkommt (3,8.13.15)."
discussion:
  - q: "„Betrachtet genau den Apostel und Hohenpriester unseres Bekenntnisses, Jesus.“ Was bekommt an einem gewöhnlichen Tag deine tiefste Aufmerksamkeit – und wie sähe es aus, Jesus diese Woche genau zu betrachten?"
    ref: "3:1"
  - q: "Mose war treu als Diener im Haus, „Christus aber als Sohn über sein Haus“. Der Verfasser ehrt Mose und macht ihn nicht schlecht. Auf welche Diener im Haus – Leiter, Traditionen, Gemeinden – sind wir versucht, unsere Sicherheit zu bauen statt auf den Sohn?"
    ref: "3:2-3:6"
  - q: "„Sein Haus sind wir.“ Was bedeutet es für unsere Gruppe – und für dich persönlich –, dass Gottes Haus nicht mehr ein Gebäude aus Stein ist, sondern sein Volk?"
    ref: "3:6"
  - q: "Der Verfasser leitet Psalm 95 ein mit „wie der Heilige Geist sagt“ – in der Gegenwart. Gibt es einen Bereich, in dem der Geist zu deinem Gewissen spricht, während du immer wieder sagst: Nicht heute, Herr?"
    ref: "3:7-3:11"
  - q: "Die Generation des Auszugs sah vierzig Jahre lang Gottes Werke und irrte doch in ihrem Herzen. Wie geschieht Verhärtung allmählich – und wie wirkt der Betrug der Sünde ganz praktisch?"
    ref: "3:8-3:13"
  - q: "Gottes Gegenmittel ist gemeinschaftlich: „Ermutigt vielmehr einander jeden Tag.“ Wer hat die Freiheit, dir Gottes Wahrheit zu sagen – und wen könntest du diese Woche ermutigen?"
    ref: "3:13"
  - q: "„Denn wir sind Teilhaber an Christus geworden – wenn wir nur die Gewissheit, die wir am Anfang hatten, bis zum Ende unerschütterlich festhalten.“ Wie tröstet uns dieser Vers, und wie fordert er uns heraus?"
    ref: "3:14-3:19"
application:
  - "Nimm eine Sache, bei der du Gott immer wieder auf morgen vertröstet hast, und gehorche diese Woche – heute."
  - "Ermutige diese Woche jeden Tag einen Gläubigen – mit einer Nachricht, einem Anruf oder einem persönlichen Wort, das auf die Treue von Christus hinweist."
prayer: "Lest gemeinsam die Verse 7–8. Betet zu zweit: Bittet den Herrn um ein weiches Herz, das antwortet, wenn er ruft, nennt eine Stelle, an der ihr heute gehorchen müsst, und betet mit Namen füreinander. Dankt Gott zum Schluss gemeinsam, dass wir sein Haus sind."
leader_notes:
  - "Zwei Andachten (Tag 6–7). Die Verse 7–19 sind die Mitte des Abends; halte dich nicht zu lange bei Mose auf."
  - "3,6 und 3,14 („wenn wir an der Zuversicht … festhalten“, „wenn wir nur die Gewissheit … festhalten“) berühren eine Frage, in der Christen unterschiedliche Überzeugungen haben: Kann ein wahrhaft Glaubender endgültig abfallen? Die Andachten von Tag 6–7 lesen diese Bedingungen so, dass Ausharren der Beweis echten Glaubens ist: Wir werden nicht dadurch Teilhaber an Christus, dass wir am Ende ausharren; das Ausharren bis zum Ende zeigt, dass wir von Anfang an wirklich Teilhaber geworden sind. Stell das als Lesart der Andachten vor, lass die anderen respektvoll sagen, wie ihre Tradition es liest, und halte dich an das, worin alle übereinstimmen können: Die Warnung ist ernst, und das Gegenmittel ist, an Christus festzuhalten und einander jeden Tag zu ermutigen."
  - "Vers 6: Manche älteren Übersetzungen fügen hier bis zum Ende fest hinzu. Diese Worte stehen nicht in den ältesten Handschriften; der Verfasser gebraucht sie in Vers 14. Wenn jemandes Bibel sie in Vers 6 hat, ist das der Grund."
  - "Meriba und Massa (2. Mose 17,1–7): Auf Hebräisch bedeuten die Namen Streit und Versuchung; der griechische Text, den der Hebräerbrief zitiert, hat statt der Namen Auflehnung und Versuchung. Unsere Übersetzung folgt dem Griechischen, so wie der Hebräerbrief es hat."
  - "Manche hören Vers 12 vielleicht als Urteil über ehrliche Zweifel. Die Andacht von Tag 7 unterscheidet: Unglaube ist im Hebräerbrief nicht intellektueller Zweifel oder ehrliches Ringen mit Fragen, sondern eine Willensentscheidung, Gottes Verheißungen zu misstrauen und vor dem Gehorsam zurückzuweichen. Gib ehrlichen Fragen in der Gruppe Raum."
  - "Ausblick: Nächste Woche Kapitel 4 – die Verheißung der Ruhe, das lebendige Wort Gottes und der Thron der Gnade."
