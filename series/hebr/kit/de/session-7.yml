session: 7
lang: de
title: "Priester in Ewigkeit"
ref: "7:1-7:28"
days: [13, 14]
big_idea: "Melchisedek, ohne Stammbaum und größer als Abraham, weist auf Jesus hin: Priester nicht durch Abstammung, sondern nach der Kraft eines unzerstörbaren Lebens und durch Gottes Eid, der allezeit lebt, um für uns einzutreten, und der sich ein für alle Mal selbst dargebracht hat."
opening: "Musstest du schon einmal mit einem neuen Arzt, Lehrer oder Berater von vorn anfangen, weil der bisherige weggegangen ist? Was ging dabei verloren?"
context: >-
  Am Ende von Kapitel 6 ist Jesus als unser Vorläufer hinter den Vorhang hineingegangen, Hoherpriester in Ewigkeit nach der Ordnung Melchisedeks.
  Jetzt öffnet der Verfasser endlich das Thema, um das er seit 5,6–10 kreist. Für jüdische Gläubige stellte sich eine berechtigte Frage: Wie kann Jesus Priester sein, wenn er aus dem Stamm Juda kam und nicht von Levi?
  Der Verfasser antwortet aus den beiden einzigen Stellen im Alten Testament, an denen Melchisedek vorkommt: 1. Mose 14,18–20 und Psalm 110,4.
read_aloud_tip: "Lasst zuerst jemanden 1. Mose 14,18–20 lesen. Lest dann Hebräer 7 in drei Teilen: Verse 1–10 (Melchisedek und Abraham), Verse 11–22 (ein anderer Priester und ein Eidschwur), Verse 23–28 (ein Priester, der allezeit lebt – Vers 25 langsam lesen)."
hebrew:
  - word: "agenealogētos"
    hebrew: "ἀγενεαλόγητος"
    gloss: "ohne Stammbaum"
    point: "Das 1. Buch Mose stellt fast jede wichtige Gestalt mit Vorfahren, Geburt und Tod vor – nur Melchisedek nicht. Er ist weder ein Engel noch eine Erscheinung Christi; der Verfasser liest das Schweigen der Schrift: Im Text ist Melchisedek „dem Sohn Gottes aber gleichgestaltet“, ein im Voraus gemaltes Porträt des Originals (7,3)."
  - word: "engyos"
    hebrew: "ἔγγυος"
    gloss: "Bürge"
    point: "Kommt im Neuen Testament nur hier vor (7,22). Ein Mittler verhandelt zwischen zwei Parteien; ein Bürge setzt sein eigenes Leben, sein Gut und seine Ehre dafür ein, dass die Bedingungen erfüllt werden – versagen wir, zahlt der Bürge. Jesus wurde mit Gottes Eidschwur eingesetzt, und darum verbürgt er einen besseren Bund."
  - word: "eis to panteles"
    hebrew: "εἰς τὸ παντελές"
    gloss: "völlig"
    point: "Der Ausdruck hat eine doppelte Färbung: völlig, bis in den tiefsten Winkel unserer Zerbrochenheit, und für alle Zeit, bis ganz zum Ende. So kann er retten, „da er allezeit lebt, um für sie einzutreten“ (7,25)."
discussion:
  - q: "Melchisedek ist zuerst „König der Gerechtigkeit“ und dann „König des Friedens“. Warum ist die Reihenfolge wichtig? Wo suchen wir Frieden, ohne die Gerechtigkeit an die Sache heranzulassen?"
    ref: "7:1-7:2"
  - q: "Das 1. Buch Mose schweigt über Melchisedeks Eltern, Geburt und Tod, und der Verfasser sieht in diesem Schweigen ein Porträt des Sohnes Gottes. Wie befreit es uns, dass Jesu Priestertum – und sein Segen – nicht von Herkunft, Hintergrund oder einem geistlichen Lebenslauf abhängt?"
    ref: "7:3"
  - q: "„Seht doch, wie groß dieser ist.“ Abraham gab den Zehnten von der besten Beute – Jahrhunderte vor dem Gesetz, aus Dankbarkeit. Was würde es für dich bedeuten, Jesus den besten Teil deiner Zeit und deines Herzens zu geben statt der Reste?"
    ref: "7:4-7:10"
  - q: "Vers 19 sagt: „das Gesetz hat ja nichts zur Vollendung gebracht“, aber es wird „eine bessere Hoffnung eingeführt, durch die wir Gott nahekommen“. Wo bist du versucht, dich auf eine Liste von Regeln zu verlassen, statt Gott nahezukommen?"
    ref: "7:11-7:19"
  - q: "Jesus wurde Priester „nach der Kraft eines unzerstörbaren Lebens“ und mit einem Eidschwur. Was haben seine Auferstehung – und Gottes Eid – mit deiner Zuversicht vor Gott zu tun?"
    ref: "7:16-7:22"
  - q: "Die früheren Priester waren viele, „weil der Tod sie hinderte, im Amt zu bleiben“, Jesus aber hat „ein bleibendes Priestertum“. Was bedeutet es für dich, dass dein Hoherpriester nie in den Ruhestand geht und nie ersetzt werden muss?"
    ref: "7:23-7:24"
  - q: "„Darum kann er auch die völlig retten, die durch ihn zu Gott herantreten, da er allezeit lebt, um für sie einzutreten.“ Gibt es einen Bereich deines Lebens, von dem du insgeheim denkst, er liege außerhalb seiner Reichweite? Was sagt Vers 25 dazu?"
    ref: "7:25-7:28"
application:
  - "Erinnere dich in dieser Woche jeden Morgen daran, dass Jesus heute für dich eintritt, und bring ihm eine Sache, von der du fürchtest, sie nicht zu schaffen."
  - "Wenn in dieser Woche alte Schuldgefühle zurückkommen, denk daran: Er hat es „ein für alle Mal getan, als er sich selbst darbrachte“ – und weigere dich, seinem Opfer deine eigene Selbstbestrafung hinzuzufügen."
prayer: "Lest die Verse 24–25 gemeinsam laut. Betet dann zu zweit: Dankt Jesus, dass er euer Bürge ist und jetzt für euch betet, und nennt vor ihm einen Bereich, den ihr für außerhalb seiner Reichweite haltet. Schließt mit Dank für sein Opfer ein für alle Mal (V. 27)."
leader_notes:
  - "Diese Einheit umfasst zwei Andachten: Tag 13 (7,1–10) und Tag 14 (7,11–28). Kapitel 7 ist eine durchgehende Argumentation; wenn du zuerst 1. Mose 14,18–20 lesen lässt, kennt die Gruppe die Geschichte, auf die der Verfasser aufbaut."
  - "Vers 3 wirft oft die Frage auf, ob Melchisedek ein Engel oder Christus selbst vor seiner Menschwerdung war. Die Andacht von Tag 13 sagt nein: Er war ein geschichtlicher König von Salem, und der Punkt liegt im Schweigen des 1. Buches Mose über seine Herkunft. Antworte kurz und geh weiter."
  - "Die Verse 9–10 (Levi war noch in den Lenden seines Vaters) können für heutige Ohren seltsam klingen. Erkläre kurz mit Tag 13: Der Stammvater des ganzen Volkes hat ein größeres Priestertum anerkannt, und durch ihn hat sich gleichsam Levi selbst davor gebeugt."
  - "Der Zehnte (V. 4–10) kann zu einem heiklen Gespräch über Geld werden. Der Punkt von Tag 13 ist Abrahams freies, dankbares Geben des besten Teils – vor jedem Gesetz –, übertragen auf Zeit, Gaben, Aufmerksamkeit und Mittel. Lass den Abend nicht zu einer Diskussion über Gemeindefinanzen werden und setz niemanden unter Druck."
  - "Manche in der Gruppe ringen vielleicht mit Heilsgewissheit oder alten Schuldgefühlen. Lass die Verse 22, 25 und 27 wirken: Mit Tag 14 hängt unser Durchhalten nicht an der Kraft unseres Griffs, sondern an Jesus als Bürge und Fürsprecher, und seinem Opfer kann nichts hinzugefügt werden."
  - "Ausblick: Nächste Woche Kapitel 8 – das wahre Zelt und ein besserer Bund."
