session: 6
lang: de
title: "Ein Anker der Seele"
ref: "6:1-6:20"
days: [10, 11, 12]
big_idea: "Bleib nicht beim Fundament stehen: Der Verfasser warnt ernst vor dem Abfall, und doch ist er bei seinen Lesern vom Besseren überzeugt – und unsere Hoffnung ruht auf Gottes Verheißung und Gottes Eid, ein Anker, der hinter dem Vorhang festgemacht ist, wohin Jesus uns vorausgegangen ist."
opening: "Denk an etwas, auf das du einmal lange warten musstest. Was hat dir geholfen durchzuhalten – oder was hat dich fast aufgeben lassen?"
context: >-
  Am Ende von Kapitel 5 hat der Verfasser seine Leser getadelt: Sie waren träge im Hören geworden und brauchten noch Milch.
  Kapitel 6 ruft sie weiter zur Reife (V. 1–3) und bringt dann eine der ernstesten Warnungen des Briefes (V. 4–8).
  Doch gleich danach nennt er sie „ihr Lieben“ und versichert ihnen Besseres (V. 9–12), bevor er sie auf Gottes Eid an Abraham hinweist und auf die Hoffnung, die ein Anker der Seele ist (V. 13–20).
read_aloud_tip: "Lest in vier Teilen mit vier Lesern: Verse 1–3, Verse 4–8 (langsam und ruhig lesen, nicht drohend), Verse 9–12 (warm lesen), Verse 13–20 (der Eid und der Anker)."
hebrew:
  - word: "nōthroi"
    hebrew: "νωθροί"
    gloss: "träge"
    point: "Stumpf, lustlos, abgestumpft. Das Wort rahmt den Abschnitt: In 5,11 sind die Leser „träge im Hören geworden“, und in 6,12 ermahnt der Verfasser sie, nicht träge zu werden, sondern die nachzuahmen, die die Verheißungen erben. Sein Gegenteil sind Eifer, Glaube und Geduld (makrothymia, ein langer Atem)."
  - word: "ametathetos"
    hebrew: "ἀμετάθετος"
    gloss: "unwandelbar"
    point: "Ein Wort aus der Rechtssprache für ein Testament oder einen Vertrag, der nicht aufgehoben oder geändert werden kann. Gottes Wort allein hätte schon genügt, aber um unserer Zweifel willen hat er einen Eid hinzugefügt – zwei unwandelbare Dinge, „bei denen Gott unmöglich lügen kann“ (6,17–18)."
  - word: "prodromos"
    hebrew: "πρόδρομος"
    gloss: "Vorläufer"
    point: "Im alten Bund ging der Hohepriester allein, einmal im Jahr, hinter den Vorhang, und niemand konnte ihm folgen. Jesus ist „als Vorläufer für uns hineingegangen“: Er ist vorausgegangen, um den Weg zu öffnen, damit wir ihm in Gottes Gegenwart folgen können (6,20)."
discussion:
  - q: "Die Verse 1–2 nennen sechs Grundsteine in drei Paaren. Welche davon wurden in deinem Leben gut gelegt? Warum sollen wir den Grund nicht immer wieder neu legen – und was fügt der Satz „wenn Gott es nur zulässt“ hinzu?"
    ref: "6:1-6:3"
  - q: "Die Verse 4–5 beschreiben Menschen, die „einmal erleuchtet worden sind“ und „die himmlische Gabe geschmeckt haben“. Wie kann jemand so viel aus nächster Nähe erleben und sich trotzdem abwenden? (Denkt an die Wüstengeneration in Kapitel 3.)"
    ref: "6:4-6:5"
  - q: "Vers 6 beschreibt Menschen, die „für sich selbst den Sohn Gottes wieder kreuzigen und ihn dem Spott preisgeben“. Warum ist es wichtig, dass die Unmöglichkeit an eine fortdauernde Verwerfung Jesu gebunden ist, des einzigen Hohenpriesters und des einzigen Opfers?"
    ref: "6:6"
  - q: "Zwei Stücke Land trinken denselben Regen: Das eine bringt nützliche Pflanzen hervor, das andere Dornen und Disteln. Wie sieht der geistliche Regen in deinem Leben aus, und was bringt er hervor?"
    ref: "6:7-6:8"
  - q: "Gleich nach der Warnung sagt der Verfasser: „sind wir doch bei euch vom Besseren überzeugt“. Was sieht er bei seinen Lesern (V. 10)? Wo seht ihr beieinander etwas „von dem, was zur Rettung gehört“?"
    ref: "6:9-6:10"
  - q: "„Denn Gott ist nicht ungerecht, dass er euer Werk vergessen würde und die Liebe, die ihr seinem Namen erwiesen habt.“ Für wessen verborgenen Dienst möchtest du Gott heute Abend danken? Was sagt dieser Vers jemandem, der sich übersehen fühlt?"
    ref: "6:10-6:12"
  - q: "Wir haben diese Hoffnung als „einen Anker der Seele, sicher und fest“ – aber er wird nach oben geworfen, hinter den Vorhang, nicht hinab ins Meer. Woran ist dein Anker festgemacht, wenn der Sturm kommt, und was ändert es, dass Jesus uns dorthin vorausgegangen ist?"
    ref: "6:13-6:20"
application:
  - "Abraham erlangte die Verheißung, „nachdem er geduldig gewartet hatte“. Nenne eine Verheißung Gottes, auf die du wartest, und bring sie in dieser Woche jeden Tag neu mit Glauben und Geduld vor ihn."
  - "Ermutige eine Person, deren Dienst meist übersehen wird – sag ihr in einer Nachricht oder persönlich, dass Gott ihr Werk und ihre Liebe nicht vergisst."
prayer: "Lest die Verse 19–20 gemeinsam laut. Betet dann zu zweit füreinander: Nennt einen Sturm oder eine lange Wartezeit, in der ihr gerade steckt, und dankt Gott, dass seine Verheißung und sein Eid nicht versagen können. Dankt zum Schluss Gott für den treuen, verborgenen Dienst von Menschen in eurer Gemeinde."
leader_notes:
  - "Diese Einheit stützt sich auf drei Andachten: Tag 10 (5,11–6,3, für die Verse 1–3), Tag 11 (6,4–12) und Tag 12 (6,13–20). Lass nicht zu, dass die Verse 4–6 den ganzen Abend verschlingen – halte mindestens 15 Minuten für den Eid und den Anker frei (V. 13–20)."
  - "6,4–6 gehört zu den umstrittensten Abschnitten des Neuen Testaments, und aufrichtige Christen in deiner Gruppe lesen ihn je nach ihrer Tradition vielleicht verschieden. Lass jeden zu Wort kommen, ohne dass die Frage entschieden werden muss; das Ziel ist, Warnung und Trost zusammen zu hören, nicht eine Debatte zu gewinnen."
  - "Folge der Linie der Andacht von Tag 11: Die Leser erwogen, Christus offen zu verleugnen und zu den Tempelopfern zurückzukehren, um der Verfolgung zu entgehen; Abfallen meint hier eine völlige, bewusste Verwerfung Christi, nicht einen Gläubigen, der aus Schwachheit in Sünde stolpert; und die Partizipien im Präsens binden die Unmöglichkeit an das Festhalten an dieser Verwerfung. Es gibt kein anderes Opfer."
  - "Vielleicht hat jemand Angst, diese Sünde begangen zu haben. Sag deutlich, was Tag 11 sagt: Allein die Tatsache, dass dein Herz weich ist, dass du über deine Sünde trauerst und dich nach Jesus sehnst, zeigt, dass du nicht in dem verhärteten Zustand von Vers 6 bist. Wenn die Angst tief sitzt, biete an, danach miteinander zu reden und zu beten."
  - "Vers 9 ist der Schlüssel des Verfassers selbst: Nur hier im Brief nennt er seine Leser „ihr Lieben“, und er ist bei ihnen vom Besseren überzeugt. Lies die Warnung nie ohne die Verse 9–12."
  - "Hintergrund (Tag 12): Der Anker findet sich auf frühchristlichen Gräbern; die beliebte Predigtgeschichte vom kleinen Boot, das den Anker in den Hafen rudert, ist antik nicht klar belegt – nutze sie als Bild, nicht als Geschichte. Ausblick: Nächste Woche Kapitel 7 – Melchisedek und ein Priester in Ewigkeit."
