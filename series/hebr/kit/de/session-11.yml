session: 11
lang: de
title: "Durch Glauben"
ref: "11:1-11:40"
days: [22, 23, 24]
big_idea: "Der Glaube hält Gottes Verheißungen wie eine Besitzurkunde in der Hand: Er macht uns zu Pilgern auf dem Weg zu der Stadt, deren Erbauer Gott ist, er hält die Schmach des Christus für wertvoller als die Schätze Ägyptens, und er hält durch – ob Gott uns befreit oder uns durch das Leiden hindurchträgt."
opening: "Hast du schon einmal etwas bezahlt, lange bevor du es genießen konntest – eine Eintrittskarte, ein Grundstück, einen Urlaub? Wie war es, den Beleg in der Hand zu halten, während du noch gewartet hast?"
context: >-
  Am Ende von Kapitel 10 hat der Verfasser seine müden, verfolgten Leser daran erinnert, dass sie nicht zu denen gehören, die zurückweichen, sondern zu denen, die glauben.
  Jetzt öffnet er eine Galerie von Zeugen aus ihren eigenen Schriften – von Abel, Henoch und Noah über Abraham und die Erzväter bis zu Mose, Rahab und namenlosen Märtyrern.
  Keiner von ihnen lebte von dem, was die Augen sehen konnten; alle lebten von Gottes Verheißungen. Heute lesen wir das ganze Kapitel 11.
read_aloud_tip: "Lest mit vier Lesern: Verse 1–7 (der Glaube und die ersten Zeugen), 8–22 (Abraham bis Josef), 23–31 (Mose bis Rahab), 32–40 (die Helden und die Namenlosen). Die ganze Gruppe spricht jedes Mal gemeinsam die Worte „Durch Glauben“."
hebrew:
  - word: "hypostasis"
    hebrew: "ὑπόστασις"
    gloss: "Gewissheit"
    point: "Diesem Wort sind wir in 1,3 („seines Wesens“) und 3,14 („Gewissheit“) begegnet. In manchen griechischen Papyri der ersten Jahrhunderte steht es für Urkunden, die Eigentum beweisen – eine Art Besitzurkunde. Der Glaube hält die Besitzurkunde der Verheißungen Gottes in der Hand, bevor wir eingezogen sind (11,1)."
  - word: "aspazomai"
    hebrew: "ἀσπάζομαι"
    gloss: "begrüßt"
    point: "Etwas mit Freude willkommen heißen, mit offenen Armen umarmen – wie Seeleute, die am Horizont die Berge der Heimat auftauchen sehen und jubeln, obwohl sie noch weit vom Hafen entfernt sind. Die Erzväter starben ohne die Erfüllung, aber sie haben die Verheißungen von fern gesehen und begrüßt (11,13)."
  - word: "kartereō"
    hebrew: "καρτερέω"
    gloss: "hielt durch"
    point: "Wie ein Soldat, der stark und unerschüttert stehen bleibt. Das ist das Geheimnis von Moses Ausdauer: Wer den unsichtbaren König mit dem Auge des Glaubens sieht, vor dem schrumpft die Wut eines irdischen Pharao zur Bedeutungslosigkeit (11,27)."
discussion:
  - q: "„Der Glaube aber ist die Gewissheit dessen, was man hofft, der Beweis für Dinge, die man nicht sieht.“ Die Andacht vergleicht diese Gewissheit mit einer Besitzurkunde. Was ist der Unterschied, ob du eine Verheißung Gottes wie eine Besitzurkunde behandelst oder wie einen Wunsch?"
    ref: "11:1-11:3"
  - q: "Abel zeigt die Anbetung des Glaubens, Henoch seinen täglichen Wandel, Noah seine Arbeit und Ausdauer. Vers 6 sagt, wer zu Gott herantritt, muss glauben, dass er ist und dass er „denen, die ihn ernsthaft suchen, Lohn gibt“. Wie verändert dieses Bild von Gott dein Beten?"
    ref: "11:4-11:7"
  - q: "Abraham zog aus, „ohne zu wissen, wohin er kommen würde“. Wann musstest du einen Schritt des Gehorsams gehen, ohne die ganze Landkarte zu sehen? Was hat dir geholfen?"
    ref: "11:8-11:12"
  - q: "Die Erzväter bekannten, dass sie „Fremde und Durchreisende auf der Erde“ sind. Wo schlagen wir unsere Zeltheringe zu tief in diese Welt? Und was bedeutet es dir: „Darum schämt sich Gott ihrer nicht, ihr Gott genannt zu werden“?"
    ref: "11:13-11:16"
  - q: "Auf Morija „rechnete“ Abraham „damit, dass Gott sogar aus den Toten auferwecken kann“. Was ist der „Isaak“ in deinem Leben – eine gute Gabe Gottes, an der du vielleicht fester hängst als am Geber?"
    ref: "11:17-11:22"
  - q: "Mose „hielt die Schmach des Christus für größeren Reichtum als die Schätze Ägyptens“. Was sind heute die Schätze Ägyptens, und was hilft uns, den „vergänglichen Genuss der Sünde“ zu durchschauen?"
    ref: "11:23-11:28"
  - q: "In den Versen 33–35 verschließen manche den Löwen den Rachen; dann kommt die Wende: „Andere aber wurden gefoltert und nahmen die Freilassung nicht an“. Beide Gruppen stehen in derselben Liste, und von den Leidenden heißt es: „die Welt war ihrer nicht wert“. Wie kann das jemandem in einer langen, schweren Zeit helfen?"
    ref: "11:32-11:40"
application:
  - "Schreib dir eine Verheißung Gottes auf, an der du festhältst, ohne ihre Erfüllung schon zu sehen. Lies sie diese Woche jeden Morgen wie eine Besitzurkunde und danke Gott dafür, bevor sich irgendetwas sichtbar ändert."
  - "Benenne einen Zelthering, der dich zu fest an diese Welt bindet – einen Besitz, ein Ziel oder eine Sorge – und tu diese Woche etwas Konkretes, um ihn zu lockern: etwas verschenken, teilen oder es Gott im Gebet übergeben."
prayer: "Lest zu Beginn gemeinsam Vers 1. Dankt Gott für die Menschen des Glaubens, die vor euch gegangen sind – in der Bibel und in eurem eigenen Leben. Betet dann für alle in der Gruppe, die gerade in einer „Andere aber“-Zeit stehen – im Warten, im Leiden oder ohne sichtbare Antwort – und bittet darum, dass ihr alle durchhaltet als solche, die den Unsichtbaren sehen."
leader_notes:
  - "Dieser Abend umfasst drei Andachten (Tag 22–24) und 40 Verse. Versucht nicht, jeden Namen zu besprechen; die vier Leseabschnitte geben die Struktur vor, und vier oder fünf Fragen genügen."
  - "11,11: Unsere Übersetzung folgt dem griechischen Grundtext, in dem Abraham das Subjekt ist („auch zusammen mit Sara selbst“); viele ältere Bibeln machen Sara zum Subjekt. Wenn jemand den Unterschied bemerkt, erkläre ihn kurz – auch Vers 12 spricht von „einem Einzigen“ – und weise darauf hin, dass Sara eingeschlossen bleibt. Lass es nicht zum Thema des Abends werden."
  - "Der empfindlichste Punkt sind die Verse 35–38. Manche glauben, großer Glaube bringe immer Heilung oder Rettung. Die Andacht von Tag 24 sagt, dass die Leidenden nicht weniger Glauben hatten als die, die Wunder erlebten. Geh behutsam mit allen um, die krank sind, trauern oder lange ohne Antwort gebetet haben, und versprich keine bestimmten Ausgänge."
  - "Abels Opfer: Die Andacht erklärt Gottes Annahme mit dem Glauben in Abels Herzen. 1. Mose sagt wenig über den Grund; haltet euch also nicht lange mit Spekulationen über die Opfergaben auf."
  - "Die Verse 39–40 bereiten die nächste Woche vor: Die Zeugen aus Kapitel 11 werden zusammen mit uns zur Vollendung gebracht. Ausblick: Kapitel 12 – der Wettlauf, die Erziehung des Vaters und die zwei Berge Sinai und Zion."
