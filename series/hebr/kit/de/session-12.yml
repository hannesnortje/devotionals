session: 12
lang: de
title: "Der Lauf und der Berg"
ref: "12:1-12:29"
days: [25, 26]
big_idea: "Den Blick auf Jesus gerichtet, laufen wir mit Ausdauer den Wettlauf und nehmen die Erziehung des Vaters als Liebe an; und weil wir zum Berg Zion herangetreten sind, nicht zum Sinai, empfangen wir ein unerschütterliches Reich und dienen Gott mit Dankbarkeit, Ehrfurcht und Scheu."
opening: "Denk an etwas Langes und Schweres, das du zu Ende gebracht hast – einen Lauf, eine Bergtour, ein Projekt –, obwohl du auf halber Strecke aufgeben wolltest. Was hat dich weitermachen lassen?"
context: >-
  Kapitel 11 endete mit einer großen Galerie von Zeugen; jetzt wird der Staffelstab uns in die Hand gelegt.
  Die ersten Leser waren erschöpft, wie Langstreckenläufer, die auf halber Strecke eines Marathons einen Krampf bekommen.
  In Kapitel 12 gibt der Verfasser ihnen mit drei Bildern neue Kraft: ein Stadion (Verse 1–3), ein Elternhaus, in dem Kinder erzogen werden (Verse 4–13), und zwei Berge – Sinai und Zion (Verse 18–24) –, gefolgt von der letzten Warnung des Briefes (Verse 25–29).
read_aloud_tip: "Lest mit vier Lesern: Verse 1–13 (der Wettlauf und die Erziehung des Vaters), 14–21 (Esau und der Berg Sinai – 18–21 langsam und schwer lesen), 22–24 (der Berg Zion – mit Freude lesen, damit man den Gegensatz hört), 25–29 (das unerschütterliche Reich)."
hebrew:
  - word: "aphorōntes"
    hebrew: "ἀφορῶντες"
    gloss: "den Blick … gerichtet"
    point: "Die Vorsilbe apo- (weg von) bedeutet: Du wendest den Blick bewusst von allem anderen ab, um ihn auf einen einzigen Punkt zu richten – auf Jesus, „den Wegbereiter und Vollender des Glaubens“ (12,2). Kein Läufer gewinnt, indem er auf seine eigenen Füße oder auf die Zuschauer schaut."
  - word: "paideia"
    hebrew: "παιδεία"
    gloss: "Erziehung"
    point: "Von pais (Kind): der ganze Vorgang, ein Kind großzuziehen, seinen Charakter zu formen und es liebevoll zurechtzuweisen. Die Strafe eines Gerichts blickt zurück auf die Tat, um sie zu vergelten – und unsere Strafe ist bereits auf Jesus gefallen; die paideia des Vaters blickt nach vorn auf das Wachstum des Kindes (12,5–11)."
  - word: "panēgyris"
    hebrew: "πανήγυρις"
    gloss: "Festversammlung"
    point: "Ein großes Volksfest, wie bei den Olympischen Spielen, wenn die ganze Stadt feierte. Am Sinai umgaben die Engel die ehrfurchtgebietende Gabe des Gesetzes; am Zion feiern sie die Erlösung von Sündern (12,22)."
discussion:
  - q: "Wir haben „eine so große Wolke von Zeugen um uns“ – keine Zuschauer, die darauf warten, dass wir fallen, sondern Zeugen, die mit ihrem eigenen Lauf bezeugen, dass Gottes Verheißungen tragen. Welche „Last“ – vielleicht nicht einmal eine Sünde – bremst dich gerade?"
    ref: "12:1"
  - q: "„Um der Freude willen, die vor ihm lag, hat er das Kreuz erduldet und die Schande verachtet.“ Was heißt es praktisch, den Blick auf Jesus gerichtet zu halten, wenn dich Widerstand, Ungerechtigkeit oder deine eigene Schwachheit überwältigen?"
    ref: "12:2-12:3"
  - q: "Vers 5 warnt vor zwei entgegengesetzten Reaktionen auf schwere Zeiten: „achte die Erziehung des Herrn nicht gering“ und „verliere nicht den Mut“. Zu welcher neigst du eher? Was verändert sich, wenn du Schweres als Training des Vaters siehst und nicht als seine Strafe?"
    ref: "12:4-12:10"
  - q: "„Später aber bringt sie denen, die durch sie geübt sind, die friedvolle Frucht der Gerechtigkeit.“ Kannst du von einer schweren Zeit erzählen, deren Frucht du erst später gesehen hast?"
    ref: "12:11-12:13"
  - q: "Esau hat „für eine einzige Mahlzeit sein Erstgeburtsrecht“ verkauft, und eine Wurzel der Bitterkeit kann viele verunreinigen. Welche „einzige Mahlzeit“ lockt uns heute? Und wie können wir als Gruppe aufeinander achten, ohne zu verurteilen?"
    ref: "12:14-12:17"
  - q: "Vergleicht die beiden Berge: Was seht, hört und spürt ihr am Sinai (Verse 18–21) und am Zion (Verse 22–24)? Wenn du betest – trittst du eher wie am Sinai oder wie am Zion zu Gott?"
    ref: "12:18-12:24"
  - q: "Das Blut Jesu ist das Blut, „das besser spricht als Abel“, und: „Weil wir also ein unerschütterliches Reich empfangen, lasst uns dankbar sein.“ Was wird um dich herum gerade erschüttert, und wie sähe dankbare Anbetung als deine Antwort aus?"
    ref: "12:24-12:29"
application:
  - "Benenne eine „Last“ und leg sie diese Woche ganz konkret ab – ein Abend ohne Bildschirm, eine Verpflichtung, die du zurückgibst, eine Sorge, die du jeden Morgen im Gebet Gott übergibst."
  - "Wenn eine Wurzel der Bitterkeit gegen jemanden zu wachsen begonnen hat, geh diese Woche einen Schritt auf Frieden zu: Bete mit Namen für diesen Menschen, schick eine Nachricht oder bitte um ein Gespräch."
prayer: "Lest zu Beginn gemeinsam Vers 2. Haltet eine Minute Stille, in der jede und jeder eine Last vor Gott ablegt. Betet dann für die in der Gruppe, die im Lauf müde sind, dankt Gott, dass wir in Christus zum Berg Zion herangetreten sind, und lest zum Schluss gemeinsam die Verse 28–29."
leader_notes:
  - "Dieser Abend umfasst zwei Andachten (Tag 25–26) und drei große Bilder. Wenn die Zeit knapp ist, konzentriert euch auf die Verse 1–3 und 18–24 und wählt eine Frage aus dem Abschnitt über die Erziehung."
  - "Die Verse 5–11 können für Menschen schmerzhaft sein, die einen harten oder gewalttätigen Vater hatten, und die Worte „er geißelt jeden Sohn“ können Angst machen. Bleib bei der Andacht: paideia ist keine Strafe, sie blickt in Liebe nach vorn, und Gott erzieht „zu unserem Besten“. Erweck nicht den Eindruck, eine bestimmte Krankheit oder ein Verlust sei Gottes Strafe für eine bestimmte Sünde."
  - "12,17 (Esau „fand keinen Raum für Umkehr“) kann empfindsamen Gläubigen Angst machen, sie seien zu weit gegangen. Die Andacht von Tag 26 sagt, dass Esaus Tränen nur Bedauern über seinen Verlust waren, keine echte Umkehr zu Gott. Wer sich darüber Sorgen macht, zeigt das Gegenteil von Esaus Gleichgültigkeit; biete bei Bedarf ein persönliches Gespräch an."
  - "Die Verse 25–29 sind die letzte Warnung des Briefes. Die Andacht hält beides zusammen: Der Gott des Zion ist dasselbe verzehrende Feuer wie der Gott des Sinai, doch in Christus wird unsere Furcht zu dankbarer Ehrfurcht. Lass keine der beiden Seiten wegfallen."
  - "Übersetzung: In 12,2 steht bei uns „den Wegbereiter und Vollender des Glaubens“ statt der vertrauten Wendung älterer Bibeln; das bleibt nahe am griechischen archēgos (schon in 2,10) und teleiōtēs. Der Titel der Reihe stammt aus diesem Vers."
  - "Ausblick: Nächste Woche Kapitel 13, der letzte Abend – Liebe im Alltag, hinaus vor das Lager und der große Hirte."
