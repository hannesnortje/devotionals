session: 5
lang: de
title: "Ein Hoherpriester, der versteht"
ref: "5:1-5:14"
days: [9, 10]
big_idea: "Jesus hat sich die Ehre des Hohenpriesters nicht selbst genommen: Von Gott berufen, lernte er durch das, was er litt, den Gehorsam und wurde zur Quelle ewiger Rettung – und er ruft uns weiter von der Milch zur festen Nahrung, zu einem Glauben, der durch Übung geschult ist."
opening: "Denk an eine Situation, in der dir jemand geholfen hat, der selbst dasselbe durchgemacht hatte. Was war an seiner Hilfe anders?"
context: >-
  Kapitel 4 endete mit der Einladung, mit Zuversicht zum Thron der Gnade herzutreten, weil wir einen großen Hohenpriester haben, der mit unseren Schwachheiten mitfühlen kann (4,14–16).
  Kapitel 5 erklärt nun, was einen wahren Hohenpriester ausmacht: Er wird aus den Menschen genommen und von Gott berufen – und Jesus erfüllt beides, bis hinein in die Tränen von Gethsemane.
  Dann hält der Verfasser plötzlich inne: Bevor er mehr über Melchisedek sagen kann, muss er auf das stumpf gewordene Hören seiner Leser eingehen.
read_aloud_tip: "Lest in drei Teilen: Verse 1–4 (was jeder Hohepriester ist), Verse 5–10 (Christus, Sohn und Priester – ein zweiter Leser liest die beiden Psalmzitate), Verse 11–14 (Milch und feste Nahrung)."
hebrew:
  - word: "metriopathein"
    hebrew: "μετριοπαθεῖν"
    gloss: "nachsichtig umgehen"
    point: "Die eigenen Gefühle im Maß halten: weder im Zorn aufbrausen über die, die straucheln, noch sich kalt von ihnen abwenden. Ein irdischer Hohepriester brauchte das, weil er selbst mit Schwachheit behaftet war (5,2); Christus hatte keine eigene Sünde und zeigt doch vollkommene Sanftmut gegenüber Sündern."
  - word: "emathen aph' hōn epathen"
    hebrew: "ἔμαθεν ἀφʼ ὧν ἔπαθεν"
    gloss: "lernte er durch das, was er litt, den Gehorsam"
    point: "Ein Wortspiel: er lernte (emathen) durch das, was er litt (epathen). Als ewiger Sohn war Jesus nie ungehorsam; aber als Mensch lernte er durch Erfahrung, was es kostet, gehorsam zu bleiben, wenn der Gehorsam alles kostet. So wurde er zur Vollendung gebracht – voll befähigt – und wurde zur Quelle ewiger Rettung (5,8–9)."
  - word: "gegymnasmena"
    hebrew: "γεγυμνασμένα"
    gloss: "geübt"
    point: "Von gymnazō, daher kommen Gymnastik und Gymnasium. Reife heißt nicht, wie viel wir wissen, sondern Sinne, die durch Gewöhnung (hexis, wiederholte Übung) geschult sind, Gutes und Böses zu unterscheiden – Unterscheidungsvermögen wächst wie ein Muskel, man lernt es nicht über Nacht im Klassenzimmer (5,14)."
discussion:
  - q: "Die Verse 1–4 nennen zwei Dinge, die jeder Hohepriester braucht: Er wird „aus den Menschen genommen“ und „von Gott berufen“. Warum ist beides wichtig für jemanden, der zwischen uns und Gott stehen soll?"
    ref: "5:1-5:4"
  - q: "Ein irdischer Hohepriester konnte „mit den Unwissenden und Irrenden nachsichtig umgehen, da auch er selbst mit Schwachheit behaftet ist“. Wo hast du solche Sanftmut erlebt – weder hart noch gleichgültig? Was macht es schwer, sie zu zeigen?"
    ref: "5:2"
  - q: "„So hat auch Christus sich nicht selbst verherrlicht, um Hoherpriester zu werden.“ Was sagt es über Jesus, dass er diese Ehre nicht an sich gerissen, sondern vom Vater empfangen hat (Psalm 2,7; Psalm 110,4)?"
    ref: "5:4-5:6"
  - q: "Vers 7 führt uns nach Gethsemane: „Bitten und Flehen mit lautem Schreien und mit Tränen“. Was bedeutet es für dein eigenes Beten, dass Jesus so gebetet hat? Traust du dich, so ehrlich zu beten?"
    ref: "5:7"
  - q: "„Obwohl er Sohn war, lernte er durch das, was er litt, den Gehorsam.“ Jesus war nie ungehorsam – was hat er dann gelernt? Und was könnte Gott dich in einer schweren Zeit gerade lehren?"
    ref: "5:8-5:10"
  - q: "Die Leser waren „träge im Hören geworden“ – sie waren nicht immer so gewesen. Wie rutscht ein Christ in geistliche Trägheit hinein, und woran merkt man es früh?"
    ref: "5:11-5:13"
  - q: "Reife gehört nach Vers 14 denen, „deren Sinne durch Gewöhnung geübt sind, Gutes und Böses zu unterscheiden“. Wie könnte dein geistliches Training in dieser Woche aussehen?"
    ref: "5:14"
application:
  - "Bring Gott in dieser Woche ein ehrliches, ungeschminktes Gebet – deine wirklichen Ängste und Nöte, so wie Jesus „mit lautem Schreien und mit Tränen“ gebetet hat – und denk daran: Dein Hoherpriester versteht dich."
  - "Wähle eine Wahrheit, die du schon kennst (vergeben, die Wahrheit sagen, auch wenn es dich etwas kostet, jemandem dienen), und setze sie in einer konkreten Situation um – eine Trainingseinheit im geistlichen Fitnessraum."
prayer: "Lest die Verse 7–9 gemeinsam laut. Betet dann zu zweit: Dankt Jesus, dass er Schwachheit und Tränen von innen kennt, nennt eine Stelle, an der ihr gerade seine Hilfe braucht, und bittet ihn, euch zu schulen, Gutes und Böses zu unterscheiden. Betet zum Schluss für alle in der Gruppe, die gerade eine schwere Zeit durchmachen."
leader_notes:
  - "Diese Einheit stützt sich auf zwei Andachten, die über die Kapitelgrenze gehen: Tag 9 (4,14–5,10) und Tag 10 (5,11–6,3). Der Schwerpunkt liegt auf Kapitel 5; 4,14–16 ist die Brücke zur letzten Woche, 6,1–3 kommt nächste Woche."
  - "Vers 7 sagt: „er ist erhört worden wegen seiner Ehrfurcht“ – und doch ist er gestorben. Die Andacht von Tag 9 antwortet: Gott hat ihn nicht vor dem Sterben bewahrt, sondern ihn durch den Tod hindurch und in der Auferstehung aus dem Tod herausgeführt. (Manche verstehen die Stelle so, dass er erhört und von seiner Angst befreit wurde.)"
  - "Vers 8 kann klingen, als sei Jesus einmal ungehorsam gewesen. Stell mit Tag 9 klar: Als ewiger Sohn hat er nie rebelliert; als Mensch lernte er durch Erfahrung, was Gehorsam kostet. Lass den Abend nicht zu einer langen Debatte über die zwei Naturen Christi werden."
  - "Wer gerade leidet, kann Vers 8 als Urteil über sein Leid hören. Geh behutsam damit um: Tag 9 sagt, dass gegenwärtiges Leid kein Zeichen dafür ist, dass Gott uns vergessen hat, sondern ein Klassenzimmer, in dem der Geist uns formt – nicht, dass jede Not verdient wäre."
  - "Die Fragen 6–7 können wie ein Tadel wirken. Langjährige Mitglieder fühlen sich vielleicht verurteilt, neue Christen vielleicht als Babys abgestempelt. Tag 10 sagt: Milch ist für ein Neugeborenes natürlich und gesund; das Problem ist nur, dort stehen zu bleiben. Halte den Ton ermutigend."
  - "Ausblick: Nächste Woche Kapitel 6 – die ernsteste Warnung des Briefes (6,4–6) und die Hoffnung als Anker der Seele."
