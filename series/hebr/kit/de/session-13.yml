session: 13
lang: de
title: "Der große Hirte"
ref: "13:1-13:25"
days: [27, 28]
big_idea: "Dankbare Anbetung in einem unerschütterlichen Reich wird zu praktischer Liebe, Zufriedenheit und dem Mut, zu Jesus hinauszugehen vor das Lager; wir bringen Gott die Opfer des Lobes und des Teilens – und der Gott des Friedens, der den großen Hirten aus den Toten heraufgeführt hat, rüstet uns selbst aus, seinen Willen zu tun."
opening: "Wenn eine lange gemeinsame Zeit zu Ende geht – eine Reise, ein Kurs, eine Arbeitsstelle –, was möchtest du am liebsten, dass die anderen mitnehmen?"
context: >-
  Am Ende von Kapitel 12 sagte der Verfasser, dass wir ein unerschütterliches Reich empfangen und Gott mit Dankbarkeit, Ehrfurcht und Scheu dienen sollen.
  Kapitel 13 zeigt, wie dieser Gottesdienst an einem gewöhnlichen Werktag aussieht: Liebe, Gastfreundschaft, Ehe und Geld (Verse 1–6), Leiter und der unveränderliche Christus (7–9), zu Jesus hinausgehen vor das Lager (10–14), die Opfer des Lobes und des Teilens (15–19) und zuletzt ein großer Segen und persönliche Grüße (20–25).
  Heute schließen wir den Brief ab – und diese Reihe.
read_aloud_tip: "Lest mit drei Lesern: Verse 1–9, 10–19 und 22–25. Die ganze Gruppe liest Vers 8 gemeinsam, und am Ende der Lesung sprecht ihr die Verse 20–21 gemeinsam als Segen."
hebrew:
  - word: "ou mē se anō oud' ou mē se enkatalipō"
    hebrew: "οὐ μή σε ἀνῶ οὐδʼ οὐ μή σε ἐγκαταλίπω"
    gloss: "niemals … niemals"
    point: "In 13,5 häuft das Griechische fünf Verneinungen: frei wiedergegeben: Ich werde dich niemals, niemals loslassen, und ich werde dich niemals, niemals verlassen. Unsere Sicherheit liegt nicht in dem, was wir haben, sondern in dem, den wir haben – darum können wir zufrieden sein (13,5–6)."
  - word: "exō tēs parembolēs"
    hebrew: "ἔξω τῆς παρεμβολῆς"
    gloss: "außerhalb des Lagers"
    point: "Am Versöhnungstag wurden die Körper der Sündopfer außerhalb des Lagers verbrannt (3. Mose 16,27). Jesus hat außerhalb des Tores gelitten. Für die ersten Leser war das Lager die sichere, angesehene Welt des Tempels – aber Jesus ist draußen (13,11–13)."
  - word: "katartizō"
    hebrew: "καταρτίζω"
    gloss: "ausrüsten"
    point: "In der Medizin gebraucht für das Einrichten eines gebrochenen Knochens, bei Fischern für das Flicken von Netzen (Matthäus 4,21); in 11,3 beschreibt dasselbe Verb, wie die Welten durch Gottes Wort geformt wurden. Was Gott von uns fordert, wirkt er selbst in uns (13,21)."
discussion:
  - q: "Die Verse 1–4 nennen vier Richtungen der Liebe: Liebe unter Geschwistern, Gastfreundschaft gegenüber Fremden, Mitgefühl mit Gefangenen und Misshandelten und die Ehre der Ehe. Welche davon ist in unserer Gruppe stark, und welche braucht unsere Aufmerksamkeit?"
    ref: "13:1-13:4"
  - q: "„Seid zufrieden mit dem, was ihr habt“ – und die Begründung ist kein Haushaltsplan, sondern eine Zusage: „Ich werde dich niemals loslassen und dich niemals verlassen.“ Warum ruht Zufriedenheit auf einer Person und nicht auf Besitz? Wo bist du gerade unruhig wegen Geld oder Zukunft?"
    ref: "13:5-13:6"
  - q: "„Jesus Christus ist gestern und heute derselbe – und in Ewigkeit.“ Denk an dein eigenes Gestern, Heute und Morgen: Wo musst du diesen Satz am dringendsten hören?"
    ref: "13:7-13:8"
  - q: "„Es ist gut, dass das Herz durch Gnade gefestigt wird, nicht durch Speisen.“ Was sind heute die „Speisen“ – Regeln, Leistungen oder Formen, mit denen wir uns sicher fühlen wollen? Wie sieht es aus, wenn die Gnade dein Herz festigt?"
    ref: "13:9"
  - q: "„So lasst uns nun zu ihm hinausgehen, aus dem Lager hinaus, und seine Schmach tragen.“ Was ist das bequeme „Lager“ in unserem Umfeld, und wie könnte es für dich in diesem Monat aussehen, zu Jesus hinauszugehen?"
    ref: "13:10-13:14"
  - q: "Die Verse 15–16 nennen zwei Opfer: „die Frucht der Lippen, die seinen Namen bekennen“ und „Vergesst nicht, Gutes zu tun und miteinander zu teilen“. Was fällt dir leichter – die Lippen oder die Hände? Und wie können wir den Leitern, die „über eure Seelen“ wachen, ihre Arbeit zur Freude machen statt zum Seufzen?"
    ref: "13:15-13:19"
  - q: "Rückblick auf die ganze Reihe: Der Hebräerbrief hat uns Jesus gezeigt als den Sohn, durch den Gott geredet hat, als den barmherzigen Hohenpriester, den Vorläufer, den Wegbereiter des Glaubens und jetzt als den großen Hirten. Welches Bild von Jesus ist dir am wichtigsten geworden, und warum?"
    ref: "13:20-13:21"
application:
  - "Wähle eine der Richtungen der Liebe aus den Versen 1–3 und setze sie diese Woche um: Lade jemanden zum Essen ein, besuche jemanden im Gefängnis, im Krankenhaus oder im Pflegeheim oder schreib ihm, oder teile etwas, das du hast, mit jemandem in Not."
  - "Zum Abschluss der Reihe: Wähle den einen Vers aus dem Hebräerbrief, der dich am meisten angesprochen hat. Schreib ihn ab, häng ihn dorthin, wo du ihn jeden Tag siehst, und erzähl diese Woche einem Menschen, warum er dir wichtig ist."
prayer: "Dankt Gott gemeinsam für das, was er in dieser Reihe in der Gruppe getan hat. Betet für eure Leiter und füreinander, wie der Verfasser in Vers 18 bittet. Wendet euch zum Schluss einander zu, sprecht die Verse 20–21 als Segen über die Gruppe und endet mit den letzten Worten des Briefes: „Die Gnade sei mit euch allen.“"
leader_notes:
  - "Dies ist der letzte Abend: Plane zusätzliche Zeit für den Rückblick auf die Reihe ein (Frage 7 und das Gebet), auch wenn du dafür weniger der übrigen Fragen wählst. Vers 2 lädt zur Gastfreundschaft ein – vielleicht schließt ihr mit einem gemeinsamen Essen."
  - "13,4: Manche in der Gruppe sind ledig, geschieden oder verwitwet oder leben in einer schmerzhaften Ehe. Bleib beim Gedanken, dass die Ehe kostbar ist und von allen in Ehren gehalten werden soll, und achte darauf, dass niemand sich verurteilt fühlt. Biete bei Bedarf ein persönliches Gespräch an."
  - "13,17: Manche sind von Leitern in der Gemeinde verletzt worden. Der Text beschreibt Leiter, die über Seelen wachen und Rechenschaft geben werden; die Andacht von Tag 28 erklärt das Folgen so, dass man sich von ihrem Wort aus der Schrift überzeugen lässt. Lass den Abend nicht zur Kritik an bestimmten Leitern werden."
  - "13,10 („Wir haben einen Altar“): Die Andacht von Tag 27 liest das als Christi Opfer am Kreuz, an dem die Glaubenden durch den Glauben Anteil haben. Wenn die Frage nach dem Abendmahl aufkommt, nenne diese Deutung und verschiebe eine längere Diskussion auf ein anderes Mal."
  - "13,23 erwähnt „unser Bruder Timotheus“, und manche schließen daraus, Paulus habe den Brief geschrieben. Der Hebräerbrief nennt keinen Verfasser; der Verfasser nennt den ganzen Brief ein „Wort der Ermutigung“ und sagt, er habe „nur kurz“ geschrieben – man braucht etwa eine Stunde, um ihn laut zu lesen."
  - "Abschluss der Reihe: Dankt der Gruppe, fragt, was sie gelernt haben und was sie als Nächstes tun möchten, und schlagt vor, den ganzen Brief zu Hause einmal in einem Zug laut zu lesen."
