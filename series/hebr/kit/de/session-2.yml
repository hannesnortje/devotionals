session: 2
lang: de
title: "Nicht abdriften"
ref: "2:1-2:18"
days: [3, 4, 5]
big_idea: "Weil der Sohn so groß ist, dürfen wir von einer so großen Rettung nicht abdriften: Jesus wurde einer von uns, schmeckte durch Gottes Gnade für jeden den Tod, entmachtete den Teufel und ist nun der barmherzige und treue Hohepriester, der uns hilft, wenn wir versucht werden."
opening: "Warst du schon einmal auf einer Luftmatratze, in einem Boot oder auf einem Paddleboard und hast plötzlich gemerkt, wie weit dich die Strömung getragen hatte, ohne dass du es gemerkt hast? Was ist passiert?"
context: >-
  Kapitel 1 hat den Sohn hoch über den Engeln gezeigt. Nun folgt der erste von fünf Warnabschnitten:
  Wenn schon das Wort, das am Sinai durch Engel gesprochen wurde, verbindlich war, wie viel mehr die Rettung, von der der Herr selbst gesprochen hat (V. 1–4).
  Dann beantwortet der Verfasser einen Stolperstein seiner jüdischen Leser – warum sollte der Sohn ein schwacher Mensch werden und sterben? – mit Psalm 8 und zeigt Jesus als unseren Wegbereiter, unseren Bruder und unseren Hohenpriester (V. 5–18).
read_aloud_tip: "Drei Leser: Verse 1–4 (die Warnung), Verse 5–9 (Psalm 8 und der gekrönte Jesus – vor „Wir sehen aber“ kurz innehalten), Verse 10–18 (unser Bruder und Hoherpriester)."
hebrew:
  - word: "pararyōmen"
    hebrew: "παραρυῶμεν"
    gloss: "abdriften"
    point: "Ein Wort aus der Seefahrt für ein Boot, das nicht richtig festgemacht ist und still mit der Strömung am sicheren Hafen vorbeitreibt – oder für einen Ring, der unbemerkt vom Finger gleitet. Sein Gegenteil im selben Vers, prosechein (achten), bedeutete, ein Schiff auf Kurs zu halten und festzumachen. Die Gefahr ist nicht plötzliche Rebellion, sondern langsames, unbemerktes Abdriften (2,1)."
  - word: "archēgos"
    hebrew: "ἀρχηγός"
    gloss: "Wegbereiter"
    point: "Ein Pionier, Bahnbrecher oder Vorkämpfer – wie der Matrose in einer bekannten Predigtillustration, der durch die Brandung an die felsige Küste schwimmt und ein Rettungsseil befestigt, damit alle an Bord sicher hinüberkommen. Gott hat diesen Wegbereiter „durch Leiden zur Vollendung“ gebracht: teleioō heißt, für seine Aufgabe voll qualifiziert, nicht moralisch verbessert (2,10)."
  - word: "boētheō"
    hebrew: "βοηθέω"
    gloss: "helfen"
    point: "Zusammengesetzt aus boē (Hilfeschrei) und theō (laufen): auf einen Hilfeschrei hin loslaufen. Weil er selbst gelitten hat, als er versucht wurde, „kann er denen helfen, die versucht werden“ (2,18)."
discussion:
  - q: "„Wie sollen wir entkommen, wenn wir eine so große Rettung missachten?“ Die Gefahr ist hier nicht offene Rebellion, sondern ein Abdriften aus Müdigkeit und Gleichgültigkeit. Welche Unterströmungen in unserem Alltag ziehen unsere Aufmerksamkeit vom Herrn weg?"
    ref: "2:1-2:3"
  - q: "Die Verse 3–4 nennen ein dreifaches Fundament dieser Rettung: den Herrn, der zuerst von ihr sprach, die, die ihn gehört haben, und Gott, der sein Zeugnis dazugab. Warum hilft es zu wissen, dass unser Glaube auf diesem Zeugnis ruht und nicht auf unseren Gefühlen?"
    ref: "2:3-2:4"
  - q: "„Jetzt aber sehen wir noch nicht, dass ihm alles unterworfen ist.“ Wo spürst du das am schmerzhaftesten – in der Welt, in deiner Familie, bei dir selbst?"
    ref: "2:5-2:8"
  - q: "„Wir sehen aber den, der ein wenig geringer gemacht worden war als die Engel, Jesus, … mit Herrlichkeit und Ehre gekrönt.“ Was ändert sich, wenn wir den Blick von dem, was wir noch nicht sehen, auf den richten, den wir im Glauben sehen?"
    ref: "2:8-2:9"
  - q: "Jesus wurde ein wenig geringer gemacht als die Engel, „damit er durch Gottes Gnade für jeden den Tod schmeckte“. Er hat den Tod nicht nur mit den Fingerspitzen berührt; er hat den Kelch geleert. Was bedeutet dir das?"
    ref: "2:9"
  - q: "„Aus diesem Grund schämt er sich nicht, sie Geschwister zu nennen.“ Wann fühlst du dich wie das schwarze Schaf in Gottes Familie? Was sagt Vers 11 dazu?"
    ref: "2:10-2:13"
  - q: "Vers 15 spricht von Menschen, die durch Todesfurcht „ihr ganzes Leben lang der Sklaverei verfallen waren“, und Vers 18 verspricht Hilfe für die, „die versucht werden“. Wo bestimmt Angst – vor Krankheit, Verlust, der Zukunft – unsere Entscheidungen? Und wenn du versucht wirst: Kämpfst du zuerst allein, oder rufst du sofort deinen Hohenpriester?"
    ref: "2:14-2:18"
application:
  - "Prüfe deine Ankerpunkte: Wähle eine tägliche Gewohnheit, die dir entglitten ist (Stille vor dem Herrn, das Wort lesen, Gemeinschaft mit Gläubigen), und mach dich diese Woche wieder daran fest."
  - "Wenn diese Woche Versuchung oder Angst kommt, mach Vers 18 zu deiner ersten Reaktion: Ruf sofort mit einem kurzen Gebet zu Jesus um Hilfe, bevor du versuchst, in eigener Kraft zu kämpfen."
prayer: "Lest gemeinsam die Verse 17–18. Betet zu dritt: Bekennt, wo ihr abgedriftet seid, dankt Jesus, dass er sich nicht schämt, euch Geschwister zu nennen, und bringt ihm einen Bereich, in dem Angst oder Versuchung euch bedrängen. Betet zum Schluss für Menschen, die ihr kennt und die gerade abdriften."
leader_notes:
  - "Drei Andachten (Tag 3–5) und achtzehn Verse ergeben einen vollen Abend. Wenn die Zeit knapp ist, nimm die Fragen 1, 4, 6 und 7."
  - "Dies ist der erste von fünf Warnabschnitten (2,1–4; 3,7–4,13; 5,11–6,12; 10,19–39; 12,14–29). Sein Ton ist seelsorgerliche Dringlichkeit, keine Panik. Halte den Schwerpunkt der Andacht von Tag 3 fest: heilige Wachsamkeit und das bewusste tägliche Festmachen unserer Herzen am Evangelium."
  - "2,9 „durch Gottes Gnade“: Unsere Übersetzung folgt der Mehrheitslesart (chariti theou). Einige Handschriften und der SBL-Text lesen chōris theou (ohne Gott). Erwähne das nur, wenn jemandes Bibel anders liest; lass es nicht zum Thema des Abends werden."
  - "2,10 bedeutet nicht, dass Jesus je sündig oder moralisch unvollkommen war (siehe 4,15). Teleioō heißt, jemanden zum vollen Ziel zu bringen, ihn für eine Aufgabe voll zu qualifizieren – hier, um Erlöser und Hoherpriester leidender Menschen zu sein. Rechnet mit dieser Frage."
  - "Die Todesfurcht (V. 15) kann Menschen berühren, die krank sind, trauern oder einen sterbenden Angehörigen begleiten. Geht behutsam damit um: Der Vers handelt vom Befreitwerden, nicht von einem Vorwurf, weil jemand Angst hat."
  - "Ausblick: Nächste Woche Kapitel 3 – Jesus, größer als Mose, und der Ruf „Heute, wenn ihr seine Stimme hört“."
