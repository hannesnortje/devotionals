session: 4
lang: de
title: "Die Verheißung der Ruhe"
ref: "4:1-4:16"
days: [8, 9]
big_idea: "Dem Volk Gottes bleibt eine Sabbatruhe: Wir kommen durch den Glauben in sie hinein, nicht durch eigene Werke, unter dem lebendigen Wort, das unsere Herzen bloßlegt – und wir dürfen mit Zuversicht an den Thron der Gnade herantreten, weil unser großer Hoherpriester mit unseren Schwachheiten mitfühlt."
opening: "Wie sieht echte Ruhe für dich aus – nicht nur Schlaf, sondern die Art, nach der du wirklich erfrischt bist? Wann hattest du sie zuletzt?"
context: >-
  Kapitel 3 endete mit der Wüstengeneration, die wegen ihres Unglaubens nicht hineinkommen konnte. Nun holt der Verfasser die Warnung in die Gegenwart: Die Verheißung, in Gottes Ruhe hineinzukommen, besteht noch.
  Er verbindet drei Wegmarken des Alten Testaments – Gottes Ruhe am siebten Tag, Josua und Kanaan und das „Heute“ aus Psalm 95 (V. 1–11) –
  und zeigt dann das lebendige Wort, das über das Herz urteilt (V. 12–13), und den großen Hohenpriester, der den Weg zum Thron der Gnade öffnet (V. 14–16).
read_aloud_tip: "Zwei Personen lesen die Abschnitte der Verse 1–11 im Wechsel; eine Person liest die Verse 12–13 langsam; dann lest ihr die Verse 14–16 alle gemeinsam."
hebrew:
  - word: "sabbatismos"
    hebrew: "σαββατισμός"
    gloss: "Sabbatruhe"
    point: "In Kapitel 3–4 gebraucht der Verfasser sonst katapausis (Ruhe, Ruheort, wie das Land Kanaan). In 4,9 verwendet er dieses sehr seltene Wort für eine echte, festliche Sabbatruhe – der Hebräerbrief ist die früheste bekannte Stelle, an der es vorkommt, und vielleicht hat der Verfasser es selbst geprägt. Josua (griechisch Iēsous, derselbe Name wie Jesus) konnte nur eine irdische Schattenruhe geben; der wahre Jesus bringt uns in Gottes eigene Ruhe."
  - word: "tetrachēlismena"
    hebrew: "τετραχηλισμένα"
    gloss: "bloßgelegt"
    point: "Von trachēlos, Nacken oder Hals. Im antiken Ringkampf bezeichnete das Verb einen Griff, der den Kopf des Gegners nach hinten bog, sodass er nicht wegschauen konnte; manche hören auch ein Echo des Opfertiers, das der Priester untersuchte. Vor Gottes Augen liegt alles „nackt und bloßgelegt“ (4,13)."
  - word: "sympatheō"
    hebrew: "συμπαθέω"
    gloss: "mitfühlen"
    point: "Viel stärker als unser Wort Sympathie: wörtlich mit jemandem von innen heraus mitleiden. Er ist einer, „der in allem auf gleiche Weise versucht worden ist – ohne Sünde“. Weil er nie nachgegeben hat, hat er die volle Wucht der Versuchung gespürt (4,15)."
discussion:
  - q: "„Das Wort, das sie hörten, nützte jenen nichts, weil sie nicht durch den Glauben mit denen verbunden waren, die wirklich hörten.“ Die Andacht vergleicht das mit einer Mahlzeit, die gegessen, aber nie verdaut wird. Wie kann es sein, dass wir Gottes Wort hören, ohne dass es uns verändert?"
    ref: "4:1-4:2"
  - q: "Josua brachte Israel in ein Land, aber nicht in Gottes endgültige Ruhe; „also bleibt dem Volk Gottes eine Sabbatruhe“. Was ist diese Ruhe – und in welchem Bereich deines Lebens läufst du noch im geistlichen Hamsterrad und arbeitest für Gottes Anerkennung, statt aus ihr zu leben?"
    ref: "4:3-4:10"
  - q: "„Lasst uns also alles daransetzen, in jene Ruhe hineinzukommen.“ Wie kann es Einsatz kosten, zu ruhen? Wie sieht der Kampf des Glaubens bei dir aus?"
    ref: "4:11"
  - q: "Das Wort Gottes ist „lebendig und wirksam und schärfer als jedes zweischneidige Schwert“. Wann hat ein Bibelabschnitt deine Ausreden durchschnitten? Wie reagierst du, wenn er eine wunde oder verborgene Stelle berührt?"
    ref: "4:12"
  - q: "„Alles liegt nackt und bloßgelegt vor den Augen dessen, dem wir Rechenschaft geben müssen.“ Macht dir das Angst oder befreit es dich – und warum, meinst du, lässt der Verfasser gleich darauf Vers 14 folgen?"
    ref: "4:13-4:14"
  - q: "„Denn wir haben nicht einen Hohenpriester, der nicht mitfühlen könnte mit unseren Schwachheiten.“ Manche meinen, weil Jesus nie gesündigt hat, könne er nicht wirklich wissen, wie schwer Versuchung ist. Warum sagt die Andacht, dass das Gegenteil wahr ist?"
    ref: "4:15"
  - q: "„Lasst uns also mit Zuversicht an den Thron der Gnade herantreten.“ Wenn du versagt hast – siehst du Gottes Thron als Richterbank, vor der du dich versteckst, oder als Thron der Gnade, zu dem du läufst? Was brauchst du heute – Erbarmen für das Vergangene oder Gnade für die Gegenwart?"
    ref: "4:16"
application:
  - "Wähle einen Bereich, in dem du rastlos versuchst, das Ergebnis aus eigener Kraft zu tragen. Übergib ihn diese Woche jeden Tag bewusst dem Herrn und ruhe im vollbrachten Werk von Christus."
  - "Wenn du diese Woche versagst oder versucht wirst, warte nicht, bis du dich selbst in Ordnung gebracht hast: Geh direkt zum Thron der Gnade, mit einem kurzen, ehrlichen Gebet um Erbarmen und Gnade."
prayer: "Lest gemeinsam Vers 16. Haltet dann einen Moment Stille vor dem lebendigen Wort, und jede und jeder fragt den Herrn, was er bloßlegen will. Betet zu zweit um Erbarmen und um Hilfe zur rechten Zeit, und betet zum Schluss Vers 16 füreinander."
leader_notes:
  - "Zwei Andachten (Tag 8 und 9). Tag 9 reicht bis 5,10; nimm heute nur den Teil zu 4,14–16 – der Rest gehört zum Treffen über Kapitel 5 nächste Woche."
  - "In 4,2 gibt es zwei Lesarten in den Handschriften. Unsere Übersetzung liest, dass sie nicht durch den Glauben mit denen verbunden waren, die wirklich hörten (Josua und Kaleb); ältere Übersetzungen sagen, dass das Wort sich bei den Hörern nicht mit dem Glauben verband. Beide kommen auf denselben Punkt hinaus: Hören ohne Glauben nützt nichts."
  - "Ruhe heißt nicht Faulheit oder Passivität (Tag 8): Wir hören auf, für Gottes Anerkennung zu arbeiten, und fangen an, aus seiner vollendeten Anerkennung in Christus zu leben. Menschen mit starkem Pflichtgefühl reagieren vielleicht mit Widerspruch; lass den Einsatz von Vers 11 und die Ruhe von Vers 10 nebeneinander stehen."
  - "Die Verse 12–13 können für empfindsame Gewissen schwer wiegen. Das Bild der Andacht ist ein liebevoller Chirurg, kein Feind. Beende das Gespräch mit den Versen 14–16, damit niemand nur mit Vers 13 nach Hause geht."
  - "Vers 15 kann spekulative Fragen über die Versuchungen Jesu auslösen. Bleibt beim Punkt des Textes: Er wurde wirklich in allem versucht und hat nie nachgegeben, und darum fühlt er wirklich mit uns."
  - "Ausblick: Nächste Woche Kapitel 5 – Jesus, Hoherpriester nach der Ordnung Melchisedeks, und der Ruf, von der Milch zur festen Nahrung zu kommen."
