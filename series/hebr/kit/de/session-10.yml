session: 10
lang: de
title: "Der neue und lebendige Weg"
ref: "10:1-10:39"
days: [19, 20, 21]
big_idea: "Mit einer einzigen Opfergabe hat Christus die, die geheiligt werden, für immer zur Vollendung gebracht; darum lasst uns zu Gott herantreten, an der Hoffnung festhalten und aufeinander achten – und unsere Zuversicht nicht wegwerfen, denn der Kommende wird kommen."
opening: "Denk an etwas, das du immer wieder wiederholen musstest – ein Medikament, eine Reparatur, eine Pflicht im Haushalt. Woran merkst du, dass ein Problem endgültig gelöst ist?"
context: >-
  Kapitel 10 bringt die große Lehre über Christus als Hohenpriester zum Schlussakkord: Die jährlichen Opfer erinnerten nur an die Sünden, aber Christi einzige Opfergabe hat bewirkt, was sie nie konnten (10,1–18).
  Dann, bei 10,19, wendet sich der Brief von dem, was Christus getan hat, zu der Frage, wie wir leben sollen: dreimal „lasst uns“. Es folgt eine vierte ernste Warnung (10,26–31) und danach eine warme Ermutigung, die in das große Glaubenskapitel, Hebräer 11, hinüberführt.
read_aloud_tip: "Drei Leser: Verse 1–18 (ein einziges Opfer – den Psalm in den Versen 5–7 als Stimme des Sohnes lesen), Verse 19–25 (im Griechischen ein einziger langer Satz – achtet auf das dreifache „lasst uns“), Verse 26–39 (Warnung und Ermutigung – nach Vers 31 kurz innehalten)."
hebrew:
  - word: "teteleiōken … tous hagiazomenous"
    hebrew: "τετελείωκεν … τοὺς ἁγιαζομένους"
    gloss: "hat … zur Vollendung gebracht … die geheiligt werden"
    point: "Zwei Zeitformen nebeneinander in 10,14: ein Perfekt – unsere Stellung vor Gott ist schon abgeschlossen – und ein Partizip Präsens – wir werden Tag für Tag geheiligt. In Gottes Augen schon vollendet, und doch noch im Wachsen."
  - word: "prosphatos"
    hebrew: "πρόσφατος"
    gloss: "neu"
    point: "Ursprünglich frisch, eben erst gemacht. Der Weg, den Jesus durch den Vorhang eingeweiht hat (10,20), bleibt immer frisch: Sein Opfer ist vor Gott heute so kraftvoll wie am Tag des Kreuzes – und weil er auferstanden ist, ist es ein lebendiger Weg."
  - word: "parrēsia"
    hebrew: "παρρησία"
    gloss: "Zuversicht"
    point: "Ein freies, ungehindertes Recht auf Zugang: Wir haben durch das Blut Jesu die Zuversicht, in das Heiligtum hineinzugehen (10,19). In 10,35 kehrt dasselbe Wort wieder: Werft sie nicht weg – wie ein Soldat, der seinen Schild wegwirft und flieht."
discussion:
  - q: "Wenn ein Medikament wirklich heilt, hört man auf, es zu nehmen. „Vielmehr geschieht durch sie Jahr für Jahr eine Erinnerung an die Sünden“ – aber Vers 18 sagt: „Wo es aber Vergebung dafür gibt, da gibt es keine Opfergabe für Sünde mehr.“ Wo errichten wir kleine Nebenaltäre neben dem Kreuz – indem wir uns selbst bestrafen oder Buße leisten, bevor wir Vergebung annehmen?"
    ref: "10:1-10:4"
  - q: "„Siehe, ich bin gekommen, um deinen Willen zu tun.“ Gott suchte keine bloßen Rituale, sondern einen Leib, der bereit ist, seinen Willen zu tun. Wie würde es aussehen, diese Woche deinen Alltagsleib – deine Zeit, deine Arbeit, dein Familienleben – ihm zur Verfügung zu stellen?"
    ref: "10:5-10:10"
  - q: "Jeder Priester steht Tag für Tag da; dieser hat ein einziges Opfer dargebracht und sich gesetzt. „Denn mit einer einzigen Opfergabe hat er die, die geheiligt werden, für immer zur Vollendung gebracht.“ Wie hilft dir dieser Vers, wenn du entmutigt bist, weil du dich so langsam veränderst?"
    ref: "10:11-10:18"
  - q: "Die Verse 19–23 ruhen auf zwei Besitztümern – dem offenen Weg und einem großen Priester – und rufen uns auf, heranzutreten und festzuhalten, „denn treu ist der, der die Verheißung gegeben hat“. Warum ist es wichtig, dass unser Festhalten auf seiner Treue ruht und nicht auf der Kraft unseres Griffs?"
    ref: "10:19-10:23"
  - q: "„Und lasst uns aufeinander achten, um uns gegenseitig zur Liebe und zu guten Werken anzuspornen.“ Dasselbe Verb steht in 3,1 für das Achten auf Jesus. Wie würde es aussehen, wenn wir als Gruppe so aufeinander achten – und wer unter uns braucht gerade Ermutigung?"
    ref: "10:24-10:25"
  - q: "Die Verse 26–31 gehören zu den ernstesten Worten des Briefes: „Furchtbar ist es, in die Hände des lebendigen Gottes zu fallen.“ Doch gleich danach schreibt der Verfasser: „Erinnert euch aber an die früheren Tage“. Warum gehören Warnung und Ermutigung hier zusammen?"
    ref: "10:26-10:31"
  - q: "Die Leser hatten einst den Raub ihrer Güter mit Freude hingenommen, weil sie wussten, dass sie einen besseren und bleibenden Besitz haben. „Werft also eure Zuversicht nicht weg; sie hat einen großen Lohn.“ Welcher frühere Kampf, durch den Gott dich getragen hat, macht dir Mut für den jetzigen?"
    ref: "10:32-10:39"
application:
  - "Benenne einen Nebenaltar in deinem Leben – eine Art, wie du für dein eigenes Versagen zu bezahlen versuchst –, und jedes Mal, wenn du ihn diese Woche bemerkst, lies Vers 18 und nimm stattdessen die Vergebung an."
  - "Achte diese Woche auf einen Menschen – vielleicht jemanden, der bei euren Treffen gefehlt hat – und sporne ihn mit einem Besuch, einem Anruf oder einer ermutigenden Nachricht an."
prayer: "Lest zu Beginn die Verse 22–24 gemeinsam laut. Betet dann in drei Schritten: Tretet zu Gott heran mit Dank für den offenen Weg durch Jesu Blut; haltet fest – bringt Gott die Bereiche, in denen eure Hoffnung unter Druck steht; achtet aufeinander – betet mit Namen für einen Menschen in der Gruppe. Schließt gemeinsam mit Vers 39."
leader_notes:
  - "Dieses Treffen stützt sich auf drei Andachten (Tag 19–21), und Kapitel 10 hat 39 Verse. Wenn die Zeit knapp ist, lest die Verse 1–18 in einem Zug und verwendet mehr Zeit auf die Verse 19–39. Wähle fünf Fragen."
  - "In 10,5 steht bei uns „einen Leib aber hast du mir bereitet“, weil der Hebräerbrief Psalm 40 nach dem Griechischen zitiert. Das Hebräische von Psalm 40,7 sagt wörtlich: Ohren hast du mir gegraben. Wenn die Bibeln in der Gruppe sich unterscheiden, ist das der Grund; die Andacht vermutet, dass der Teil (die Ohren) für das Ganze (den Leib) steht."
  - "10,26–31 und unterschiedliche Überzeugungen: Christen in deiner Gruppe verstehen diese Verse vielleicht verschieden, besonders bei der Frage, ob ein wahrer Glaubender endgültig abfallen kann. Lass die Leute zu Wort kommen und hört einander respektvoll zu; du musst die Debatte nicht entscheiden. Bleib bei dem, was die Andacht von Tag 21 sagt: Die Warnung betrifft den Abfall – sich bewusst und beharrlich von Christus abzuwenden, nachdem man die Erkenntnis der Wahrheit empfangen hat –, nicht einen Glaubenden, der aus Schwachheit strauchelt und in Umkehr zurückkehrt (4,15–16). Wer das einzige Opfer verwirft, hat kein anderes mehr."
  - "Zarte Gewissen: Manche werden fürchten, diese Sünde begangen zu haben. Die Andachten antworten: Für den Glaubenden, der bei Christus Zuflucht sucht, sind die Hände des lebendigen Gottes der sicherste Ort (Johannes 10,28–29), und (Tag 11, zu 6,4–6) ein zartes Herz, das über Sünde trauert und sich nach Jesus sehnt, ist selbst der Beweis, nicht in jenem verhärteten Zustand zu sein. Sag das deutlich und biete ein Gespräch danach an."
  - "Zwei kleinere Punkte mit Feingefühl: Die Andacht versteht „den Leib gewaschen mit reinem Wasser“ (10,22) als Hinweis auf die Taufe – in Gruppen gibt es unterschiedliche Taufverständnisse, also lass keine Debatte daraus werden. Und in Vers 25 geht es ums Ermutigen, nicht ums Kontrollieren: Manche fehlen wegen Krankheit, Schichtarbeit oder Pflege von Angehörigen."
  - "Ausblick: Vers 39 baut die Brücke zu Kapitel 11 – nächste Woche das Wesen des Glaubens und die großen Zeugen der Vergangenheit."
