<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t.series_title }}{% endblock %}</title>
<meta name="description" content="{{ t.series_subtitle }} – {{ t.author }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ t.series_subtitle }}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#16465a">
<link rel="icon" href="{{ root }}assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body data-lang="{{ lang }}" data-series="{{ series }}">
<a class="skip" href="#main">↓</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 20c3.5 0 3.5-3 7-3s3.5 3 7 3 3.5-3 7-3 3.5 3 5 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 26c3.5 0 3.5-3 7-3s3.5 3 7 3 3.5-3 7-3 3.5 3 5 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".5"/><circle cx="23" cy="9" r="4" fill="currentColor"/></svg>
      <span>{{ t.series_title }}</span>
    </a>
    <nav class="langs" aria-label="{{ t.choose_lang }}">
      {% for l in langs %}
      <a href="../{{ l }}/{% if d %}{{ strings[l].day|lower }}-{{ '%02d'|format(d.n) }}.html{% elif page == 'bible' %}book.html{% elif s is defined and s.slug %}{{ s.slug }}.html{% elif page == 'kit' %}kit.html{% else %}index.html{% endif %}" lang="{{ l }}" {% if l == lang %}aria-current="true"{% endif %}>{{ l|upper }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<main id="main">
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>{{ t.translation_note }}</p>
    <p>{{ copyright }} · {{ t.privacy }}</p>
    <p><a href="{{ collection }}">{{ t.all_series }}</a></p>
  </div>
</footer>
<script src="{{ root }}assets/app.js"></script>
</body>
</html>
