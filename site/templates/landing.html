<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% for l in langs %}{{ strings[l].series_title }}{% if not loop.last %} · {% endif %}{% endfor %}</title>
<meta name="theme-color" content="#16465a">
<link rel="icon" href="{{ root }}assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body class="landing">
<main class="landing-main">
  <svg class="brand-mark big" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 20c3.5 0 3.5-3 7-3s3.5 3 7 3 3.5-3 7-3 3.5 3 5 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 26c3.5 0 3.5-3 7-3s3.5 3 7 3 3.5-3 7-3 3.5 3 5 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".5"/><circle cx="23" cy="9" r="4" fill="currentColor"/></svg>
  <ul class="lang-cards">
    {% for l in langs %}{% set s = strings[l] %}
    <li><a href="{{ l }}/index.html" lang="{{ l }}">
      <span class="lc-lang">{{ s.lang_name }}</span>
      <span class="lc-title">{{ s.series_title }}</span>
      <span class="lc-sub">{{ s.series_subtitle }}</span>
    </a></li>
    {% endfor %}
  </ul>
  <p class="landing-author">Dr. Johannes A. Nortjé</p>
</main>
<script>
// Send returning visitors to the language they used last time.
try { var l = localStorage.getItem('{{ series }}-lang'); if (l && ['de','en','af'].indexOf(l) > -1 && !location.hash) location.replace(l + '/index.html'); } catch (e) {}
</script>
</body>
</html>
